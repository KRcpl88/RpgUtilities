      Element('h2', { textContent: 'Terrain' }), Element('div', { role: 'radiogroup', ariaLabel: 'Active terrain' }, rgRows));
  }

  function Field(szId, szTitle, Control) {
    Control.id = szId;
    return Element('label', { className: 'property-field', htmlFor: szId }, [
      Element('span', { textContent: szTitle }), Control,
    ]);
  }

  function SelectControl(rgOptions, szValue, OnChange) {
    const Select = Element('select', {}, rgOptions.map(([szKey, szText]) => Element('option', { value: szKey, textContent: szText })));
    Select.value = szValue;
    Select.onchange = () => OnChange(Select.value);
    return Select;
  }

  function ActionButton(szId, szText, OnClick, fDisabled = false) {
    return Element('button', { id: szId, type: 'button', className: 'tool-button', textContent: szText, onclick: OnClick, disabled: fDisabled });
  }

  function FeatureName(szLayer, Item) {
    return szLayer === 'label' ? Item.szText : `${Item.szType}: ${Item.szName || Item.szId || '(unnamed)'}`;
  }

  function SelectionTile(Selection) {
    const Item = Edit.GetFeature(State.Doc, Selection);
    return !Item ? -1 : Selection.szLayer === 'landmark' ? Selection.Key
      : Selection.szLayer === 'label' ? Item.nTile : Item.rgnTiles[Selection.nPoint || 0];
  }

  function SyncSelection() {
    const Item = Edit.GetFeature(State.Doc, State.Selection);
    if (!Item) {
      State.Selection = null;
    } else if (State.Selection.szLayer === 'overlay') {
      State.Selection.nPoint = Math.min(State.Selection.nPoint || 0, Item.rgnTiles.length - 1);
    }
    if (State.Selection) {
      State.nSelectedTile = SelectionTile(State.Selection);
    }
  }

  function SelectFeature(Selection) {
    State.Selection = Selection ? { szLayer: Selection.szLayer, Key: Selection.Key, nPoint: Selection.nPoint || 0 } : null;
    SyncSelection();
    BuildProperties();
    RequestDraw();
  }

  function ApplyFeatureEdit(Action, fSelectChanged = false) {
    try {
      const Command = Action();
      if (Command && fSelectChanged) {
        const Change = Command.rgChanges[0];
        State.Selection = { szLayer: Change.szLayer, Key: Change.Key, nPoint: 0 };
      }
      SyncSelection();
      BuildProperties();
      if (Command) {
        TilesChanged(Edit.CommandTiles(Command));
        SetMessage(Command.szLabel);
      }
      return true;
    } catch (Caught) {
      SetMessage(`Can't edit: ${Caught.message}`);
      return false;
    }
  }

  function StartPath() {
    SelectFeature(null);
    State.szPathAction = 'new';
    BuildProperties();
    SetMessage('Click the first tile of the new path');
  }

  function FinishPath() {
    State.szPathAction = 'select';
    BuildProperties();
    SetMessage('Path finished; click a path to select it');
  }

  function BuildFeatureOptions() {
    const rgFields = [];
    if (State.szTool === 'overlay') {
      rgFields.push(Field('overlay-type', 'New path type', SelectControl(
        Model.g_rgszOverlayTypes.map((szType) => [szType, szType]), State.szOverlayType, (szValue) => {
          State.szOverlayType = szValue;
          StartPath();
        })));
      rgFields.push(ActionButton('path-new', 'New path', StartPath));
    } else if (State.szTool === 'landmark') {
      rgFields.push(Field('landmark-type', 'New landmark type', SelectControl(
        Terrain.g_rgLandmarkTypes.map((Item) => [Item.szKey, Item.szName]), State.szLandmarkType, (szValue) => { State.szLandmarkType = szValue; })));
    } else if (State.szTool === 'label') {
      rgFields.push(Field('label-category', 'New label category', SelectControl(
        Model.g_rgszLabelCategories.map((szCategory) => [szCategory, szCategory]), State.szLabelCategory, (szValue) => { State.szLabelCategory = szValue; })));
      rgFields.push(ActionButton('label-new', 'New label', () => {
        SelectFeature(null);
        State.fNewLabel = true;
        SetMessage('Click a tile to add another label');
      }));
    } else if (State.szTool === 'select' || State.szTool === 'erase') {
      rgFields.push(Field('target-layer', 'Target layer', SelectControl([
        ['all', 'Any feature'], ['terrain', 'Terrain'], ['road', 'Roads'], ['trail', 'Trails'], ['river', 'Rivers'],
        ['landmark', 'Landmarks'], ['label', 'Labels'],
      ], State.szTargetLayer, (szValue) => {
        State.szTargetLayer = szValue;
        State.nSelectedTile = -1;
        SelectFeature(null);
      })));
    }
    Root.document.getElementById('feature-options').replaceChildren(...rgFields);
  }

  function FeaturesAt(nTile, szFilter = 'all') {
    if (!Model.IsTile(State.Doc, nTile)) {
      return [];
    }
    const rgFeatures = [
      ...Model.OverlaysAt(State.Doc, nTile).map((Item) => ({ szLayer: 'overlay', Key: Item.szId, nPoint: Item.rgnTiles.indexOf(nTile), Item })),
      ...[Model.GetLandmark(State.Doc, nTile)].filter(Boolean).map((Item) => ({ szLayer: 'landmark', Key: nTile, Item })),
      ...Model.LabelsAt(State.Doc, nTile).map((Item) => ({ szLayer: 'label', Key: Item.szId, Item })),
    ];
    return rgFeatures.filter(({ szLayer, Item }) => Renderer.FeatureVisible(State.Layers, szLayer, Item)
      && (szFilter === 'all' || szFilter === szLayer || (szLayer === 'overlay' && szFilter === Item.szType)));
  }

  function BuildProperties() {
    const fTerrain = ['pan', 'brush', 'fill', 'eyedropper'].includes(State.szTool)
      || (['select', 'erase'].includes(State.szTool) && State.szTargetLayer === 'terrain');
    Root.document.getElementById('property-list').hidden = !fTerrain;
    const Container = Root.document.getElementById('feature-properties');
    Container.hidden = fTerrain;
    if (fTerrain) {
      return;
    }
    const Selection = State.Selection;
    const Item = Edit.GetFeature(State.Doc, Selection);
    const rgFields = [];
    const rgAtTile = FeaturesAt(State.nSelectedTile);
    if (rgAtTile.length > 1) {
      rgFields.push(Field('feature-choice', 'Features on this tile', SelectControl(
        rgAtTile.map((Entry, nIndex) => [String(nIndex), FeatureName(Entry.szLayer, Entry.Item) + (Entry.Item.szId ? ` [${Entry.Item.szId}]` : '')]),
        String(rgAtTile.findIndex((Entry) => Selection && Entry.szLayer === Selection.szLayer && Entry.Key === Selection.Key)),
        (szIndex) => {
          State.szPathAction = 'select';
          SelectFeature(rgAtTile[Number(szIndex)]);
        })));
    }
    if (!Item) {
      const szHelp = State.szTool === 'overlay' ? 'Click a tile to start a path, then click to extend. Gaps follow the shortest tile path. Escape finishes.'
        : State.szTool === 'landmark' ? 'Click a tile to place a landmark, or an existing symbol to edit it.'
        : State.szTool === 'label' ? 'Click a tile to add a label. Select existing text to edit it.'
        : State.szTool === 'erase' ? 'Click to erase only the target layer. For overlapping features, use Select and the feature chooser first.'
        : 'Click a feature to inspect it. Hidden layers cannot be selected or erased.';
      rgFields.push(Element('p', { className: 'tool-help', textContent: szHelp }));
      Container.replaceChildren(...rgFields);
      return;
    }
    const { szLayer, Key } = Selection;
    rgFields.push(Element('h2', { textContent: FeatureName(szLayer, Item) }));
    if (!Renderer.FeatureVisible(State.Layers, szLayer, Item)) {
      rgFields.push(Element('p', { className: 'tool-help', textContent: 'This layer is hidden. Show it to edit the feature.' }));
      Container.replaceChildren(...rgFields);
      return;
    }
    const EditProps = (Props) => ApplyFeatureEdit(() => Edit.SetFeature(State.History, szLayer, Key, Props));
    const TextField = (szKey, szTitle, fNumber = false) => {
      const Input = Element('input', { type: fNumber ? 'number' : 'text', value: String(Item[szKey]), step: 'any' });
      if (fNumber) {
        Input.required = true;
        if (szKey === 'dSize') {
          Input.min = '0.1';
        }
      }
      Input.onchange = () => {
        if (Input.reportValidity()) {
          EditProps({ [szKey]: fNumber ? Number(Input.value) : Input.value });
        }
      };
      rgFields.push(Field(`feature-${szKey}`, szTitle, Input));
    };
    if (szLayer === 'overlay') {
      rgFields.push(Field('feature-type', 'Type', SelectControl(Model.g_rgszOverlayTypes.map((sz) => [sz, sz]), Item.szType, (szType) => EditProps({ szType }))));
      TextField('szName', 'Name');
      TextField('szStyle', 'Style (letters, digits, - or _)');
      rgFields.push(Field('path-point', 'Selected point', SelectControl(Item.rgnTiles.map((nTile, nIndex) => [
        String(nIndex), `${nIndex + 1}: ${TileLocationText(nTile)}`,
      ]), String(Selection.nPoint), (szIndex) => SelectFeature({ ...Selection, nPoint: Number(szIndex) }))));
      const nPoint = Selection.nPoint;
      rgFields.push(Element('div', { className: 'property-actions' }, [
        ActionButton('path-extend', 'Extend end', () => {
          SetTool('overlay');
          State.szPathAction = 'extend';
          BuildProperties();
          SetMessage('Click a tile to extend the path from its end');
        }),
        ActionButton('path-insert', 'Insert after point', () => {
          SetTool('overlay');
          State.szPathAction = 'insert';
          BuildProperties();
          SetMessage('Click a tile to insert after the selected point');
        }),
        ActionButton('path-remove', 'Remove point', () => ApplyFeatureEdit(() => Edit.RemoveOverlayPoint(State.History, Key, nPoint))),
        ActionButton('path-split', 'Split at point', () => ApplyFeatureEdit(() => Edit.SplitOverlay(State.History, Key, nPoint)), nPoint === 0 || nPoint === Item.rgnTiles.length - 1),
        ActionButton('path-finish', 'Finish path', FinishPath),
      ]));
      rgFields.push(Element('p', { className: 'tool-help', textContent: `Path mode: ${State.szPathAction}. Select a point to insert, remove or split. Removing an interior point reroutes around that tile.` }));
      const rgOthers = State.Doc.rgOverlays.filter((Other) => Other.szId !== Key && Other.szType === Item.szType);
      if (rgOthers.length > 0) {
        const Target = SelectControl(rgOthers.map((Other) => [Other.szId, Other.szName || Other.szId]), rgOthers[0].szId, () => {});
        const FromEnd = SelectControl([['end', 'End'], ['start', 'Start']], 'end', () => {});
        const ToEnd = SelectControl([['start', 'Start'], ['end', 'End']], 'start', () => {});
        rgFields.push(Field('join-target', 'Join to (same type)', Target), Field('join-from', 'This endpoint', FromEnd), Field('join-to', 'Other endpoint', ToEnd),
          ActionButton('path-join', 'Join paths', () => ApplyFeatureEdit(() => Edit.JoinOverlays(State.History, Key, Target.value, FromEnd.value === 'start', ToEnd.value === 'end'))),
          Element('p', { className: 'tool-help', textContent: 'Join keeps this path\'s name/style, removes the other path, and bridges any gap.' }));
      }
    } else if (szLayer === 'landmark') {
      rgFields.push(Field('feature-type', 'Type', SelectControl(Terrain.g_rgLandmarkTypes.map((Type) => [Type.szKey, Type.szName]), Item.szType, (szType) => EditProps({ szType }))));
      TextField('szName', 'Name');
      TextField('szNotes', 'Notes (one line)');
      rgFields.push(LocationNote(Key));
    } else {
      TextField('szText', 'Text');
      rgFields.push(Field('feature-category', 'Category', SelectControl(Model.g_rgszLabelCategories.map((sz) => [sz, sz]), Item.szCategory, (szCategory) => EditProps({ szCategory }))));
      TextField('dSize', 'Size (48 units = one hex)', true);
      TextField('dRotation', 'Rotation (clockwise degrees)', true);
      TextField('dDx', 'Offset right (units)', true);
      TextField('dDy', 'Offset down (units)', true);
      rgFields.push(LocationNote(Item.nTile));
      rgFields.push(Element('p', { className: 'tool-help', textContent: 'Drag the white handle to move; drag the yellow handle to rotate. Escape cancels a drag. Each drag is one undo step.' }));
    }
    rgFields.push(Element('div', { className: 'property-actions' }, [
      ActionButton('feature-delete', `Delete ${szLayer}`, DeleteSelected),
    ]));
    Container.replaceChildren(...rgFields);
  }

  function LocationNote(nTile) {
    return Element('p', { className: 'tool-help feature-location', textContent: `${TileLocationText(nTile)} \u00b7 ${TrueLocationText(nTile)}` });
  }

  function DeleteSelected() {
    const Item = Edit.GetFeature(State.Doc, State.Selection);
    if (Item && Renderer.FeatureVisible(State.Layers, State.Selection.szLayer, Item)) {
      const { szLayer, Key } = State.Selection;
      State.szPathAction = 'select';
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, szLayer, Key, null));
    }
  }

  function PickFeature(rgdScreen, Hit, szFilter) {
    const Feature = Renderer.HitFeature(State.Renderer, State, rgdScreen, szFilter);
    return Feature || (Hit ? FeaturesAt(Hit.nTile, szFilter).at(-1) : null);
  }

  function FeatureClick(rgdScreen, Hit) {
    const szTool = State.szTool;
    const szFilter = szTool === 'select' || szTool === 'erase' ? State.szTargetLayer : szTool;
    State.nSelectedTile = Hit ? Hit.nTile : -1;
    if (szFilter === 'terrain') {
      SelectFeature(null);
      if (Hit && State.Layers.fTerrain) {
        if (szTool === 'erase') {
          const Command = History.Perform(State.History, 'Erase terrain', (Doc, Record) => Record(Model.SetTerrain(Doc, Hit.nTile, Terrain.g_nWaterId)));
          TilesChanged(Edit.CommandTiles(Command));
          SetMessage(Command ? 'Erased terrain' : 'Terrain is already water');
        } else {
          PickTerrain(Hit.nTile);
        }
      }
      return;
    }
    const Feature = PickFeature(rgdScreen, Hit, szFilter);
    if (szTool === 'erase') {
      if (Feature) {
        SelectFeature(Feature);
        DeleteSelected();
      } else {
        SetMessage('No visible feature in the target layer here');
      }
      return;
    }
    if (szTool === 'select') {
      SelectFeature(Feature);
      return;
    }
    if (szTool === 'overlay' && State.szPathAction !== 'select' && State.szPathAction !== 'new') {
      const Selected = Edit.GetFeature(State.Doc, State.Selection);
      if (!Selected || State.Selection.szLayer !== 'overlay' || !State.Layers[Selected.szType]) {
        SetMessage('Select a visible path first');
        return;
      }
      if (Hit) {
        const { Key, nPoint } = State.Selection;
        const fInsert = State.szPathAction === 'insert';
        if (ApplyFeatureEdit(() => fInsert ? Edit.InsertOverlayPoint(State.History, Key, nPoint, Hit.nTile) : Edit.ExtendOverlay(State.History, Key, Hit.nTile))) {
          const rgnTiles = Model.GetOverlay(State.Doc, Key).rgnTiles;
          State.Selection.nPoint = fInsert ? rgnTiles.indexOf(Hit.nTile, nPoint) : rgnTiles.length - 1;
          if (fInsert) {
            State.szPathAction = 'select';
          }
          SyncSelection();
          BuildProperties();
        }
      }
      return;
    }
    if (Feature && !(szTool === 'overlay' && State.szPathAction === 'new') && !(szTool === 'label' && State.fNewLabel)) {
      SelectFeature(Feature);
      return;
    }
    if (!Hit) {
      SelectFeature(null);
      return;
    }
    const szLayerKey = szTool === 'overlay' ? State.szOverlayType : szTool;
    if (!State.Layers[szLayerKey]) {
      SetMessage(`Show the ${szLayerKey} layer before adding a feature`);
      return;
    }
    if (szTool === 'overlay') {
      if (ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'overlay', null, { szType: State.szOverlayType, rgnTiles: [Hit.nTile] }), true)) {
        State.szPathAction = 'extend';
        BuildProperties();
      }
    } else if (szTool === 'landmark') {
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'landmark', Hit.nTile, { szType: State.szLandmarkType }), true);
    } else if (szTool === 'label') {
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'label', null, { nTile: Hit.nTile, szCategory: State.szLabelCategory, szText: 'Label' }), true);
      State.fNewLabel = false;
    }
  }

  function StartLabelDrag(rgdScreen) {
    if (!['label', 'select'].includes(State.szTool) || (State.szTool === 'select' && !['all', 'label'].includes(State.szTargetLayer)) || State.fNewLabel) {
      return false;
    }
    const Hit = Renderer.HitFeature(State.Renderer, State, rgdScreen, 'label');
    if (!Hit || !Hit.szHandle) {
      return false;
    }
    const Label = Model.GetLabel(State.Doc, Hit.Key);
    const rgdScreenToFrame = Projection.InvertTransform(Hit.rgdFrameToScreen);
    State.LabelDrag = { Label, szHandle: Hit.szHandle, rgdScreenToFrame, rgdStart: Projection.ApplyTransform(rgdScreenToFrame, rgdScreen) };
    State.LabelPreview = Label;
    return true;
  }

  function MoveLabelDrag(rgdScreen) {
    const Drag = State.LabelDrag;
    if (!Drag) {
      return;
    }
    const rgdPoint = Projection.ApplyTransform(Drag.rgdScreenToFrame, rgdScreen);
    const Label = Drag.Label;
    const Geometry = View.MapGeometry(State.Doc);
    const dUnit = Geometry.dD / View.g_dLabelUnitsPerHex;
    if (Drag.szHandle === 'move') {
      State.LabelPreview = { ...Label, dDx: Label.dDx + (rgdPoint[0] - Drag.rgdStart[0]) / dUnit, dDy: Label.dDy - (rgdPoint[1] - Drag.rgdStart[1]) / dUnit };
    } else {
      const rgdT = View.LabelTransform(Geometry, Label);
      const Angle = (Point) => Math.atan2(-(Point[1] - rgdT[5]), Point[0] - rgdT[4]);
      const dDelta = Angle(rgdPoint) - Angle(Drag.rgdStart);
      State.LabelPreview = { ...Label, dRotation: Label.dRotation + Math.atan2(Math.sin(dDelta), Math.cos(dDelta)) * 180 / Math.PI };
    }
    RequestDraw();
  }

  function FinishLabelDrag(fCancel) {
    if (!State.LabelDrag) {
      return;
    }
    const Label = State.LabelPreview;
    State.LabelPreview = null;
    State.LabelDrag = null;
    if (fCancel) {
      SetMessage('Label drag cancelled');
    } else {
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'label', Label.szId, { dDx: Label.dDx, dDy: Label.dDy, dRotation: Label.dRotation }));
    }
    RequestDraw();
  }

  function LocalPoint(Event, Target) {
    const Rect = Target.getBoundingClientRect();
    return [Event.clientX - Rect.left, Event.clientY - Rect.top];
  }

  // The left button drives the active tool; the middle or right button, Space+drag
  // and the Pan tool pan. Alt+click picks a terrain with any editing tool.
  function AttachCanvasEvents(Canvas) {
    let Drag = null;
    Canvas.addEventListener('contextmenu', (Event) => Event.preventDefault());
    Canvas.addEventListener('pointerdown', (Event) => {
      if (Drag) {
        return;
      }
      const rgdPoint = LocalPoint(Event, Canvas);
      const fPan = Event.button === 1 || Event.button === 2 || State.fSpaceDown || State.szTool === 'pan';
      if (Event.button === 1) {
        Event.preventDefault();
      }
      if (fPan) {
        Drag = { szMode: 'pan', nPointer: Event.pointerId, rgdLast: rgdPoint };
        Canvas.classList.add('dragging');
      } else if (Event.button === 0) {
        if (!Event.altKey && StartLabelDrag(rgdPoint)) {
          Drag = { szMode: 'label', nPointer: Event.pointerId };
          Canvas.setPointerCapture(Event.pointerId);
          return;
        }
        const Hit = HitAt(rgdPoint);
        if (Event.altKey || State.szTool === 'eyedropper') {
          if (Hit) {
            PickTerrain(Hit.nTile);
          }
          return;
        }
        if (State.szTool === 'fill') {
          if (Hit) {
            FillAt(Hit.nTile);
          }
          return;
        }
        if (State.szTool !== 'brush') {
          FeatureClick(rgdPoint, Hit);
          return;
        }
        State.Stroke = Edit.BeginStroke(State.History, State.nTerrainId, State.nBrushRadius);
        Drag = { szMode: 'paint', nPointer: Event.pointerId };
        StrokeAt(rgdPoint);
      } else {
        return;
      }
      Canvas.setPointerCapture(Event.pointerId);
    });
    Canvas.addEventListener('pointermove', (Event) => {
      const rgdPoint = LocalPoint(Event, Canvas);
      if (Drag && Drag.nPointer === Event.pointerId) {
        if (Drag.szMode === 'pan') {
          View.Pan(State.Camera, rgdPoint[0] - Drag.rgdLast[0], rgdPoint[1] - Drag.rgdLast[1]);
          Drag.rgdLast = rgdPoint;
          RequestDraw();
        } else if (Drag.szMode === 'label') {
          MoveLabelDrag(rgdPoint);
        } else if (State.Stroke) {
          StrokeAt(rgdPoint);
        }
      }
      HoverAt(rgdPoint);
    });
    const EndDrag = (Event) => {
      if (Drag && Drag.nPointer === Event.pointerId) {
        if (Drag.szMode === 'paint') {
          EndStroke();
        } else if (Drag.szMode === 'label') {
          FinishLabelDrag(Event.type !== 'pointerup');
        }
        Drag = null;
        Canvas.classList.remove('dragging');
      }
    };
    Canvas.addEventListener('pointerup', EndDrag);
    Canvas.addEventListener('pointercancel', EndDrag);
    Canvas.addEventListener('lostpointercapture', EndDrag);
    Canvas.addEventListener('pointerleave', () => SetHover(-1));
    Canvas.addEventListener('wheel', (Event) => {
      Event.preventDefault();
      if (State.LabelDrag) {
        return;
      }
      const dDelta = Event.deltaMode === 1 ? Event.deltaY * 16 : Event.deltaY;
      View.ZoomAt(State.Camera, LocalPoint(Event, Canvas), Math.exp(-dDelta * 0.0015));
      HoverAt(LocalPoint(Event, Canvas));
      RequestDraw();
    }, { passive: false });
    Canvas.addEventListener('dblclick', (Event) => {
      if (State.szTool !== 'pan' || State.Doc.szKind !== 'global') {
        return;
      }
      const Hit = View.PlacementAt(State.Layout, View.ScreenToWorld(State.Camera, LocalPoint(Event, Canvas)));
      if (Hit && (State.Layout.szMode === 'net' || Hit.Placement.szPanel !== State.Layout.szFocus)) {
        ShowFocus(Hit.Placement.szPanel, State.Layout.szMode === 'net' ? null : Hit.rgdFrame);
      }
    });
  }

  function AttachMinimapEvents(MiniCanvas) {
    MiniCanvas.addEventListener('click', (Event) => {
      if (!State.MiniCamera) {
        return;
      }
      const rgdNet = View.ScreenToWorld(State.MiniCamera, LocalPoint(Event, MiniCanvas));
      if (State.Layout.szMode !== 'focus') {
        View.CenterOn(State.Camera, rgdNet);
        RequestDraw();
        return;
      }
      const Hit = View.PlacementAt(View.BuildNetLayout(), rgdNet);
      if (Hit) {
        ShowFocus(Hit.Placement.szPanel, Hit.rgdFrame);
      }
    });
  }

  function AttachKeyboard() {
    Root.addEventListener('keyup', (Event) => {
      if (Event.key === ' ') {
        State.fSpaceDown = false;
      }
    });
    Root.addEventListener('blur', () => {
      State.fSpaceDown = false;
    });
    Root.addEventListener('keydown', (Event) => {
      if (Root.document.querySelector('dialog[open]')) {
        return;
      }
      const szTag = Event.target && Event.target.tagName;
      const fTextEntry = szTag === 'TEXTAREA' || (szTag === 'INPUT' && Event.target.type !== 'range' && Event.target.type !== 'checkbox');
      if (State.LabelDrag) {
        if (Event.key === 'Escape') {
          FinishLabelDrag(true);
        }
        Event.preventDefault();
        return;
      }
      if ((Event.ctrlKey || Event.metaKey) && !Event.altKey && !fTextEntry) {
        const szKey = Event.key.toLowerCase();
        if (szKey === 'z' || szKey === 'y') {
          Event.preventDefault();
          UndoOrRedo(szKey === 'z' && !Event.shiftKey);
        } else if (szKey === 's') {
          Event.preventDefault();
          SaveMap();
        } else if (szKey === 'o') {
          Event.preventDefault();
          OpenMap();
        }
        return;
      }
      if (szTag === 'INPUT' || szTag === 'SELECT' || szTag === 'TEXTAREA' || Event.ctrlKey || Event.metaKey || Event.altKey) {
        return;
      }
      if (Event.key === 'Escape') {
        EndStroke();
        State.fNewLabel = false;
        FinishPath();
        return;
      }
      if ((Event.key === 'Delete' || Event.key === 'Backspace') && !['pan', 'brush', 'fill', 'eyedropper'].includes(State.szTool)) {
        Event.preventDefault();
        DeleteSelected();
        return;
      }
      if (Event.key === ' ') {
        Event.preventDefault();
        State.fSpaceDown = true;
        return;
      }
      const Tool = g_rgTools.find((Entry) => Entry[2] === Event.key.toLowerCase());
      if (Tool) {
        Event.preventDefault();
        SetTool(Tool[0]);
        return;
      }
      if (Event.key === '[' || Event.key === ']') {
        Event.preventDefault();
        SetBrushRadius(State.nBrushRadius + (Event.key === ']' ? 1 : -1));
        return;
      }
      const dStep = g_dKeyPanPixels * (Event.shiftKey ? 4 : 1);
      const rgdCenter = [State.Camera.nWidth / 2, State.Camera.nHeight / 2];
      const Actions = {
        ArrowLeft: () => View.Pan(State.Camera, dStep, 0),
        ArrowRight: () => View.Pan(State.Camera, -dStep, 0),
        ArrowUp: () => View.Pan(State.Camera, 0, dStep),
        ArrowDown: () => View.Pan(State.Camera, 0, -dStep),
        '+': () => View.ZoomAt(State.Camera, rgdCenter, g_dKeyZoomFactor),
        '=': () => View.ZoomAt(State.Camera, rgdCenter, g_dKeyZoomFactor),
        '-': () => View.ZoomAt(State.Camera, rgdCenter, 1 / g_dKeyZoomFactor),
        Home: FitNet,
        f: FitPanel,
        n: ShowNet,
        p: FocusAtViewCenter,
      };
      const Action = Actions[Event.key];
      if (Action) {
        Event.preventDefault();
        Action();
        RequestDraw();
      }
    });
  }

  // A new global map seeded with the deterministic demo terrain (no undo history).
  function CreateDemoDocument() {
    const Doc = Model.CreateGlobalMap({ szName: 'Demo' });
    View.DemoTerrain(Doc.Topo, 1).forEach((nId, nTile) => Model.SetTerrain(Doc, nTile, nId));
    return Doc;
  }

  function Start() {
    const Canvas = Root.document.getElementById('map-canvas');
    State.MiniCanvas = Root.document.getElementById('minimap');
    State.Renderer = Renderer.Create(Canvas);
    State.Doc = CreateDemoDocument();
    State.nSavedRevision = State.Doc.nRevision;
    State.History = History.Create(State.Doc);
    State.Layout = View.BuildNetLayout();
    BuildToolbar();
    BuildToolList();
    BuildLayerList();
    BuildLegend();
    SetTool(State.szTool);
    SetTerrain(State.nTerrainId);
    SyncUndoButtons();
    AttachCanvasEvents(Canvas);
    AttachMinimapEvents(State.MiniCanvas);
    AttachKeyboard();
    const Rect = Canvas.getBoundingClientRect();
    View.ResizeCamera(State.Camera, Rect.width, Rect.height);
    View.FitBounds(State.Camera, State.Layout.rgdBounds);
    new Root.ResizeObserver(RequestDraw).observe(Canvas);
    Root.addEventListener('pagehide', Autosave);
    SyncControls();
    OfferRestore();
    RequestDraw();
  }

  RpgMap.App = Object.freeze({ g_szVersion, State, Start, ShowFocus, ShowNet, FitNet, FitPanel, SetTool, SetTerrain, SetBrushRadius, UndoOrRedo, NewMap, SaveMap, ExportMap, Autosave, IsDirty });

  if (Root.document.readyState === 'loading') {
    Root.document.addEventListener('DOMContentLoaded', Start);
  } else {
    Start();
  }
})(globalThis);
</script>
</body>
</html>
