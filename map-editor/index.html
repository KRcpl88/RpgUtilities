    ScreenToWorld,
    Pan,
    ZoomAt,
    CenterOn,
    FitBounds,
    VisibleBounds,
    BoundsOf,
    BoundsIntersect,
    UnionBounds,
    TransformBounds,
    BuildNetLayout,
    BuildFocusLayout,
    MapGeometry,
    MapLayout,
    FrameOutline,
    ReferenceGeometry,
    FindPlacement,
    PlacementAt,
    PanelTileGroups,
    VisibleTiles,
    HitTest,
    PanelTransform,
    FeatureAnchor,
    FeatureCopies,
    OverlayCurves,
    CubicPoint,
    DistanceToSegment,
    FlattenCurve,
    SplitCurve,
    g_OverlayStyles,
    g_dLabelUnitsPerHex,
    LabelTransform,
    DemoTerrain,
  });
})(globalThis);
</script>

<script data-module="Edit">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Terrain, Model, History, View } = RpgMap;
  const { Require } = Util;

  // DOM-free terrain editing: brush footprints, flood fill, stroke interpolation, and
  // commands grouped in History. Tile sets are found by walking tile adjacency, so they
  // cross panel seams in every view.
  const g_nMaxBrushRadius = 5;
  // Stroke samples per hex height when interpolating between pointer positions.
  const g_nSamplesPerHex = 4;

  function NeighborsOf(Doc, nTile) {
    return Doc.Topo ? Topology.Neighbors(Doc.Topo, nTile) : Model.Neighbors(Doc, nTile);
  }

  function CheckRadius(nRadius) {
    Require(Number.isInteger(nRadius) && nRadius >= 0 && nRadius <= g_nMaxBrushRadius,
      `Brush radius must be an integer 0-${g_nMaxBrushRadius}`);
  }

  // Tiles within nRadius steps of nCenter, nearest first.
  function BrushTiles(Doc, nCenter, nRadius) {
    Require(Model.IsTile(Doc, nCenter), `Unknown tile: ${nCenter}`);
    CheckRadius(nRadius);
    const Seen = new Set([nCenter]);
    let rgnRing = [nCenter];
    const rgnResult = [nCenter];
    for (let nStep = 0; nStep < nRadius; nStep++) {
      const rgnNext = [];
      for (const nTile of rgnRing) {
        for (const nOther of NeighborsOf(Doc, nTile)) {
          if (!Seen.has(nOther)) {
            Seen.add(nOther);
            rgnNext.push(nOther);
            rgnResult.push(nOther);
          }
        }
      }
      rgnRing = rgnNext;
    }
    return rgnResult;
  }

  // The connected region of tiles sharing nStart's terrain, in breadth-first order.
  function FloodRegion(Doc, nStart) {
    Require(Model.IsTile(Doc, nStart), `Unknown tile: ${nStart}`);
    const rgnTerrain = Doc.rgnTerrain;
    const nId = rgnTerrain[nStart];
    const rgfSeen = new Uint8Array(Doc.nTiles);
    rgfSeen[nStart] = 1;
    const rgnResult = [nStart];
    for (let nHead = 0; nHead < rgnResult.length; nHead++) {
      for (const nOther of NeighborsOf(Doc, rgnResult[nHead])) {
        if (!rgfSeen[nOther] && rgnTerrain[nOther] === nId) {
          rgfSeen[nOther] = 1;
          rgnResult.push(nOther);
        }
      }
    }
    return rgnResult;
  }

  // Tiles under the world-space segment from rgdFrom to rgdTo in Layout, in order, without
  // consecutive repeats. Sampled densely enough that no crossed tile is skipped in practice.
  function SegmentTiles(Topo, Layout, rgdFrom, rgdTo) {
    const dLength = Math.hypot(rgdTo[0] - rgdFrom[0], rgdTo[1] - rgdFrom[1]);
    const nSteps = Math.max(1, Math.ceil(dLength * g_nSamplesPerHex / Topo.dD));
    const rgnResult = [];
    for (let nStep = 0; nStep <= nSteps; nStep++) {
      const dT = nStep / nSteps;
      const Hit = View.HitTest(Topo, Layout, [rgdFrom[0] + dT * (rgdTo[0] - rgdFrom[0]), rgdFrom[1] + dT * (rgdTo[1] - rgdFrom[1])]);
      if (Hit && rgnResult[rgnResult.length - 1] !== Hit.nTile) {
        rgnResult.push(Hit.nTile);
      }
    }
    return rgnResult;
  }

  // Sets the terrain of each tile; returns the tiles that changed. fnRecord receives
  // each change record (for History.Record).
  function PaintTiles(Doc, rgnTiles, nTerrainId, fnRecord) {
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    const rgnChanged = [];
    for (const nTile of rgnTiles) {
      const Change = Model.SetTerrain(Doc, nTile, nTerrainId);
      if (Change) {
        fnRecord(Change);
        rgnChanged.push(nTile);
      }
    }
    return rgnChanged;
  }

  // A brush stroke is one History command, opened here and closed by EndStroke.
  function BeginStroke(HistoryState, nTerrainId, nRadius) {
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    CheckRadius(nRadius);
    History.Begin(HistoryState, `Paint ${Terrain.ById(nTerrainId).szName}`);
    return { History: HistoryState, nTerrainId, nRadius, rgdLast: null, nLastTile: -1, Centers: new Set(), nChanged: 0 };
  }

  // Paints along the segment from the previous point (or just at rgdWorld for the first
  // point). Returns the tiles that changed.
  function StrokeTo(Stroke, Layout, rgdWorld) {
    const Doc = Stroke.History.Doc;
    const Geometry = View.MapGeometry(Doc);
    const rgnCenters = SegmentTiles(Geometry, Layout, Stroke.rgdLast || rgdWorld, rgdWorld);
    Stroke.rgdLast = [rgdWorld[0], rgdWorld[1]];
    const fnRecord = (Change) => History.Record(Stroke.History, Change);
    const rgnChanged = [];
    for (const nCenter of rgnCenters) {
      if (Stroke.Centers.has(nCenter)) {
        continue;
      }
      Stroke.Centers.add(nCenter);
      rgnChanged.push(...PaintTiles(Doc, BrushTiles(Doc, nCenter, Stroke.nRadius), Stroke.nTerrainId, fnRecord));
    }
    Stroke.nChanged += rgnChanged.length;
    return rgnChanged;
  }

  // Closes the stroke's command; returns it, or null if nothing changed.
  function EndStroke(Stroke) {
    return History.Commit(Stroke.History);
  }

  // Replaces the connected region under nStart with nTerrainId as one command.
  // Returns { Command, rgnTiles } (Command null when nothing changed).
  function Fill(HistoryState, nStart, nTerrainId) {
    const Doc = HistoryState.Doc;
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    if (Model.GetTerrain(Doc, nStart) === nTerrainId) {
      return { Command: null, rgnTiles: [] };
    }
    const rgnRegion = FloodRegion(Doc, nStart);
    let rgnTiles = [];
    const Command = History.Perform(HistoryState, `Fill ${Terrain.ById(nTerrainId).szName}`, (_, fnRecord) => {
      rgnTiles = PaintTiles(Doc, rgnRegion, nTerrainId, fnRecord);
    });
    return { Command, rgnTiles };
  }

  // The tiles whose terrain a command changes.
  function CommandTiles(Command) {
    return Command ? Command.rgChanges.filter((Change) => Change.szLayer === 'terrain').map((Change) => Change.Key) : [];
  }

  const g_PathGeometry = new WeakMap();

  // Chord distance / longest graph edge is an admissible, consistent lower bound,
  // including partial tiles and seams where a planar hex-distance heuristic is not.
  function PathGeometry(Topo) {
    if (!g_PathGeometry.has(Topo)) {
      const Built = Projection.Build();
      const rgrgdPoints = Topo.rgTiles.map((Tile) => Projection.FrameToSolid(Built.Frames[Tile.szPanel], Tile.rgdCenter));
      let dMaxStep = 0;
      for (let nTile = 0; nTile < Topo.nTiles; nTile++) {
        for (const nOther of Topology.Neighbors(Topo, nTile)) {
          dMaxStep = Math.max(dMaxStep, Util.Distance(rgrgdPoints[nTile], rgrgdPoints[nOther]));
        }
      }
      g_PathGeometry.set(Topo, { rgrgdPoints, dMaxStep: dMaxStep * (1 + 1e-12) });
    }
    return g_PathGeometry.get(Topo);
  }

  // Deterministic A*, unit cost per adjacency edge. Excluded tiles are used when
  // removing an interior overlay point so the replacement cannot reinsert it.
  function FindPath(Doc, nFrom, nTo, Excluded = new Set()) {
    Require(Model.IsTile(Doc, nFrom) && Model.IsTile(Doc, nTo), 'Path endpoints must be map tiles');
    Require(!Excluded.has(nFrom) && !Excluded.has(nTo), 'A path endpoint is excluded');
    const Geometry = Doc.Topo ? PathGeometry(Doc.Topo) : null;
    const Heuristic = (nTile) => {
      if (Geometry) {
        return Geometry.dMaxStep > 0
          ? Util.Distance(Geometry.rgrgdPoints[nTile], Geometry.rgrgdPoints[nTo]) / Geometry.dMaxStep : 0;
      }
      const [nX, nY] = Model.LocalTileXY(Doc, nTile);
      const [nTX, nTY] = Model.LocalTileXY(Doc, nTo);
      return Lattice.OffsetDistance(nX + Doc.Local.nParity, -nY, nTX + Doc.Local.nParity, -nTY);
    };
    const rgnCost = new Int32Array(Doc.nTiles).fill(-1);
    const rgnPrevious = new Int32Array(Doc.nTiles).fill(-1);
    const rgHeap = [];
    const Before = (A, B) => A.dScore < B.dScore || (A.dScore === B.dScore && A.nTile < B.nTile);
    const Push = (Entry) => {
      let nIndex = rgHeap.length;
      rgHeap.push(Entry);
      while (nIndex > 0) {
        const nParent = (nIndex - 1) >> 1;
        if (!Before(Entry, rgHeap[nParent])) {
          break;
        }
        rgHeap[nIndex] = rgHeap[nParent];
        nIndex = nParent;
      }
      rgHeap[nIndex] = Entry;
    };
    const Pop = () => {
      const First = rgHeap[0];
      const Last = rgHeap.pop();
      if (rgHeap.length > 0) {
        let nIndex = 0;
        while (2 * nIndex + 1 < rgHeap.length) {
          let nChild = 2 * nIndex + 1;
          if (nChild + 1 < rgHeap.length && Before(rgHeap[nChild + 1], rgHeap[nChild])) {
            nChild++;
          }
          if (!Before(rgHeap[nChild], Last)) {
            break;
          }
          rgHeap[nIndex] = rgHeap[nChild];
          nIndex = nChild;
        }
        rgHeap[nIndex] = Last;
      }
      return First;
    };
    rgnCost[nFrom] = 0;
    Push({ nTile: nFrom, nCost: 0, dScore: Heuristic(nFrom) });
    while (rgHeap.length > 0) {
      const { nTile, nCost } = Pop();
      if (rgnCost[nTile] !== nCost) {
        continue;
      }
      if (nTile === nTo) {
        const rgnPath = [];
        for (let nStep = nTo; nStep >= 0; nStep = rgnPrevious[nStep]) {
          rgnPath.push(nStep);
        }
        return rgnPath.reverse();
      }
      for (const nOther of NeighborsOf(Doc, nTile)) {
        if (!Excluded.has(nOther) && (rgnCost[nOther] < 0 || nCost + 1 < rgnCost[nOther])) {
          rgnCost[nOther] = nCost + 1;
          rgnPrevious[nOther] = nTile;
          Push({ nTile: nOther, nCost: nCost + 1, dScore: nCost + 1 + Heuristic(nOther) });
        }
      }
    }
    throw new Error(`No path connects tiles ${nFrom} and ${nTo}`);
  }

  function GetFeature(Doc, Selection) {
    if (!Selection) {
      return null;
    }
    const { szLayer, Key } = Selection;
    if (szLayer === 'landmark') {
      return Model.IsTile(Doc, Key) ? Model.GetLandmark(Doc, Key) : null;
    }
    return szLayer === 'overlay' ? Model.GetOverlay(Doc, Key) : Model.GetLabel(Doc, Key);
  }

  // Key null creates an overlay/label; landmarks always use a tile key. Props null
  // deletes. Each committed property change is one command, with no-op edits skipped.
  function SetFeature(Hist, szLayer, Key, Props) {
    Require(['overlay', 'landmark', 'label'].includes(szLayer), `Unknown feature layer: ${szLayer}`);
    const Before = GetFeature(Hist.Doc, { szLayer, Key });
    if (Before && Props && Object.keys(Props).every((szKey) => {
      const Value = Props[szKey];
      return Array.isArray(Value) ? Value.length === Before[szKey].length && Value.every((Item, nIndex) => Item === Before[szKey][nIndex])
        : Value === Before[szKey];
    })) {
      return null;
    }
    return History.Perform(Hist, `${Props === null ? 'Delete' : Before ? 'Edit' : 'Add'} ${szLayer}`, (Doc, Record) => {
      if (szLayer === 'landmark') {
        Record(Model.SetLandmark(Doc, Key, Props === null ? null : { ...Before, ...Props }));
      } else if (szLayer === 'overlay') {
        Record(Props === null ? Model.RemoveOverlay(Doc, Key)
          : Key === null ? Model.AddOverlay(Doc, Props) : Model.UpdateOverlay(Doc, Key, Props));
      } else {
        Record(Props === null ? Model.RemoveLabel(Doc, Key)
          : Key === null ? Model.AddLabel(Doc, Props) : Model.UpdateLabel(Doc, Key, Props));
      }
    });
  }

  function OverlayPoint(Doc, szId, nPoint) {
    const Overlay = Model.GetOverlay(Doc, szId);
    Require(Overlay !== null, `Unknown overlay: ${szId}`);
    Require(Number.isInteger(nPoint) && nPoint >= 0 && nPoint < Overlay.rgnTiles.length, 'Select an overlay point');
    return Overlay;
  }

  function ExtendOverlay(Hist, szId, nTile) {
    const Overlay = Model.GetOverlay(Hist.Doc, szId);
    Require(Overlay !== null, `Unknown overlay: ${szId}`);
    const rgnPath = FindPath(Hist.Doc, Overlay.rgnTiles.at(-1), nTile);
    return SetFeature(Hist, 'overlay', szId, { rgnTiles: [...Overlay.rgnTiles, ...rgnPath.slice(1)] });
  }

  function InsertOverlayPoint(Hist, szId, nPoint, nTile) {
    const { rgnTiles } = OverlayPoint(Hist.Doc, szId, nPoint);
    const rgnPath = [...rgnTiles.slice(0, nPoint), ...FindPath(Hist.Doc, rgnTiles[nPoint], nTile)];
    if (nPoint + 1 < rgnTiles.length) {
      rgnPath.push(...FindPath(Hist.Doc, nTile, rgnTiles[nPoint + 1]).slice(1), ...rgnTiles.slice(nPoint + 2));
    }
    return SetFeature(Hist, 'overlay', szId, { rgnTiles: rgnPath });
  }

  function RemoveOverlayPoint(Hist, szId, nPoint) {
    const { rgnTiles } = OverlayPoint(Hist.Doc, szId, nPoint);
    if (rgnTiles.length === 1) {
      return SetFeature(Hist, 'overlay', szId, null);
    }
    const rgnPath = rgnTiles.slice(0, nPoint);
    if (nPoint > 0 && nPoint + 1 < rgnTiles.length) {
      rgnPath.push(...FindPath(Hist.Doc, rgnTiles[nPoint - 1], rgnTiles[nPoint + 1], new Set([rgnTiles[nPoint]])).slice(1));
      rgnPath.push(...rgnTiles.slice(nPoint + 2));
    } else {
      rgnPath.push(...rgnTiles.slice(nPoint + 1));
    }
    return SetFeature(Hist, 'overlay', szId, { rgnTiles: rgnPath });
  }

  function SplitOverlay(Hist, szId, nPoint) {
    const Overlay = OverlayPoint(Hist.Doc, szId, nPoint);
    Require(nPoint > 0 && nPoint < Overlay.rgnTiles.length - 1, 'Split needs an interior point');
    return History.Perform(Hist, 'Split overlay', (Doc, Record) => {
      Record(Model.UpdateOverlay(Doc, szId, { rgnTiles: Overlay.rgnTiles.slice(0, nPoint + 1) }));
      Record(Model.AddOverlay(Doc, { ...Overlay, szId: undefined, rgnTiles: Overlay.rgnTiles.slice(nPoint) }));
    });
  }

  // Orient the first path toward its chosen endpoint and the second away from its
  // endpoint. Keep the first path's id and properties; bridge any gap with A*.
  function JoinOverlays(Hist, szFirst, szSecond, fReverseFirst = false, fReverseSecond = false) {
    const First = Model.GetOverlay(Hist.Doc, szFirst);
    const Second = Model.GetOverlay(Hist.Doc, szSecond);
    Require(First && Second && First !== Second, 'Choose two different overlays');
    Require(First.szType === Second.szType, 'Joined overlays must have the same type');
    const rgnFirst = fReverseFirst ? [...First.rgnTiles].reverse() : First.rgnTiles;
    const rgnSecond = fReverseSecond ? [...Second.rgnTiles].reverse() : Second.rgnTiles;
    const rgnBridge = FindPath(Hist.Doc, rgnFirst.at(-1), rgnSecond[0]);
    return History.Perform(Hist, 'Join overlays', (Doc, Record) => {
      Record(Model.UpdateOverlay(Doc, szFirst, { rgnTiles: [...rgnFirst, ...rgnBridge.slice(1), ...rgnSecond.slice(1)] }));
      Record(Model.RemoveOverlay(Doc, szSecond));
    });
  }

  RpgMap.Edit = Object.freeze({
    g_nMaxBrushRadius,
    BrushTiles,
    FloodRegion,
    SegmentTiles,
    PaintTiles,
    BeginStroke,
    StrokeTo,
    EndStroke,
    Fill,
    CommandTiles,
    FindPath,
    GetFeature,
    SetFeature,
    ExtendOverlay,
    InsertOverlayPoint,
    RemoveOverlayPoint,
    SplitOverlay,
    JoinOverlays,
  });
})(globalThis);
</script>

<script data-module="Resample">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Coordinates, Terrain, Model, View, Edit } = RpgMap;
  const { Require } = Util;

  // Cropping and rescaling copy a map onto a new tile grid through panel-frame points, so
  // global, single-panel, flat local and seam-crossing local maps all mix freely.
  // Same or finer tiles take the source tile under their centre (upscaled tiles repeat
  // the original); coarser tiles take the most common source terrain among the source
  // tiles whose anchors fall inside them (ties: the terrain under the centre, else the
  // lowest id).

  const g_PanelEdges = new Map();

  // Each panel edge as { szOther, rgdA, rgdB, nInside } in the panel's frame, where
  // nInside is the sign of Cross(B − A, P − A) for points P inside the panel.
  function PanelEdges(szPanel) {
    if (!g_PanelEdges.has(szPanel)) {
      const Built = Projection.Build();
      const Frame = Built.Frames[szPanel];
      const rgEdges = Built.Seams.filter((Seam) => Seam.szPanelA === szPanel || Seam.szPanelB === szPanel).map((Seam) => {
        const [rgdA, rgdB] = Seam.rgszVertices.map((szId) => Projection.SolidToFrame(Frame, Built.Vertices[szId]));
        return { szOther: Seam.szPanelA === szPanel ? Seam.szPanelB : Seam.szPanelA, rgdA, rgdB };
      });
      const rgdCenter = Util.Center(rgEdges.flatMap((Edge) => [Edge.rgdA, Edge.rgdB]));
      g_PanelEdges.set(szPanel, rgEdges.map((Edge) => Object.freeze({ ...Edge, nInside: Math.sign(Side(Edge, rgdCenter)) })));
    }
    return g_PanelEdges.get(szPanel);
  }

  function Side(Edge, rgdPoint) {
    const rgdEdge = Util.Subtract(Edge.rgdB, Edge.rgdA);
    return (rgdEdge[0] * (rgdPoint[1] - Edge.rgdA[1]) - rgdEdge[1] * (rgdPoint[0] - Edge.rgdA[0])) / Math.hypot(...rgdEdge);
  }

  // A frame point that may lie beyond its panel (flat local maps run past seams), moved
  // across the seams it lies beyond into the panel that holds it.
  function NormalizePoint(szPanel, rgdPoint) {
    for (let nStep = 0; nStep < 4; nStep++) {
      let Worst = null;
      let dWorst = 1e-12;
      for (const Edge of PanelEdges(szPanel)) {
        const dOutside = -Edge.nInside * Side(Edge, rgdPoint);
        if (dOutside > dWorst) {
          dWorst = dOutside;
          Worst = Edge;
        }
      }
      if (!Worst) {
        break;
      }
      rgdPoint = Projection.ApplyTransform(View.PanelTransform(szPanel, Worst.szOther), rgdPoint);
      szPanel = Worst.szOther;
    }
    return { szPanel, rgdPoint };
  }

  function MilesPerEdge(Doc) {
    return Model.MilesPerEdge(Doc);
  }

  // The tile's feature anchor as { szPanel, rgdPoint } (panel frame, edge units).
  function TilePoint(Doc, nTile) {
    if (Doc.Topo) {
      return { szPanel: Doc.Topo.rgTiles[nTile].szPanel, rgdPoint: View.FeatureAnchor(Doc.Topo, nTile) };
    }
    const Location = Model.TileToUniversal(Doc, nTile);
    const dMilesPerEdge = MilesPerEdge(Doc);
    return NormalizePoint(Location.szPanel, [Location.dEast / dMilesPerEdge, Location.dNorth / dMilesPerEdge]);
  }

  // The tile of Doc containing a panel-frame point, or −1 when the map does not cover it.
  function TileAtPoint(Doc, szPanel, rgdPoint) {
    if (Doc.Topo) {
      const Info = Doc.Topo.Panels[szPanel];
      if (!Info) {
        return -1;
      }
      const [nQ, nJ] = Topology.LatticeNearest(Info.Lattice, rgdPoint[0], rgdPoint[1]);
      return Topology.LocateLattice(Doc.Topo, szPanel, nQ, nJ);
    }
    const Local = Doc.Local;
    let rgdFrame = rgdPoint;
    if (szPanel !== Local.Anchor.szPanel) {
      if (!Projection.FindSeam(szPanel, Local.Anchor.szPanel)) {
        return -1;
      }
      rgdFrame = Projection.ApplyTransform(View.PanelTransform(szPanel, Local.Anchor.szPanel), rgdPoint);
    }
    const dScale = MilesPerEdge(Doc) / Local.dHexMiles;
    const rgnXY = Coordinates.LocalPointToTile(Local, [
      rgdFrame[0] * dScale - Local.Anchor.dEast / Local.dHexMiles,
      rgdFrame[1] * dScale - Local.Anchor.dNorth / Local.dHexMiles,
    ]);
    return rgnXY ? Model.LocalTileIndex(Doc, rgnXY[0], rgnXY[1]) : -1;
  }

  function PanelHexes(Doc) {
    return Doc.Global ? Doc.Global.nPanelHexes : Doc.Local.nPanelHexes;
  }

  // For each Source tile, the Target tile holding its anchor (or −1).
  function MapSourceTiles(Source, Target) {
    const rgnMap = new Int32Array(Source.nTiles);
    for (let nTile = 0; nTile < Source.nTiles; nTile++) {
      const Point = TilePoint(Source, nTile);
      rgnMap[nTile] = TileAtPoint(Target, Point.szPanel, Point.rgdPoint);
    }
    return rgnMap;
  }

  // Copies terrain, landmarks, labels and overlays from Source onto the empty Target
  // (both must use the same panel size). Returns Target.
  function Transfer(Source, Target) {
    Require(PanelHexes(Source) === PanelHexes(Target), 'Both maps must use the same panel size');
    const dRatio = Model.HexMiles(Source) / Model.HexMiles(Target);
    const rgnSourceToTarget = MapSourceTiles(Source, Target);
    const rgnCenterSource = new Int32Array(Target.nTiles);
    for (let nTile = 0; nTile < Target.nTiles; nTile++) {
      const Point = TilePoint(Target, nTile);
      rgnCenterSource[nTile] = TileAtPoint(Source, Point.szPanel, Point.rgdPoint);
    }
    const CenterTerrain = (nTile) => (rgnCenterSource[nTile] >= 0 ? Source.rgnTerrain[rgnCenterSource[nTile]] : Terrain.g_nWaterId);
    if (dRatio > 1 - 1e-9) {
      for (let nTile = 0; nTile < Target.nTiles; nTile++) {
        Target.rgnTerrain[nTile] = CenterTerrain(nTile);
      }
    } else {
      const nTerrains = Terrain.g_rgTerrains.length;
      const Votes = new Map();
      rgnSourceToTarget.forEach((nTarget, nSource) => {
        if (nTarget >= 0) {
          if (!Votes.has(nTarget)) {
            Votes.set(nTarget, new Uint32Array(nTerrains));
          }
          Votes.get(nTarget)[Source.rgnTerrain[nSource]]++;
        }
      });
      for (let nTile = 0; nTile < Target.nTiles; nTile++) {
        Target.rgnTerrain[nTile] = Votes.has(nTile) ? MostCommon(Votes.get(nTile), CenterTerrain(nTile)) : CenterTerrain(nTile);
      }
    }
    for (const nSource of [...Source.Landmarks.keys()].sort((nA, nB) => nA - nB)) {
      const nTarget = rgnSourceToTarget[nSource];
      if (nTarget >= 0 && !Target.Landmarks.has(nTarget)) {
        Model.SetLandmark(Target, nTarget, Source.Landmarks.get(nSource));
      }
    }
    const Round = (dValue) => Math.round(dValue * 100) / 100 || 0;
    for (const Label of Source.rgLabels) {
      const nTarget = rgnSourceToTarget[Label.nTile];
      if (nTarget >= 0) {
        // Label units are 1/48 hex: keep the label's size and offset on the ground.
        Model.AddLabel(Target, {
          ...Label, nTile: nTarget, dSize: Math.max(0.01, Round(Label.dSize * dRatio)),
          dDx: Round(Label.dDx * dRatio), dDy: Round(Label.dDy * dRatio),
        });
      }
    }
    const UsedIds = new Set(Source.rgOverlays.map((Overlay) => Overlay.szId));
    for (const Overlay of Source.rgOverlays) {
      OverlayPieces(Target, Overlay.rgnTiles.map((nTile) => rgnSourceToTarget[nTile])).forEach((rgnTiles, nPiece) => {
        let szId = Overlay.szId;
        if (nPiece > 0) {
          let nSuffix = nPiece + 1;
          while (UsedIds.has(`${Overlay.szId}_${nSuffix}`)) {
            nSuffix++;
          }
          szId = `${Overlay.szId}_${nSuffix}`;
          UsedIds.add(szId);
        }
        Model.AddOverlay(Target, { szType: Overlay.szType, szName: Overlay.szName, szStyle: Overlay.szStyle, szId, rgnTiles });
      });
    }
    Target.nRevision = 0;
    return Target;
  }

  function MostCommon(rgnVotes, nCenter) {
    const nBest = Math.max(...rgnVotes);
    return rgnVotes[nCenter] === nBest ? nCenter : rgnVotes.indexOf(nBest);
  }

  // Splits a mapped overlay path where it leaves the map, drops repeats, and bridges
  // tiles that are no longer adjacent with shortest paths. Pieces need two tiles.
  function OverlayPieces(Target, rgnMapped) {
    const rgPieces = [];
    let rgnPiece = [];
    const Finish = () => {
      if (rgnPiece.length >= 2) {
        rgPieces.push(rgnPiece);
      }
      rgnPiece = [];
    };
    for (const nTile of rgnMapped) {
      if (nTile < 0) {
        Finish();
        continue;
      }
      const nLast = rgnPiece.length > 0 ? rgnPiece[rgnPiece.length - 1] : -1;
      if (nLast === nTile) {
        continue;
      }
      if (nLast < 0 || Model.AreAdjacent(Target, nLast, nTile)) {
        rgnPiece.push(nTile);
        continue;
      }
      const rgnPath = Edit.FindPath(Target, nLast, nTile);
      if (rgnPath) {
        rgnPiece.push(...rgnPath.slice(1));
      } else {
        Finish();
        rgnPiece.push(nTile);
      }
    }
    Finish();
    return rgPieces;
  }

  // Options: { szName?, nWidth, nHeight, szSystem, szScale, Anchor } (as Model.CreateLocalMap;
  // the panel size comes from Source). A new local map copied from part of Source.
  function Crop(Source, Options) {
    const Target = Model.CreateLocalMap({
      szName: Options.szName === undefined ? Source.szName : Options.szName,
      nWidth: Options.nWidth, nHeight: Options.nHeight, szSystem: Options.szSystem, szScale: Options.szScale,
      Anchor: Options.Anchor, nPanelHexes: PanelHexes(Source),
    });
    return Transfer(Source, Target);
  }

  // Tile scales a map of this kind can be rescaled to, as [szSystem, szScale] pairs.
  function RescaleOptions(Doc) {
    if (Doc.szKind === 'global') {
      return Topology.g_rgszTileScales.map((szScale) => ['regional', szScale]);
    }
    if (Doc.szKind === 'panel') {
      return ['XL', 'L', 'M'].map((szScale) => ['regional', szScale]);
    }
    return Object.keys(Lattice.g_Scales).flatMap((szSystem) =>
      Object.keys(Lattice.g_Scales[szSystem].Sizes).map((szScale) => [szSystem, szScale]));
  }

  // Local map options at a new scale: the same ground (at least one tile) and the same
  // north-west corner. Hexes are one unit high with a circumradius of 1/√3, so the west
  // tip and top edge of tile (0, 0) stay put.
  function LocalRescaleOptions(Local, szSystem, szScale) {
    const dNewMiles = Lattice.ScaleMiles(szSystem, szScale);
    const dRatio = Local.dHexMiles / dNewMiles;
    return {
      nWidth: Math.max(1, Math.round(Local.nWidth * dRatio)),
      nHeight: Math.max(1, Math.round(Local.nHeight * dRatio)),
      szSystem, szScale, nPanelHexes: Local.nPanelHexes,
      Anchor: Coordinates.MakeLocation(Local.Anchor.szPanel,
        Local.Anchor.dEast + (dNewMiles - Local.dHexMiles) / Math.sqrt(3),
        Local.Anchor.dNorth + (Local.dHexMiles - dNewMiles) / 2),
    };
  }

  // A copy of Doc at another tile scale. Global and panel maps keep their extent; a local
  // map keeps its ground size and north-west corner.
  function Rescale(Doc, szSystem, szScale) {
    Require(RescaleOptions(Doc).some(([szS, szZ]) => szS === szSystem && szZ === szScale),
      `A ${Doc.szKind} map cannot use the ${szSystem} ${szScale} scale`);
    if (Doc.szKind !== 'local') {
      const Options = { szName: Doc.szName, nPanelHexes: Doc.Global.nPanelHexes, szTileScale: szScale };
      const Target = Doc.szKind === 'global' ? Model.CreateGlobalMap(Options)
        : Model.CreatePanelMap({ ...Options, szPanel: Doc.Global.szPanel });
      return Transfer(Doc, Target);
    }
    return Crop(Doc, LocalRescaleOptions(Doc.Local, szSystem, szScale));
  }

  RpgMap.Resample = Object.freeze({
    NormalizePoint,
    TilePoint,
    TileAtPoint,
    Transfer,
    Crop,
    RescaleOptions,
    LocalRescaleOptions,
    Rescale,
  });
})(globalThis);
</script>
<script data-module="FileFormat">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Coordinates, Terrain, Model } = RpgMap;

  // The human-readable ASCII map file (doc/file-format.md). Write is deterministic, so
  // saved files diff cleanly; Parse reports every problem with its 1-based line number.
  const g_szMagic = '# RPGMAP 1';
  const g_szFileExtension = '.map.txt';
  const g_szReserved = Terrain.g_szReservedChar;
  // Characters that may never stand for a terrain.
  const g_szForbiddenTerrainChars = ' #[]"\\' + g_szReserved;

  // A parse error carrying the line it was found on (0 when not tied to a line).
  function FileError(nLine, szMessage) {
    const Error_ = new Error(nLine > 0 ? `Line ${nLine}: ${szMessage}` : szMessage);
    Error_.nLine = nLine;
    Error_.szReason = szMessage;
    return Error_;
  }

  function Check(fCondition, nLine, szMessage) {
    if (!fCondition) {
      throw FileError(nLine, szMessage);
    }
  }

  // Runs fn, re-throwing plain errors (for example Model validation) with the line.
  function AtLine(nLine, fn) {
    try {
      return fn();
    } catch (Caught) {
      if (Caught.nLine !== undefined) {
        throw Caught;
      }
      throw FileError(nLine, Caught.message);
    }
  }

  // Panels in Greek-alphabet order (Alpha … Sigma).
  function GreekPanelOrder() {
    const Panels = Projection.Build().Panels;
    return Object.keys(Panels).sort((szA, szB) => Panels[szA].szLetter.localeCompare(Panels[szB].szLetter));
  }

  // Strings ----------------------------------------------------------------------

  // Double-quoted; backslash and quote are escaped, and anything outside printable
  // ASCII becomes \uXXXX, so the file stays printable ASCII.
  function Quote(szText) {
    let szResult = '"';
    for (const szChar of szText) {
      for (let nIndex = 0; nIndex < szChar.length; nIndex++) {
        const nCode = szChar.charCodeAt(nIndex);
        const szUnit = szChar[nIndex];
        if (szUnit === '\\' || szUnit === '"') {
          szResult += '\\' + szUnit;
        } else if (nCode < 0x20 || nCode > 0x7e) {
          szResult += '\\u' + nCode.toString(16).padStart(4, '0');
        } else {
          szResult += szUnit;
        }
      }
    }
    return szResult + '"';
  }

  // Reads a quoted string starting at szLine[nStart] === '"'. Returns [text, next index].
  function ReadQuoted(szLine, nStart, nLine) {
    let szText = '';
    let nIndex = nStart + 1;
    while (nIndex < szLine.length) {
      const szChar = szLine[nIndex];
      if (szChar === '"') {
        return [szText, nIndex + 1];
      }
      if (szChar === '\\') {
        const szNext = szLine[nIndex + 1];
        if (szNext === '\\' || szNext === '"') {
          szText += szNext;
          nIndex += 2;
          continue;
        }
        const szHex = szLine.slice(nIndex + 2, nIndex + 6);
        Check(szNext === 'u' && /^[0-9A-Fa-f]{4}$/.test(szHex), nLine, `Invalid escape in quoted text at column ${nIndex + 1}`);
        szText += String.fromCharCode(parseInt(szHex, 16));
        nIndex += 6;
        continue;
      }
      szText += szChar;
      nIndex++;
    }
    throw FileError(nLine, 'Unterminated quoted text');
  }

  // Tokens: { szKind: 'word'|'string'|'pair'|'punct', szValue, szKey? }. A pair is
  // key=value or key="quoted value"; ';' and ':' are punctuation.
  function Tokenize(szLine, nLine) {
    const rgTokens = [];
    let nIndex = 0;
    while (nIndex < szLine.length) {
      const szChar = szLine[nIndex];
      if (szChar === ' ' || szChar === '\t') {
        nIndex++;
      } else if (szChar === '"') {
        const [szText, nNext] = ReadQuoted(szLine, nIndex, nLine);
        rgTokens.push({ szKind: 'string', szValue: szText });
        nIndex = nNext;
      } else if (szChar === ';' || szChar === ':') {
        rgTokens.push({ szKind: 'punct', szValue: szChar });
        nIndex++;
      } else {
        let nEnd = nIndex;
        while (nEnd < szLine.length && !' \t";:'.includes(szLine[nEnd])) {
          nEnd++;
        }
        const szWord = szLine.slice(nIndex, nEnd);
        const nEquals = szWord.indexOf('=');
        if (nEquals > 0) {
          const szKey = szWord.slice(0, nEquals);
          let szValue = szWord.slice(nEquals + 1);
          if (szValue === '' && szLine[nEnd] === '"') {
            [szValue, nEnd] = ReadQuoted(szLine, nEnd, nLine);
          }
          rgTokens.push({ szKind: 'pair', szKey, szValue });
        } else {
          rgTokens.push({ szKind: 'word', szValue: szWord });
        }
        nIndex = nEnd;
      }
    }
    return rgTokens;
  }

  // Locations --------------------------------------------------------------------

  // Decimals that keep a written coordinate within 1/20 hex of the tile centre
  // (0.1 mi for every regional scale; more for yard-scale local maps).
  function CoordinateDecimals(dHexMiles) {
    return Math.max(1, Math.ceil(-Math.log10(dHexMiles / 10)));
  }

  function HexMiles(Doc) {
    return Model.HexMiles(Doc);
  }

  function TileLocation(Doc, nTile) {
    return Model.TileToUniversal(Doc, nTile);
  }

  function LocationTile(Doc, Location) {
    if (Doc.Topo) {
      return Coordinates.UniversalToTile(Doc.Topo, Location);
    }
    const rgnXY = Coordinates.UniversalToLocalTile(Doc.Local, Location);
    return rgnXY ? Model.LocalTileIndex(Doc, rgnXY[0], rgnXY[1]) : -1;
  }

  // "Eta 187.1W 324.0N", or "187.1W 324.0N" when the panel is szOmitPanel.
  function FormatLocation(Doc, nTile, szOmitPanel = null) {
    const Location = TileLocation(Doc, nTile);
    const szText = Coordinates.FormatUniversal(Location, CoordinateDecimals(HexMiles(Doc)));
    return Location.szPanel === szOmitPanel ? szText.slice(szText.indexOf(' ') + 1) : szText;
  }

  // Reads a location from word tokens; szPanel supplies the panel when only the two
  // distances are given. Returns the tile index.
  function ParseLocation(Doc, rgszWords, nLine, szPanel = null) {
    let szText = rgszWords.join(' ');
    if (rgszWords.length === 2 && szPanel !== null) {
      szText = `${Projection.Build().Panels[szPanel].szName} ${szText}`;
    }
    Check(rgszWords.length === 3 || (rgszWords.length === 2 && szPanel !== null), nLine,
      `Expected a location like "Alpha 93.5E 108.0N", found "${rgszWords.join(' ')}"`);
    const Location = AtLine(nLine, () => Coordinates.ParseUniversal(szText));
    const nTile = LocationTile(Doc, Location);
    Check(nTile >= 0, nLine, `No tile within ${Coordinates.g_dSnapFraction} hex of ${szText}`);
    return { nTile, szPanel: Location.szPanel };
  }

  // Leading word tokens (up to nMax).
  function TakeWords(rgTokens, nMax) {
    const rgszWords = [];
    while (rgTokens.length > 0 && rgTokens[0].szKind === 'word' && rgszWords.length < nMax) {
      rgszWords.push(rgTokens.shift().szValue);
    }
    return rgszWords;
  }

  // Terrain grids ------------------------------------------------------------------

  // Panel section layout: file column c is lattice column nLatticeColumn + c, file row
  // r is lattice row nLatticeRow − r; rgnTiles[r·columns + c] is the tile or −1.
  function PanelGrid(Topo, szPanel) {
    const Info = Topo.Panels[szPanel];
    const rgnTiles = new Int32Array(Info.nColumns * Info.nRows).fill(-1);
    for (let nTile = Info.nFirstTile; nTile < Info.nFirstTile + Info.nTileCount; nTile++) {
      const Tile = Topo.rgTiles[nTile];
      rgnTiles[Tile.nRow * Info.nColumns + Tile.nColumn] = nTile;
    }
    return { nColumns: Info.nColumns, nRows: Info.nRows, nLatticeColumn: Info.nLatticeColumnMin, nLatticeRow: Info.nLatticeRowMax, rgnTiles };
  }

  function LocalGrid(Doc) {
    const { nWidth, nHeight } = Doc.Local;
    return { nColumns: nWidth, nRows: nHeight, rgnTiles: Int32Array.from({ length: nWidth * nHeight }, (_, nIndex) => nIndex) };
  }

  function GridLines(Doc, Grid) {
    const rgszLines = [];
    for (let nRow = 0; nRow < Grid.nRows; nRow++) {
      let szLine = '';
      for (let nColumn = 0; nColumn < Grid.nColumns; nColumn++) {
        const nTile = Grid.rgnTiles[nRow * Grid.nColumns + nColumn];
        szLine += nTile < 0 ? g_szReserved : Terrain.ById(Doc.rgnTerrain[nTile]).szChar;
      }
      rgszLines.push(szLine);
    }
    return rgszLines;
  }

  // Writer -------------------------------------------------------------------------

  function Write(Doc) {
    if (Doc.Local && Doc.Local.szSystem === 'local') {
      // Feature coordinates must use the same rounded free anchor that the reader
      // will use, or a second save can round those coordinates differently.
      const Anchor = Coordinates.ParseUniversal(Coordinates.FormatUniversal(Doc.Local.Anchor, CoordinateDecimals(Doc.Local.dHexMiles)));
      Doc = { ...Doc, Local: Coordinates.CreateLocalMap({ ...Doc.Local, Anchor }) };
    }
    const rgszLines = [g_szMagic, '', '[map]', `kind = ${Doc.szKind}`, `name = ${Quote(Doc.szName)}`];
    if (!Doc.Local) {
      rgszLines.push(`panelHexes = ${Doc.Global.nPanelHexes}`, `tileScale = ${Doc.Global.szTileScale}`);
      if (Doc.szKind === 'panel') {
        rgszLines.push(`panel = ${Projection.Build().Panels[Doc.Global.szPanel].szName}`);
      }
    } else {
      const Local = Doc.Local;
      rgszLines.push(
        `width = ${Local.nWidth}`,
        `height = ${Local.nHeight}`,
        `system = ${Local.szSystem}`,
        `size = ${Local.szScale}`,
        `anchor = ${Coordinates.FormatUniversal(Local.Anchor, CoordinateDecimals(Local.dHexMiles))}`,
        `panelHexes = ${Local.nPanelHexes}`);
    }
    rgszLines.push('', '[legend]', ...Terrain.g_rgTerrains.map((Item) => `${Item.szChar} ${Item.szKey}`));
    if (Doc.Topo) {
      // Local maps that span seams list only the panels holding some of their tiles.
      for (const szPanel of GreekPanelOrder().filter((sz) => Doc.Topo.rgszPanels.includes(sz))) {
        const Grid = PanelGrid(Doc.Topo, szPanel);
        rgszLines.push('', `[panel ${Projection.Build().Panels[szPanel].szName}]`,
          `columns = ${Grid.nColumns}`, `rows = ${Grid.nRows}`,
          `latticeColumn = ${Grid.nLatticeColumn}`, `latticeRow = ${Grid.nLatticeRow}`,
          ...GridLines(Doc, Grid));
      }
    } else {
      const Grid = LocalGrid(Doc);
      rgszLines.push('', '[local]', `columns = ${Grid.nColumns}`, `rows = ${Grid.nRows}`, ...GridLines(Doc, Grid));
    }
    if (Doc.Landmarks.size > 0) {
      rgszLines.push('', '[landmarks]');
      for (const nTile of [...Doc.Landmarks.keys()].sort((nA, nB) => nA - nB)) {
        const Landmark = Doc.Landmarks.get(nTile);
        let szLine = `${FormatLocation(Doc, nTile)} ${Landmark.szType} ${Quote(Landmark.szName)}`;
        if (Landmark.szNotes !== '') {
          szLine += ` notes=${Quote(Landmark.szNotes)}`;
        }
        rgszLines.push(szLine);
      }
    }
    if (Doc.rgLabels.length > 0) {
      rgszLines.push('', '[labels]');
      for (const Label of Doc.rgLabels) {
        rgszLines.push([
          FormatLocation(Doc, Label.nTile), Label.szCategory, `id=${Label.szId}`,
          `size=${Util.FormatNumber(Label.dSize)}`, `rot=${Util.FormatNumber(Label.dRotation)}`,
          `dx=${Util.FormatNumber(Label.dDx)}`, `dy=${Util.FormatNumber(Label.dDy)}`, Quote(Label.szText),
        ].join(' '));
      }
    }
    if (Doc.rgOverlays.length > 0) {
      rgszLines.push('', '[overlays]');
      for (const Overlay of Doc.rgOverlays) {
        const rgszHead = [Overlay.szType, Overlay.szId];
        if (Overlay.szStyle !== '') {
          rgszHead.push(`style=${Overlay.szStyle}`);
        }
        rgszHead.push(Quote(Overlay.szName));
        let szPanel = null;
        const rgszPoints = Overlay.rgnTiles.map((nTile) => {
          const szText = FormatLocation(Doc, nTile, szPanel);
          szPanel = TileLocation(Doc, nTile).szPanel;
          return szText;
        });
        rgszLines.push(`${rgszHead.join(' ')} : ${rgszPoints.join('; ')}`);
      }
    }
    return rgszLines.join('\n') + '\n';
  }

  // Parser -------------------------------------------------------------------------

  // Splits text into sections: [{ szName, szArgument, nLine, rgLines: [{ nLine, szText }] }].
  // Blank lines and lines starting with '#' are skipped (inside terrain rows too).
  function SplitSections(szText) {
    const rgszLines = szText.split(/\r?\n/);
    let nFirst = 0;
    while (nFirst < rgszLines.length && rgszLines[nFirst].trim() === '') {
      nFirst++;
    }
    Check(nFirst < rgszLines.length && rgszLines[nFirst].trim() === g_szMagic, nFirst + 1,
      `Not a map file: the first line must be "${g_szMagic}"`);
    const rgSections = [];
    for (let nIndex = nFirst + 1; nIndex < rgszLines.length; nIndex++) {
      const nLine = nIndex + 1;
      const szLine = rgszLines[nIndex].trim();
      if (szLine === '' || szLine.startsWith('#')) {
        continue;
      }
      const Match = /^\[\s*([A-Za-z]+)(?:\s+([^\]]*?))?\s*\]$/.exec(szLine);
      if (szLine.startsWith('[')) {
        Check(Match !== null, nLine, `Malformed section header: ${szLine}`);
        rgSections.push({ szName: Match[1].toLowerCase(), szArgument: Match[2] || '', nLine, rgLines: [] });
        continue;
      }
      Check(rgSections.length > 0, nLine, 'Content before the first [section]');
      rgSections[rgSections.length - 1].rgLines.push({ nLine, szText: szLine });
    }
    return rgSections;
  }

  // Leading "key = value" lines of a section; returns { Values, nNext }.
  function ReadKeyValues(Section, rgszAllowed) {
    const Values = {};
    let nNext = 0;
    for (; nNext < Section.rgLines.length; nNext++) {
      const { nLine, szText } = Section.rgLines[nNext];
      const Match = /^([A-Za-z]+)\s*=\s*(.*)$/.exec(szText);
      if (!Match) {
        break;
      }
      const szKey = Match[1];
      Check(rgszAllowed.includes(szKey), nLine, `Unknown key "${szKey}" in [${Section.szName}]`);
      Check(!(szKey in Values), nLine, `Duplicate key "${szKey}"`);
      let szValue = Match[2].trim();
      if (szValue.startsWith('"')) {
        const [szText2, nEnd] = ReadQuoted(szValue, 0, nLine);
        Check(szValue.slice(nEnd).trim() === '', nLine, `Unexpected text after the quoted value of "${szKey}"`);
        szValue = szText2;
      }
      Values[szKey] = { szValue, nLine };
    }
    return { Values, nNext };
  }

  function RequireValue(Values, szKey, Section) {
    Check(szKey in Values, Section.nLine, `[${Section.szName}] needs "${szKey} = …"`);
    return Values[szKey];
  }

  function ParseInteger(Value, szKey) {
    Check(/^-?\d+$/.test(Value.szValue), Value.nLine, `"${szKey}" must be an integer, found "${Value.szValue}"`);
    return Number(Value.szValue);
  }

  function ParseNumber(szValue, szKey, nLine) {
    Check(/^-?(\d+(\.\d*)?|\.\d+)(e[-+]?\d+)?$/i.test(szValue), nLine, `"${szKey}" must be a number, found "${szValue}"`);
    return Number(szValue) || 0;
  }

  // fFlat: the file has a [local] grid, so the map stays one flat grid even if it
  // crosses a panel seam (files written before local maps could span seams).
  function CreateDocument(Section, fFlat = false) {
    const { Values, nNext } = ReadKeyValues(Section,
      ['kind', 'name', 'panelHexes', 'tileScale', 'panel', 'width', 'height', 'system', 'size', 'anchor']);
    Check(nNext === Section.rgLines.length, Section.rgLines[nNext] ? Section.rgLines[nNext].nLine : 0, 'Expected "key = value" in [map]');
    const Kind = RequireValue(Values, 'kind', Section);
    const szName = Values.name ? Values.name.szValue : '';
    const nPanelHexes = Values.panelHexes ? ParseInteger(Values.panelHexes, 'panelHexes') : undefined;
    if (Kind.szValue === 'global' || Kind.szValue === 'panel') {
      for (const szKey of ['width', 'height', 'system', 'size', 'anchor']) {
        Check(!(szKey in Values), Values[szKey] && Values[szKey].nLine, `"${szKey}" is only for local maps`);
      }
      const szTileScale = Values.tileScale ? Values.tileScale.szValue : undefined;
      if (Kind.szValue === 'panel') {
        const Panel = RequireValue(Values, 'panel', Section);
        const szPanel = Coordinates.PanelIdByName(Panel.szValue);
        Check(szPanel !== null, Panel.nLine, `Unknown panel "${Panel.szValue}"`);
        return AtLine(Section.nLine, () => Model.CreatePanelMap({ nPanelHexes, szTileScale, szPanel, szName }));
      }
      Check(!('panel' in Values), Values.panel && Values.panel.nLine, '"panel" is only for single-panel maps');
      return AtLine(Section.nLine, () => Model.CreateGlobalMap({ nPanelHexes, szTileScale, szName }));
    }
    Check(Kind.szValue === 'local', Kind.nLine, `Map kind must be "global", "panel" or "local", found "${Kind.szValue}"`);
    Check(!('panel' in Values), Values.panel && Values.panel.nLine, '"panel" is only for single-panel maps');
    Check(!('tileScale' in Values), Values.tileScale && Values.tileScale.nLine, '"tileScale" is only for global maps');
    const Anchor = RequireValue(Values, 'anchor', Section);
    const System = RequireValue(Values, 'system', Section);
    const Size = RequireValue(Values, 'size', Section);
    Check(System.szValue in Lattice.g_Scales, System.nLine, `Unknown scale system "${System.szValue}"`);
    Check(Size.szValue in Lattice.g_Scales[System.szValue].Sizes, Size.nLine, `Unknown ${System.szValue} size "${Size.szValue}"`);
    return AtLine(Section.nLine, () => Model.CreateLocalMap({
      nWidth: ParseInteger(RequireValue(Values, 'width', Section), 'width'),
      nHeight: ParseInteger(RequireValue(Values, 'height', Section), 'height'),
      szSystem: System.szValue,
      szScale: Size.szValue,
      Anchor: AtLine(Anchor.nLine, () => Coordinates.ParseUniversal(Anchor.szValue)),
      nPanelHexes,
      szName,
      fFlat,
    }));
  }

  // [legend] lines "<char> <terrain key>"; returns Map char → terrain id.
  function ParseLegend(Section) {
    const ByChar = new Map();
    const Keys = new Set();
    for (const { nLine, szText } of Section.rgLines) {
      const Match = /^(\S)\s+(\S+)$/.exec(szText);
      Check(Match !== null, nLine, `Expected "<char> <terrain>" in [legend], found "${szText}"`);
      const [, szChar, szKey] = Match;
      Check(!g_szForbiddenTerrainChars.includes(szChar), nLine, `"${szChar}" cannot stand for a terrain`);
      const Item = Terrain.ByKey(szKey);
      Check(Item !== null, nLine, `Unknown terrain "${szKey}"`);
      Check(!ByChar.has(szChar), nLine, `Character "${szChar}" is defined twice`);
      Check(!Keys.has(szKey), nLine, `Terrain "${szKey}" is defined twice`);
      ByChar.set(szChar, Item.nId);
      Keys.add(szKey);
    }
    return ByChar;
  }

  function DefaultLegend() {
    return new Map(Terrain.g_rgTerrains.map((Item) => [Item.szChar, Item.nId]));
  }

  // Reads a terrain grid section into Doc.rgnTerrain.
  function ParseGrid(Doc, Section, Grid, Legend, rgszExtraKeys) {
    const { Values, nNext } = ReadKeyValues(Section, ['columns', 'rows', ...rgszExtraKeys]);
    const szWhere = `[${Section.szName}${Section.szArgument ? ' ' + Section.szArgument : ''}]`;
    const nColumns = ParseInteger(RequireValue(Values, 'columns', Section), 'columns');
    const nRows = ParseInteger(RequireValue(Values, 'rows', Section), 'rows');
    Check(nColumns === Grid.nColumns, Values.columns.nLine, `${szWhere} must have columns = ${Grid.nColumns}, found ${nColumns}`);
    Check(nRows === Grid.nRows, Values.rows.nLine, `${szWhere} must have rows = ${Grid.nRows}, found ${nRows}`);
    if (Values.latticeColumn) {
      Check(ParseInteger(Values.latticeColumn, 'latticeColumn') === Grid.nLatticeColumn, Values.latticeColumn.nLine,
        `${szWhere} must have latticeColumn = ${Grid.nLatticeColumn}`);
    }
    if (Values.latticeRow) {
      Check(ParseInteger(Values.latticeRow, 'latticeRow') === Grid.nLatticeRow, Values.latticeRow.nLine,
        `${szWhere} must have latticeRow = ${Grid.nLatticeRow}`);
    }
    const rgRows = Section.rgLines.slice(nNext);
    Check(rgRows.length === nRows, rgRows.length > nRows ? rgRows[nRows].nLine : Section.nLine,
      `${szWhere} has ${rgRows.length} terrain rows, expected ${nRows}`);
    rgRows.forEach(({ nLine, szText }, nRow) => {
      Check(szText.length === nColumns, nLine, `Terrain row is ${szText.length} characters wide, expected ${nColumns}`);
      for (let nColumn = 0; nColumn < nColumns; nColumn++) {
        const szChar = szText[nColumn];
        const nTile = Grid.rgnTiles[nRow * nColumns + nColumn];
        if (nTile < 0) {
          Check(szChar === g_szReserved, nLine, `Column ${nColumn + 1} is not a tile of this panel and must be "${g_szReserved}", found "${szChar}"`);
          continue;
        }
        Check(szChar !== g_szReserved, nLine, `Column ${nColumn + 1} is a tile and needs a terrain character, found "${g_szReserved}"`);
        const nId = Legend.get(szChar);
        Check(nId !== undefined, nLine, `Unknown terrain character "${szChar}" in column ${nColumn + 1}`);
        Doc.rgnTerrain[nTile] = nId;
      }
    });
  }

  function ExpectNoTokens(rgTokens, nLine) {
    Check(rgTokens.length === 0, nLine, `Unexpected "${rgTokens.length ? (rgTokens[0].szKey ? rgTokens[0].szKey + '=' : '') + rgTokens[0].szValue : ''}"`);
  }

  function TakePairs(rgTokens, rgszAllowed, nLine) {
    const Pairs = {};
    for (let nIndex = 0; nIndex < rgTokens.length;) {
      const Token = rgTokens[nIndex];
      if (Token.szKind !== 'pair') {
        nIndex++;
        continue;
      }
      Check(rgszAllowed.includes(Token.szKey), nLine, `Unknown option "${Token.szKey}"`);
      Check(!(Token.szKey in Pairs), nLine, `Duplicate option "${Token.szKey}"`);
      Pairs[Token.szKey] = Token.szValue;
      rgTokens.splice(nIndex, 1);
    }
    return Pairs;
  }

  function TakeString(rgTokens, nLine, szWhat, fRequired) {
    const nIndex = rgTokens.findIndex((Token) => Token.szKind === 'string');
    Check(nIndex >= 0 || !fRequired, nLine, `Missing quoted ${szWhat}`);
    return nIndex < 0 ? '' : rgTokens.splice(nIndex, 1)[0].szValue;
  }

  // "<location> <type> ["name"] [notes="…"]"
  function ParseLandmarks(Doc, Section) {
    for (const { nLine, szText } of Section.rgLines) {
      const rgTokens = Tokenize(szText, nLine);
      const { nTile } = ParseLocation(Doc, TakeWords(rgTokens, 3), nLine);
      const rgszType = TakeWords(rgTokens, 1);
      Check(rgszType.length === 1, nLine, 'Missing landmark type');
      const Pairs = TakePairs(rgTokens, ['notes'], nLine);
      const szName = TakeString(rgTokens, nLine, 'name', false);
      ExpectNoTokens(rgTokens, nLine);
      Check(!Doc.Landmarks.has(nTile), nLine, `A landmark already exists at ${FormatLocation(Doc, nTile)} (one per tile)`);
      AtLine(nLine, () => Model.SetLandmark(Doc, nTile, { szType: rgszType[0], szName, szNotes: Pairs.notes === undefined ? '' : Pairs.notes }));
    }
  }

  // "<location> <category> [id=…] [size=…] [rot=…] [dx=…] [dy=…] "text""
  function ParseLabels(Doc, Section) {
    for (const { nLine, szText } of Section.rgLines) {
      const rgTokens = Tokenize(szText, nLine);
      const { nTile } = ParseLocation(Doc, TakeWords(rgTokens, 3), nLine);
      const rgszCategory = TakeWords(rgTokens, 1);
      Check(rgszCategory.length === 1, nLine, 'Missing label category');
      const Pairs = TakePairs(rgTokens, ['id', 'size', 'rot', 'dx', 'dy'], nLine);
      const szLabelText = TakeString(rgTokens, nLine, 'label text', true);
      ExpectNoTokens(rgTokens, nLine);
      const Props = { nTile, szText: szLabelText, szCategory: rgszCategory[0] };
      if (Pairs.id !== undefined) {
        Props.szId = Pairs.id;
      }
      for (const [szKey, szProp] of [['size', 'dSize'], ['rot', 'dRotation'], ['dx', 'dDx'], ['dy', 'dDy']]) {
        if (Pairs[szKey] !== undefined) {
          Props[szProp] = ParseNumber(Pairs[szKey], szKey, nLine);
        }
      }
      AtLine(nLine, () => Model.AddLabel(Doc, Props));
    }
  }

  // "<type> <id> [style=…] ["name"] : <location>; [<panel>] <east> <north>; …"
  function ParseOverlays(Doc, Section) {
    for (const { nLine, szText } of Section.rgLines) {
      const rgTokens = Tokenize(szText, nLine);
      const nColon = rgTokens.findIndex((Token) => Token.szKind === 'punct' && Token.szValue === ':');
      Check(nColon >= 0, nLine, 'Missing ":" before the overlay points');
      const rgHead = rgTokens.slice(0, nColon);
      const rgPoints = rgTokens.slice(nColon + 1);
      const rgszHead = TakeWords(rgHead, 2);
      Check(rgszHead.length === 2, nLine, 'Expected "<type> <id>" before the overlay name');
      const Pairs = TakePairs(rgHead, ['style'], nLine);
      const szName = TakeString(rgHead, nLine, 'name', false);
      ExpectNoTokens(rgHead, nLine);
      const rgnTiles = [];
      let szPanel = null;
      let rgszWords = [];
      for (let nIndex = 0; nIndex <= rgPoints.length; nIndex++) {
        const Token = rgPoints[nIndex];
        if (Token === undefined || (Token.szKind === 'punct' && Token.szValue === ';')) {
          Check(rgszWords.length > 0, nLine, `Empty overlay point ${rgnTiles.length + 1}`);
          const Point = ParseLocation(Doc, rgszWords, nLine, szPanel);
          rgnTiles.push(Point.nTile);
          szPanel = Point.szPanel;
          rgszWords = [];
          continue;
        }
        Check(Token.szKind === 'word', nLine, `Unexpected "${Token.szValue}" in overlay point ${rgnTiles.length + 1}`);
        rgszWords.push(Token.szValue);
      }
      AtLine(nLine, () => Model.AddOverlay(Doc, {
        szType: rgszHead[0], szId: rgszHead[1], szName, szStyle: Pairs.style === undefined ? '' : Pairs.style, rgnTiles,
      }));
    }
  }

  // Text → document. Throws an Error with nLine (1-based) on the first problem.
  function Parse(szText) {
    Util.Require(typeof szText === 'string', 'Map file text must be a string');
    const rgSections = SplitSections(szText);
    const Seen = new Map();
    for (const Section of rgSections) {
      const szKey = Section.szName === 'panel' ? `panel ${Section.szArgument.toLowerCase()}` : Section.szName;
      Check(['map', 'legend', 'panel', 'local', 'landmarks', 'labels', 'overlays'].includes(Section.szName), Section.nLine,
        `Unknown section [${Section.szName}]`);
      Check(Section.szName === 'panel' || Section.szArgument === '', Section.nLine, `[${Section.szName}] takes no argument`);
      Check(!Seen.has(szKey), Section.nLine, `Duplicate section [${Section.szName}${Section.szArgument ? ' ' + Section.szArgument : ''}] (first on line ${Seen.get(szKey)})`);
      Seen.set(szKey, Section.nLine);
    }
    const MapSection = rgSections.find((Section) => Section.szName === 'map');
    Check(MapSection !== undefined, 0, 'Missing [map] section');
    Check(rgSections[0] === MapSection, rgSections[0].nLine, '[map] must be the first section');
    const Doc = CreateDocument(MapSection, rgSections.some((Section) => Section.szName === 'local'));
    const LegendSection = rgSections.find((Section) => Section.szName === 'legend');
    const Legend = LegendSection ? ParseLegend(LegendSection) : DefaultLegend();
    if (Doc.Topo) {
      const Built = Projection.Build();
      const Remaining = new Set(Doc.Topo.rgszPanels);
      for (const Section of rgSections) {
        if (Section.szName === 'local') {
          throw FileError(Section.nLine, '[local] is only for local maps');
        }
        if (Section.szName === 'panel') {
          const szPanel = Coordinates.PanelIdByName(Section.szArgument);
          Check(szPanel !== null, Section.nLine, `Unknown panel "${Section.szArgument}"`);
          Check(Doc.Topo.rgszPanels.includes(szPanel), Section.nLine, `Panel "${Section.szArgument}" is outside this map`);
          ParseGrid(Doc, Section, PanelGrid(Doc.Topo, szPanel), Legend, ['latticeColumn', 'latticeRow']);
          Remaining.delete(szPanel);
        }
      }
      Check(Remaining.size === 0, 0, `Missing panel sections: ${GreekPanelOrder().filter((sz) => Remaining.has(sz)).map((sz) => Built.Panels[sz].szName).join(', ')}`);
    } else {
      for (const Section of rgSections) {
        Check(Section.szName !== 'panel', Section.nLine, '[panel …] is only for global maps and local maps that cross panel seams');
      }
      const LocalSection = rgSections.find((Section) => Section.szName === 'local');
      Check(LocalSection !== undefined, 0, 'Missing [local] section');
      ParseGrid(Doc, LocalSection, LocalGrid(Doc), Legend, []);
    }
    for (const Section of rgSections) {
      if (Section.szName === 'landmarks') {
        ParseLandmarks(Doc, Section);
      } else if (Section.szName === 'labels') {
        ParseLabels(Doc, Section);
      } else if (Section.szName === 'overlays') {
        ParseOverlays(Doc, Section);
      }
    }
    Doc.nRevision = 0;
    return Doc;
  }

  // A file name from the map name: "<name>.map.txt" with unsafe characters replaced.
  function FileName(Doc) {
    const szBase = Doc.szName.trim().replace(/[^A-Za-z0-9 _.-]+/g, '_').replace(/\s+/g, '-').replace(/^[.-]+/, '');
    return (szBase || 'map') + g_szFileExtension;
  }

  RpgMap.FileFormat = Object.freeze({
    g_szMagic,
    g_szFileExtension,
    Quote,
    Tokenize,
    CoordinateDecimals,
    Write,
    Parse,
    FileName,
  });
})(globalThis);
</script>

<script data-module="Regions">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Terrain, Model, View } = RpgMap;
  const { Require } = Util;
  const g_dTolerance = 1e-8;

  // Export geometry is in hex heights, y north/up, regardless of physical scale.
  function Outline(Doc, szPanel) {
    const Geometry = View.MapGeometry(Doc);
    Require(Doc.Local ? szPanel === 'local' : Object.hasOwn(Geometry.Panels, szPanel), 'Choose a valid export panel');
    return View.FrameOutline(Geometry, szPanel).map((Point) => Util.Scale(Point, 1 / Geometry.dD));
  }

  // Trace directed edges, keeping the region/land on the left. Open chains are
  // visited first; remaining edges are closed outer rings or holes.
  function TracePaths(rgEdges, rgrgdPoints) {
    const Outgoing = new Map(), Incoming = new Map();
    for (const Edge of rgEdges) {
      Require(!Outgoing.has(Edge.nA) && !Incoming.has(Edge.nB), 'Ambiguous region boundary');
      Outgoing.set(Edge.nA, Edge);
      Incoming.set(Edge.nB, Edge);
    }
    const Seen = new Set(), rgPaths = [];
    for (const First of [...rgEdges.filter((Edge) => !Incoming.has(Edge.nA)), ...rgEdges]) {
      if (Seen.has(First)) {
        continue;
      }
      const Points = [rgrgdPoints[First.nA]];
      let Edge = First;
      while (Edge && !Seen.has(Edge)) {
        Seen.add(Edge);
        Points.push(rgrgdPoints[Edge.nB]);
        Edge = Outgoing.get(Edge.nB);
      }
      Require(!Edge || Edge === First, 'Region boundary joins a different chain');
      rgPaths.push({ rgrgdPoints: Points, fClosed: Edge === First });
    }
    return rgPaths;
  }

  function Build(Doc, szPanel = Doc.Local ? 'local' : Doc.Global.szPanel || null) {
    const Geometry = View.MapGeometry(Doc);
    const rgrgdOutline = Outline(Doc, szPanel);
    const rgdToHex = [1 / Geometry.dD, 0, 0, 1 / Geometry.dD, 0, 0];
    let Data;
    if (Geometry.Span && szPanel === 'local') {
      // A local map spanning seams: each panel's part is built in its own unfolded place.
      // Parts are not stitched, so regions and shorelines stop at the seams.
      Data = { rgrgdPoints: [], rgCells: [], rgEdges: [], rgRegions: [], rgShorelines: [] };
      for (const [szPart, Placement] of Object.entries(Geometry.Span.Placements)) {
        const rgdPartToHex = Projection.ComposeTransforms(Placement.rgdFrameToWorld, rgdToHex);
        const Part = BuildPart(Doc, Geometry, szPart, rgdPartToHex,
          Placement.rgrgdFrameOutline.map((Point) => Projection.ApplyTransform(rgdPartToHex, Point)));
        const nPoints = Data.rgrgdPoints.length, nCells = Data.rgCells.length, nRegions = Data.rgRegions.length;
        for (const Edge of Part.rgEdges) {
          Edge.nA += nPoints;
          Edge.nB += nPoints;
          Edge.rgnCells = Edge.rgnCells.map((nCell) => nCell + nCells);
        }
        for (const Cell of Part.rgCells) {
          Cell.rgnVertices = Cell.rgnVertices.map((nVertex) => nVertex + nPoints);
          Cell.nRegion += nRegions;
        }
        Data.rgrgdPoints.push(...Part.rgrgdPoints);
        Data.rgCells.push(...Part.rgCells);
        Data.rgEdges.push(...Part.rgEdges);
        Data.rgRegions.push(...Part.rgRegions);
        Data.rgShorelines.push(...Part.rgShorelines);
      }
    } else {
      Data = BuildPart(Doc, Geometry, szPanel, rgdToHex, rgrgdOutline);
    }
    return { szPanel, rgrgdOutline, rgdBounds: View.BoundsOf(rgrgdOutline), ...Data };
  }

  // Cells, regions and shorelines of szPanel's tiles: rgdPanelToHex maps its frame to
  // export units, and rgrgdClip (export units) bounds the drawing.
  function BuildPart(Doc, Geometry, szPanel, rgdPanelToHex, rgrgdClip) {
    const rgrgdPoints = [], rgCells = [], rgEdges = [];
    const Buckets = new Map(), Edges = new Map();
    // Adjacent hexes and clipped seam copies can differ in their last float bits.
    // Check neighbouring buckets too, rather than relying on rounded equality.
    // Buckets are nested numeric maps (x, then y) to avoid string keys at L scale.
    const Vertex = (Point) => {
      const nX = Math.floor(Point[0] / g_dTolerance), nY = Math.floor(Point[1] / g_dTolerance);
      for (let nDx = -1; nDx <= 1; nDx++) {
        const Column = Buckets.get(nX + nDx);
        if (!Column) {
          continue;
        }
        for (let nDy = -1; nDy <= 1; nDy++) {
          for (const nVertex of Column.get(nY + nDy) || []) {
            if (Util.Distance(Point, rgrgdPoints[nVertex]) <= g_dTolerance) {
              return nVertex;
            }
          }
        }
      }
      const nVertex = rgrgdPoints.length;
      rgrgdPoints.push(Point);
      const Column = Buckets.get(nX) || Buckets.set(nX, new Map()).get(nX);
      (Column.get(nY) || Column.set(nY, []).get(nY)).push(nVertex);
      return nVertex;
    };
    for (const Group of View.PanelTileGroups(Geometry, szPanel)) {
      const rgdToHex = Projection.ComposeTransforms(Group.rgdToPanel, rgdPanelToHex);
      for (const nTile of Group.rgnTiles) {
        const Tile = Geometry.rgTiles[nTile];
        const rgPolygons = Tile.rgPieces
          ? Tile.rgPieces.filter((Piece) => Piece.szPanel === szPanel).map((Piece) => Piece.rgrgdPolygon)
          : [Lattice.HexPolygon(Tile.rgdCenter, Geometry.dD)];
        for (const Polygon of rgPolygons) {
          const Mapped = Polygon.map((Point) => Projection.ApplyTransform(rgdToHex, Point));
          const Clipped = Util.ClipPolygonToConvex(Mapped, rgrgdClip);
          if (Clipped.length < 3 || Math.abs(Util.PolygonArea(Clipped)) < 1e-12) {
            continue;
          }
          const Vertices = Clipped.map(Vertex);
          const rgnVertices = Vertices.filter((nVertex, nIndex) => nVertex !== Vertices[(nIndex + 1) % Vertices.length]);
          if (rgnVertices.length < 3) {
            continue;
          }
          const Cell = { nTile, nTerrainId: Model.GetTerrain(Doc, nTile), rgnVertices, rgEdges: [] };
          const nCell = rgCells.length;
          rgCells.push(Cell);
          for (const [nA, nB] of Util.Boundary(rgnVertices)) {
            const szKey = nA < nB ? `${nA}:${nB}` : `${nB}:${nA}`;
            let Edge = Edges.get(szKey);
            if (!Edge) {
              Edge = { nA, nB, rgnCells: [] };
              Edges.set(szKey, Edge);
              rgEdges.push(Edge);
            } else {
              Require(Edge.rgnCells.length === 1 && Edge.nA === nB && Edge.nB === nA, 'Overlapping export tiles');
            }
            Edge.rgnCells.push(nCell);
            Cell.rgEdges.push(Edge);
          }
        }
      }
    }
    const rgnRegions = new Int32Array(rgCells.length).fill(-1), rgRegions = [];
    for (let nStart = 0; nStart < rgCells.length; nStart++) {
      if (rgnRegions[nStart] !== -1) {
        continue;
      }
      const nRegion = rgRegions.length, nTerrainId = rgCells[nStart].nTerrainId;
      const rgnQueue = [nStart], Tiles = new Set(), Boundary = [];
      rgnRegions[nStart] = nRegion;
      for (let nHead = 0; nHead < rgnQueue.length; nHead++) {
        const nCell = rgnQueue[nHead], Cell = rgCells[nCell];
        Tiles.add(Cell.nTile);
        for (const Edge of Cell.rgEdges) {
          const nOther = Edge.rgnCells.find((nIndex) => nIndex !== nCell);
          if (nOther === undefined || rgCells[nOther].nTerrainId !== nTerrainId) {
            Boundary.push(Edge.rgnCells[0] === nCell ? Edge : { nA: Edge.nB, nB: Edge.nA });
          } else if (rgnRegions[nOther] === -1) {
            rgnRegions[nOther] = nRegion;
            rgnQueue.push(nOther);
          }
        }
      }
      const Paths = TracePaths(Boundary, rgrgdPoints);
      Require(Paths.every((Path) => Path.fClosed), 'Unclosed terrain region');
      rgRegions.push({ nTerrainId, rgnTiles: [...Tiles], rgrgrgdLoops: Paths.map((Path) => Path.rgrgdPoints) });
    }
    rgCells.forEach((Cell, nCell) => {
      Cell.nRegion = rgnRegions[nCell];
    });
    const ShoreEdges = [];
    for (const Edge of rgEdges) {
      if (Edge.rgnCells.length !== 2) {
        continue; // An export boundary has no water on its other side.
      }
      const fFirstWater = Terrain.IsWater(rgCells[Edge.rgnCells[0]].nTerrainId);
      const fSecondWater = Terrain.IsWater(rgCells[Edge.rgnCells[1]].nTerrainId);
      if (fFirstWater !== fSecondWater) {
        ShoreEdges.push(fFirstWater ? { nA: Edge.nB, nB: Edge.nA } : Edge);
      }
    }
    return { rgrgdPoints, rgCells, rgEdges, rgRegions, rgShorelines: TracePaths(ShoreEdges, rgrgdPoints) };
  }

  // Chaikin corner cutting, preserving the endpoints of panel-clipped coastlines.
  function SmoothPath(Path, nPasses = 2) {
    Require(Number.isInteger(nPasses) && nPasses >= 0 && nPasses <= 3, 'Shoreline smoothing needs 0 to 3 passes');
    let Points = Path.rgrgdPoints.map((Point) => [...Point]);
    for (let nPass = 0; nPass < nPasses; nPass++) {
      const Next = Path.fClosed ? [] : [Points[0]];
      for (let nIndex = 0; nIndex + 1 < Points.length; nIndex++) {
        Next.push(Util.Add(Util.Scale(Points[nIndex], 0.75), Util.Scale(Points[nIndex + 1], 0.25)),
          Util.Add(Util.Scale(Points[nIndex], 0.25), Util.Scale(Points[nIndex + 1], 0.75)));
      }
      Next.push(Path.fClosed ? Next[0] : Points.at(-1));
      Points = Next;
    }
    return { rgrgdPoints: Points, fClosed: Path.fClosed };
  }

  RpgMap.Regions = Object.freeze({ g_dTolerance, Outline, Build, TracePaths, SmoothPath });
})(globalThis);
</script>

<script data-module="Embellish">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Terrain, Regions } = RpgMap;

  // SVG terrain patterns (plan §8) in normalized export units: hex heights, y north/up.
  // Motifs are anchored to lattices in the exported panel's frame, so patterns continue
  // across same-terrain tiles; SvgExport clips each region's motifs to that region.
  const g_nVariants = 4;
  const g_dJitter = 0.3;
  const g_dHexArea = Math.sqrt(3) / 2;
  const g_dTrunkSpacing = 0.08;
  const g_dTrunkHeight = 0.07;
  const g_dSouthFacing = -0.3;
  // Forest crowns keep this clearance from an exposed south edge so trunks show beneath them;
  // a row of crowns spaced along the edge replaces those removed.
  const g_dCrownClearance = 0.165;
  const g_dFringeSpacing = 0.2;
  const g_MotifCache = new Map();

  function SegmentDistance(rgdPoint, A, B) {
    const Direction = Util.Subtract(B, A);
    const dT = Math.min(1, Math.max(0, Util.Dot(Util.Subtract(rgdPoint, A), Direction) / Util.Dot(Direction, Direction)));
    const Delta = Util.Subtract(rgdPoint, Util.Add(A, Util.Scale(Direction, dT)));
    return Math.hypot(Delta[0], Delta[1]);
  }

  // Roles: body is filled and inked, ink/accent are strokes, dot is filled with ink.
  function Shape(szRole, rgrgdPoints, fClosed = false) {
    return Object.freeze({ szRole, fClosed, rgrgdPoints: Object.freeze(rgrgdPoints.map((Point) => Object.freeze(Point))) });
  }

  function Line(...rgrgdPoints) {
    return Shape('ink', rgrgdPoints);
  }

  function Water(...rgrgdPoints) {
    return Shape('accent', rgrgdPoints);
  }

  function Bump(dX, dY, dWidth, dHeight, nSteps = 10) {
    return Array.from({ length: nSteps + 1 }, (_, nIndex) =>
      [dX + (nIndex / nSteps - 0.5) * dWidth, dY + dHeight * Math.sin(Math.PI * nIndex / nSteps)]);
  }

  function Quadratic(rgdA, rgdControl, rgdB, nSteps = 8) {
    return Array.from({ length: nSteps + 1 }, (_, nIndex) => {
      const dT = nIndex / nSteps, dU = 1 - dT;
      return [0, 1].map((nAxis) => dU * dU * rgdA[nAxis] + 2 * dU * dT * rgdControl[nAxis] + dT * dT * rgdB[nAxis]);
    });
  }

  function Ring(dX, dY, dRadius, nSteps, RadiusAt = () => 1) {
    return Array.from({ length: nSteps }, (_, nIndex) => {
      const dAngle = 2 * Math.PI * nIndex / nSteps, dR = dRadius * RadiusAt(dAngle);
      return [dX + dR * Math.cos(dAngle), dY + dR * Math.sin(dAngle)];
    });
  }

  function Dot(dX, dY) {
    return Shape('dot', Ring(dX, dY, 0.014, 6), true);
  }

  function Peak(dX, dY, dWidth, dHeight, dApex) {
    const Apex = [dX + dApex, dY + dHeight];
    return [
      Shape('body', [[dX - dWidth / 2, dY], Apex, [dX + dWidth / 2, dY]]),
      Line(Apex, [Apex[0] + 0.03, dY + dHeight * 0.55], [Apex[0] + 0.012, dY + dHeight * 0.3], [Apex[0] + 0.035, dY + dHeight * 0.08]),
    ];
  }

  function Dune(dX, dY, dWidth, dHeight) {
    const Crest = [dX - dWidth * 0.15, dY + dHeight];
    return Shape('body', [[dX - dWidth / 2, dY], ...Quadratic(Crest, [dX + dWidth * 0.18, dY + dHeight], [dX + dWidth / 2, dY])]);
  }

  // Each generator returns the shapes of one variant, back to front.
  const g_Generators = {
    islands(R) {
      const Points = Ring(0, 0, 1, 8).map((Point) => Util.Scale(Point, 0.045 + 0.035 * R()));
      const Smooth = Regions.SmoothPath({ rgrgdPoints: [...Points, Points[0]], fClosed: true }, 2);
      return [Shape('body', Smooth.rgrgdPoints.slice(0, -1), true)];
    },
    hills(R) {
      const rgShapes = R() < 0.7 ? [Shape('body', Bump(-0.08 + 0.04 * R(), 0.035, 0.17, 0.06))] : [];

    const rgdFrameToSvg = Projection.ComposeTransforms([1 / Geometry.dD, 0, 0, 1 / Geometry.dD, 0, 0], rgdHexToSvg);
    const Outline = { rgrgdPoints: [...RegionsData.rgrgdOutline, RegionsData.rgrgdOutline[0]], fClosed: true };
    const szScope = Doc.Local ? 'Local map' : Projection.Build().Panels[szPanel].szName;
    const Lines = [
      '<?xml version="1.0" encoding="UTF-8"?>',
      `<svg xmlns="http://www.w3.org/2000/svg" width="${Size.nWidth}" height="${Size.nHeight}" viewBox="0 0 ${NumberText(Size.dWidth)} ${NumberText(Size.dHeight)}" role="img" aria-labelledby="map-title">`,
      `<title id="map-title">${Escape(Doc.szName || 'Untitled')} - ${Escape(szScope)}</title>`,
      '<defs>',
      `<clipPath id="map-clip"><path d="${PathData(Outline, rgdHexToSvg)}"/></clipPath>`,
    ];
    const rgEmbellishments = (Layers.embellishment ? Embellish.Build(RegionsData) : [])
      .map((Item) => Item && (Item.rgInstances.length || Item.rgrgrgdTrunks.length) ? Item : null);
    if (Layers.terrain || Layers.embellishment) {
      RegionsData.rgRegions.forEach((Region, nIndex) => {
        const szPath = Region.rgrgrgdLoops.map((Points) => PathData({ rgrgdPoints: Points, fClosed: true }, rgdHexToSvg)).join('');
        Lines.push(`<path id="region-${nIndex}" fill-rule="evenodd" clip-rule="evenodd" d="${szPath}"/>`);
      });
    }
    const UsedVariants = new Map();
    rgEmbellishments.forEach((Item, nIndex) => {
      if (Item) {
        Lines.push(`<clipPath id="clip-region-${nIndex}"><use href="#region-${nIndex}"/></clipPath>`);
        const Variants = UsedVariants.get(Item.nTerrainId) || UsedVariants.set(Item.nTerrainId, new Set()).get(Item.nTerrainId);
        Item.rgInstances.forEach((Instance) => Variants.add(Instance.nVariant));
      }
    });
    for (const Type of Terrain.g_rgTerrains.filter((Item) => UsedVariants.has(Item.nId))) {
      const Spec = Type.Embellish;
      const szBody = Layers.terrain ? Spec.szBody || Type.szColor : g_szUncolouredBody;
      Embellish.Motifs(Type.szKey).forEach((rgShapes, nVariant) => {
        if (UsedVariants.get(Type.nId).has(nVariant)) {
          Lines.push(`<g id="emb-${Type.szKey}-${nVariant}">${rgShapes.map((Shape) => MotifPath(Shape, Spec, szBody)).join('')}</g>`);
        }
      });
    }
    if (Layers.landmark) {
      const Types = new Set([...Doc.Landmarks.values()].map((Landmark) => Landmark.szType));
      for (const Type of Terrain.g_rgLandmarkTypes.filter((Item) => Types.has(Item.szKey))) {
        Lines.push(`<symbol id="landmark-${Type.szKey}" viewBox="-12 -12 24 24" overflow="visible"><path d="${Type.szPath}" fill="#f9edcc" stroke="#28221b" stroke-width="1.8" stroke-linejoin="round"/></symbol>`);
      }
    }
    Lines.push('</defs>', '<g clip-path="url(#map-clip)">');
    if (Layers.terrain) {
      Lines.push('<g id="layer-terrain">');
      RegionsData.rgRegions.forEach((Region, nIndex) =>
        Lines.push(`<use href="#region-${nIndex}" fill="${Terrain.ById(Region.nTerrainId).szColor}"/>`));
      Lines.push('</g>');
    }
    if (Layers.embellishment) {
      Lines.push('<g id="layer-embellishment" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">');
      rgEmbellishments.forEach((Item, nIndex) => {
        if (!Item) {
          return;
        }
        Lines.push(`<g data-terrain="${Item.szKey}" clip-path="url(#clip-region-${nIndex})">`);
        if (Item.rgrgrgdTrunks.length) {
          const szTrunks = Item.rgrgrgdTrunks.map(([rgdBase, rgdTop]) => {
            const Base = Projection.ApplyTransform(rgdHexToSvg, rgdBase), Top = Projection.ApplyTransform(rgdHexToSvg, rgdTop);
            return `M${MotifNumber(Base[0])} ${MotifNumber(Base[1])}V${MotifNumber(Top[1])}`;
          }).join('');
          Lines.push(`<path class="trunks" fill="none" stroke="${Terrain.ById(Item.nTerrainId).Embellish.szAccent}" stroke-width="1.4" d="${szTrunks}"/>`);
        }
        for (const Instance of Item.rgInstances) {
          const Point = Projection.ApplyTransform(rgdHexToSvg, Instance.rgdPoint).map(MotifNumber);
          const szHref = `href="#emb-${Item.szKey}-${Instance.nVariant}"`;
          Lines.push(Instance.dScale === 1 ? `<use ${szHref} x="${Point[0]}" y="${Point[1]}"/>`
            : `<use ${szHref} transform="matrix(${Util.FormatNumber(Instance.dScale, 4)} 0 0 ${Util.FormatNumber(Instance.dScale, 4)} ${Point[0]} ${Point[1]})"/>`);
        }
        Lines.push('</g>');
      });
      Lines.push('</g>');
    }
    if (Layers.shoreline) {
      Lines.push('<g id="layer-shoreline" fill="none" stroke="#253c46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">');
      for (const Path of RegionsData.rgShorelines) {
        Lines.push(`<path d="${PathData(Regions.SmoothPath(Path), rgdHexToSvg)}"/>`);
      }
      Lines.push('</g>');
    }
    if (Layers.grid) {
      const szGrid = RegionsData.rgEdges.map((Edge) => PathData({
        rgrgdPoints: [RegionsData.rgrgdPoints[Edge.nA], RegionsData.rgrgdPoints[Edge.nB]], fClosed: false,
      }, rgdHexToSvg)).join('');
      Lines.push(`<g id="layer-grid" fill="none" stroke="#10151c" stroke-opacity="0.35" stroke-width="0.75"><path d="${szGrid}"/></g>`);
    }
    for (const Overlay of Doc.rgOverlays) {
      if (!Layers[Overlay.szType]) {
        continue;
      }
      const Style = View.g_OverlayStyles[Overlay.szType];
      Lines.push(`<g id="overlay-${Escape(Overlay.szId)}" data-layer="${Overlay.szType}" fill="none" stroke="${Style.szColor}" stroke-width="${NumberText(Style.dWidth * 1.5)}" stroke-linecap="round" stroke-linejoin="round"${Style.rgDash.length ? ` stroke-dasharray="${Style.rgDash.join(' ')}"` : ''}>`);
      if (Overlay.rgnTiles.length === 1) {
        const nTile = Overlay.rgnTiles[0], Copy = View.FeatureCopies(Geometry, Layout, nTile)[0];
        if (Copy) {
          const Point = Projection.ApplyTransform(Projection.ComposeTransforms(Copy.rgdFrameToWorld, rgdFrameToSvg), View.FeatureAnchor(Geometry, nTile));
          Lines.push(`<circle cx="${NumberText(Point[0])}" cy="${NumberText(Point[1])}" r="3" fill="${Style.szColor}" stroke="none"/>`);
        }
      }
      for (const Curve of SvgCurves(Geometry, Layout, Overlay, szPanel)) {
        if (Overlay.szType !== 'river') {
          Lines.push(`<path data-point="${Curve.nPoint}" d="${CurveData(Curve.rgrgdControl, rgdFrameToSvg)}"/>`);
          continue;
        }
        // Eight exact sub-curves per segment approximate a continuous source-to-mouth
        // taper. Using the original point index keeps widths identical at panel seams.
        let Parts = [Curve.rgrgdControl];
        for (let nPass = 0; nPass < 3; nPass++) {
          Parts = Parts.flatMap(View.SplitCurve);
        }
        Parts.forEach((Part, nPart) => {
          const dProgress = (Curve.nPoint + (nPart + 0.5) / Parts.length) / (Overlay.rgnTiles.length - 1);
          const dWidth = Style.dWidth * 1.5 * (0.35 + 0.65 * dProgress);
          Lines.push(`<path data-point="${Curve.nPoint}" stroke-width="${NumberText(dWidth)}" d="${CurveData(Part, rgdFrameToSvg)}"/>`);
        });
      }
      Lines.push('</g>');
    }
    if (Layers.landmark) {
      Lines.push('<g id="layer-landmark">');
      for (const [nTile, Landmark] of [...Doc.Landmarks].sort((A, B) => A[0] - B[0])) {
        const Copy = View.FeatureCopies(Geometry, Layout, nTile)[0];
        if (!Copy) {
          continue;
        }
        const Point = View.FeatureAnchor(Geometry, nTile);
        const dUnit = Geometry.dD / g_dHexUnits;
        const Glyph = [26 / 24 * dUnit, 0, 0, -26 / 24 * dUnit, Point[0], Point[1]];
        const Transform = Projection.ComposeTransforms(Glyph, Projection.ComposeTransforms(Copy.rgdFrameToWorld, rgdFrameToSvg));
        Lines.push(`<g data-tile="${nTile}" transform="${Matrix(Transform)}"><use href="#landmark-${Landmark.szType}" x="-12" y="-12" width="24" height="24"/>`);
        if (Layers.landmarkNames && Landmark.szName) {
          Lines.push(`<text x="0" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#201c19" stroke="#f9edcc" stroke-width="1.5" paint-order="stroke">${Escape(Landmark.szName)}</text>`);
        }
        Lines.push('</g>');
      }
      Lines.push('</g>');
    }
    if (Layers.label) {
      Lines.push('<g id="layer-label" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" fill="#201c19" stroke="#f9edcc" stroke-linejoin="round" paint-order="stroke">');
      for (const Label of Doc.rgLabels) {
        const Copy = View.FeatureCopies(Geometry, Layout, Label.nTile)[0];
        if (!Copy) {
          continue;
        }
        const Transform = Projection.ComposeTransforms(View.LabelTransform(Geometry, Label),
          Projection.ComposeTransforms(Copy.rgdFrameToWorld, rgdFrameToSvg));
        Lines.push(`<text data-id="${Escape(Label.szId)}" transform="${Matrix(Transform)}" font-size="${NumberText(Label.dSize)}" font-weight="${Label.szCategory === 'region' ? '600' : '400'}" stroke-width="${NumberText(Math.max(1, Label.dSize / 8))}">${Escape(Label.szText)}</text>`);
      }
      Lines.push('</g>');
    }
    Lines.push('</g>');
    if (Layers.reference) {
      const Reference = View.ReferenceGeometry(Doc, szPanel);
      const dPixel = Size.dWidth / g_nDefaultWidth;
      const dRadius = 9 * dPixel;
      Lines.push(`<g id="layer-reference" fill="none" stroke="#d32f2f" stroke-width="${NumberText(1.5 * dPixel)}">`);
      for (const rgrgdSegment of Reference.rgrgrgdEquatorSegments) {
        Lines.push(`<path data-reference="equator" d="${PathData({ rgrgdPoints: rgrgdSegment, fClosed: false }, rgdFrameToSvg)}"/>`);
      }
      const Center = Projection.ApplyTransform(rgdFrameToSvg, Util.Center(View.FrameOutline(Geometry, szPanel)));
      for (const Pole of Reference.rgPoles) {
        const [dX, dY] = Projection.ApplyTransform(rgdFrameToSvg, Pole.rgdPoint);
        const Direction = Util.Distance(Center, [dX, dY]) > 1e-9 ? Util.Unit(Util.Subtract(Center, [dX, dY])) : [0, -1];
        Lines.push(`<g data-reference="pole-${Pole.szLabel}"><circle cx="${NumberText(dX)}" cy="${NumberText(dY)}" r="${NumberText(dRadius)}"/>`,
