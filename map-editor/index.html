<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG World Map Editor</title>
<!--
  Single-file, framework-free hex map editor.

  Module convention: every <script data-module="Name"> block is a self-contained
  IIFE that registers exactly one object on globalThis.RpgMap[Name] and reads its
  dependencies from globalThis.RpgMap. Blocks appear in dependency order.
  Blocks marked data-dom="true" touch the browser DOM and are skipped by the
  Node unit tests (tests/_load.cjs); all other blocks must be DOM-free.
-->
<style>
  :root {
    --bg: #1e1f22;
    --panel: #2b2d31;
    --panel-border: #3c3f45;
    --text: #e6e6e6;
    --text-dim: #9a9ca3;
    --accent: #6ea8fe;
    --canvas-bg: #10151c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 220px 1fr 260px;
    grid-template-areas:
      "toolbar toolbar toolbar"
      "tools viewport properties"
      "status status status";
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #toolbar {
    grid-area: toolbar;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
  }
  #toolbar h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #toolbar-actions { display: flex; gap: 6px; }
  aside {
    overflow: auto;
    padding: 10px;
    background: var(--panel);
  }
  #tool-panel { grid-area: tools; border-right: 1px solid var(--panel-border); }
  #properties-panel { grid-area: properties; border-left: 1px solid var(--panel-border); }
  aside h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #viewport {
    grid-area: viewport;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--canvas-bg);
  }
  #map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #status-bar {
    grid-area: status;
    display: flex;
    gap: 18px;
    padding: 3px 12px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
<header id="toolbar">
  <h1>RPG World Map Editor</h1>
  <div id="toolbar-actions"></div>
</header>
<aside id="tool-panel" aria-label="Tools">
  <h2>Tools</h2>
  <div id="tool-list"></div>
  <h2>Layers</h2>
  <div id="layer-list"></div>
</aside>
<main id="viewport">
  <canvas id="map-canvas" aria-label="Map"></canvas>
</main>
<aside id="properties-panel" aria-label="Properties">
  <h2>Properties</h2>
  <div id="property-list"></div>
</aside>
<footer id="status-bar">
  <span id="status-coordinates">&nbsp;</span>
  <span id="status-message"></span>
</footer>

<script data-module="Util">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};

  const g_dEpsilon = 1e-9;

  function Require(fCondition, szMessage) {
    if (!fCondition) {
      throw new Error(szMessage);
    }
  }

  function Add(rgdLeft, rgdRight) {
    return rgdLeft.map((dValue, nIndex) => dValue + rgdRight[nIndex]);
  }

  function Subtract(rgdLeft, rgdRight) {
    return rgdLeft.map((dValue, nIndex) => dValue - rgdRight[nIndex]);
  }

  function Scale(rgdVector, dFactor) {
    return rgdVector.map((dValue) => dValue * dFactor);
  }

  function Dot(rgdLeft, rgdRight) {
    let dSum = 0;
    for (let nIndex = 0; nIndex < rgdLeft.length; nIndex++) {
      dSum += rgdLeft[nIndex] * rgdRight[nIndex];
    }
    return dSum;
  }

  function Cross(rgdLeft, rgdRight) {
    return [
      rgdLeft[1] * rgdRight[2] - rgdLeft[2] * rgdRight[1],
      rgdLeft[2] * rgdRight[0] - rgdLeft[0] * rgdRight[2],
      rgdLeft[0] * rgdRight[1] - rgdLeft[1] * rgdRight[0],
    ];
  }

  function Length(rgdVector) {
    return Math.sqrt(Dot(rgdVector, rgdVector));
  }

  function Distance(rgdLeft, rgdRight) {
    return Length(Subtract(rgdLeft, rgdRight));
  }

  function Unit(rgdVector) {
    const dLength = Length(rgdVector);
    Require(dLength > 0, 'Cannot normalize a zero-length vector');
    return Scale(rgdVector, 1 / dLength);
  }

  function Center(rgrgdPoints) {
    Require(rgrgdPoints.length > 0, 'Cannot center an empty point set');
    const rgdSum = rgrgdPoints[0].map(() => 0);
    for (const rgdPoint of rgrgdPoints) {
      for (let nAxis = 0; nAxis < rgdSum.length; nAxis++) {
        rgdSum[nAxis] += rgdPoint[nAxis];
      }
    }
    return Scale(rgdSum, 1 / rgrgdPoints.length);
  }

  // Consecutive pairs around a closed boundary, including the closing pair.
  function Boundary(rgItems) {
    return rgItems.map((Item, nIndex) => [Item, rgItems[(nIndex + 1) % rgItems.length]]);
  }

  // Signed shoelace area; positive for counter-clockwise polygons (x right, y up).
  function PolygonArea(rgrgdPolygon) {
    let dTwiceArea = 0;
    for (const [rgdFirst, rgdSecond] of Boundary(rgrgdPolygon)) {
      dTwiceArea += rgdFirst[0] * rgdSecond[1] - rgdSecond[0] * rgdFirst[1];
    }
    return dTwiceArea / 2;
  }

  function EdgeSide(rgdStart, rgdEnd, rgdPoint) {
    return (rgdEnd[0] - rgdStart[0]) * (rgdPoint[1] - rgdStart[1])
      - (rgdEnd[1] - rgdStart[1]) * (rgdPoint[0] - rgdStart[0]);
  }

  // Sutherland-Hodgman clip of any polygon by a convex counter-clockwise polygon.
  function ClipPolygonToConvex(rgrgdSubject, rgrgdClip) {
    let rgrgdOutput = rgrgdSubject;
    for (const [rgdStart, rgdEnd] of Boundary(rgrgdClip)) {
      if (rgrgdOutput.length === 0) {
        break;
      }
      const rgrgdInput = rgrgdOutput;
      rgrgdOutput = [];
      for (let nIndex = 0; nIndex < rgrgdInput.length; nIndex++) {
        const rgdPoint = rgrgdInput[nIndex];
        const rgdNext = rgrgdInput[(nIndex + 1) % rgrgdInput.length];
        const dPoint = EdgeSide(rgdStart, rgdEnd, rgdPoint);
        const dNext = EdgeSide(rgdStart, rgdEnd, rgdNext);
        if (dPoint >= 0) {
          rgrgdOutput.push(rgdPoint);
        }
        if ((dPoint >= 0) !== (dNext >= 0)) {
          const dT = dPoint / (dPoint - dNext);
          rgrgdOutput.push([
            rgdPoint[0] + dT * (rgdNext[0] - rgdPoint[0]),
            rgdPoint[1] + dT * (rgdNext[1] - rgdPoint[1]),
          ]);
        }
      }
    }
    const rgrgdResult = rgrgdOutput.filter((rgdPoint, nIndex) =>
      Distance(rgdPoint, rgrgdOutput[(nIndex + 1) % rgrgdOutput.length]) > 1e-14);
    return rgrgdResult.length >= 3 ? rgrgdResult : [];
  }

  // Cyrus-Beck clip of segment A→B by a convex counter-clockwise polygon.
  // Returns the parameter interval [t0, t1] inside the polygon, or null.
  function ClipSegmentToConvex(rgdA, rgdB, rgrgdClip) {
    let dT0 = 0;
    let dT1 = 1;
    const rgdDirection = Subtract(rgdB, rgdA);
    for (const [rgdStart, rgdEnd] of Boundary(rgrgdClip)) {
      const dStart = EdgeSide(rgdStart, rgdEnd, rgdA);
      const dRate = (rgdEnd[0] - rgdStart[0]) * rgdDirection[1] - (rgdEnd[1] - rgdStart[1]) * rgdDirection[0];
      if (Math.abs(dRate) < 1e-300) {
        if (dStart < 0) {
          return null;
        }
        continue;
      }
      const dT = -dStart / dRate;
      if (dRate > 0) {
        dT0 = Math.max(dT0, dT);
      } else {
        dT1 = Math.min(dT1, dT);
      }
      if (dT0 > dT1) {
        return null;
      }
    }
    return [dT0, dT1];
  }

  function PointInConvex(rgdPoint, rgrgdClip, dTolerance = g_dEpsilon) {
    return Boundary(rgrgdClip).every(([rgdStart, rgdEnd]) =>
      EdgeSide(rgdStart, rgdEnd, rgdPoint) / Distance(rgdStart, rgdEnd) >= -dTolerance);
  }

  // Mulberry32: small, fast, deterministic PRNG returning floats in [0, 1).
  function CreateRng(nSeed) {
    let nState = nSeed >>> 0;
    return function () {
      nState = (nState + 0x6D2B79F5) >>> 0;
      let nValue = nState;
      nValue = Math.imul(nValue ^ (nValue >>> 15), nValue | 1);
      nValue ^= nValue + Math.imul(nValue ^ (nValue >>> 7), nValue | 61);
      return ((nValue ^ (nValue >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Order-sensitive 32-bit hash of integers, used to seed per-tile randomness.
  function HashIntegers(...rgnValues) {
    let nHash = 0x811C9DC5;
    for (const nValue of rgnValues) {
      nHash = Math.imul(nHash ^ (nValue | 0), 0x01000193) >>> 0;
      nHash ^= nHash >>> 13;
    }
    return Math.imul(nHash ^ (nHash >>> 16), 0x85EBCA6B) >>> 0;
  }

  // Fixed-precision number text without trailing zeros or a signed zero.
  function FormatNumber(dValue, nDecimals = 6) {
    const szFixed = dValue.toFixed(nDecimals);
    const szText = szFixed.includes('.') ? szFixed.replace(/\.?0+$/, '') : szFixed;
    return (szText === '-0' || szText === '') ? '0' : szText;
  }

  RpgMap.Util = Object.freeze({
    g_dEpsilon,
    Require,
    Add,
    Subtract,
    Scale,
    Dot,
    Cross,
    Length,
    Distance,
    Unit,
    Center,
    Boundary,
    PolygonArea,
    ClipPolygonToConvex,
    ClipSegmentToConvex,
    PointInConvex,
    CreateRng,
    HashIntegers,
    FormatNumber,
  });
})(globalThis);
</script>

<script data-module="Projection">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const Util = RpgMap.Util;
  const { Require, Subtract, Dot, Cross, Unit, Center, Boundary, Distance } = Util;

  // Port of tools/generate_map_projection.py (geometry, net and validation),
  // keeping its identifiers and ordering, plus panel frames and seam transforms.
  const g_dTolerance = 1e-9;
  const g_dAcuteAngle = Math.acos(-1 / 3) * 180 / Math.PI;
  const g_dObtuseAngle = (360 - g_dAcuteAngle) / 2;
  const g_dXlHexMiles = 216;
  const g_North = Object.freeze(Unit([1, -1, -1]));

  const g_SectorLabels = Object.freeze({
    'Hyz+-': '\u03b1', 'Hxz--': '\u03b2', 'Hxy--': '\u03b3',
    'Hyz-+': '\u03b4', 'Hxz++': '\u03b5', 'Hxy++': '\u03b6',
    'Hxz+-': '\u03b7', 'Hyz--': '\u03b8', 'Hxy+-': '\u03b9',
    'Hxy-+': '\u03ba', 'Hxz-+': '\u03bb', 'Hyz++': '\u03bc',
    'Sz-': '\u03bd', 'Sy-': '\u03be', 'Sx+': '\u03bf',
    'Sx-': '\u03c0', 'Sz+': '\u03c1', 'Sy+': '\u03c3',
  });
  const g_SectorNames = Object.freeze({
    '\u03b1': 'Alpha', '\u03b2': 'Beta', '\u03b3': 'Gamma',
    '\u03b4': 'Delta', '\u03b5': 'Epsilon', '\u03b6': 'Zeta',
    '\u03b7': 'Eta', '\u03b8': 'Theta', '\u03b9': 'Iota',
    '\u03ba': 'Kappa', '\u03bb': 'Lambda', '\u03bc': 'Mu',
    '\u03bd': 'Nu', '\u03be': 'Xi', '\u03bf': 'Omicron',
    '\u03c0': 'Pi', '\u03c1': 'Rho', '\u03c3': 'Sigma',
  });

  const g_rgszStrip = ['Hxy++', 'Hyz+-', 'Hxz--', 'Hxy--', 'Hyz-+', 'Hxz++'];
  const g_rgAttachments = [
    ['Hxy++', ['Sx+', 'Hxz+-'], ['Hyz++', 'Sy+']],
    ['Hxz--', ['Sz-', 'Hyz--'], ['Hxy-+', 'Sx-']],
    ['Hyz-+', ['Sy-', 'Hxy+-'], ['Hxz-+', 'Sz+']],
  ];

  function Pad2(nValue) {
    return String(nValue).padStart(2, '0');
  }

  function CompareStrings(szLeft, szRight) {
    return szLeft < szRight ? -1 : (szLeft > szRight ? 1 : 0);
  }

  function EdgeKey(szFirst, szSecond) {
    return [szFirst, szSecond].sort(CompareStrings);
  }

  function KeyText(rgszKey) {
    return rgszKey.join('|');
  }

  function Angle(rgdPrevious, rgdVertex, rgdFollowing) {
    const dCosine = Dot(Unit(Subtract(rgdPrevious, rgdVertex)), Unit(Subtract(rgdFollowing, rgdVertex)));
    return Math.acos(Math.max(-1, Math.min(1, dCosine))) * 180 / Math.PI;
  }

  // Python itertools.product((-1, 1), repeat=n): the last position varies fastest.
  function SignProduct(nCount) {
    let rgrgnResult = [[]];
    for (let nIndex = 0; nIndex < nCount; nIndex++) {
      const rgrgnNext = [];
      for (const rgnPrefix of rgrgnResult) {
        for (const nSign of [-1, 1]) {
          rgrgnNext.push([...rgnPrefix, nSign]);
        }
      }
      rgrgnResult = rgrgnNext;
    }
    return rgrgnResult;
  }

  function Combinations(rgItems, nCount) {
    if (nCount === 0) {
      return [[]];
    }
    const rgResult = [];
    for (let nIndex = 0; nIndex <= rgItems.length - nCount; nIndex++) {
      for (const rgRest of Combinations(rgItems.slice(nIndex + 1), nCount - 1)) {
        rgResult.push([rgItems[nIndex], ...rgRest]);
      }
    }
    return rgResult;
  }

  function CountKinds(rgszKinds) {
    const Counts = {};
    for (const szKind of rgszKinds) {
      Counts[szKind] = (Counts[szKind] || 0) + 1;
    }
    return Counts;
  }

  function SameCounts(Left, Right) {
    const rgszKeys = Object.keys(Left);
    return rgszKeys.length === Object.keys(Right).length
      && rgszKeys.every((szKey) => Left[szKey] === Right[szKey]);
  }

  function BuildSolidVertices() {
    const dSmall = 0.5;
    const dCorner = dSmall + 1 / Math.sqrt(3);
    const dLarge = dSmall + 2 / Math.sqrt(3);
    const rgrgdPoints = SignProduct(3).map((rgnSigns) => rgnSigns.map((nSign) => nSign * dCorner));
    for (let nAxis = 0; nAxis < 3; nAxis++) {
      for (const rgnSigns of SignProduct(3)) {
        rgrgdPoints.push(rgnSigns.map((nSign, nCoordinate) =>
          nSign * (nCoordinate === nAxis ? dLarge : dSmall)));
      }
    }
    const Vertices = {};
    rgrgdPoints.forEach((rgdPoint, nIndex) => {
      Vertices[`V${Pad2(nIndex + 1)}`] = rgdPoint;
    });
    return { Vertices, dLarge, dCorner };
  }

  function BuildSolid() {
    const { Vertices, dLarge, dCorner } = BuildSolidVertices();
    const Faces = {};
    for (const [nCount, szPrefix, dOffset] of [[1, 'S', dLarge], [2, 'H', 2 * dCorner]]) {
      for (const rgnAxes of Combinations([0, 1, 2], nCount)) {
        for (const rgnSigns of SignProduct(nCount)) {
          const rgdNormal = [0, 1, 2].map((nAxis) =>
            rgnAxes.includes(nAxis) ? rgnSigns[rgnAxes.indexOf(nAxis)] : 0);
          const szName = szPrefix + rgnAxes.map((nAxis) => 'xyz'[nAxis]).join('')
            + rgnSigns.map((nSign) => (nSign > 0 ? '+' : '-')).join('');
          const rgszIds = Object.keys(Vertices).filter((szId) =>
            Math.abs(Dot(Vertices[szId], rgdNormal) - dOffset) < g_dTolerance);
          const rgdOrigin = Center(rgszIds.map((szId) => Vertices[szId]));
          const rgdAxisX = Unit(Subtract(Vertices[rgszIds[0]], rgdOrigin));
          const rgdAxisY = Cross(Unit(rgdNormal), rgdAxisX);
          const AngleOf = (szId) => {
            const rgdRelative = Subtract(Vertices[szId], rgdOrigin);
            return Math.atan2(Dot(rgdRelative, rgdAxisY), Dot(rgdRelative, rgdAxisX));
          };
          rgszIds.sort((szLeft, szRight) => AngleOf(szLeft) - AngleOf(szRight));
          Faces[szName] = {
            id: szName,
            kind: nCount === 1 ? 'square' : 'hexagon',
            vertices: rgszIds,
            normal: Unit(rgdNormal),
          };
        }
      }
    }
    const EdgeFaces = {};
    for (const [szId, Face] of Object.entries(Faces)) {
      for (const [szFirst, szSecond] of Boundary(Face.vertices)) {
        const szKey = KeyText(EdgeKey(szFirst, szSecond));
        (EdgeFaces[szKey] = EdgeFaces[szKey] || []).push(szId);
      }
    }
    const Edges = {};
    Object.keys(EdgeFaces).sort(CompareStrings).forEach((szKey, nIndex) => {
      Edges[szKey] = { id: `E${Pad2(nIndex + 1)}`, vertices: szKey.split('|'), faces: EdgeFaces[szKey] };
    });
    return { Vertices, Faces, Edges };
  }

  function AddNetVertex(NetVertices, szSolidId, rgdPoint) {
    const szId = `N${Pad2(Object.keys(NetVertices).length + 1)}`;
    NetVertices[szId] = { id: szId, position: rgdPoint, solid_vertex: szSolidId };
    return szId;
  }

  function InitializeNet(Vertices, Faces, rgszStrip) {
    const dRootThree = Math.sqrt(3);
    const dSmall = 0.5;
    const dCorner = 0.5 + 1 / dRootThree;
    const dLarge = 0.5 + 2 / dRootThree;
    const dA = Math.sqrt(2 / 3);
    const dB = 1 / dRootThree;
    const dC = 2 * Math.sqrt(2) / 3;
    const rgrgdRootSolid = [
      [dLarge, dSmall, dSmall], [dLarge, dSmall, -dSmall],
      [dCorner, dCorner, -dCorner], [dSmall, dLarge, -dSmall],
      [dSmall, dLarge, dSmall], [dCorner, dCorner, dCorner],
    ];
    const rgrgdRootFlat = [
      [0, 0.5], [dA, 0.5 + dB], [dA + dC, 0.5 + dB - 1 / 3],
      [dA + dC, -0.5 + dB - 1 / 3], [dC, -5 / 6], [0, -0.5],
    ];
    const PointIds = {};
    for (const [szId, rgdPoint] of Object.entries(Vertices)) {
      PointIds[rgdPoint.join(',')] = szId;
    }
    const NetVertices = {};
    const NetFaces = {};
    const FaceMaps = {};

    // Reflect the seed face so its outward winding is preserved in the net.
    const RootMap = {};
    rgrgdRootSolid.forEach((rgdSolid, nIndex) => {
      const szSolidId = PointIds[rgdSolid.join(',')];
      Require(szSolidId !== undefined, 'Root vertex is not a solid vertex');
      const rgdFlat = rgrgdRootFlat[nIndex];
      RootMap[szSolidId] = AddNetVertex(NetVertices, szSolidId, [-rgdFlat[0], rgdFlat[1]]);
    });
    FaceMaps[rgszStrip[0]] = RootMap;
    NetFaces[rgszStrip[0]] = {
      id: rgszStrip[0], kind: 'hexagon', placement: 'strip',
      vertices: Faces[rgszStrip[0]].vertices.map((szId) => RootMap[szId]),
      parent: null, hinge: null,
    };
    return { NetVertices, NetFaces, FaceMaps };
  }

  function AttachNetFace(Vertices, Faces, Edges, NetVertices, NetFaces, FaceMaps,
    szParent, szChild, szPlacement) {
    Require(!(szChild in NetFaces), `Repeated face: ${szChild}`);
    const rgszShared = Faces[szParent].vertices
      .filter((szId) => Faces[szChild].vertices.includes(szId))
      .sort(CompareStrings);
    Require(rgszShared.length === 2, `Faces do not share an edge: ${szParent}, ${szChild}`);
    const [szFirst, szSecond] = rgszShared;
    const rgdSolidStart = Vertices[szFirst];
    const rgdSolidEnd = Vertices[szSecond];
    const rgdFlatStart = NetVertices[FaceMaps[szParent][szFirst]].position;
    const rgdFlatEnd = NetVertices[FaceMaps[szParent][szSecond]].position;
    const rgdAxis3D = Unit(Subtract(rgdSolidEnd, rgdSolidStart));
    const rgdChildCenter = Center(Faces[szChild].vertices.map((szId) => Vertices[szId]));
    const rgdToward = Subtract(rgdChildCenter, rgdSolidStart);
    const dToward = Dot(rgdToward, rgdAxis3D);
    const rgdInward3D = Unit(rgdToward.map((dValue, nIndex) => dValue - dToward * rgdAxis3D[nIndex]));
    const rgdAxis2D = Unit(Subtract(rgdFlatEnd, rgdFlatStart));
    const rgdPerpendicular = [-rgdAxis2D[1], rgdAxis2D[0]];
    const rgdParentCenter = Center(NetFaces[szParent].vertices.map((szId) => NetVertices[szId].position));
    const dSide = Dot(Subtract(rgdParentCenter, rgdFlatStart), rgdPerpendicular);
    const dSign = (dSide < 0 || Object.is(dSide, -0)) ? 1 : -1;
    const ChildMap = {};
    for (const szSolidId of Faces[szChild].vertices) {
      if (rgszShared.includes(szSolidId)) {
        ChildMap[szSolidId] = FaceMaps[szParent][szSolidId];
      } else {
        const rgdRelative = Subtract(Vertices[szSolidId], rgdSolidStart);
        const dAlong = Dot(rgdRelative, rgdAxis3D);
        const dAcross = Dot(rgdRelative, rgdInward3D);
        const rgdPoint = rgdFlatStart.map((dStart, nIndex) =>
          dStart + dAlong * rgdAxis2D[nIndex] + dSign * dAcross * rgdPerpendicular[nIndex]);
        ChildMap[szSolidId] = AddNetVertex(NetVertices, szSolidId, rgdPoint);
      }
    }
    FaceMaps[szChild] = ChildMap;
    NetFaces[szChild] = {
      id: szChild, kind: Faces[szChild].kind, placement: szPlacement,
      vertices: Faces[szChild].vertices.map((szId) => ChildMap[szId]),
      parent: szParent, hinge: Edges[KeyText(rgszShared)].id,
    };
  }

  function BuildNetEdges(NetVertices, NetFaces, Edges) {
    const NetEdges = {};
    for (const [szId, Face] of Object.entries(NetFaces)) {
      for (const [szFirst, szSecond] of Boundary(Face.vertices)) {
        const rgszKey = EdgeKey(szFirst, szSecond);
        const szKey = KeyText(rgszKey);
        if (!(szKey in NetEdges)) {
          const szSolidKey = KeyText(EdgeKey(
            NetVertices[szFirst].solid_vertex, NetVertices[szSecond].solid_vertex));
          NetEdges[szKey] = {
            id: `NE${Pad2(Object.keys(NetEdges).length + 1)}`, vertices: rgszKey,
            solid_edge: Edges[szSolidKey].id, faces: [],
          };
        }
        NetEdges[szKey].faces.push(szId);
      }
    }
    const Copies = {};
    for (const Edge of Object.values(NetEdges)) {
      Edge.kind = Edge.faces.length === 2 ? 'fold' : 'cut';
      (Copies[Edge.solid_edge] = Copies[Edge.solid_edge] || []).push(Edge);
    }
    for (const rgPair of Object.values(Copies)) {
      for (const Edge of rgPair) {
        const Other = rgPair.find((Candidate) => Candidate !== Edge);
        Edge.mate = Other ? Other.id : null;
      }
    }
    return NetEdges;
  }

  function BuildNet(Vertices, Faces, Edges) {
    const { NetVertices, NetFaces, FaceMaps } = InitializeNet(Vertices, Faces, g_rgszStrip);
    for (let nIndex = 1; nIndex < g_rgszStrip.length; nIndex++) {
      AttachNetFace(Vertices, Faces, Edges, NetVertices, NetFaces, FaceMaps,
        g_rgszStrip[nIndex - 1], g_rgszStrip[nIndex], 'strip');
    }
    for (const [szParent, rgszTop, rgszBottom] of g_rgAttachments) {
      for (const szChild of rgszTop) {
        AttachNetFace(Vertices, Faces, Edges, NetVertices, NetFaces, FaceMaps, szParent, szChild, 'top');
      }
      for (const szChild of rgszBottom) {
        AttachNetFace(Vertices, Faces, Edges, NetVertices, NetFaces, FaceMaps, szParent, szChild, 'bottom');
      }
    }
    const NetEdges = BuildNetEdges(NetVertices, NetFaces, Edges);
    return { NetVertices, NetFaces, NetEdges, rgszStrip: [...g_rgszStrip].reverse() };
  }

  function InteriorsOverlap(rgrgdFirst, rgrgdSecond) {
    // Separating-axis theorem for the convex faces; touching edges are allowed.
    for (const rgrgdPolygon of [rgrgdFirst, rgrgdSecond]) {
      for (const [rgdStart, rgdEnd] of Boundary(rgrgdPolygon)) {
        const rgdDirection = Subtract(rgdEnd, rgdStart);
        const rgdAxis = Unit([-rgdDirection[1], rgdDirection[0]]);
        const rgdLeft = rgrgdFirst.map((rgdPoint) => Dot(rgdPoint, rgdAxis));
        const rgdRight = rgrgdSecond.map((rgdPoint) => Dot(rgdPoint, rgdAxis));
        if (Math.min(Math.max(...rgdLeft), Math.max(...rgdRight))
          - Math.max(Math.min(...rgdLeft), Math.min(...rgdRight)) <= g_dTolerance) {
          return false;
        }
      }
    }
    return true;
  }

  function ValidateFaceAngles(szId, Face, rgrgdSolid, rgrgdFlat, Incidences, nExpected, Errors) {
    const rgnAcute = [];
    Face.vertices.forEach((szVertex, nIndex) => {
      Incidences[szVertex].push(szId);
      let dExpected = 90;
      if (nExpected === 6) {
        const fCorner = Number(szVertex.slice(1)) <= 8;
        dExpected = fCorner ? g_dAcuteAngle : g_dObtuseAngle;
        if (fCorner) {
          rgnAcute.push(nIndex);
        }
      }
      const nPrevious = (nIndex + nExpected - 1) % nExpected;
      for (const rgrgdPolygon of [rgrgdSolid, rgrgdFlat]) {
        const dAngle = Angle(rgrgdPolygon[nPrevious], rgrgdPolygon[nIndex], rgrgdPolygon[(nIndex + 1) % nExpected]);
        Errors.dMaxAngle = Math.max(Errors.dMaxAngle, Math.abs(dAngle - dExpected));
        Errors.dMaxLength = Math.max(Errors.dMaxLength,
          Math.abs(Distance(rgrgdPolygon[nPrevious], rgrgdPolygon[nIndex]) - 1));
      }
      Require(Math.abs(Dot(Subtract(rgrgdSolid[nIndex], rgrgdSolid[0]), Face.normal)) < g_dTolerance,
        `Nonplanar face: ${szId}`);
    });
    return rgnAcute;
  }

  function ValidateHexagonEdges(szId, Face, Faces, Edges, rgnAcute) {
    Require(rgnAcute.length === 2 && rgnAcute[1] - rgnAcute[0] === 3,
      `Acute vertices must be opposite: ${szId}`);
    const rgnSquareEdges = [];
    Boundary(Face.vertices).forEach(([szFirst, szSecond], nIndex) => {
      const rgszAdjacent = Edges[KeyText(EdgeKey(szFirst, szSecond))].faces;
      if (rgszAdjacent.some((szOther) => Faces[szOther].kind === 'square')) {
        rgnSquareEdges.push(nIndex);
        Require(!rgnAcute.includes(nIndex) && !rgnAcute.includes((nIndex + 1) % 6),
          `Square at an acute vertex: ${szId}`);
      }
    });
    Require(rgnSquareEdges.length === 2 && rgnSquareEdges[1] - rgnSquareEdges[0] === 3,
      `Square edges must be opposite: ${szId}`);
  }

  function ValidateFaces(Vertices, Faces, Edges, NetVertices, NetFaces) {
    const Errors = { dMaxLength: 0, dMaxAngle: 0, dMaxDistance: 0 };
    const Incidences = {};
    for (const szId of Object.keys(Vertices)) {
      Incidences[szId] = [];
    }
    const Polygons = {};
    for (const [szId, Face] of Object.entries(Faces)) {
      const rgrgdSolid = Face.vertices.map((szVertex) => Vertices[szVertex]);
      const NetFace = NetFaces[szId];
      const rgrgdFlat = NetFace.vertices.map((szVertex) => NetVertices[szVertex].position);
      const dArea = Boundary(rgrgdFlat).reduce((dSum, [rgdFirst, rgdSecond]) =>
        dSum + rgdFirst[0] * rgdSecond[1] - rgdSecond[0] * rgdFirst[1], 0);
      Require(dArea > 0, `Net face must be viewed from outside: ${szId}`);
      Polygons[szId] = rgrgdFlat;
      Require(NetFace.vertices.map((szVertex) => NetVertices[szVertex].solid_vertex).join()
        === Face.vertices.join(), `Vertex correspondence: ${szId}`);
      const nExpected = Face.kind === 'hexagon' ? 6 : 4;
      Require(rgrgdSolid.length === nExpected, `Polygon size: ${szId}`);
      const rgnAcute = ValidateFaceAngles(szId, Face, rgrgdSolid, rgrgdFlat, Incidences, nExpected, Errors);
      if (nExpected === 6) {
        ValidateHexagonEdges(szId, Face, Faces, Edges, rgnAcute);
      }
      for (const [nFirst, nSecond] of Combinations([...Array(nExpected).keys()], 2)) {
        Errors.dMaxDistance = Math.max(Errors.dMaxDistance, Math.abs(
          Distance(rgrgdSolid[nFirst], rgrgdSolid[nSecond]) - Distance(rgrgdFlat[nFirst], rgrgdFlat[nSecond])));
      }
    }
    return { Incidences, Polygons, Errors };
  }

  function ValidateSolidIncidences(Faces, Edges, Incidences) {
    for (const [szVertex, rgszFaces] of Object.entries(Incidences)) {
      const Expected = Number(szVertex.slice(1)) <= 8 ? { hexagon: 3 } : { hexagon: 2, square: 1 };
      Require(SameCounts(CountKinds(rgszFaces.map((szId) => Faces[szId].kind)), Expected),
        `Vertex incidence: ${szVertex}`);
    }
    for (const Edge of Object.values(Edges)) {
      Require(Edge.faces.length === 2, `Nonmanifold edge: ${Edge.id}`);
    }
  }

  function ValidateSeams(Edges, NetVertices, NetEdges) {
    const Copies = {};
    const NetEdgeIds = {};
    for (const Edge of Object.values(NetEdges)) {
      NetEdgeIds[Edge.id] = Edge;
    }
    let nFolds = 0;
    for (const Edge of Object.values(NetEdges)) {
      (Copies[Edge.solid_edge] = Copies[Edge.solid_edge] || []).push(Edge);
      if (Edge.kind === 'fold') {
        nFolds++;
        Require(Edge.faces.length === 2 && Edge.mate === null, 'Invalid fold');
      } else {
        Require(Edge.faces.length === 1 && Edge.mate in NetEdgeIds, 'Unpaired cut');
        const Mate = NetEdgeIds[Edge.mate];
        Require(Mate.mate === Edge.id && Mate.solid_edge === Edge.solid_edge, 'Cut seam mismatch');
      }
    }
    Require(nFolds === 17, 'The 18-face tree must have 17 hinges');
    for (const Edge of Object.values(Edges)) {
      const rgPair = Copies[Edge.id];
      Require(rgPair.length === 1 || rgPair.length === 2, 'Wrong number of edge copies');
      Require(rgPair.flatMap((Copy) => Copy.faces).sort(CompareStrings).join()
        === [...Edge.faces].sort(CompareStrings).join(), 'Folded edge incidence does not close');
      for (const Copy of rgPair) {
        Require(KeyText(EdgeKey(...Copy.vertices.map((szId) => NetVertices[szId].solid_vertex)))
          === KeyText(Edge.vertices), 'Folded endpoints do not close');
      }
    }
  }

  function ValidateHingeTree(NetFaces, NetEdges) {
    const Visited = new Set();
    for (const [szId, Face] of Object.entries(NetFaces)) {
      Require(Visited.has(Face.parent) || (Visited.size === 0 && Face.parent === null),
        'Disconnected or cyclic hinge tree');
      if (Face.parent !== null) {
        Require(Object.values(NetEdges).some((Edge) =>
          Edge.kind === 'fold' && Edge.solid_edge === Face.hinge
          && Edge.faces.length === 2 && Edge.faces.includes(szId) && Edge.faces.includes(Face.parent)),
        'Parent hinge missing');
      }
      Visited.add(szId);
    }
  }

  function ValidateStrip(Faces, NetVertices, NetEdges, rgszStrip, Polygons) {
    const rgrgdCenters = rgszStrip.map((szId) => Center(Polygons[szId]));
    const rgdY = rgrgdCenters.map((rgdPoint) => rgdPoint[1]);
    Require(Math.max(...rgdY) - Math.min(...rgdY) < g_dTolerance, 'Strip centers are not horizontal');
    Require(rgrgdCenters.every((rgdPoint, nIndex) =>
      nIndex === 0 || rgrgdCenters[nIndex - 1][0] < rgdPoint[0]), 'Strip must be ordered left to right');
    const EdgeCenter = (Edge) => Center(Edge.vertices.map((szVertex) => NetVertices[szVertex].position));
    rgszStrip.forEach((szId, nIndex) => {
      for (const szSide of ['top', 'bottom']) {
        const dCenterY = rgrgdCenters[nIndex][1];
        const rgSideEdges = Object.values(NetEdges).filter((Edge) => Edge.faces.includes(szId)
          && Math.abs(NetVertices[Edge.vertices[0]].position[0] - NetVertices[Edge.vertices[1]].position[0]) > g_dTolerance
          && (EdgeCenter(Edge)[1] > dCenterY) === (szSide === 'top'));
        rgSideEdges.sort((Left, Right) => EdgeCenter(Left)[0] - EdgeCenter(Right)[0]);
        const rgszPattern = rgSideEdges.map((Edge) => {
          const szOther = Edge.faces.find((szFace) => szFace !== szId);
          return szOther === undefined ? '-' : Faces[szOther].kind;
        });
        const rgszExpected = nIndex % 2 === 1
          ? (szSide === 'top' ? ['hexagon', 'square'] : ['square', 'hexagon'])
          : ['-', '-'];
        Require(rgszPattern.join() === rgszExpected.join(), `Incorrect ${szSide} attachment pattern: ${szId}`);
      }
    });
  }

  function Validate(Vertices, Faces, Edges, NetVertices, NetFaces, NetEdges, rgszStrip) {
    const nVertices = Object.keys(Vertices).length;
    const nEdges = Object.keys(Edges).length;
    const nFaces = Object.keys(Faces).length;
    const nNetVertices = Object.keys(NetVertices).length;
    const nNetEdges = Object.keys(NetEdges).length;
    const nNetFaces = Object.keys(NetFaces).length;
    Require(nVertices === 32 && nEdges === 48 && nFaces === 18, 'Solid counts');
    Require(SameCounts(CountKinds(Object.values(Faces).map((Face) => Face.kind)), { hexagon: 12, square: 6 }),
      'Face types');
    Require(nNetFaces === nFaces && Object.keys(Faces).every((szId) => szId in NetFaces),
      'Every solid face must appear exactly once');
    Require(nNetVertices === 62 && nNetEdges === 79, 'Net counts');
    Require(nVertices - nEdges + nFaces === 2, 'Solid Euler characteristic');
    Require(nNetVertices - nNetEdges + nNetFaces === 1, 'Net Euler characteristic');
    const { Incidences, Polygons, Errors } = ValidateFaces(Vertices, Faces, Edges, NetVertices, NetFaces);
    ValidateSolidIncidences(Faces, Edges, Incidences);
    Require(Errors.dMaxLength < g_dTolerance, 'Unequal side lengths');
    Require(Errors.dMaxAngle < g_dTolerance, 'Incorrect interior angles');
    Require(Errors.dMaxDistance < g_dTolerance, "Unfolding changed a face's geometry");
    for (const [szFirst, szSecond] of Combinations(Object.keys(Polygons), 2)) {
      Require(!InteriorsOverlap(Polygons[szFirst], Polygons[szSecond]),
        `Overlapping faces: ${szFirst}, ${szSecond}`);
    }
    ValidateSeams(Edges, NetVertices, NetEdges);
    ValidateHingeTree(NetFaces, NetEdges);
    ValidateStrip(Faces, NetVertices, NetEdges, rgszStrip, Polygons);
    return {
      solid_counts: { vertices: 32, edges: 48, faces: 18 },
      net_counts: { vertices: 62, edges: 79, faces: 18, hinges: 17, cut_pairs: 31 },
      edge_length_tolerance: g_dTolerance,
      angle_tolerance_degrees: g_dTolerance,
      face_distance_tolerance: g_dTolerance,
      overlapping_face_pairs: 0,
      folded_seams_match: true,
    };
  }

  // 2D affine transforms use the canvas/SVG matrix layout [a, b, c, d, e, f]:
  // x' = a x + c y + e, y' = b x + d y + f.
  function ApplyTransform(rgdT, rgdPoint) {
    return [
      rgdT[0] * rgdPoint[0] + rgdT[2] * rgdPoint[1] + rgdT[4],
      rgdT[1] * rgdPoint[0] + rgdT[3] * rgdPoint[1] + rgdT[5],
    ];
  }

  // Returns the transform that applies rgdFirst, then rgdSecond.
  function ComposeTransforms(rgdFirst, rgdSecond) {
    const [a, b, c, d, e, f] = rgdSecond;
    return [
      a * rgdFirst[0] + c * rgdFirst[1], b * rgdFirst[0] + d * rgdFirst[1],
      a * rgdFirst[2] + c * rgdFirst[3], b * rgdFirst[2] + d * rgdFirst[3],
      a * rgdFirst[4] + c * rgdFirst[5] + e, b * rgdFirst[4] + d * rgdFirst[5] + f,
    ];
  }

  function InvertTransform(rgdT) {
    const [a, b, c, d, e, f] = rgdT;
    const dDeterminant = a * d - b * c;
    Require(Math.abs(dDeterminant) > g_dTolerance, 'Transform is not invertible');
    return [
      d / dDeterminant, -b / dDeterminant, -c / dDeterminant, a / dDeterminant,
      (c * f - d * e) / dDeterminant, (b * e - a * f) / dDeterminant,
    ];
  }

  // Proper rigid motion (rotation + translation) taking segment P0→P1 onto Q0→Q1.
  function RigidFromSegments(rgdP0, rgdP1, rgdQ0, rgdQ1) {
    const rgdFrom = Unit(Subtract(rgdP1, rgdP0));
    const rgdTo = Unit(Subtract(rgdQ1, rgdQ0));
    const dCos = rgdFrom[0] * rgdTo[0] + rgdFrom[1] * rgdTo[1];
    const dSin = rgdFrom[0] * rgdTo[1] - rgdFrom[1] * rgdTo[0];
    const rgdRotation = [dCos, dSin, -dSin, dCos, 0, 0];
    const rgdRotated = ApplyTransform(rgdRotation, rgdP0);
    return [dCos, dSin, -dSin, dCos, rgdQ0[0] - rgdRotated[0], rgdQ0[1] - rgdRotated[1]];
  }

  // Frame coordinates are [east, north] in edge units, measured in the panel plane
  // from the panel centre (which lies on the equator for equatorial panels).
  function SolidToFrame(Frame, rgdPoint) {
    const rgdRelative = Subtract(rgdPoint, Frame.rgdOrigin3D);
    return [Dot(rgdRelative, Frame.rgdEast3D), Dot(rgdRelative, Frame.rgdNorth3D)];
  }

  function FrameToSolid(Frame, rgdFrame) {
    return Frame.rgdOrigin3D.map((dOrigin, nAxis) =>
      dOrigin + rgdFrame[0] * Frame.rgdEast3D[nAxis] + rgdFrame[1] * Frame.rgdNorth3D[nAxis]);
  }

  function BuildFrame(Face, Vertices, NetVertices, NetFace) {
    const rgrgdSolid = Face.vertices.map((szId) => Vertices[szId]);
    const rgrgdFlat = NetFace.vertices.map((szId) => NetVertices[szId].position);
    const rgdNormal = Face.normal;
    const fEquatorial = Math.abs(Dot(rgdNormal, g_North)) < g_dTolerance;
    const dAlongNormal = Dot(g_North, rgdNormal);
    const rgdNorth3D = Unit(g_North.map((dValue, nAxis) => dValue - dAlongNormal * rgdNormal[nAxis]));
    const rgdEast3D = Cross(rgdNorth3D, rgdNormal);
    const Frame = {
      rgdOrigin3D: Center(rgrgdSolid),
      rgdEast3D,
      rgdNorth3D,
      rgdNormal3D: [...rgdNormal],
    };
    const rgrgdPolygon = rgrgdSolid.map((rgdPoint) => SolidToFrame(Frame, rgdPoint));
    // Frame → net is the rigid motion matching the first boundary edge; faces in
    // the net are viewed from outside, so no reflection is needed.
    const rgdFrameToNet = RigidFromSegments(rgrgdPolygon[0], rgrgdPolygon[1], rgrgdFlat[0], rgrgdFlat[1]);
    rgrgdPolygon.forEach((rgdPoint, nIndex) => {
      Require(Distance(ApplyTransform(rgdFrameToNet, rgdPoint), rgrgdFlat[nIndex]) < g_dTolerance,
        `Frame placement does not match the net: ${Face.id}`);
    });
    let szNorthVertex = null;
    let szSouthVertex = null;
    if (!fEquatorial) {
      const rgdNorths = rgrgdPolygon.map((rgdPoint) => rgdPoint[1]);
      const nNorth = rgdNorths.indexOf(Math.max(...rgdNorths));
      const nSouth = rgdNorths.indexOf(Math.min(...rgdNorths));
      Require(Math.abs(rgrgdPolygon[nNorth][0]) < g_dTolerance && Math.abs(rgrgdPolygon[nSouth][0]) < g_dTolerance,
        `Panel north must run through opposite vertices: ${Face.id}`);
      szNorthVertex = Face.vertices[nNorth];
      szSouthVertex = Face.vertices[nSouth];
    }
    return Object.freeze({
      ...Frame,
      szPanel: Face.id,
      fEquatorial,
      rgszVertices: [...Face.vertices],
      rgrgdPolygon,
      rgdOriginNet: ApplyTransform(rgdFrameToNet, [0, 0]),
      rgdEastNet: [rgdFrameToNet[0], rgdFrameToNet[1]],
      rgdNorthNet: [rgdFrameToNet[2], rgdFrameToNet[3]],
      rgdFrameToNet,
      rgdNetToFrame: InvertTransform(rgdFrameToNet),
      szNorthVertex,
      szSouthVertex,
    });
  }

  // Seam transform A→B maps frame-A coordinates to frame-B coordinates after
  // unfolding B about the shared edge into A's plane (a proper isometry).
  function BuildSeam(Edge, Frames, Vertices) {
    const [szPanelA, szPanelB] = Edge.faces;
    const [rgdStart, rgdEnd] = Edge.vertices.map((szId) => Vertices[szId]);
    const FrameA = Frames[szPanelA];
    const FrameB = Frames[szPanelB];
    const rgdAToB = RigidFromSegments(
      SolidToFrame(FrameA, rgdStart), SolidToFrame(FrameA, rgdEnd),
      SolidToFrame(FrameB, rgdStart), SolidToFrame(FrameB, rgdEnd));
    return Object.freeze({
      szEdge: Edge.id,
      rgszVertices: [...Edge.vertices],
      szPanelA,
      szPanelB,
      rgdAToB,
      rgdBToA: InvertTransform(rgdAToB),
    });
  }

  function DeepFreeze(Value, Seen = new Set()) {
    if (Value && typeof Value === 'object' && !Seen.has(Value)) {
      Seen.add(Value);
      Object.freeze(Value);
      Object.values(Value).forEach((Item) => DeepFreeze(Item, Seen));
    }
    return Value;
  }

  let g_Cache = null;

  // Builds (once) the solid, net, validation summary, panel frames and seams.
  function Build() {
    if (g_Cache) {
      return g_Cache;
    }
    const { Vertices, Faces, Edges } = BuildSolid();
    const { NetVertices, NetFaces, NetEdges, rgszStrip } = BuildNet(Vertices, Faces, Edges);
    const Validation = Validate(Vertices, Faces, Edges, NetVertices, NetFaces, NetEdges, rgszStrip);
    const Frames = {};
    const Panels = {};
    for (const [szId, Face] of Object.entries(Faces)) {
      const Frame = BuildFrame(Face, Vertices, NetVertices, NetFaces[szId]);
      const szLetter = g_SectorLabels[szId];
      Frames[szId] = Frame;
      Panels[szId] = Object.freeze({
        szId, szLetter, szName: g_SectorNames[szLetter], szKind: Face.kind, fEquatorial: Frame.fEquatorial, Frame,
      });
    }
    const Seams = Object.values(Edges).map((Edge) => BuildSeam(Edge, Frames, Vertices));
    const rgszEquatorial = rgszStrip.filter((szId) => Frames[szId].fEquatorial);
    Require(rgszEquatorial.length === 6, 'The strip must hold the six equatorial panels');
    const Equatorial = Frames[rgszEquatorial[0]];
    const dEquatorialWidth = Math.max(...Equatorial.rgrgdPolygon.map((rgdPoint) => rgdPoint[0]))
      - Math.min(...Equatorial.rgrgdPolygon.map((rgdPoint) => rgdPoint[0]));
    g_Cache = DeepFreeze({
      Vertices, Faces, Edges, NetVertices, NetFaces, NetEdges,
      rgszStrip,
      rgszEquatorialWestToEast: rgszEquatorial,
      Validation,
      Panels,
      Frames,
      Seams,
      dEquatorialWidth,
    });
    return g_Cache;
  }

  // Miles per unit edge when nHexes XL columns span an equatorial panel west to east
  // (column spacing is 216·√3/2 miles for flat-top hexes).
  function MilesPerEdge(nHexes) {
    Require(Number.isInteger(nHexes) && nHexes > 0 && nHexes % 2 === 0,
      'Panel size must be a positive even number of XL hexes');
    return nHexes * g_dXlHexMiles * Math.sqrt(3) / 2 / Build().dEquatorialWidth;
  }

  function FindSeam(szPanelA, szPanelB) {
    return Build().Seams.find((Seam) =>
      (Seam.szPanelA === szPanelA && Seam.szPanelB === szPanelB)
      || (Seam.szPanelA === szPanelB && Seam.szPanelB === szPanelA)) || null;
  }

  RpgMap.Projection = Object.freeze({
    g_dTolerance,
    g_dXlHexMiles,
    g_North,
    g_SectorLabels,
    g_SectorNames,
    Build,
    MilesPerEdge,
    FindSeam,
    SolidToFrame,
    FrameToSolid,
    ApplyTransform,
    ComposeTransforms,
    InvertTransform,
    RigidFromSegments,
    InteriorsOverlap,
  });
})(globalThis);
</script>

<script data-module="Lattice">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Require } = RpgMap.Util;

  // Flat-top hex lattice math, independent of panels and units.
  // Offset coordinates (q, j): column q runs north-south at x = q·w; odd columns
  // are shifted half a hex north, so a centre is at (q·w, (j + ½·odd(q))·d),
  // where d is the distance between adjacent centres and w = d·√3/2.
  // Axial (q, r) has centre (q·w, (r + q/2)·d); cube is (x, y, z) = (q, −q−r, r).
  const g_dRootThree = Math.sqrt(3);
  const g_dYardsPerMile = 1760;
  const g_rgszSizes = Object.freeze(['S', 'M', 'L', 'XL']);
  const g_Scales = Object.freeze({
    regional: Object.freeze({ szUnit: 'mi', Sizes: Object.freeze({ S: 1, M: 6, L: 36, XL: 216 }) }),
    local: Object.freeze({ szUnit: 'yd', Sizes: Object.freeze({ S: 1, M: 10, L: 100, XL: 600 }) }),
  });
  // Axial steps to the six neighbours, in the order N, NE, SE, S, SW, NW.
  const g_rgrgnDirections = Object.freeze([[0, 1], [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1]]
    .map((rgnStep) => Object.freeze(rgnStep)));
  // HexPolygon vertex indices of the edge shared with each neighbour direction.
  const g_rgrgnDirectionEdges = Object.freeze([[1, 2], [0, 1], [5, 0], [4, 5], [3, 4], [2, 3]]
    .map((rgnEdge) => Object.freeze(rgnEdge)));

  function Clean(nValue) {
    return nValue || 0;
  }

  function IsOdd(nValue) {
    return (nValue & 1) !== 0;
  }

  function ScaleDistance(szSystem, szSize) {
    const System = g_Scales[szSystem];
    Require(System && szSize in System.Sizes, `Unknown scale: ${szSystem} ${szSize}`);
    return System.Sizes[szSize];
  }

  function ScaleMiles(szSystem, szSize) {
    const dDistance = ScaleDistance(szSystem, szSize);
    return szSystem === 'local' ? dDistance / g_dYardsPerMile : dDistance;
  }

  // Number of fine hexes per coarse hex along a column; 1 or an even integer.
  function ScaleRatio(szSystem, szCoarse, szFine) {
    const nRatio = ScaleDistance(szSystem, szCoarse) / ScaleDistance(szSystem, szFine);
    Require(Number.isInteger(nRatio) && (nRatio === 1 || nRatio % 2 === 0),
      `Scale ${szCoarse} does not nest ${szFine} by an even ratio`);
    return nRatio;
  }

  function ColumnSpacing(dD) {
    return dD * g_dRootThree / 2;
  }

  function HexRadius(dD) {
    return dD / g_dRootThree;
  }

  function HexArea(dD) {
    return dD * dD * g_dRootThree / 2;
  }

  function OffsetToAxial(nQ, nJ) {
    return [Clean(nQ), Clean(nJ - Math.floor(nQ / 2))];
  }

  function AxialToOffset(nQ, nR) {
    return [Clean(nQ), Clean(nR + Math.floor(nQ / 2))];
  }

  function AxialToCube(nQ, nR) {
    return [Clean(nQ), Clean(-nQ - nR), Clean(nR)];
  }

  function CubeToAxial(nX, nY, nZ) {
    Require(nX + nY + nZ === 0, 'Cube coordinates must sum to zero');
    return [Clean(nX), Clean(nZ)];
  }

  function CubeRound(dX, dY, dZ) {
    let nX = Math.round(dX);
    let nY = Math.round(dY);
    let nZ = Math.round(dZ);
    const dErrorX = Math.abs(nX - dX);
    const dErrorY = Math.abs(nY - dY);
    const dErrorZ = Math.abs(nZ - dZ);
    if (dErrorX > dErrorY && dErrorX > dErrorZ) {
      nX = -nY - nZ;
    } else if (dErrorY > dErrorZ) {
      nY = -nX - nZ;
    } else {
      nZ = -nX - nY;
    }
    return [Clean(nX), Clean(nY), Clean(nZ)];
  }

  function OffsetToPoint(nQ, nJ, dD) {
    return [nQ * ColumnSpacing(dD), (nJ + (IsOdd(nQ) ? 0.5 : 0)) * dD];
  }

  // Nearest lattice centre (the containing hex) for a point.
  function PointToOffset(dX, dY, dD) {
    const dQ = dX / ColumnSpacing(dD);
    const dR = dY / dD - dQ / 2;
    const [nX, , nZ] = CubeRound(dQ, -dQ - dR, dR);
    return AxialToOffset(nX, nZ);
  }

  // Counter-clockwise vertices, starting due east of the centre.
  function HexPolygon(rgdCenter, dD) {
    const dRadius = HexRadius(dD);
    const rgrgdPolygon = [];
    for (let nIndex = 0; nIndex < 6; nIndex++) {
      const dAngle = nIndex * Math.PI / 3;
      rgrgdPolygon.push([rgdCenter[0] + dRadius * Math.cos(dAngle), rgdCenter[1] + dRadius * Math.sin(dAngle)]);
    }
    return rgrgdPolygon;
  }

  function OffsetNeighbor(nQ, nJ, nDirection) {
    const [nAxialQ, nAxialR] = OffsetToAxial(nQ, nJ);
    const rgnStep = g_rgrgnDirections[nDirection];
    return AxialToOffset(nAxialQ + rgnStep[0], nAxialR + rgnStep[1]);
  }

  function OffsetNeighbors(nQ, nJ) {
    return g_rgrgnDirections.map((rgnStep, nDirection) => OffsetNeighbor(nQ, nJ, nDirection));
  }

  function OppositeDirection(nDirection) {
    return (nDirection + 3) % 6;
  }

  // The edge a hex at rgdCenter shares with its neighbour in nDirection.
  function SharedEdge(rgdCenter, dD, nDirection) {
    const rgrgdPolygon = HexPolygon(rgdCenter, dD);
    return g_rgrgnDirectionEdges[nDirection].map((nVertex) => rgrgdPolygon[nVertex]);
  }

  function OffsetDistance(nQ1, nJ1, nQ2, nJ2) {
    const rgnFirst = AxialToCube(...OffsetToAxial(nQ1, nJ1));
    const rgnSecond = AxialToCube(...OffsetToAxial(nQ2, nJ2));
    return Math.max(...rgnFirst.map((nValue, nAxis) => Math.abs(nValue - rgnSecond[nAxis])));
  }

  // The fine-lattice hex centred on coarse hex (q, j), for an even ratio.
  function NestOffset(nQ, nJ, nRatio) {
    Require(nRatio === 1 || (Number.isInteger(nRatio) && nRatio % 2 === 0), 'Nesting ratio must be 1 or even');
    if (nRatio === 1) {
      return [Clean(nQ), Clean(nJ)];
    }
    return [Clean(nQ * nRatio), Clean(nJ * nRatio + (IsOdd(nQ) ? nRatio / 2 : 0))];
  }

  RpgMap.Lattice = Object.freeze({
    g_dYardsPerMile,
    g_rgszSizes,
    g_Scales,
    g_rgrgnDirections,
    IsOdd,
    ScaleDistance,
    ScaleMiles,
    ScaleRatio,
    ColumnSpacing,
    HexRadius,
    HexArea,
    OffsetToAxial,
    AxialToOffset,
    AxialToCube,
    CubeToAxial,
    CubeRound,
    OffsetToPoint,
    PointToOffset,
    HexPolygon,
    OffsetNeighbor,
    OffsetNeighbors,
    OppositeDirection,
    SharedEdge,
    OffsetDistance,
    NestOffset,
  });

<script data-module="Topology">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice } = RpgMap;
  const { Require } = Util;

  // Global-map tiles: one hex lattice per panel, except that the six equatorial
  // panels share one continuous lattice that wraps around the strip. Lengths
  // are in edge units, measured in each panel's frame ([east, north]).
  const g_nDefaultPanelHexes = 24;
  const g_rgszTileScales = Object.freeze(['XL', 'L']);
  const g_dMinAreaFraction = 1e-6;
  const g_dFullAreaFraction = 1 - 1e-9;
  const g_nKeyBias = 100000;
  const g_Cache = new Map();

  function ValidatePanelHexes(nPanelHexes) {
    Require(Number.isInteger(nPanelHexes) && nPanelHexes > 0 && nPanelHexes % 2 === 0,
      'Panel size must be a positive even number of XL hexes');
  }

  // Lattice placement for one panel. Column q is centred at east = dOriginEast + q·dW.
  // Non-equatorial panels: q = 0 is the north-south bisector and hex (0, 0) is the
  // panel centre. Equatorial panels: the lattice is anchored on XL hex centres, so
  // finer scales nest; panel column i = q − nColumnShift runs 0 … nColumns−1 west to east.
  function PanelLattice(szPanel, nPanelHexes = g_nDefaultPanelHexes, nRatio = 1) {
    ValidatePanelHexes(nPanelHexes);
    Require(nRatio === 1 || (Number.isInteger(nRatio) && nRatio > 0 && nRatio % 2 === 0),
      'Scale ratio must be 1 or an even integer');
    const Built = Projection.Build();
    const Panel = Built.Panels[szPanel];
    Require(Panel !== undefined, `Unknown panel: ${szPanel}`);
    const dMilesPerEdge = Projection.MilesPerEdge(nPanelHexes);
    const dD = Projection.g_dXlHexMiles / dMilesPerEdge / nRatio;
    const dW = Lattice.ColumnSpacing(dD);
    let dOriginEast = 0;
    let nColumns = 0;
    let nColumnShift = 0;
    if (Panel.fEquatorial) {
      nColumns = nPanelHexes * nRatio;
      nColumnShift = nRatio === 1 ? 0 : nRatio / 2;
      dOriginEast = -Built.dEquatorialWidth / 2 + ((nRatio === 1 ? 0.5 : 0) - nColumnShift) * dW;
    }
    return Object.freeze({
      szPanel, fEquatorial: Panel.fEquatorial, nPanelHexes, nRatio, dMilesPerEdge, dD, dW, dOriginEast, nColumns, nColumnShift,
    });
  }

  function LatticeCenter(PanelLatticeInfo, nQ, nJ) {
    return [
      PanelLatticeInfo.dOriginEast + nQ * PanelLatticeInfo.dW,
      (nJ + (Lattice.IsOdd(nQ) ? 0.5 : 0)) * PanelLatticeInfo.dD,
    ];
  }

  function LatticeNearest(PanelLatticeInfo, dEast, dNorth) {
    return Lattice.PointToOffset(dEast - PanelLatticeInfo.dOriginEast, dNorth, PanelLatticeInfo.dD);
  }

  function Key(nQ, nJ) {
    return (nQ + g_nKeyBias) * 2 * g_nKeyBias + (nJ + g_nKeyBias);
  }

  // The clip regions of a panel, in its own frame. Equatorial panels also clip
  // against their strip neighbours, since tiles there are whole at east/west edges.
  function BuildRegions(Built, szPanel) {
    const Frame = Built.Frames[szPanel];
    const rgRegions = [{ szPanel, rgdToRegion: [1, 0, 0, 1, 0, 0], rgrgdPolygon: Frame.rgrgdPolygon }];
    if (Frame.fEquatorial) {
      const rgszStrip = Built.rgszEquatorialWestToEast;
      const nStrip = rgszStrip.indexOf(szPanel);
      for (const szOther of [rgszStrip[(nStrip + 5) % 6], rgszStrip[(nStrip + 1) % 6]]) {
        const Seam = Projection.FindSeam(szPanel, szOther);
        const rgdToRegion = Seam.szPanelA === szPanel ? Seam.rgdAToB : Seam.rgdBToA;
        const rgdFromRegion = Projection.InvertTransform(rgdToRegion);
        rgRegions.push({
          szPanel: szOther,
          rgdToRegion,
          rgrgdPolygon: Built.Frames[szOther].rgrgdPolygon.map((rgdPoint) => Projection.ApplyTransform(rgdFromRegion, rgdPoint)),
        });
      }
    }
    return rgRegions;
  }

  function EdgeLines(rgrgdPolygon) {
    return Util.Boundary(rgrgdPolygon).map(([rgdStart, rgdEnd]) => {
      const rgdDirection = Util.Unit(Util.Subtract(rgdEnd, rgdStart));
      return { rgdStart, rgdDirection };
    });
  }

  // Signed distance inside the convex polygon (negative outside).
  function InsideDistance(rgEdgeLines, rgdPoint) {
    let dMinimum = Infinity;
    for (const Line of rgEdgeLines) {
      const dSide = Line.rgdDirection[0] * (rgdPoint[1] - Line.rgdStart[1])
        - Line.rgdDirection[1] * (rgdPoint[0] - Line.rgdStart[0]);
      dMinimum = Math.min(dMinimum, dSide);
    }
    return dMinimum;
  }

  function Bounds(rgRegions) {
    const rgrgdPoints = rgRegions.flatMap((Region) => Region.rgrgdPolygon);
    return {
      dMinEast: Math.min(...rgrgdPoints.map((rgdPoint) => rgdPoint[0])),
      dMaxEast: Math.max(...rgrgdPoints.map((rgdPoint) => rgdPoint[0])),
      dMinNorth: Math.min(...rgrgdPoints.map((rgdPoint) => rgdPoint[1])),
      dMaxNorth: Math.max(...rgrgdPoints.map((rgdPoint) => rgdPoint[1])),
    };
  }

  // Lattice hexes overlapping the panel (or, for equatorial panels, the strip near
  // the panel's own columns), with partial tiles clipped into per-region pieces.
  function CollectPanelTiles(Info, rgRegions, dHexArea) {
    const PanelLatticeInfo = Info.Lattice;
    const { dD, dW } = PanelLatticeInfo;
    const dRadius = Lattice.HexRadius(dD);
    const Box = Bounds(rgRegions);
    const rgEdgeLines = EdgeLines(rgRegions[0].rgrgdPolygon);
    let nQMin;
    let nQMax;
    if (PanelLatticeInfo.fEquatorial) {
      nQMin = PanelLatticeInfo.nColumnShift;
      nQMax = nQMin + PanelLatticeInfo.nColumns - 1;
    } else {
      nQMax = Math.ceil((Math.max(-Box.dMinEast, Box.dMaxEast) + dRadius) / dW) + 1;
      nQMin = -nQMax;
    }
    const nJMin = Math.floor((Box.dMinNorth - dRadius) / dD) - 1;
    const nJMax = Math.ceil((Box.dMaxNorth + dRadius) / dD) + 1;
    const rgCandidates = [];
    for (let nQ = nQMin; nQ <= nQMax; nQ++) {
      for (let nJ = nJMin; nJ <= nJMax; nJ++) {
        const rgdCenter = LatticeCenter(PanelLatticeInfo, nQ, nJ);
        if (rgdCenter[0] + dRadius < Box.dMinEast || rgdCenter[0] - dRadius > Box.dMaxEast
          || rgdCenter[1] + dRadius < Box.dMinNorth || rgdCenter[1] - dRadius > Box.dMaxNorth) {
          continue;
        }
        const dInside = InsideDistance(rgEdgeLines, rgdCenter);
        if (dInside >= dRadius) {
          rgCandidates.push({ nQ, nJ, rgdCenter, dArea: dHexArea, rgPieces: null });
          continue;
        }
        if (!PanelLatticeInfo.fEquatorial && dInside <= -dRadius) {
          continue;
        }
        const rgrgdHex = Lattice.HexPolygon(rgdCenter, dD);
        const rgPieces = [];
        let dArea = 0;
        for (const Region of rgRegions) {
          const rgrgdPiece = Util.ClipPolygonToConvex(rgrgdHex, Region.rgrgdPolygon);
          const dPieceArea = rgrgdPiece.length ? Util.PolygonArea(rgrgdPiece) : 0;
          if (dPieceArea > 1e-12 * dHexArea) {
            rgPieces.push(Object.freeze({ szPanel: Region.szPanel, rgrgdPolygon: Object.freeze(rgrgdPiece) }));
            dArea += dPieceArea;
          }
        }
        if (dArea <= g_dMinAreaFraction * dHexArea) {
          continue;
        }
        const fFull = dArea >= g_dFullAreaFraction * dHexArea;
        rgCandidates.push({ nQ, nJ, rgdCenter, dArea: fFull ? dHexArea : dArea, rgPieces: fFull ? null : rgPieces });
      }
    }
    return rgCandidates;
  }

  function SegmentLengthInRegions(rgdStart, rgdEnd, rgRegions) {
    const dLength = Util.Distance(rgdStart, rgdEnd);
    let dInside = 0;
    for (const Region of rgRegions) {
      const rgdInterval = Util.ClipSegmentToConvex(rgdStart, rgdEnd, Region.rgrgdPolygon);
      if (rgdInterval) {
        dInside += (rgdInterval[1] - rgdInterval[0]) * dLength;
      }
    }
    return dInside;
  }

  // Interval of a convex piece's boundary lying on the line through rgdStart (unit direction).
  function EdgeInterval(rgrgdPolygon, rgdStart, rgdDirection, dTolerance) {
    let dMin = Infinity;
    let dMax = -Infinity;
    let nCount = 0;
    for (const rgdPoint of rgrgdPolygon) {
      const rgdRelative = Util.Subtract(rgdPoint, rgdStart);
      if (Math.abs(rgdDirection[0] * rgdRelative[1] - rgdDirection[1] * rgdRelative[0]) <= dTolerance) {
        const dAlong = Util.Dot(rgdRelative, rgdDirection);
        dMin = Math.min(dMin, dAlong);
        dMax = Math.max(dMax, dAlong);
        nCount++;
      }
    }
    return nCount >= 2 && dMax > dMin ? [dMin, dMax] : null;
  }

  function BuildAdjacency(Topo, RegionsByPanel, Built) {
    const rgNeighborSets = Topo.rgTiles.map(() => new Set());
    const dEpsilon = 1e-6 * Topo.dD;
    const Link = (nFirst, nSecond) => {
      if (nFirst !== nSecond) {
        rgNeighborSets[nFirst].add(nSecond);
        rgNeighborSets[nSecond].add(nFirst);
      }
    };
    // Lattice neighbours within a panel, or within the continuous equatorial strip.
    for (const Tile of Topo.rgTiles) {
      for (let nDirection = 0; nDirection < 6; nDirection++) {
        const [nQ, nJ] = Lattice.OffsetNeighbor(Tile.nLatticeColumn, Tile.nLatticeRow, nDirection);
        const nOther = LocateLattice(Topo, Tile.szPanel, nQ, nJ);
        if (nOther < 0 || nOther < Tile.nIndex) {
          continue;
        }
        const Other = Topo.rgTiles[nOther];
        if (!Tile.fPartial && !Other.fPartial) {
          Link(Tile.nIndex, nOther);
          continue;
        }
        const [rgdStart, rgdEnd] = Lattice.SharedEdge(Tile.rgdCenter, Topo.dD, nDirection);
        if (SegmentLengthInRegions(rgdStart, rgdEnd, RegionsByPanel[Tile.szPanel]) > dEpsilon) {
          Link(Tile.nIndex, nOther);
        }
      }
    }
    // Partial-tile pieces meeting across the other seams, compared along the shared edge.
    const PiecesByPanel = {};
    for (const Tile of Topo.rgTiles) {
      for (const Piece of Tile.rgPieces || []) {
        const Region = RegionsByPanel[Tile.szPanel].find((Item) => Item.szPanel === Piece.szPanel);
        (PiecesByPanel[Piece.szPanel] = PiecesByPanel[Piece.szPanel] || []).push({
          nTile: Tile.nIndex,
          rgrgdPolygon: Piece.rgrgdPolygon.map((rgdPoint) => Projection.ApplyTransform(Region.rgdToRegion, rgdPoint)),
        });
      }
    }
    for (const Seam of Built.Seams) {
      if (Built.Panels[Seam.szPanelA].fEquatorial && Built.Panels[Seam.szPanelB].fEquatorial) {
        continue;
      }
      const rgSides = [Seam.szPanelA, Seam.szPanelB].map((szPanel) => {
        const Frame = Built.Frames[szPanel];
        const [rgdStart, rgdEnd] = Seam.rgszVertices.map((szId) => Projection.SolidToFrame(Frame, Built.Vertices[szId]));
        const rgdDirection = Util.Unit(Util.Subtract(rgdEnd, rgdStart));
        return (PiecesByPanel[szPanel] || [])
          .map((Piece) => ({ nTile: Piece.nTile, rgdInterval: EdgeInterval(Piece.rgrgdPolygon, rgdStart, rgdDirection, 1e-9) }))
          .filter((Piece) => Piece.rgdInterval !== null);
      });
      for (const First of rgSides[0]) {
        for (const Second of rgSides[1]) {
          const dOverlap = Math.min(First.rgdInterval[1], Second.rgdInterval[1])
            - Math.max(First.rgdInterval[0], Second.rgdInterval[0]);
          if (dOverlap > dEpsilon) {
            Link(First.nTile, Second.nTile);
          }
        }
      }
    }
    const rgnOffsets = new Int32Array(rgNeighborSets.length + 1);
    rgNeighborSets.forEach((Neighbors, nIndex) => {
      rgnOffsets[nIndex + 1] = rgnOffsets[nIndex] + Neighbors.size;
    });
    const rgnNeighbors = new Int32Array(rgnOffsets[rgNeighborSets.length]);
    rgNeighborSets.forEach((Neighbors, nIndex) => {
      rgnNeighbors.set([...Neighbors].sort((nLeft, nRight) => nLeft - nRight), rgnOffsets[nIndex]);
    });
    return { rgnOffsets, rgnNeighbors };
  }

  // Builds (and caches) the tiles and adjacency of a global map.
  function Build(nPanelHexes = g_nDefaultPanelHexes, szTileScale = 'XL') {
    ValidatePanelHexes(nPanelHexes);
    Require(g_rgszTileScales.includes(szTileScale), `Global tile scale must be one of ${g_rgszTileScales.join(', ')}`);
    const szKey = `${nPanelHexes}:${szTileScale}`;
    if (g_Cache.has(szKey)) {
      return g_Cache.get(szKey);
    }
    const Built = Projection.Build();
    const nRatio = Lattice.ScaleRatio('regional', 'XL', szTileScale);
    const rgszPanels = Object.keys(Built.Panels);
    const rgszStrip = Built.rgszEquatorialWestToEast;
    const dD = PanelLattice(rgszPanels[0], nPanelHexes, nRatio).dD;
    const dHexArea = Lattice.HexArea(dD);
    const rgTiles = [];
    const Panels = {};
    const Lookups = {};
    const RegionsByPanel = {};
    for (const szPanel of rgszPanels) {
      const PanelLatticeInfo = PanelLattice(szPanel, nPanelHexes, nRatio);
      const rgRegions = BuildRegions(Built, szPanel);
      RegionsByPanel[szPanel] = rgRegions;
      const rgCandidates = CollectPanelTiles({ Lattice: PanelLatticeInfo }, rgRegions, dHexArea);
      rgCandidates.sort((Left, Right) => (Right.nJ - Left.nJ) || (Left.nQ - Right.nQ));
      const nQMin = PanelLatticeInfo.fEquatorial
        ? PanelLatticeInfo.nColumnShift
        : Math.min(...rgCandidates.map((Candidate) => Candidate.nQ));
      const nQMax = Math.max(...rgCandidates.map((Candidate) => Candidate.nQ));
      const nJMax = rgCandidates[0].nJ;
      const nJMin = rgCandidates[rgCandidates.length - 1].nJ;
      const Lookup = new Map();
      const nFirstTile = rgTiles.length;
      for (const Candidate of rgCandidates) {
        const nIndex = rgTiles.length;
        Lookup.set(Key(Candidate.nQ, Candidate.nJ), nIndex);
        rgTiles.push(Object.freeze({
          nIndex,
          szPanel,
          nColumn: Candidate.nQ - nQMin,
          nRow: nJMax - Candidate.nJ,
          nLatticeColumn: Candidate.nQ,
          nLatticeRow: Candidate.nJ,
          rgdCenter: Object.freeze(Candidate.rgdCenter),
          dArea: Candidate.dArea,
          fPartial: Candidate.rgPieces !== null,
          rgPieces: Candidate.rgPieces ? Object.freeze(Candidate.rgPieces) : null,
        }));
      }
      Lookups[szPanel] = Lookup;
      const nStrip = rgszStrip.indexOf(szPanel);
      Panels[szPanel] = Object.freeze({
        szPanel,
        Lattice: PanelLatticeInfo,
        nFirstTile,
        nTileCount: rgTiles.length - nFirstTile,
        nColumns: nQMax - nQMin + 1,
        nRows: nJMax - nJMin + 1,
        nLatticeColumnMin: nQMin,
        nLatticeRowMax: nJMax,
        szWest: nStrip >= 0 ? rgszStrip[(nStrip + 5) % 6] : null,
        szEast: nStrip >= 0 ? rgszStrip[(nStrip + 1) % 6] : null,
      });
    }
    const Topo = {
      nPanelHexes,
      szTileScale,
      nRatio,
      dMilesPerEdge: Projection.MilesPerEdge(nPanelHexes),
      dD,
      dW: Lattice.ColumnSpacing(dD),
      dHexArea,
      rgszPanels: Object.freeze(rgszPanels),
      Panels: Object.freeze(Panels),
      Lookups: Object.freeze(Lookups),
      rgTiles: Object.freeze(rgTiles),
      nTiles: rgTiles.length,
    };
    const { rgnOffsets, rgnNeighbors } = BuildAdjacency(Topo, RegionsByPanel, Built);
    Topo.rgnAdjacencyOffsets = rgnOffsets;
    Topo.rgnAdjacency = rgnNeighbors;
    Object.freeze(Topo);
    g_Cache.set(szKey, Topo);
    return Topo;
  }

  function TileAt(Topo, szPanel, nQ, nJ) {
    const Lookup = Topo.Lookups[szPanel];
    Require(Lookup !== undefined, `Unknown panel: ${szPanel}`);
    const nIndex = Lookup.get(Key(nQ, nJ));
    return nIndex === undefined ? -1 : nIndex;
  }

  // Like TileAt, but equatorial columns past the panel's east/west edge resolve
  // to the neighbouring strip panel (the strip lattice is continuous and wraps).
  function LocateLattice(Topo, szPanel, nQ, nJ) {
    const Info = Topo.Panels[szPanel];
    const PanelLatticeInfo = Info.Lattice;
    if (PanelLatticeInfo.fEquatorial) {
      const nColumn = nQ - PanelLatticeInfo.nColumnShift;
      if (nColumn < 0) {
        return TileAt(Topo, Info.szWest, nQ + PanelLatticeInfo.nColumns, nJ);
      }
      if (nColumn >= PanelLatticeInfo.nColumns) {
        return TileAt(Topo, Info.szEast, nQ - PanelLatticeInfo.nColumns, nJ);
      }
    }
    return TileAt(Topo, szPanel, nQ, nJ);
  }

  function TileByColumnRow(Topo, szPanel, nColumn, nRow) {
    const Info = Topo.Panels[szPanel];
    Require(Info !== undefined, `Unknown panel: ${szPanel}`);
    return TileAt(Topo, szPanel, nColumn + Info.nLatticeColumnMin, Info.nLatticeRowMax - nRow);
  }

  function Neighbors(Topo, nTile) {
    return Topo.rgnAdjacency.subarray(Topo.rgnAdjacencyOffsets[nTile], Topo.rgnAdjacencyOffsets[nTile + 1]);
  }

  function AreAdjacent(Topo, nFirst, nSecond) {
    return Neighbors(Topo, nFirst).includes(nSecond);
  }

  // The tile's drawable outline(s) in its own panel frame.
  function TilePolygons(Topo, nTile) {
    const Tile = Topo.rgTiles[nTile];
    return Tile.rgPieces
      ? Tile.rgPieces.map((Piece) => Piece.rgrgdPolygon)
      : [Lattice.HexPolygon(Tile.rgdCenter, Topo.dD)];
  }

  RpgMap.Topology = Object.freeze({
    g_nDefaultPanelHexes,
    g_rgszTileScales,
    g_dMinAreaFraction,
    PanelLattice,
    LatticeCenter,
    LatticeNearest,
    Build,
    TileAt,
    LocateLattice,
    TileByColumnRow,
    Neighbors,
    AreAdjacent,
    TilePolygons,
  });
})(globalThis);
</script>
