    });
  }

  function GetLandmark(Doc, nTile) {
    CheckTile(Doc, nTile);
    return Doc.Landmarks.get(nTile) || null;
  }

  // Places, replaces or edits the tile's landmark; null removes it.
  function SetLandmark(Doc, nTile, Props) {
    CheckTile(Doc, nTile);
    const Before = Doc.Landmarks.get(nTile) || null;
    const After = Props === null ? null : MakeLandmark(Props);
    if (Before === null && After === null) {
      return null;
    }
    return ApplyChange(Doc, { szLayer: 'landmark', Key: nTile, nIndex: -1, Before, After });
  }

  function RemoveLandmark(Doc, nTile) {
    return SetLandmark(Doc, nTile, null);
  }

  // Overlays: road, trail or river paths of adjacent tiles ----------------------

  function CheckPath(Doc, rgnTiles) {
    Require(Array.isArray(rgnTiles) && rgnTiles.length > 0, 'An overlay needs at least one tile');
    rgnTiles.forEach((nTile) => CheckTile(Doc, nTile));
    for (let nIndex = 1; nIndex < rgnTiles.length; nIndex++) {
      Require(AreAdjacent(Doc, rgnTiles[nIndex - 1], rgnTiles[nIndex]),
        `Overlay tiles ${rgnTiles[nIndex - 1]} and ${rgnTiles[nIndex]} (points ${nIndex - 1} and ${nIndex}) are not adjacent`);
    }
  }

  function MakeOverlay(Doc, Props) {
    Require(g_rgszOverlayTypes.includes(Props.szType), `Unknown overlay type: ${Props.szType}`);
    CheckId(Props.szId, 'overlay');
    const szStyle = Props.szStyle === undefined ? '' : Props.szStyle;
    Require(typeof szStyle === 'string' && g_StylePattern.test(szStyle), `Invalid overlay style: ${szStyle}`);
    CheckPath(Doc, Props.rgnTiles);
    return Object.freeze({
      szId: Props.szId,
      szType: Props.szType,
      szName: CheckText(Props.szName === undefined ? '' : Props.szName, 'Overlay name'),
      szStyle,
      rgnTiles: Object.freeze(Props.rgnTiles.slice()),
    });
  }

  function GetOverlay(Doc, szId) {
    return Doc.rgOverlays.find((Overlay) => Overlay.szId === szId) || null;
  }

  function OverlaysAt(Doc, nTile) {
    return Doc.rgOverlays.filter((Overlay) => Overlay.rgnTiles.includes(nTile));
  }

  // Props: { szType, rgnTiles, szName?, szStyle?, szId? }. The id defaults to "<type><n>".
  function AddOverlay(Doc, Props) {
    const szId = Props.szId === undefined ? NextId(Doc.rgOverlays, String(Props.szType)) : Props.szId;
    Require(GetOverlay(Doc, szId) === null, `Duplicate overlay id: ${szId}`);
    const After = MakeOverlay(Doc, { ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'overlay', Key: szId, nIndex: Doc.rgOverlays.length, Before: null, After });
  }

  function UpdateOverlay(Doc, szId, Props) {
    const nIndex = IndexOfId(Doc.rgOverlays, szId);
    Require(nIndex >= 0, `Unknown overlay: ${szId}`);
    const Before = Doc.rgOverlays[nIndex];
    const After = MakeOverlay(Doc, { ...Before, ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'overlay', Key: szId, nIndex, Before, After });
  }

  function RemoveOverlay(Doc, szId) {
    const nIndex = IndexOfId(Doc.rgOverlays, szId);
    Require(nIndex >= 0, `Unknown overlay: ${szId}`);
    return ApplyChange(Doc, { szLayer: 'overlay', Key: szId, nIndex, Before: Doc.rgOverlays[nIndex], After: null });
  }

  // Labels: text attached to a tile ---------------------------------------------

  function MakeLabel(Doc, Props) {
    CheckId(Props.szId, 'label');
    CheckTile(Doc, Props.nTile);
    Require(g_rgszLabelCategories.includes(Props.szCategory), `Unknown label category: ${Props.szCategory}`);
    const szText = CheckText(Props.szText, 'Label text');
    Require(szText.trim().length > 0, 'Label text must not be empty');
    const dSize = Props.dSize === undefined ? g_LabelDefaultSizes[Props.szCategory] : Props.dSize;
    CheckFinite(dSize, 'Label size');
    Require(dSize > 0, 'Label size must be positive');
    const Label = {
      szId: Props.szId,
      nTile: Props.nTile,
      szText,
      szCategory: Props.szCategory,
      dSize,
      dRotation: Props.dRotation === undefined ? 0 : Props.dRotation,
      dDx: Props.dDx === undefined ? 0 : Props.dDx,
      dDy: Props.dDy === undefined ? 0 : Props.dDy,
    };
    CheckFinite(Label.dRotation, 'Label rotation');
    CheckFinite(Label.dDx, 'Label dx');
    CheckFinite(Label.dDy, 'Label dy');
    return Object.freeze(Label);
  }

  function GetLabel(Doc, szId) {
    return Doc.rgLabels.find((Label) => Label.szId === szId) || null;
  }

  function LabelsAt(Doc, nTile) {
    return Doc.rgLabels.filter((Label) => Label.nTile === nTile);
  }

  // Props: { nTile, szText, szCategory, dSize?, dRotation?, dDx?, dDy?, szId? }.
  function AddLabel(Doc, Props) {
    const szId = Props.szId === undefined ? NextId(Doc.rgLabels, 'label') : Props.szId;
    Require(GetLabel(Doc, szId) === null, `Duplicate label id: ${szId}`);
    const After = MakeLabel(Doc, { ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'label', Key: szId, nIndex: Doc.rgLabels.length, Before: null, After });
  }

  function UpdateLabel(Doc, szId, Props) {
    const nIndex = IndexOfId(Doc.rgLabels, szId);
    Require(nIndex >= 0, `Unknown label: ${szId}`);
    const Before = Doc.rgLabels[nIndex];
    const After = MakeLabel(Doc, { ...Before, ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'label', Key: szId, nIndex, Before, After });
  }

  function RemoveLabel(Doc, szId) {
    const nIndex = IndexOfId(Doc.rgLabels, szId);
    Require(nIndex >= 0, `Unknown label: ${szId}`);
    return ApplyChange(Doc, { szLayer: 'label', Key: szId, nIndex, Before: Doc.rgLabels[nIndex], After: null });
  }

  // Replaying changes -------------------------------------------------------------

  function ApplyListChange(rgItems, Change, Before, After) {
    if (Before === null) {
      rgItems.splice(Change.nIndex, 0, After);
      return;
    }
    const nIndex = IndexOfId(rgItems, Change.Key);
    Require(nIndex >= 0, `Cannot apply change: ${Change.Key} is missing`);
    if (After === null) {
      rgItems.splice(nIndex, 1);
    } else {
      rgItems[nIndex] = After;
    }
  }

  // Sets the changed item to After (fForward) or Before, and returns the change.
  function ApplyChange(Doc, Change, fForward = true) {
    const Before = fForward ? Change.Before : Change.After;
    const After = fForward ? Change.After : Change.Before;
    switch (Change.szLayer) {
      case 'terrain':
        Doc.rgnTerrain[Change.Key] = After;
        break;
      case 'landmark':
        if (After === null) {
          Doc.Landmarks.delete(Change.Key);
        } else {
          Doc.Landmarks.set(Change.Key, After);
        }
        break;
      case 'overlay':
        ApplyListChange(Doc.rgOverlays, Change, Before, After);
        break;
      case 'label':
        ApplyListChange(Doc.rgLabels, Change, Before, After);
        break;
      default:
        Require(false, `Unknown change layer: ${Change.szLayer}`);
    }
    Doc.nRevision++;
    return Change;
  }

  RpgMap.Model = Object.freeze({
    g_nFormatVersion,
    g_rgszOverlayTypes,
    g_rgszLabelCategories,
    g_LabelDefaultSizes,
    g_rgszLayers,
    CreateGlobalMap,
    CreateLocalMap,
    LocalTileIndex,
    LocalTileXY,
    TileToUniversal,
    HexMiles,
    IsTile,
    Neighbors,
    AreAdjacent,
    GetTerrain,
    SetTerrain,
    GetLandmark,
    SetLandmark,
    RemoveLandmark,
    GetOverlay,
    OverlaysAt,
    AddOverlay,
    UpdateOverlay,
    RemoveOverlay,
    GetLabel,
    LabelsAt,
    AddLabel,
    UpdateLabel,
    RemoveLabel,
    ApplyChange,
  });
})(globalThis);
</script>

<script data-module="History">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Model } = RpgMap;
  const { Require } = Util;

  // Command-pattern undo/redo. A command is { szLabel, rgChanges } holding only the
  // Model change records; undo replays them backwards, redo forwards.
  const g_nDefaultLimit = 500;

  function Create(Doc, Options = {}) {
    const nLimit = Options.nLimit === undefined ? g_nDefaultLimit : Options.nLimit;
    Require(Number.isInteger(nLimit) && nLimit > 0, 'History limit must be a positive integer');
    return { Doc, nLimit, rgUndo: [], rgRedo: [], Pending: null };
  }

  // Starts a grouped command, such as a brush stroke. Must be closed by Commit or Cancel.
  function Begin(History, szLabel) {
    Require(History.Pending === null, 'A history group is already open');
    History.Pending = { szLabel: String(szLabel), rgChanges: [] };
  }

  // Records changes already applied to the document (nulls from no-op mutators are skipped).
  function Record(History, Changes) {
    Require(History.Pending !== null, 'History.Record needs an open group (call Begin first)');
    for (const Change of Array.isArray(Changes) ? Changes : [Changes]) {
      if (Change !== null && Change !== undefined) {
        History.Pending.rgChanges.push(Change);
      }
    }
  }

  // Merges repeated terrain/landmark changes to one tile (first Before, last After) and
  // drops those that end where they started. Overlay and label changes keep their order.
  function Coalesce(rgChanges) {
    const rgResult = [];
    const ByKey = new Map();
    for (const Change of rgChanges) {
      if (Change.szLayer !== 'terrain' && Change.szLayer !== 'landmark') {
        rgResult.push(Change);
        continue;
      }
      const szKey = `${Change.szLayer}:${Change.Key}`;
      const nIndex = ByKey.get(szKey);
      if (nIndex === undefined) {
        ByKey.set(szKey, rgResult.length);
        rgResult.push(Change);
      } else {
        rgResult[nIndex] = { ...rgResult[nIndex], After: Change.After };
      }
    }
    return rgResult.filter((Change) => Change.Before !== Change.After);
  }

  function Push(History, Command) {
    History.rgUndo.push(Command);
    if (History.rgUndo.length > History.nLimit) {
      History.rgUndo.shift();
    }
    History.rgRedo.length = 0;
  }

  // Closes the open group; returns the command, or null if it changed nothing.
  function Commit(History) {
    Require(History.Pending !== null, 'No history group is open');
    const { szLabel, rgChanges } = History.Pending;
    History.Pending = null;
    const rgCoalesced = Coalesce(rgChanges);
    if (rgCoalesced.length === 0) {
      return null;
    }
    const Command = Object.freeze({ szLabel, rgChanges: Object.freeze(rgCoalesced) });
    Push(History, Command);
    return Command;
  }

  // Reverts and discards the open group.
  function Cancel(History) {
    Require(History.Pending !== null, 'No history group is open');
    const { rgChanges } = History.Pending;
    History.Pending = null;
    for (let nIndex = rgChanges.length - 1; nIndex >= 0; nIndex--) {
      Model.ApplyChange(History.Doc, rgChanges[nIndex], false);
    }
  }

  // Runs fnMutate(Doc, fnRecord) as one command. fnMutate passes each change record
  // (for example fnRecord(Model.SetTerrain(...))) to fnRecord, which returns it.
  // If fnMutate throws, the recorded changes are reverted and the error is rethrown.
  function Perform(History, szLabel, fnMutate) {
    Begin(History, szLabel);
    const fnRecord = (Change) => {
      Record(History, Change);
      return Change;
    };
    try {
      fnMutate(History.Doc, fnRecord);
    } catch (Failure) {
      Cancel(History);
      throw Failure;
    }
    return Commit(History);
  }

  function CanUndo(History) {
    return History.Pending === null && History.rgUndo.length > 0;
  }

  function CanRedo(History) {
    return History.Pending === null && History.rgRedo.length > 0;
  }

  function Undo(History) {
    if (!CanUndo(History)) {
      return null;
    }
    const Command = History.rgUndo.pop();
    for (let nIndex = Command.rgChanges.length - 1; nIndex >= 0; nIndex--) {
      Model.ApplyChange(History.Doc, Command.rgChanges[nIndex], false);
    }
    History.rgRedo.push(Command);
    return Command;
  }

  function Redo(History) {
    if (!CanRedo(History)) {
      return null;
    }
    const Command = History.rgRedo.pop();
    for (const Change of Command.rgChanges) {
      Model.ApplyChange(History.Doc, Change, true);
    }
    History.rgUndo.push(Command);
    return Command;
  }

  function Clear(History) {
    Require(History.Pending === null, 'Cannot clear history while a group is open');
    History.rgUndo.length = 0;
    History.rgRedo.length = 0;
  }

  RpgMap.History = Object.freeze({
    g_nDefaultLimit,
    Create,
    Begin,
    Record,
    Commit,
    Cancel,
    Perform,
    CanUndo,
    CanRedo,
    Undo,
    Redo,
    Clear,
  });
})(globalThis);
</script>

<script data-module="View">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Coordinates, Terrain } = RpgMap;
  const { Require } = Util;

  // DOM-free view geometry for the renderer. "World" space is net space for the net
  // layout and the focus panel's frame for the focus layout (edge units, y north/up).
  // Local world units are hex heights, relative to the anchor. The camera maps world
  // to CSS pixels (y down), independent of the map's physical scale.
  const g_dMinScale = 4;
  const g_dMaxScale = 400000;
  const g_rgdIdentity = Object.freeze([1, 0, 0, 1, 0, 0]);

  // Camera -------------------------------------------------------------------------

  function CreateCamera(nWidth = 800, nHeight = 600) {
    return { dCenterX: 0, dCenterY: 0, dScale: 100, dMinScale: g_dMinScale, nWidth, nHeight };
  }

  function ResizeCamera(Camera, nWidth, nHeight) {
    Camera.nWidth = Math.max(1, nWidth);
    Camera.nHeight = Math.max(1, nHeight);
  }

  function ClampScale(dScale, dMinScale = g_dMinScale) {
    return Math.min(g_dMaxScale, Math.max(dMinScale, dScale));
  }

  // [a, b, c, d, e, f] taking world points to screen pixels.
  function WorldToScreenTransform(Camera) {
    const dScale = Camera.dScale;
    return [dScale, 0, 0, -dScale, Camera.nWidth / 2 - Camera.dCenterX * dScale, Camera.nHeight / 2 + Camera.dCenterY * dScale];
  }

  function WorldToScreen(Camera, rgdWorld) {
    return [
      Camera.nWidth / 2 + (rgdWorld[0] - Camera.dCenterX) * Camera.dScale,
      Camera.nHeight / 2 - (rgdWorld[1] - Camera.dCenterY) * Camera.dScale,
    ];
  }

  function ScreenToWorld(Camera, rgdScreen) {
    return [
      Camera.dCenterX + (rgdScreen[0] - Camera.nWidth / 2) / Camera.dScale,
      Camera.dCenterY - (rgdScreen[1] - Camera.nHeight / 2) / Camera.dScale,
    ];
  }

  // Moves the content by (dDx, dDy) screen pixels.
  function Pan(Camera, dDx, dDy) {
    Camera.dCenterX -= dDx / Camera.dScale;
    Camera.dCenterY += dDy / Camera.dScale;
  }

  // Zooms by dFactor, keeping the world point under rgdScreen fixed.
  function ZoomAt(Camera, rgdScreen, dFactor) {
    const rgdBefore = ScreenToWorld(Camera, rgdScreen);
    Camera.dScale = ClampScale(Camera.dScale * dFactor, Camera.dMinScale);
    const rgdAfter = ScreenToWorld(Camera, rgdScreen);
    Camera.dCenterX += rgdBefore[0] - rgdAfter[0];
    Camera.dCenterY += rgdBefore[1] - rgdAfter[1];
  }

  function CenterOn(Camera, rgdWorld) {
    Camera.dCenterX = rgdWorld[0];
    Camera.dCenterY = rgdWorld[1];
  }

  // Bounds are [minX, minY, maxX, maxY] in world units.
  function FitBounds(Camera, rgdBounds, dMargin = 24) {
    const dWidth = Math.max(rgdBounds[2] - rgdBounds[0], 1e-9);
    const dHeight = Math.max(rgdBounds[3] - rgdBounds[1], 1e-9);
    const dAvailableX = Math.max(1, Camera.nWidth - 2 * dMargin);
    const dAvailableY = Math.max(1, Camera.nHeight - 2 * dMargin);
    const dFitScale = Math.min(dAvailableX / dWidth, dAvailableY / dHeight);
    // Large local rectangles must still fit; allow a further fourfold zoom out.
    Camera.dMinScale = Math.min(g_dMinScale, dFitScale / 4);

    const [dMinX, dMaxY] = ScreenToWorld(Camera, [0, 0]);
    const [dMaxX, dMinY] = ScreenToWorld(Camera, [Camera.nWidth, Camera.nHeight]);

    for (const [dX, dY] of rgrgdPoints) {

      rgdBounds[1] = Math.min(rgdBounds[1], dY);
      rgdBounds[2] = Math.max(rgdBounds[2], dX);
      rgdBounds[3] = Math.max(rgdBounds[3], dY);

    return BoundsOf([[dMinX, dMinY], [dMaxX, dMinY], [dMaxX, dMaxY], [dMinX, dMaxY]]

    return Object.freeze({
      szPanel,
      szName: Built.Panels[szPanel].szName,
      rgdFrameToWorld: Object.freeze([...rgdFrameToWorld]),
      rgdWorldToFrame: Object.freeze(Projection.InvertTransform(rgdFrameToWorld)),
      rgrgdFrameOutline: Built.Frames[szPanel].rgrgdPolygon,
      rgrgdOutline: Object.freeze(rgrgdOutline.map((rgdPoint) => Object.freeze(rgdPoint))),
      rgdBounds: Object.freeze(BoundsOf(rgrgdOutline)),
      rgdCenter: Object.freeze(Projection.ApplyTransform(rgdFrameToWorld, [0, 0])),

      szMode,
      szFocus,
      rgPlacements: Object.freeze(rgPlacements),
      rgdBounds: Object.freeze(UnionBounds(rgPlacements.map((Placement) => Placement.rgdBounds))),

  const g_LocalGeometry = new WeakMap();

  // A rendering-only geometry adapter. Local maps keep Doc.Topo null and use Model's
  // rectangular adjacency; no projection, partial tiles or seam graph is invented.
  function MapGeometry(Doc) {
    if (Doc.Topo) {

    const Local = Doc.Local;
    if (!g_LocalGeometry.has(Local)) {
      const { nWidth, nHeight } = Local;
      const rgTiles = Array.from({ length: nWidth * nHeight }, (_, nIndex) => {
        const nColumn = nIndex % nWidth, nRow = Math.floor(nIndex / nWidth);
        return Object.freeze({
          nIndex, szPanel: 'local', nColumn, nRow, fPartial: false, rgPieces: null,
          rgdCenter: Object.freeze(Coordinates.LocalTilePoint(Local, nColumn, nRow)),
        });
      });
      const dRadius = Lattice.HexRadius(1);
      const dShift = nWidth > 1 ? (Local.nParity ? -0.5 : 0.5) : 0;
      const rgdBounds = Object.freeze([-dRadius, -(nHeight - 1) + Math.min(0, dShift) - 0.5,

      const [dLeft, dBottom, dRight, dTop] = rgdBounds;
      const rgrgdOutline = Object.freeze([[dLeft, dBottom], [dRight, dBottom], [dRight, dTop], [dLeft, dTop]]

        szPanel: 'local', szName: 'Local map', rgdFrameToWorld: g_rgdIdentity, rgdWorldToFrame: g_rgdIdentity,
        rgrgdFrameOutline: rgrgdOutline, rgrgdOutline, rgdBounds,
        rgdCenter: Object.freeze([(dLeft + dRight) / 2, (dBottom + dTop) / 2]),

  // Every panel at its place in the net.
  function BuildNetLayout() {
    if (!g_NetLayout) {
      const Built = Projection.Build();
      g_NetLayout = MakeLayout('net', null,
        Object.keys(Built.Panels).map((szPanel) => MakePlacement(szPanel, Built.Frames[szPanel].rgdFrameToNet)));
    }
    return g_NetLayout;

  // the shared seam. Neighbours come first so the focus panel draws on top.
  function BuildFocusLayout(szFocus) {
    if (!g_FocusLayouts.has(szFocus)) {
      const Built = Projection.Build();
      Require(Built.Panels[szFocus] !== undefined, `Unknown panel: ${szFocus}`);
      const rgPlacements = [];
      for (const Seam of Built.Seams) {
        if (Seam.szPanelA === szFocus) {
          rgPlacements.push(MakePlacement(Seam.szPanelB, Seam.rgdBToA));
        } else if (Seam.szPanelB === szFocus) {
          rgPlacements.push(MakePlacement(Seam.szPanelA, Seam.rgdAToB));
        }
      }
      rgPlacements.push(MakePlacement(szFocus, g_rgdIdentity));
      g_FocusLayouts.set(szFocus, MakeLayout('focus', szFocus, rgPlacements));
    }

  function FindPlacement(Layout, szPanel) {
    return Layout.rgPlacements.find((Placement) => Placement.szPanel === szPanel) || null;
  }

  function PlacementAt(Layout, rgdWorld) {
    for (let nIndex = Layout.rgPlacements.length - 1; nIndex >= 0; nIndex--) {
      const Placement = Layout.rgPlacements[nIndex];
      if (!BoundsIntersect(Placement.rgdBounds, [rgdWorld[0], rgdWorld[1], rgdWorld[0], rgdWorld[1]])) {
        continue;
      }
      const rgdFrame = Projection.ApplyTransform(Placement.rgdWorldToFrame, rgdWorld);
      if (Util.PointInConvex(rgdFrame, Placement.rgrgdFrameOutline)) {
        return { Placement, rgdFrame };
      }

    return null;

  // Tiles drawn per panel ----------------------------------------------------------------

  const g_GroupCache = new WeakMap();

  // Groups of tiles to draw inside a panel's polygon, each with the transform from the
  // owning panel's frame to this panel's frame. Equatorial panels also draw the edge
  // columns of their strip neighbours, whose whole hexes overhang this panel slightly.
  function PanelTileGroups(Topo, szPanel) {
    let ByPanel = g_GroupCache.get(Topo);
    if (!ByPanel) {
      ByPanel = new Map();
      g_GroupCache.set(Topo, ByPanel);
    }
    if (ByPanel.has(szPanel)) {
      return ByPanel.get(szPanel);
    }
    const Info = Topo.Panels[szPanel];
    Require(Info !== undefined, `Unknown panel: ${szPanel}`);
    const rgGroups = [{
      szOwner: szPanel,
      rgdToPanel: g_rgdIdentity,
      rgnTiles: Int32Array.from({ length: Info.nTileCount }, (_, nIndex) => Info.nFirstTile + nIndex),
    }];
    if (Info.Lattice.fEquatorial) {
      const Built = Projection.Build();
      const dHalfWidth = Built.dEquatorialWidth / 2;
      const dRadius = Lattice.HexRadius(Topo.dD);
      for (const szOther of [Info.szWest, Info.szEast]) {
        const Seam = Projection.FindSeam(szOther, szPanel);
        const rgdToPanel = Seam.szPanelA === szOther ? Seam.rgdAToB : Seam.rgdBToA;
        const Other = Topo.Panels[szOther];
        const rgnTiles = [];
        for (let nTile = Other.nFirstTile; nTile < Other.nFirstTile + Other.nTileCount; nTile++) {
          const dEast = Projection.ApplyTransform(rgdToPanel, Topo.rgTiles[nTile].rgdCenter)[0];
          if (dEast + dRadius > -dHalfWidth && dEast - dRadius < dHalfWidth) {
            rgnTiles.push(nTile);
          }
        }
        rgGroups.push({ szOwner: szOther, rgdToPanel, rgnTiles: Int32Array.from(rgnTiles) });
      }
    }
    const rgFrozen = Object.freeze(rgGroups.map((Group) => Object.freeze(Group)));
    ByPanel.set(szPanel, rgFrozen);
    return rgFrozen;
  }

  // Tiles of a group that may touch rgdFrameBounds (the view box in the panel's frame).
  function VisibleTiles(Topo, Group, rgdFrameBounds) {
    const dRadius = Lattice.HexRadius(Topo.dD);
    const [dMinX, dMinY, dMaxX, dMaxY] = rgdFrameBounds;
    const fIdentity = Group.rgdToPanel === g_rgdIdentity;
    const rgnVisible = [];
    for (const nTile of Group.rgnTiles) {
      const rgdCenter = fIdentity ? Topo.rgTiles[nTile].rgdCenter : Projection.ApplyTransform(Group.rgdToPanel, Topo.rgTiles[nTile].rgdCenter);
      if (rgdCenter[0] + dRadius >= dMinX && rgdCenter[0] - dRadius <= dMaxX
        && rgdCenter[1] + dRadius >= dMinY && rgdCenter[1] - dRadius <= dMaxY) {
        rgnVisible.push(nTile);
      }
    }
    return rgnVisible;
  }

  // The tile that owns a world point, or null. Returns { nTile, szPanel, rgdFrame } with
  // szPanel the tile's own panel and rgdFrame the point in that panel's frame. The point
  // can lie inside a neighbouring panel's outline: on the east/west seams between
  // equatorial panels, edge hexes belong wholly to their own panel, so the tip of a hex
  // that pokes across the seam still belongs to that hex (prompt.md, "Map projection").
  // Partial tiles on the other seams are clipped to their panel, so there the panel
  // containing the point owns it. szDrawPanel is the panel whose outline contains the point.
  function HitTest(Topo, Layout, rgdWorld) {
    const Hit = PlacementAt(Layout, rgdWorld);
    if (Hit === null) {
      return null;
    }
    const szDrawPanel = Hit.Placement.szPanel;
    if (Topo.Local) {
      const rgnXY = Coordinates.LocalPointToTile(Topo.Local, Hit.rgdFrame);
      return rgnXY ? { nTile: rgnXY[1] * Topo.Local.nWidth + rgnXY[0], szPanel: 'local', rgdFrame: Hit.rgdFrame, szDrawPanel } : null;
    }
    const [nQ, nJ] = Topology.LatticeNearest(Topo.Panels[szDrawPanel].Lattice, Hit.rgdFrame[0], Hit.rgdFrame[1]);
    const nTile = Topology.LocateLattice(Topo, szDrawPanel, nQ, nJ);
    if (nTile < 0) {
      return null;
    }
    const szPanel = Topo.rgTiles[nTile].szPanel;
    let rgdFrame = Hit.rgdFrame;
    if (szPanel !== szDrawPanel) {
      const Seam = Projection.FindSeam(szDrawPanel, szPanel);
      rgdFrame = Projection.ApplyTransform(Seam.szPanelA === szDrawPanel ? Seam.rgdAToB : Seam.rgdBToA, rgdFrame);
    }
    return { nTile, szPanel, rgdFrame, szDrawPanel };
  }

  // Feature geometry is computed in panel frames, never by joining net positions.
  function PanelTransform(szFrom, szTo) {
    if (szFrom === szTo) {
      return g_rgdIdentity;
    }
    const Seam = Projection.FindSeam(szFrom, szTo);
    Require(Seam !== null && Seam !== undefined, `Panels ${szFrom} and ${szTo} do not share an edge`);
    return Seam.szPanelA === szFrom ? Seam.rgdAToB : Seam.rgdBToA;
  }

  function PanelCopies(szPanel) {
    const rgCopies = [{ szPanel, rgdTransform: g_rgdIdentity }];
    for (const Seam of Projection.Build().Seams) {
      if (Seam.szPanelA === szPanel) {
        rgCopies.push({ szPanel: Seam.szPanelB, rgdTransform: Seam.rgdAToB });
      } else if (Seam.szPanelB === szPanel) {
        rgCopies.push({ szPanel: Seam.szPanelA, rgdTransform: Seam.rgdBToA });
      }
    }
    return rgCopies;
  }

  // A partial tile's lattice centre can lie outside its panel. Keep its glyph/path
  // anchor inside the largest visible piece; the saved tile coordinate is unchanged.
  function FeatureAnchor(Topo, nTile) {
    const Tile = Topo.rgTiles[nTile];
    if (!Tile.rgPieces) {
      return Tile.rgdCenter;
    }
    const Piece = Tile.rgPieces.reduce((Best, Next) =>
      Math.abs(Util.PolygonArea(Next.rgrgdPolygon)) > Math.abs(Util.PolygonArea(Best.rgrgdPolygon)) ? Next : Best);
    return Util.Center(Piece.rgrgdPolygon);
  }

  function FeatureCopies(Topo, Layout, nTile) {
    return PanelCopies(Topo.rgTiles[nTile].szPanel).flatMap((Copy) => {
      const Placement = FindPlacement(Layout, Copy.szPanel);
      return Placement ? [{
        Placement,
        rgdFrameToWorld: Projection.ComposeTransforms(Copy.rgdTransform, Placement.rgdFrameToWorld),
      }] : [];
    });
  }

  const g_OverlayCurves = new WeakMap();

  // Catmull-Rom tangents yield cubic curves through the tile anchors. At a seam both
  // panels get the SAME curve, transformed and clipped when drawn, including cut edges.
  function OverlayCurves(Topo, Overlay) {
    const Cached = g_OverlayCurves.get(Overlay);
    if (Cached && Cached.Topo === Topo) {
      return Cached.rgCurves;
    }
    const rgnTiles = Overlay.rgnTiles;
    const rgCurves = [];
    const PointIn = (nTile, szPanel) => Projection.ApplyTransform(PanelTransform(Topo.rgTiles[nTile].szPanel, szPanel), FeatureAnchor(Topo, nTile));
    for (let nIndex = 0; nIndex + 1 < rgnTiles.length; nIndex++) {
      const nA = rgnTiles[nIndex];
      const nB = rgnTiles[nIndex + 1];
      const szA = Topo.rgTiles[nA].szPanel;
      const szB = Topo.rgTiles[nB].szPanel;
      const rgdA = FeatureAnchor(Topo, nA);
      const rgdB = PointIn(nB, szA);
      const rgdPrev = PointIn(rgnTiles[Math.max(0, nIndex - 1)], szA);
      const rgdNextInB = PointIn(rgnTiles[Math.min(rgnTiles.length - 1, nIndex + 2)], szB);
      const rgdControlB = Util.Subtract(FeatureAnchor(Topo, nB), Util.Scale(Util.Subtract(rgdNextInB, PointIn(nA, szB)), 1 / 6));
      const rgrgdControl = [
        rgdA,
        Util.Add(rgdA, Util.Scale(Util.Subtract(rgdB, rgdPrev), 1 / 6)),
        Projection.ApplyTransform(PanelTransform(szB, szA), rgdControlB),
        rgdB,
      ];
      for (const Copy of PanelCopies(szA)) {
        const rgrgdMapped = rgrgdControl.map((rgdPoint) => Projection.ApplyTransform(Copy.rgdTransform, rgdPoint));
        if (BoundsIntersect(BoundsOf(rgrgdMapped), BoundsOf(FrameOutline(Topo, Copy.szPanel)))) {
          rgCurves.push({ szPanel: Copy.szPanel, nPoint: nIndex, rgrgdControl: rgrgdMapped });
        }
      }
    }
    g_OverlayCurves.set(Overlay, { Topo, rgCurves });
    return rgCurves;
  }

  function CubicPoint(rgrgdControl, dT) {
    const dU = 1 - dT;
    return [0, 1].map((nAxis) => dU ** 3 * rgrgdControl[0][nAxis]
      + 3 * dU * dU * dT * rgrgdControl[1][nAxis]
      + 3 * dU * dT * dT * rgrgdControl[2][nAxis] + dT ** 3 * rgrgdControl[3][nAxis]);
  }

  function DistanceToSegment(rgdPoint, rgdA, rgdB) {
    const rgdDelta = Util.Subtract(rgdB, rgdA);
    const dSquared = Util.Dot(rgdDelta, rgdDelta);
    const dT = dSquared === 0 ? 0 : Math.max(0, Math.min(1, Util.Dot(Util.Subtract(rgdPoint, rgdA), rgdDelta) / dSquared));
    return Util.Distance(rgdPoint, Util.Add(rgdA, Util.Scale(rgdDelta, dT)));
  }

  function FlattenCurve(rgrgdControl, dTolerance = 0.5) {
    const rgPoints = [rgrgdControl[0]];
    const Subdivide = (rg, nDepth) => {
      if (nDepth === 16 || Math.max(DistanceToSegment(rg[1], rg[0], rg[3]), DistanceToSegment(rg[2], rg[0], rg[3])) <= dTolerance) {
        rgPoints.push(rg[3]);
        return;
      }
      const Mid = (A, B) => Util.Scale(Util.Add(A, B), 0.5);
      const A = Mid(rg[0], rg[1]), B = Mid(rg[1], rg[2]), C = Mid(rg[2], rg[3]);
      const D = Mid(A, B), E = Mid(B, C), F = Mid(D, E);
      Subdivide([rg[0], A, D, F], nDepth + 1);
      Subdivide([F, E, C, rg[3]], nDepth + 1);
    };
    Subdivide(rgrgdControl, 0);
    return rgPoints;
  }

  const g_dLabelUnitsPerHex = 48;

  // Label size/offset units are 1/48 hex. Local x is right, y is down, and rotation
  // is clockwise relative to panel north. Compose this with a panel-to-screen matrix.
  function LabelTransform(Topo, Label) {
    const [dX, dY] = FeatureAnchor(Topo, Label.nTile);
    const dUnit = Topo.dD / g_dLabelUnitsPerHex;
    const dAngle = Label.dRotation * Math.PI / 180;
    const dCos = Math.cos(dAngle) * dUnit;
    const dSin = Math.sin(dAngle) * dUnit;
    return [dCos, -dSin, -dSin, -dCos, dX + Label.dDx * dUnit, dY - Label.dDy * dUnit];
  }

  // Demo terrain -------------------------------------------------------------------------

  function CreateWaves(Random, nCount) {
    const rgWaves = [];
    for (let nIndex = 0; nIndex < nCount; nIndex++) {
      const dZ = 2 * Random() - 1;
      const dAngle = 2 * Math.PI * Random();
      const dRing = Math.sqrt(1 - dZ * dZ);
      const dFrequency = 1 + 5 * Random();
      rgWaves.push({ rgdDirection: [dRing * Math.cos(dAngle), dRing * Math.sin(dAngle), dZ], dFrequency, dPhase: 2 * Math.PI * Random(), dAmplitude: 1 / dFrequency });
    }
    const dTotal = rgWaves.reduce((dSum, Wave) => dSum + Wave.dAmplitude, 0);
    rgWaves.forEach((Wave) => { Wave.dAmplitude /= dTotal; });
    return rgWaves;
  }

  function SampleWaves(rgWaves, rgdPoint) {
    return rgWaves.reduce((dSum, Wave) => dSum + Wave.dAmplitude * Math.sin(Wave.dFrequency * Util.Dot(Wave.rgdDirection, rgdPoint) + Wave.dPhase), 0);
  }

  // A deterministic sample world (terrain ids per tile) so the renderer has something to
  // show before the terrain tools exist. Uses only Util.CreateRng / Util.HashIntegers.
  function DemoTerrain(Topo, nSeed = 1) {
    const Built = Projection.Build();
    const Random = Util.CreateRng(nSeed);
    const rgElevationWaves = CreateWaves(Random, 14);
    const rgMoistureWaves = CreateWaves(Random, 8);
    const rgdNorth = Util.Unit(Projection.g_North);
    const Id = (szKey) => Terrain.ByKey(szKey).nId;
    const rgnTerrain = new Uint8Array(Topo.nTiles);
    for (const Tile of Topo.rgTiles) {
      const rgdPoint = Util.Unit(Projection.FrameToSolid(Built.Frames[Tile.szPanel], Tile.rgdCenter));
      const dElevation = SampleWaves(rgElevationWaves, rgdPoint) * 2.2 - 0.05;
      const dMoisture = SampleWaves(rgMoistureWaves, rgdPoint) * 2.5;
      const dLatitude = Math.abs(Math.asin(Math.max(-1, Math.min(1, Util.Dot(rgdPoint, rgdNorth))))) * 180 / Math.PI;
      const dRoll = Util.HashIntegers(nSeed, Tile.nIndex) / 4294967296;
      let szKey = 'plain';
      if (dElevation < -0.02) {
        szKey = dElevation > -0.06 && dRoll < 0.08 ? 'islands' : 'water';
      } else if (dLatitude > 66) {
        szKey = dElevation > 0.4 ? 'mountains' : 'tundra';
      } else if (dElevation > 0.62) {
        szKey = 'mountainPeak';
      } else if (dElevation > 0.45) {
        szKey = 'mountains';
      } else if (dElevation > 0.3) {
        szKey = dMoisture < -0.45 ? 'badlands' : (dMoisture < -0.2 && dRoll < 0.35 ? 'canyon' : 'hills');
      } else if (dElevation < 0.04 && dMoisture > 0.35) {
        szKey = dLatitude < 25 ? 'mangrove' : 'marsh';
      } else if (dMoisture > 0.55 && dRoll < 0.15) {
        szKey = 'lakes';
      } else if (dMoisture > 0.15) {
        szKey = 'forest';
      } else if (dLatitude < 35 && dMoisture < -0.3) {
        szKey = dMoisture < -0.55 ? 'sandDunes' : 'desert';
      } else if (dRoll < 0.12) {
        szKey = 'farmland';
      }
      rgnTerrain[Tile.nIndex] = Id(szKey);
    }
    // Inlets: open water mostly enclosed by land becomes firth.
    const nWater = Id('water');
    const rgnResult = rgnTerrain.slice();
    for (let nTile = 0; nTile < Topo.nTiles; nTile++) {
      if (rgnTerrain[nTile] === nWater) {
        const rgnNeighbors = Topology.Neighbors(Topo, nTile);
        const nLand = rgnNeighbors.filter((nOther) => !Terrain.IsWater(rgnTerrain[nOther])).length;
        if (nLand >= 4) {
          rgnResult[nTile] = Id('firth');
        }
      }
    }
    return rgnResult;
  }

  RpgMap.View = Object.freeze({
    g_dMinScale,
    g_dMaxScale,
    g_rgdIdentity,
    CreateCamera,
    ResizeCamera,
    ClampScale,
    WorldToScreenTransform,
    WorldToScreen,
    ScreenToWorld,
    Pan,
    ZoomAt,
    CenterOn,
    FitBounds,
    VisibleBounds,
    BoundsOf,
    BoundsIntersect,
    UnionBounds,
    TransformBounds,
    BuildNetLayout,
    BuildFocusLayout,
    MapGeometry,
    MapLayout,
    FrameOutline,
    FindPlacement,
    PlacementAt,
    PanelTileGroups,
    VisibleTiles,
    HitTest,
    PanelTransform,
    FeatureAnchor,
    FeatureCopies,
    OverlayCurves,
    CubicPoint,
    DistanceToSegment,
    FlattenCurve,
    g_dLabelUnitsPerHex,
    LabelTransform,
    DemoTerrain,
  });
})(globalThis);
</script>

<script data-module="Edit">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Terrain, Model, History, View } = RpgMap;
  const { Require } = Util;

  // DOM-free terrain editing: brush footprints, flood fill, stroke interpolation, and
  // commands grouped in History. Tile sets are found by walking tile adjacency, so they
  // cross panel seams in every view.
  const g_nMaxBrushRadius = 5;
  // Stroke samples per hex height when interpolating between pointer positions.
  const g_nSamplesPerHex = 4;

  function NeighborsOf(Doc, nTile) {
    return Doc.Topo ? Topology.Neighbors(Doc.Topo, nTile) : Model.Neighbors(Doc, nTile);
  }

  function CheckRadius(nRadius) {
    Require(Number.isInteger(nRadius) && nRadius >= 0 && nRadius <= g_nMaxBrushRadius,
      `Brush radius must be an integer 0-${g_nMaxBrushRadius}`);
  }

  // Tiles within nRadius steps of nCenter, nearest first.
  function BrushTiles(Doc, nCenter, nRadius) {
    Require(Model.IsTile(Doc, nCenter), `Unknown tile: ${nCenter}`);
    CheckRadius(nRadius);
    const Seen = new Set([nCenter]);
    let rgnRing = [nCenter];
    const rgnResult = [nCenter];
    for (let nStep = 0; nStep < nRadius; nStep++) {
      const rgnNext = [];
      for (const nTile of rgnRing) {
        for (const nOther of NeighborsOf(Doc, nTile)) {
          if (!Seen.has(nOther)) {
            Seen.add(nOther);
            rgnNext.push(nOther);
            rgnResult.push(nOther);
          }
        }
      }
      rgnRing = rgnNext;
    }
    return rgnResult;
  }

  // The connected region of tiles sharing nStart's terrain, in breadth-first order.
  function FloodRegion(Doc, nStart) {
    Require(Model.IsTile(Doc, nStart), `Unknown tile: ${nStart}`);
    const rgnTerrain = Doc.rgnTerrain;
    const nId = rgnTerrain[nStart];
    const rgfSeen = new Uint8Array(Doc.nTiles);
    rgfSeen[nStart] = 1;
    const rgnResult = [nStart];
    for (let nHead = 0; nHead < rgnResult.length; nHead++) {
      for (const nOther of NeighborsOf(Doc, rgnResult[nHead])) {
        if (!rgfSeen[nOther] && rgnTerrain[nOther] === nId) {
          rgfSeen[nOther] = 1;
          rgnResult.push(nOther);
        }
      }
    }
    return rgnResult;
  }

  // Tiles under the world-space segment from rgdFrom to rgdTo in Layout, in order, without
  // consecutive repeats. Sampled densely enough that no crossed tile is skipped in practice.
  function SegmentTiles(Topo, Layout, rgdFrom, rgdTo) {
    const dLength = Math.hypot(rgdTo[0] - rgdFrom[0], rgdTo[1] - rgdFrom[1]);
    const nSteps = Math.max(1, Math.ceil(dLength * g_nSamplesPerHex / Topo.dD));
    const rgnResult = [];
    for (let nStep = 0; nStep <= nSteps; nStep++) {
      const dT = nStep / nSteps;
      const Hit = View.HitTest(Topo, Layout, [rgdFrom[0] + dT * (rgdTo[0] - rgdFrom[0]), rgdFrom[1] + dT * (rgdTo[1] - rgdFrom[1])]);
      if (Hit && rgnResult[rgnResult.length - 1] !== Hit.nTile) {
        rgnResult.push(Hit.nTile);
      }
    }
    return rgnResult;
  }

  // Sets the terrain of each tile; returns the tiles that changed. fnRecord receives
  // each change record (for History.Record).
  function PaintTiles(Doc, rgnTiles, nTerrainId, fnRecord) {
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    const rgnChanged = [];
    for (const nTile of rgnTiles) {
      const Change = Model.SetTerrain(Doc, nTile, nTerrainId);
      if (Change) {
        fnRecord(Change);
        rgnChanged.push(nTile);
      }
    }
    return rgnChanged;
  }

  // A brush stroke is one History command, opened here and closed by EndStroke.
  function BeginStroke(HistoryState, nTerrainId, nRadius) {
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    CheckRadius(nRadius);
    History.Begin(HistoryState, `Paint ${Terrain.ById(nTerrainId).szName}`);
    return { History: HistoryState, nTerrainId, nRadius, rgdLast: null, nLastTile: -1, Centers: new Set(), nChanged: 0 };
  }

  // Paints along the segment from the previous point (or just at rgdWorld for the first
  // point). Returns the tiles that changed.
  function StrokeTo(Stroke, Layout, rgdWorld) {
    const Doc = Stroke.History.Doc;
    const Geometry = View.MapGeometry(Doc);
    const rgnCenters = SegmentTiles(Geometry, Layout, Stroke.rgdLast || rgdWorld, rgdWorld);
    Stroke.rgdLast = [rgdWorld[0], rgdWorld[1]];
    const fnRecord = (Change) => History.Record(Stroke.History, Change);
    const rgnChanged = [];
    for (const nCenter of rgnCenters) {
      if (Stroke.Centers.has(nCenter)) {
        continue;
      }
      Stroke.Centers.add(nCenter);
      rgnChanged.push(...PaintTiles(Doc, BrushTiles(Doc, nCenter, Stroke.nRadius), Stroke.nTerrainId, fnRecord));
    }
    Stroke.nChanged += rgnChanged.length;
    return rgnChanged;
  }

  // Closes the stroke's command; returns it, or null if nothing changed.
  function EndStroke(Stroke) {
    return History.Commit(Stroke.History);
  }

  // Replaces the connected region under nStart with nTerrainId as one command.
  // Returns { Command, rgnTiles } (Command null when nothing changed).
  function Fill(HistoryState, nStart, nTerrainId) {
    const Doc = HistoryState.Doc;
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    if (Model.GetTerrain(Doc, nStart) === nTerrainId) {
      return { Command: null, rgnTiles: [] };
    }
    const rgnRegion = FloodRegion(Doc, nStart);
    let rgnTiles = [];
    const Command = History.Perform(HistoryState, `Fill ${Terrain.ById(nTerrainId).szName}`, (_, fnRecord) => {
      rgnTiles = PaintTiles(Doc, rgnRegion, nTerrainId, fnRecord);
    });
    return { Command, rgnTiles };
  }

  // The tiles whose terrain a command changes.
  function CommandTiles(Command) {
    return Command ? Command.rgChanges.filter((Change) => Change.szLayer === 'terrain').map((Change) => Change.Key) : [];
  }

  const g_PathGeometry = new WeakMap();

  // Chord distance / longest graph edge is an admissible, consistent lower bound,
  // including partial tiles and seams where a planar hex-distance heuristic is not.
  function PathGeometry(Topo) {
    if (!g_PathGeometry.has(Topo)) {
      const Built = Projection.Build();
      const rgrgdPoints = Topo.rgTiles.map((Tile) => Projection.FrameToSolid(Built.Frames[Tile.szPanel], Tile.rgdCenter));
      let dMaxStep = 0;
      for (let nTile = 0; nTile < Topo.nTiles; nTile++) {
        for (const nOther of Topology.Neighbors(Topo, nTile)) {
          dMaxStep = Math.max(dMaxStep, Util.Distance(rgrgdPoints[nTile], rgrgdPoints[nOther]));
        }
      }
      g_PathGeometry.set(Topo, { rgrgdPoints, dMaxStep: dMaxStep * (1 + 1e-12) });
    }
    return g_PathGeometry.get(Topo);
  }

  // Deterministic A*, unit cost per adjacency edge. Excluded tiles are used when
  // removing an interior overlay point so the replacement cannot reinsert it.
  function FindPath(Doc, nFrom, nTo, Excluded = new Set()) {
    Require(Model.IsTile(Doc, nFrom) && Model.IsTile(Doc, nTo), 'Path endpoints must be map tiles');
    Require(!Excluded.has(nFrom) && !Excluded.has(nTo), 'A path endpoint is excluded');
    const Geometry = Doc.Topo ? PathGeometry(Doc.Topo) : null;
    const Heuristic = (nTile) => {
      if (Geometry) {
        return Geometry.dMaxStep > 0
          ? Util.Distance(Geometry.rgrgdPoints[nTile], Geometry.rgrgdPoints[nTo]) / Geometry.dMaxStep : 0;
      }
      const [nX, nY] = Model.LocalTileXY(Doc, nTile);
      const [nTX, nTY] = Model.LocalTileXY(Doc, nTo);
      return Lattice.OffsetDistance(nX + Doc.Local.nParity, -nY, nTX + Doc.Local.nParity, -nTY);
    };
    const rgnCost = new Int32Array(Doc.nTiles).fill(-1);
    const rgnPrevious = new Int32Array(Doc.nTiles).fill(-1);
    const rgHeap = [];
    const Before = (A, B) => A.dScore < B.dScore || (A.dScore === B.dScore && A.nTile < B.nTile);
    const Push = (Entry) => {
      let nIndex = rgHeap.length;
      rgHeap.push(Entry);
      while (nIndex > 0) {
        const nParent = (nIndex - 1) >> 1;
        if (!Before(Entry, rgHeap[nParent])) {
          break;
        }
        rgHeap[nIndex] = rgHeap[nParent];
        nIndex = nParent;
      }
      rgHeap[nIndex] = Entry;
    };
    const Pop = () => {
      const First = rgHeap[0];
      const Last = rgHeap.pop();
      if (rgHeap.length > 0) {
        let nIndex = 0;
        while (2 * nIndex + 1 < rgHeap.length) {
          let nChild = 2 * nIndex + 1;
          if (nChild + 1 < rgHeap.length && Before(rgHeap[nChild + 1], rgHeap[nChild])) {
            nChild++;
          }
          if (!Before(rgHeap[nChild], Last)) {
            break;
          }
          rgHeap[nIndex] = rgHeap[nChild];
          nIndex = nChild;
        }
        rgHeap[nIndex] = Last;
      }
      return First;
    };
    rgnCost[nFrom] = 0;
    Push({ nTile: nFrom, nCost: 0, dScore: Heuristic(nFrom) });
    while (rgHeap.length > 0) {
      const { nTile, nCost } = Pop();
      if (rgnCost[nTile] !== nCost) {
        continue;
      }
      if (nTile === nTo) {
        const rgnPath = [];
        for (let nStep = nTo; nStep >= 0; nStep = rgnPrevious[nStep]) {
          rgnPath.push(nStep);
        }
        return rgnPath.reverse();
      }
      for (const nOther of NeighborsOf(Doc, nTile)) {
        if (!Excluded.has(nOther) && (rgnCost[nOther] < 0 || nCost + 1 < rgnCost[nOther])) {
          rgnCost[nOther] = nCost + 1;
          rgnPrevious[nOther] = nTile;
          Push({ nTile: nOther, nCost: nCost + 1, dScore: nCost + 1 + Heuristic(nOther) });
        }
      }
    }
    throw new Error(`No path connects tiles ${nFrom} and ${nTo}`);
  }

  function GetFeature(Doc, Selection) {
    if (!Selection) {
      return null;
    }
    const { szLayer, Key } = Selection;
    if (szLayer === 'landmark') {
      return Model.IsTile(Doc, Key) ? Model.GetLandmark(Doc, Key) : null;
    }
    return szLayer === 'overlay' ? Model.GetOverlay(Doc, Key) : Model.GetLabel(Doc, Key);
  }

  // Key null creates an overlay/label; landmarks always use a tile key. Props null
  // deletes. Each committed property change is one command, with no-op edits skipped.
  function SetFeature(Hist, szLayer, Key, Props) {
    Require(['overlay', 'landmark', 'label'].includes(szLayer), `Unknown feature layer: ${szLayer}`);
    const Before = GetFeature(Hist.Doc, { szLayer, Key });
    if (Before && Props && Object.keys(Props).every((szKey) => {
      const Value = Props[szKey];
      return Array.isArray(Value) ? Value.length === Before[szKey].length && Value.every((Item, nIndex) => Item === Before[szKey][nIndex])
        : Value === Before[szKey];
    })) {
      return null;
    }
    return History.Perform(Hist, `${Props === null ? 'Delete' : Before ? 'Edit' : 'Add'} ${szLayer}`, (Doc, Record) => {
      if (szLayer === 'landmark') {
        Record(Model.SetLandmark(Doc, Key, Props === null ? null : { ...Before, ...Props }));
      } else if (szLayer === 'overlay') {
        Record(Props === null ? Model.RemoveOverlay(Doc, Key)
          : Key === null ? Model.AddOverlay(Doc, Props) : Model.UpdateOverlay(Doc, Key, Props));
      } else {
        Record(Props === null ? Model.RemoveLabel(Doc, Key)
          : Key === null ? Model.AddLabel(Doc, Props) : Model.UpdateLabel(Doc, Key, Props));
      }
    });
  }

  function OverlayPoint(Doc, szId, nPoint) {
    const Overlay = Model.GetOverlay(Doc, szId);
    Require(Overlay !== null, `Unknown overlay: ${szId}`);
    Require(Number.isInteger(nPoint) && nPoint >= 0 && nPoint < Overlay.rgnTiles.length, 'Select an overlay point');
    return Overlay;
  }

  function ExtendOverlay(Hist, szId, nTile) {
    const Overlay = Model.GetOverlay(Hist.Doc, szId);
    Require(Overlay !== null, `Unknown overlay: ${szId}`);
    const rgnPath = FindPath(Hist.Doc, Overlay.rgnTiles.at(-1), nTile);
    return SetFeature(Hist, 'overlay', szId, { rgnTiles: [...Overlay.rgnTiles, ...rgnPath.slice(1)] });
  }

  function InsertOverlayPoint(Hist, szId, nPoint, nTile) {
    const { rgnTiles } = OverlayPoint(Hist.Doc, szId, nPoint);
    const rgnPath = [...rgnTiles.slice(0, nPoint), ...FindPath(Hist.Doc, rgnTiles[nPoint], nTile)];
    if (nPoint + 1 < rgnTiles.length) {
      rgnPath.push(...FindPath(Hist.Doc, nTile, rgnTiles[nPoint + 1]).slice(1), ...rgnTiles.slice(nPoint + 2));
    }
    return SetFeature(Hist, 'overlay', szId, { rgnTiles: rgnPath });
  }

  function RemoveOverlayPoint(Hist, szId, nPoint) {
    const { rgnTiles } = OverlayPoint(Hist.Doc, szId, nPoint);
    if (rgnTiles.length === 1) {
      return SetFeature(Hist, 'overlay', szId, null);
    }
    const rgnPath = rgnTiles.slice(0, nPoint);
    if (nPoint > 0 && nPoint + 1 < rgnTiles.length) {
      rgnPath.push(...FindPath(Hist.Doc, rgnTiles[nPoint - 1], rgnTiles[nPoint + 1], new Set([rgnTiles[nPoint]])).slice(1));
      rgnPath.push(...rgnTiles.slice(nPoint + 2));
    } else {
      rgnPath.push(...rgnTiles.slice(nPoint + 1));
    }
    return SetFeature(Hist, 'overlay', szId, { rgnTiles: rgnPath });
  }

  function SplitOverlay(Hist, szId, nPoint) {
    const Overlay = OverlayPoint(Hist.Doc, szId, nPoint);
    Require(nPoint > 0 && nPoint < Overlay.rgnTiles.length - 1, 'Split needs an interior point');
    return History.Perform(Hist, 'Split overlay', (Doc, Record) => {
      Record(Model.UpdateOverlay(Doc, szId, { rgnTiles: Overlay.rgnTiles.slice(0, nPoint + 1) }));
      Record(Model.AddOverlay(Doc, { ...Overlay, szId: undefined, rgnTiles: Overlay.rgnTiles.slice(nPoint) }));
    });
  }

  // Orient the first path toward its chosen endpoint and the second away from its
  // endpoint. Keep the first path's id and properties; bridge any gap with A*.
  function JoinOverlays(Hist, szFirst, szSecond, fReverseFirst = false, fReverseSecond = false) {
    const First = Model.GetOverlay(Hist.Doc, szFirst);
    const Second = Model.GetOverlay(Hist.Doc, szSecond);
    Require(First && Second && First !== Second, 'Choose two different overlays');
    Require(First.szType === Second.szType, 'Joined overlays must have the same type');
    const rgnFirst = fReverseFirst ? [...First.rgnTiles].reverse() : First.rgnTiles;
    const rgnSecond = fReverseSecond ? [...Second.rgnTiles].reverse() : Second.rgnTiles;
    const rgnBridge = FindPath(Hist.Doc, rgnFirst.at(-1), rgnSecond[0]);
    return History.Perform(Hist, 'Join overlays', (Doc, Record) => {
      Record(Model.UpdateOverlay(Doc, szFirst, { rgnTiles: [...rgnFirst, ...rgnBridge.slice(1), ...rgnSecond.slice(1)] }));
      Record(Model.RemoveOverlay(Doc, szSecond));
    });
  }

  RpgMap.Edit = Object.freeze({
    g_nMaxBrushRadius,
    BrushTiles,
    FloodRegion,
    SegmentTiles,
    PaintTiles,
    BeginStroke,
    StrokeTo,
    EndStroke,
    Fill,
    CommandTiles,
    FindPath,
    GetFeature,
    SetFeature,
    ExtendOverlay,
    InsertOverlayPoint,
    RemoveOverlayPoint,
    SplitOverlay,
    JoinOverlays,
  });
})(globalThis);
</script>

<script data-module="FileFormat">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Coordinates, Terrain, Model } = RpgMap;

  // The human-readable ASCII map file (doc/file-format.md). Write is deterministic, so
  // saved files diff cleanly; Parse reports every problem with its 1-based line number.
  const g_szMagic = '# RPGMAP 1';
  const g_szFileExtension = '.map.txt';
  const g_szReserved = Terrain.g_szReservedChar;
  // Characters that may never stand for a terrain.
  const g_szForbiddenTerrainChars = ' #[]"\\' + g_szReserved;

  // A parse error carrying the line it was found on (0 when not tied to a line).
  function FileError(nLine, szMessage) {
    const Error_ = new Error(nLine > 0 ? `Line ${nLine}: ${szMessage}` : szMessage);
    Error_.nLine = nLine;
    Error_.szReason = szMessage;
    return Error_;
  }

  function Check(fCondition, nLine, szMessage) {
    if (!fCondition) {
      throw FileError(nLine, szMessage);
    }
  }

  // Runs fn, re-throwing plain errors (for example Model validation) with the line.
  function AtLine(nLine, fn) {
    try {
      return fn();
    } catch (Caught) {
      if (Caught.nLine !== undefined) {
        throw Caught;
      }
      throw FileError(nLine, Caught.message);
    }
  }

  // Panels in Greek-alphabet order (Alpha … Sigma).
  function GreekPanelOrder() {
    const Panels = Projection.Build().Panels;
    return Object.keys(Panels).sort((szA, szB) => Panels[szA].szLetter.localeCompare(Panels[szB].szLetter));
  }

  // Strings ----------------------------------------------------------------------

  // Double-quoted; backslash and quote are escaped, and anything outside printable
  // ASCII becomes \uXXXX, so the file stays printable ASCII.
  function Quote(szText) {
    let szResult = '"';
    for (const szChar of szText) {
      for (let nIndex = 0; nIndex < szChar.length; nIndex++) {
        const nCode = szChar.charCodeAt(nIndex);
        const szUnit = szChar[nIndex];
        if (szUnit === '\\' || szUnit === '"') {
          szResult += '\\' + szUnit;
        } else if (nCode < 0x20 || nCode > 0x7e) {
          szResult += '\\u' + nCode.toString(16).padStart(4, '0');
        } else {
          szResult += szUnit;
        }
      }
    }
    return szResult + '"';
  }

  // Reads a quoted string starting at szLine[nStart] === '"'. Returns [text, next index].
  function ReadQuoted(szLine, nStart, nLine) {
    let szText = '';
    let nIndex = nStart + 1;
    while (nIndex < szLine.length) {
      const szChar = szLine[nIndex];
      if (szChar === '"') {
        return [szText, nIndex + 1];
      }
      if (szChar === '\\') {
        const szNext = szLine[nIndex + 1];
        if (szNext === '\\' || szNext === '"') {
          szText += szNext;
          nIndex += 2;
          continue;
        }
        const szHex = szLine.slice(nIndex + 2, nIndex + 6);
        Check(szNext === 'u' && /^[0-9A-Fa-f]{4}$/.test(szHex), nLine, `Invalid escape in quoted text at column ${nIndex + 1}`);
        szText += String.fromCharCode(parseInt(szHex, 16));
        nIndex += 6;
        continue;
      }
      szText += szChar;
      nIndex++;
    }
    throw FileError(nLine, 'Unterminated quoted text');
  }

  // Tokens: { szKind: 'word'|'string'|'pair'|'punct', szValue, szKey? }. A pair is
  // key=value or key="quoted value"; ';' and ':' are punctuation.
  function Tokenize(szLine, nLine) {
    const rgTokens = [];
    let nIndex = 0;
    while (nIndex < szLine.length) {
      const szChar = szLine[nIndex];
      if (szChar === ' ' || szChar === '\t') {
        nIndex++;
      } else if (szChar === '"') {
        const [szText, nNext] = ReadQuoted(szLine, nIndex, nLine);
        rgTokens.push({ szKind: 'string', szValue: szText });
        nIndex = nNext;
      } else if (szChar === ';' || szChar === ':') {
        rgTokens.push({ szKind: 'punct', szValue: szChar });
        nIndex++;
      } else {
        let nEnd = nIndex;
        while (nEnd < szLine.length && !' \t";:'.includes(szLine[nEnd])) {
          nEnd++;
        }
        const szWord = szLine.slice(nIndex, nEnd);
        const nEquals = szWord.indexOf('=');
        if (nEquals > 0) {
          const szKey = szWord.slice(0, nEquals);
          let szValue = szWord.slice(nEquals + 1);
          if (szValue === '' && szLine[nEnd] === '"') {
            [szValue, nEnd] = ReadQuoted(szLine, nEnd, nLine);
          }
          rgTokens.push({ szKind: 'pair', szKey, szValue });
        } else {
          rgTokens.push({ szKind: 'word', szValue: szWord });
        }
        nIndex = nEnd;
      }
    }
    return rgTokens;
  }

  // Locations --------------------------------------------------------------------

  // Decimals that keep a written coordinate within 1/20 hex of the tile centre
  // (0.1 mi for every regional scale; more for yard-scale local maps).
  function CoordinateDecimals(dHexMiles) {
    return Math.max(1, Math.ceil(-Math.log10(dHexMiles / 10)));
  }

  function HexMiles(Doc) {
    return Model.HexMiles(Doc);
  }

  function TileLocation(Doc, nTile) {
    return Model.TileToUniversal(Doc, nTile);
  }

  function LocationTile(Doc, Location) {
    if (Doc.Topo) {
      return Coordinates.UniversalToTile(Doc.Topo, Location);
    }
    const rgnXY = Coordinates.UniversalToLocalTile(Doc.Local, Location);
    return rgnXY ? Model.LocalTileIndex(Doc, rgnXY[0], rgnXY[1]) : -1;
  }

  // "Eta 187.1W 324.0N", or "187.1W 324.0N" when the panel is szOmitPanel.
  function FormatLocation(Doc, nTile, szOmitPanel = null) {
    const Location = TileLocation(Doc, nTile);
    const szText = Coordinates.FormatUniversal(Location, CoordinateDecimals(HexMiles(Doc)));
    return Location.szPanel === szOmitPanel ? szText.slice(szText.indexOf(' ') + 1) : szText;
  }

  // Reads a location from word tokens; szPanel supplies the panel when only the two
  // distances are given. Returns the tile index.
  function ParseLocation(Doc, rgszWords, nLine, szPanel = null) {
    let szText = rgszWords.join(' ');
    if (rgszWords.length === 2 && szPanel !== null) {
      szText = `${Projection.Build().Panels[szPanel].szName} ${szText}`;
    }
    Check(rgszWords.length === 3 || (rgszWords.length === 2 && szPanel !== null), nLine,
      `Expected a location like "Alpha 93.5E 108.0N", found "${rgszWords.join(' ')}"`);
    const Location = AtLine(nLine, () => Coordinates.ParseUniversal(szText));
    const nTile = LocationTile(Doc, Location);
    Check(nTile >= 0, nLine, `No tile within ${Coordinates.g_dSnapFraction} hex of ${szText}`);
    return { nTile, szPanel: Location.szPanel };
  }

  // Leading word tokens (up to nMax).
  function TakeWords(rgTokens, nMax) {
    const rgszWords = [];
    while (rgTokens.length > 0 && rgTokens[0].szKind === 'word' && rgszWords.length < nMax) {
      rgszWords.push(rgTokens.shift().szValue);
    }
    return rgszWords;
  }

  // Terrain grids ------------------------------------------------------------------

  // Panel section layout: file column c is lattice column nLatticeColumn + c, file row
  // r is lattice row nLatticeRow − r; rgnTiles[r·columns + c] is the tile or −1.
  function PanelGrid(Topo, szPanel) {
    const Info = Topo.Panels[szPanel];
    const rgnTiles = new Int32Array(Info.nColumns * Info.nRows).fill(-1);
    for (let nTile = Info.nFirstTile; nTile < Info.nFirstTile + Info.nTileCount; nTile++) {
      const Tile = Topo.rgTiles[nTile];
      rgnTiles[Tile.nRow * Info.nColumns + Tile.nColumn] = nTile;
    }
    return { nColumns: Info.nColumns, nRows: Info.nRows, nLatticeColumn: Info.nLatticeColumnMin, nLatticeRow: Info.nLatticeRowMax, rgnTiles };
  }

  function LocalGrid(Doc) {
    const { nWidth, nHeight } = Doc.Local;
    return { nColumns: nWidth, nRows: nHeight, rgnTiles: Int32Array.from({ length: nWidth * nHeight }, (_, nIndex) => nIndex) };
  }

  function GridLines(Doc, Grid) {
    const rgszLines = [];
    for (let nRow = 0; nRow < Grid.nRows; nRow++) {
      let szLine = '';
      for (let nColumn = 0; nColumn < Grid.nColumns; nColumn++) {
        const nTile = Grid.rgnTiles[nRow * Grid.nColumns + nColumn];
        szLine += nTile < 0 ? g_szReserved : Terrain.ById(Doc.rgnTerrain[nTile]).szChar;
      }
      rgszLines.push(szLine);
    }
    return rgszLines;
  }

  // Writer -------------------------------------------------------------------------

  function Write(Doc) {
    if (Doc.Local && Doc.Local.szSystem === 'local') {
      // Feature coordinates must use the same rounded free anchor that the reader
      // will use, or a second save can round those coordinates differently.
      const Anchor = Coordinates.ParseUniversal(Coordinates.FormatUniversal(Doc.Local.Anchor, CoordinateDecimals(Doc.Local.dHexMiles)));
      Doc = { ...Doc, Local: Coordinates.CreateLocalMap({ ...Doc.Local, Anchor }) };
    }
    const rgszLines = [g_szMagic, '', '[map]', `kind = ${Doc.szKind}`, `name = ${Quote(Doc.szName)}`];
    if (Doc.szKind === 'global') {
      rgszLines.push(`panelHexes = ${Doc.Global.nPanelHexes}`, `tileScale = ${Doc.Global.szTileScale}`);
    } else {
      const Local = Doc.Local;
      rgszLines.push(
        `width = ${Local.nWidth}`,
        `height = ${Local.nHeight}`,
        `system = ${Local.szSystem}`,
        `size = ${Local.szScale}`,
        `anchor = ${Coordinates.FormatUniversal(Local.Anchor, CoordinateDecimals(Local.dHexMiles))}`,
        `panelHexes = ${Local.nPanelHexes}`);
    }
    rgszLines.push('', '[legend]', ...Terrain.g_rgTerrains.map((Item) => `${Item.szChar} ${Item.szKey}`));
    if (Doc.szKind === 'global') {
      for (const szPanel of GreekPanelOrder()) {
        const Grid = PanelGrid(Doc.Topo, szPanel);
        rgszLines.push('', `[panel ${Projection.Build().Panels[szPanel].szName}]`,
          `columns = ${Grid.nColumns}`, `rows = ${Grid.nRows}`,
          `latticeColumn = ${Grid.nLatticeColumn}`, `latticeRow = ${Grid.nLatticeRow}`,
          ...GridLines(Doc, Grid));
      }
    } else {
      const Grid = LocalGrid(Doc);
      rgszLines.push('', '[local]', `columns = ${Grid.nColumns}`, `rows = ${Grid.nRows}`, ...GridLines(Doc, Grid));
    }
    if (Doc.Landmarks.size > 0) {
      rgszLines.push('', '[landmarks]');
      for (const nTile of [...Doc.Landmarks.keys()].sort((nA, nB) => nA - nB)) {
        const Landmark = Doc.Landmarks.get(nTile);
        let szLine = `${FormatLocation(Doc, nTile)} ${Landmark.szType} ${Quote(Landmark.szName)}`;
        if (Landmark.szNotes !== '') {
          szLine += ` notes=${Quote(Landmark.szNotes)}`;
        }
        rgszLines.push(szLine);
      }
    }
    if (Doc.rgLabels.length > 0) {
      rgszLines.push('', '[labels]');
      for (const Label of Doc.rgLabels) {
        rgszLines.push([
          FormatLocation(Doc, Label.nTile), Label.szCategory, `id=${Label.szId}`,
          `size=${Util.FormatNumber(Label.dSize)}`, `rot=${Util.FormatNumber(Label.dRotation)}`,
          `dx=${Util.FormatNumber(Label.dDx)}`, `dy=${Util.FormatNumber(Label.dDy)}`, Quote(Label.szText),
        ].join(' '));
      }
    }
    if (Doc.rgOverlays.length > 0) {
      rgszLines.push('', '[overlays]');
      for (const Overlay of Doc.rgOverlays) {
        const rgszHead = [Overlay.szType, Overlay.szId];
        if (Overlay.szStyle !== '') {
          rgszHead.push(`style=${Overlay.szStyle}`);
        }
        rgszHead.push(Quote(Overlay.szName));
        let szPanel = null;
        const rgszPoints = Overlay.rgnTiles.map((nTile) => {
          const szText = FormatLocation(Doc, nTile, szPanel);
          szPanel = TileLocation(Doc, nTile).szPanel;
          return szText;
        });
        rgszLines.push(`${rgszHead.join(' ')} : ${rgszPoints.join('; ')}`);
      }
    }
    return rgszLines.join('\n') + '\n';
  }

  // Parser -------------------------------------------------------------------------

  // Splits text into sections: [{ szName, szArgument, nLine, rgLines: [{ nLine, szText }] }].
  // Blank lines and lines starting with '#' are skipped (inside terrain rows too).
  function SplitSections(szText) {
    const rgszLines = szText.split(/\r?\n/);
    let nFirst = 0;
    while (nFirst < rgszLines.length && rgszLines[nFirst].trim() === '') {
      nFirst++;
    }
    Check(nFirst < rgszLines.length && rgszLines[nFirst].trim() === g_szMagic, nFirst + 1,
      `Not a map file: the first line must be "${g_szMagic}"`);
    const rgSections = [];
    for (let nIndex = nFirst + 1; nIndex < rgszLines.length; nIndex++) {
      const nLine = nIndex + 1;
      const szLine = rgszLines[nIndex].trim();
      if (szLine === '' || szLine.startsWith('#')) {
        continue;
      }
      const Match = /^\[\s*([A-Za-z]+)(?:\s+([^\]]*?))?\s*\]$/.exec(szLine);
      if (szLine.startsWith('[')) {
        Check(Match !== null, nLine, `Malformed section header: ${szLine}`);
        rgSections.push({ szName: Match[1].toLowerCase(), szArgument: Match[2] || '', nLine, rgLines: [] });
        continue;
      }
      Check(rgSections.length > 0, nLine, 'Content before the first [section]');
      rgSections[rgSections.length - 1].rgLines.push({ nLine, szText: szLine });
    }
    return rgSections;
  }

  // Leading "key = value" lines of a section; returns { Values, nNext }.
  function ReadKeyValues(Section, rgszAllowed) {
    const Values = {};
    let nNext = 0;
    for (; nNext < Section.rgLines.length; nNext++) {
      const { nLine, szText } = Section.rgLines[nNext];
      const Match = /^([A-Za-z]+)\s*=\s*(.*)$/.exec(szText);
      if (!Match) {
        break;
      }
      const szKey = Match[1];
      Check(rgszAllowed.includes(szKey), nLine, `Unknown key "${szKey}" in [${Section.szName}]`);
      Check(!(szKey in Values), nLine, `Duplicate key "${szKey}"`);
      let szValue = Match[2].trim();
      if (szValue.startsWith('"')) {
        const [szText2, nEnd] = ReadQuoted(szValue, 0, nLine);
        Check(szValue.slice(nEnd).trim() === '', nLine, `Unexpected text after the quoted value of "${szKey}"`);
        szValue = szText2;
      }
      Values[szKey] = { szValue, nLine };
    }
    return { Values, nNext };
  }

  function RequireValue(Values, szKey, Section) {
    Check(szKey in Values, Section.nLine, `[${Section.szName}] needs "${szKey} = …"`);
    return Values[szKey];
  }

  function ParseInteger(Value, szKey) {
    Check(/^-?\d+$/.test(Value.szValue), Value.nLine, `"${szKey}" must be an integer, found "${Value.szValue}"`);
    return Number(Value.szValue);
  }

  function ParseNumber(szValue, szKey, nLine) {
    Check(/^-?(\d+(\.\d*)?|\.\d+)(e[-+]?\d+)?$/i.test(szValue), nLine, `"${szKey}" must be a number, found "${szValue}"`);
    return Number(szValue) || 0;
  }

  function CreateDocument(Section) {
    const { Values, nNext } = ReadKeyValues(Section,
      ['kind', 'name', 'panelHexes', 'tileScale', 'width', 'height', 'system', 'size', 'anchor']);
    Check(nNext === Section.rgLines.length, Section.rgLines[nNext] ? Section.rgLines[nNext].nLine : 0, 'Expected "key = value" in [map]');
    const Kind = RequireValue(Values, 'kind', Section);
    const szName = Values.name ? Values.name.szValue : '';
    const nPanelHexes = Values.panelHexes ? ParseInteger(Values.panelHexes, 'panelHexes') : undefined;
    if (Kind.szValue === 'global') {
      for (const szKey of ['width', 'height', 'system', 'size', 'anchor']) {
        Check(!(szKey in Values), Values[szKey] && Values[szKey].nLine, `"${szKey}" is only for local maps`);
      }
      const szTileScale = Values.tileScale ? Values.tileScale.szValue : undefined;
      return AtLine(Section.nLine, () => Model.CreateGlobalMap({ nPanelHexes, szTileScale, szName }));
    }
    Check(Kind.szValue === 'local', Kind.nLine, `Map kind must be "global" or "local", found "${Kind.szValue}"`);
    Check(!('tileScale' in Values), Values.tileScale && Values.tileScale.nLine, '"tileScale" is only for global maps');
    const Anchor = RequireValue(Values, 'anchor', Section);
    const System = RequireValue(Values, 'system', Section);
    const Size = RequireValue(Values, 'size', Section);
    Check(System.szValue in Lattice.g_Scales, System.nLine, `Unknown scale system "${System.szValue}"`);
    Check(Size.szValue in Lattice.g_Scales[System.szValue].Sizes, Size.nLine, `Unknown ${System.szValue} size "${Size.szValue}"`);
    return AtLine(Section.nLine, () => Model.CreateLocalMap({
      nWidth: ParseInteger(RequireValue(Values, 'width', Section), 'width'),
      nHeight: ParseInteger(RequireValue(Values, 'height', Section), 'height'),
      szSystem: System.szValue,
      szScale: Size.szValue,
      Anchor: AtLine(Anchor.nLine, () => Coordinates.ParseUniversal(Anchor.szValue)),
      nPanelHexes,
      szName,
    }));
  }

  // [legend] lines "<char> <terrain key>"; returns Map char → terrain id.
  function ParseLegend(Section) {
    const ByChar = new Map();
    const Keys = new Set();
    for (const { nLine, szText } of Section.rgLines) {
      const Match = /^(\S)\s+(\S+)$/.exec(szText);
      Check(Match !== null, nLine, `Expected "<char> <terrain>" in [legend], found "${szText}"`);
      const [, szChar, szKey] = Match;
      Check(!g_szForbiddenTerrainChars.includes(szChar), nLine, `"${szChar}" cannot stand for a terrain`);
      const Item = Terrain.ByKey(szKey);
      Check(Item !== null, nLine, `Unknown terrain "${szKey}"`);
      Check(!ByChar.has(szChar), nLine, `Character "${szChar}" is defined twice`);
      Check(!Keys.has(szKey), nLine, `Terrain "${szKey}" is defined twice`);
      ByChar.set(szChar, Item.nId);
      Keys.add(szKey);
    }
    return ByChar;
  }

  function DefaultLegend() {
    return new Map(Terrain.g_rgTerrains.map((Item) => [Item.szChar, Item.nId]));
  }

  // Reads a terrain grid section into Doc.rgnTerrain.
  function ParseGrid(Doc, Section, Grid, Legend, rgszExtraKeys) {
    const { Values, nNext } = ReadKeyValues(Section, ['columns', 'rows', ...rgszExtraKeys]);
    const szWhere = `[${Section.szName}${Section.szArgument ? ' ' + Section.szArgument : ''}]`;
    const nColumns = ParseInteger(RequireValue(Values, 'columns', Section), 'columns');
    const nRows = ParseInteger(RequireValue(Values, 'rows', Section), 'rows');
    Check(nColumns === Grid.nColumns, Values.columns.nLine, `${szWhere} must have columns = ${Grid.nColumns}, found ${nColumns}`);
    Check(nRows === Grid.nRows, Values.rows.nLine, `${szWhere} must have rows = ${Grid.nRows}, found ${nRows}`);
    if (Values.latticeColumn) {
      Check(ParseInteger(Values.latticeColumn, 'latticeColumn') === Grid.nLatticeColumn, Values.latticeColumn.nLine,
        `${szWhere} must have latticeColumn = ${Grid.nLatticeColumn}`);
    }
    if (Values.latticeRow) {
      Check(ParseInteger(Values.latticeRow, 'latticeRow') === Grid.nLatticeRow, Values.latticeRow.nLine,
        `${szWhere} must have latticeRow = ${Grid.nLatticeRow}`);
    }
    const rgRows = Section.rgLines.slice(nNext);
    Check(rgRows.length === nRows, rgRows.length > nRows ? rgRows[nRows].nLine : Section.nLine,
      `${szWhere} has ${rgRows.length} terrain rows, expected ${nRows}`);
    rgRows.forEach(({ nLine, szText }, nRow) => {
      Check(szText.length === nColumns, nLine, `Terrain row is ${szText.length} characters wide, expected ${nColumns}`);
      for (let nColumn = 0; nColumn < nColumns; nColumn++) {
        const szChar = szText[nColumn];
        const nTile = Grid.rgnTiles[nRow * nColumns + nColumn];
        if (nTile < 0) {
          Check(szChar === g_szReserved, nLine, `Column ${nColumn + 1} is not a tile of this panel and must be "${g_szReserved}", found "${szChar}"`);
          continue;
        }
        Check(szChar !== g_szReserved, nLine, `Column ${nColumn + 1} is a tile and needs a terrain character, found "${g_szReserved}"`);
        const nId = Legend.get(szChar);
        Check(nId !== undefined, nLine, `Unknown terrain character "${szChar}" in column ${nColumn + 1}`);
        Doc.rgnTerrain[nTile] = nId;
      }
    });
  }

  function ExpectNoTokens(rgTokens, nLine) {
    Check(rgTokens.length === 0, nLine, `Unexpected "${rgTokens.length ? (rgTokens[0].szKey ? rgTokens[0].szKey + '=' : '') + rgTokens[0].szValue : ''}"`);
  }

  function TakePairs(rgTokens, rgszAllowed, nLine) {
    const Pairs = {};
    for (let nIndex = 0; nIndex < rgTokens.length;) {
      const Token = rgTokens[nIndex];
      if (Token.szKind !== 'pair') {
        nIndex++;
        continue;
      }
      Check(rgszAllowed.includes(Token.szKey), nLine, `Unknown option "${Token.szKey}"`);
      Check(!(Token.szKey in Pairs), nLine, `Duplicate option "${Token.szKey}"`);
      Pairs[Token.szKey] = Token.szValue;
      rgTokens.splice(nIndex, 1);
    }
    return Pairs;
  }

  function TakeString(rgTokens, nLine, szWhat, fRequired) {
    const nIndex = rgTokens.findIndex((Token) => Token.szKind === 'string');
    Check(nIndex >= 0 || !fRequired, nLine, `Missing quoted ${szWhat}`);
    return nIndex < 0 ? '' : rgTokens.splice(nIndex, 1)[0].szValue;
  }

  // "<location> <type> ["name"] [notes="…"]"
  function ParseLandmarks(Doc, Section) {
    for (const { nLine, szText } of Section.rgLines) {
      const rgTokens = Tokenize(szText, nLine);
      const { nTile } = ParseLocation(Doc, TakeWords(rgTokens, 3), nLine);
      const rgszType = TakeWords(rgTokens, 1);
      Check(rgszType.length === 1, nLine, 'Missing landmark type');
      const Pairs = TakePairs(rgTokens, ['notes'], nLine);
      const szName = TakeString(rgTokens, nLine, 'name', false);
      ExpectNoTokens(rgTokens, nLine);
      Check(!Doc.Landmarks.has(nTile), nLine, `A landmark already exists at ${FormatLocation(Doc, nTile)} (one per tile)`);
      AtLine(nLine, () => Model.SetLandmark(Doc, nTile, { szType: rgszType[0], szName, szNotes: Pairs.notes === undefined ? '' : Pairs.notes }));
    }
  }

  // "<location> <category> [id=…] [size=…] [rot=…] [dx=…] [dy=…] "text""
  function ParseLabels(Doc, Section) {
    for (const { nLine, szText } of Section.rgLines) {
      const rgTokens = Tokenize(szText, nLine);
      const { nTile } = ParseLocation(Doc, TakeWords(rgTokens, 3), nLine);
      const rgszCategory = TakeWords(rgTokens, 1);
      Check(rgszCategory.length === 1, nLine, 'Missing label category');
      const Pairs = TakePairs(rgTokens, ['id', 'size', 'rot', 'dx', 'dy'], nLine);
      const szLabelText = TakeString(rgTokens, nLine, 'label text', true);
      ExpectNoTokens(rgTokens, nLine);
      const Props = { nTile, szText: szLabelText, szCategory: rgszCategory[0] };
      if (Pairs.id !== undefined) {
        Props.szId = Pairs.id;
      }
      for (const [szKey, szProp] of [['size', 'dSize'], ['rot', 'dRotation'], ['dx', 'dDx'], ['dy', 'dDy']]) {
        if (Pairs[szKey] !== undefined) {
          Props[szProp] = ParseNumber(Pairs[szKey], szKey, nLine);
        }
      }
      AtLine(nLine, () => Model.AddLabel(Doc, Props));
    }
  }

  // "<type> <id> [style=…] ["name"] : <location>; [<panel>] <east> <north>; …"
  function ParseOverlays(Doc, Section) {
    for (const { nLine, szText } of Section.rgLines) {
      const rgTokens = Tokenize(szText, nLine);
      const nColon = rgTokens.findIndex((Token) => Token.szKind === 'punct' && Token.szValue === ':');
      Check(nColon >= 0, nLine, 'Missing ":" before the overlay points');
      const rgHead = rgTokens.slice(0, nColon);
      const rgPoints = rgTokens.slice(nColon + 1);
      const rgszHead = TakeWords(rgHead, 2);
      Check(rgszHead.length === 2, nLine, 'Expected "<type> <id>" before the overlay name');
      const Pairs = TakePairs(rgHead, ['style'], nLine);
      const szName = TakeString(rgHead, nLine, 'name', false);
      ExpectNoTokens(rgHead, nLine);
      const rgnTiles = [];
      let szPanel = null;
      let rgszWords = [];
      for (let nIndex = 0; nIndex <= rgPoints.length; nIndex++) {
        const Token = rgPoints[nIndex];
        if (Token === undefined || (Token.szKind === 'punct' && Token.szValue === ';')) {
          Check(rgszWords.length > 0, nLine, `Empty overlay point ${rgnTiles.length + 1}`);
          const Point = ParseLocation(Doc, rgszWords, nLine, szPanel);
          rgnTiles.push(Point.nTile);
          szPanel = Point.szPanel;
          rgszWords = [];
          continue;
        }
        Check(Token.szKind === 'word', nLine, `Unexpected "${Token.szValue}" in overlay point ${rgnTiles.length + 1}`);
        rgszWords.push(Token.szValue);
      }
      AtLine(nLine, () => Model.AddOverlay(Doc, {
        szType: rgszHead[0], szId: rgszHead[1], szName, szStyle: Pairs.style === undefined ? '' : Pairs.style, rgnTiles,
      }));
    }
  }

  // Text → document. Throws an Error with nLine (1-based) on the first problem.
  function Parse(szText) {
    Util.Require(typeof szText === 'string', 'Map file text must be a string');
    const rgSections = SplitSections(szText);
    const Seen = new Map();
    for (const Section of rgSections) {
      const szKey = Section.szName === 'panel' ? `panel ${Section.szArgument.toLowerCase()}` : Section.szName;
      Check(['map', 'legend', 'panel', 'local', 'landmarks', 'labels', 'overlays'].includes(Section.szName), Section.nLine,
        `Unknown section [${Section.szName}]`);
      Check(Section.szName === 'panel' || Section.szArgument === '', Section.nLine, `[${Section.szName}] takes no argument`);
      Check(!Seen.has(szKey), Section.nLine, `Duplicate section [${Section.szName}${Section.szArgument ? ' ' + Section.szArgument : ''}] (first on line ${Seen.get(szKey)})`);
      Seen.set(szKey, Section.nLine);
    }
    const MapSection = rgSections.find((Section) => Section.szName === 'map');
    Check(MapSection !== undefined, 0, 'Missing [map] section');
    Check(rgSections[0] === MapSection, rgSections[0].nLine, '[map] must be the first section');
    const Doc = CreateDocument(MapSection);
    const LegendSection = rgSections.find((Section) => Section.szName === 'legend');
    const Legend = LegendSection ? ParseLegend(LegendSection) : DefaultLegend();
    if (Doc.szKind === 'global') {
      const Built = Projection.Build();
      const Remaining = new Set(Object.keys(Built.Panels));
      for (const Section of rgSections) {
        if (Section.szName === 'local') {
          throw FileError(Section.nLine, '[local] is only for local maps');
        }
        if (Section.szName === 'panel') {
          const szPanel = Coordinates.PanelIdByName(Section.szArgument);
          Check(szPanel !== null, Section.nLine, `Unknown panel "${Section.szArgument}"`);
          ParseGrid(Doc, Section, PanelGrid(Doc.Topo, szPanel), Legend, ['latticeColumn', 'latticeRow']);
          Remaining.delete(szPanel);
        }
      }
      Check(Remaining.size === 0, 0, `Missing panel sections: ${GreekPanelOrder().filter((sz) => Remaining.has(sz)).map((sz) => Built.Panels[sz].szName).join(', ')}`);
    } else {
      for (const Section of rgSections) {
        Check(Section.szName !== 'panel', Section.nLine, '[panel …] is only for global maps');
      }
      const LocalSection = rgSections.find((Section) => Section.szName === 'local');
      Check(LocalSection !== undefined, 0, 'Missing [local] section');
      ParseGrid(Doc, LocalSection, LocalGrid(Doc), Legend, []);
    }
    for (const Section of rgSections) {
      if (Section.szName === 'landmarks') {
        ParseLandmarks(Doc, Section);
      } else if (Section.szName === 'labels') {
        ParseLabels(Doc, Section);
      } else if (Section.szName === 'overlays') {
        ParseOverlays(Doc, Section);
      }
    }
    Doc.nRevision = 0;
    return Doc;
  }

  // A file name from the map name: "<name>.map.txt" with unsafe characters replaced.
  function FileName(Doc) {
    const szBase = Doc.szName.trim().replace(/[^A-Za-z0-9 _.-]+/g, '_').replace(/\s+/g, '-').replace(/^[.-]+/, '');
    return (szBase || 'map') + g_szFileExtension;
  }

  RpgMap.FileFormat = Object.freeze({
    g_szMagic,
    g_szFileExtension,
    Quote,
    Tokenize,
    CoordinateDecimals,
    Write,
    Parse,
    FileName,
  });
})(globalThis);
</script>

<script data-module="Renderer" data-dom="true">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Terrain, View } = RpgMap;

  // Canvas drawing for a global map in a View layout. Tiles are drawn per panel through
  // the frame → world → screen transform, clipped to the panel polygon, batched by colour.
  const g_dRasterHexPixels = 3;
  const g_nRasterMaxPixels = 4096;
  const g_dSmallHexPixels = 4;
  const g_dSeamPixels = 0.5;
  const g_dGridMinPixels = 6;
  // Canvas path fills slow down superlinearly with subpath count, so long tile lists are
  // filled or stroked in chunks.
  const g_nPathChunk = 512;
  // Above this many changed tiles, a cached raster is redrawn whole instead.
  const g_nMaxRepaintTiles = 3000;
  const g_szBackground = '#10151c';
  const g_szGridColor = 'rgba(16, 21, 28, 0.35)';
  const g_szOutlineColor = 'rgba(230, 230, 230, 0.8)';
  const g_szFocusColor = '#ffd166';
  const g_szHoverColor = '#ffd166';
  const g_szPreviewColor = 'rgba(255, 209, 102, 0.7)';
  const g_rgrgdHexUnit = [0, 1, 2, 3, 4, 5].map((nIndex) => [Math.cos(nIndex * Math.PI / 3), Math.sin(nIndex * Math.PI / 3)]);

  function Create(Canvas) {
    return { Canvas, Context: Canvas.getContext('2d'), dRatio: 1, Rasters: new Map(), MiniCamera: null, rgFeatureHits: [] };
  }

  // Matches the canvas backing store to its CSS size and resizes the camera.
  function SyncSize(Canvas, Camera) {
    const dRatio = Root.devicePixelRatio || 1;
    const Rect = Canvas.getBoundingClientRect();
    const nWidth = Math.max(1, Math.round(Rect.width * dRatio));
    const nHeight = Math.max(1, Math.round(Rect.height * dRatio));
    if (Canvas.width !== nWidth || Canvas.height !== nHeight) {
      Canvas.width = nWidth;
      Canvas.height = nHeight;
    }
    View.ResizeCamera(Camera, Rect.width, Rect.height);
    return dRatio;
  }

  function SetTransform(Context, dRatio, rgdT) {
    Context.setTransform(dRatio * rgdT[0], dRatio * rgdT[1], dRatio * rgdT[2], dRatio * rgdT[3], dRatio * rgdT[4], dRatio * rgdT[5]);
  }

  function TracePolygon(Context, rgrgdPolygon) {
    Context.moveTo(rgrgdPolygon[0][0], rgrgdPolygon[0][1]);
    for (let nIndex = 1; nIndex < rgrgdPolygon.length; nIndex++) {
      Context.lineTo(rgrgdPolygon[nIndex][0], rgrgdPolygon[nIndex][1]);
    }
    Context.closePath();
  }

  // Adds a tile's outline to the current path, in its own panel frame. Small hexes are
  // traced as their w × d cell, which tessellates and is much cheaper. dInflate grows
  // whole hexes so neighbouring fills overlap and hide anti-aliasing seams.
  function TraceTile(Context, Topo, nTile, fSmall, dInflate = 0) {
    const Tile = Topo.rgTiles[nTile];
    const [dX, dY] = Tile.rgdCenter;
    if (fSmall) {
