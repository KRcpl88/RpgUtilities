<script data-module="View">
(function (root) {
  'use strict';
  const rpgMap = root.RpgMap = root.RpgMap || {};
  const { Util: util, Projection: projection, Lattice: lattice, Topology: topology, Coordinates: coordinates, Terrain: terrain } = rpgMap;
  const { assertCondition } = util;

  // DOM-free view geometry for the renderer. "World" space is net space for the net
  // layout and the focus panel's frame for the focus layout (edge units, y north/up).
  // Local world units are hex heights, relative to the anchor. The camera maps world
  // to CSS pixels (y down), independent of the map's physical scale.
  const MIN_SCALE = 4;
  const MAX_SCALE = 400000;
  const IDENTITY = Object.freeze([1, 0, 0, 1, 0, 0]);

  // Camera -------------------------------------------------------------------------

  function createCamera(width = 800, height = 600) {
    return { centerX: 0, centerY: 0, scale: 100, minScale: MIN_SCALE, maxScale: MAX_SCALE, width, height };
  }

  function resizeCamera(camera, width, height) {
    camera.width = Math.max(1, width);
    camera.height = Math.max(1, height);
  }

  function clampScale(scale, minScale = MIN_SCALE, maxScale = MAX_SCALE) {
    return Math.min(maxScale, Math.max(minScale, scale));
  }

  // [a, b, c, d, e, f] taking world points to screen pixels.
  function worldToScreenTransform(camera) {
    const scale = camera.scale;
    return [scale, 0, 0, -scale, camera.width / 2 - camera.centerX * scale, camera.height / 2 + camera.centerY * scale];
  }

  function worldToScreen(camera, world) {
    return [
      camera.width / 2 + (world[0] - camera.centerX) * camera.scale,
      camera.height / 2 - (world[1] - camera.centerY) * camera.scale,
    ];
  }

  function screenToWorld(camera, screen) {
    return [
      camera.centerX + (screen[0] - camera.width / 2) / camera.scale,
      camera.centerY - (screen[1] - camera.height / 2) / camera.scale,
    ];
  }

  // Moves the content by (dx, dy) screen pixels.
  function pan(camera, dx, dy) {
    camera.centerX -= dx / camera.scale;
    camera.centerY += dy / camera.scale;
  }

  // Zooms by factor, keeping the world point under screen fixed.
  function zoomAt(camera, screen, factor) {
    const before = screenToWorld(camera, screen);
    camera.scale = clampScale(camera.scale * factor, camera.minScale, camera.maxScale);
    const after = screenToWorld(camera, screen);
    camera.centerX += before[0] - after[0];
    camera.centerY += before[1] - after[1];
  }

  function centerOn(camera, world) {
    camera.centerX = world[0];
    camera.centerY = world[1];
  }

  // Bounds are [minX, minY, maxX, maxY] in world units.
  function fitBounds(camera, bounds, margin = 24) {
    const spanWidth = Math.max(bounds[2] - bounds[0], 1e-9);
    const spanHeight = Math.max(bounds[3] - bounds[1], 1e-9);
    const availableX = Math.max(1, camera.width - 2 * margin);
    const availableY = Math.max(1, camera.height - 2 * margin);
    const fitScale = Math.min(availableX / spanWidth, availableY / spanHeight);
    // Large local rectangles must still fit; allow a further fourfold zoom out.
    camera.minScale = Math.min(MIN_SCALE, fitScale / 4);
    // Small local spans are measured in panel edge units; let them zoom in as far.
    camera.maxScale = Math.max(MAX_SCALE, fitScale * 64);
    camera.scale = clampScale(fitScale, camera.minScale, camera.maxScale);
    centerOn(camera, [(bounds[0] + bounds[2]) / 2, (bounds[1] + bounds[3]) / 2]);
  }

  function visibleBounds(camera) {
    const [minX, maxY] = screenToWorld(camera, [0, 0]);
    const [maxX, minY] = screenToWorld(camera, [camera.width, camera.height]);
    return [minX, minY, maxX, maxY];
  }

  function boundsOf(points) {
    const bounds = [Infinity, Infinity, -Infinity, -Infinity];
    for (const [x, y] of points) {
      bounds[0] = Math.min(bounds[0], x);
      bounds[1] = Math.min(bounds[1], y);
      bounds[2] = Math.max(bounds[2], x);
      bounds[3] = Math.max(bounds[3], y);
    }
    return bounds;
  }

  function boundsIntersect(firstPoint, secondPoint) {
    return firstPoint[0] <= secondPoint[2] && secondPoint[0] <= firstPoint[2]
      && firstPoint[1] <= secondPoint[3] && secondPoint[1] <= firstPoint[3];
  }

  function unionBounds(bounds) {
    return boundsOf(bounds.flatMap((bounds) => [[bounds[0], bounds[1]], [bounds[2], bounds[3]]]));
  }

  // The axis-aligned box, in the other space, of a box mapped through transform.
  function transformBounds(transform, bounds) {
    const [minX, minY, maxX, maxY] = bounds;
    return boundsOf([[minX, minY], [maxX, minY], [maxX, maxY], [minX, maxY]]
      .map((point) => projection.applyTransform(transform, point)));
  }

  // Layouts: where each panel's frame sits in world space -----------------------------

  // frameOutline (optional) replaces the panel polygon, e.g. the part of a panel
  // inside a local map that spans seams.
  function makePlacement(panelId, frameToWorld, frameOutline = null) {
    const built = projection.build();
    const frame = frameOutline || built.frames[panelId].polygon;
    const outline = frame.map((point) => projection.applyTransform(frameToWorld, point));
    return Object.freeze({
      panelId,
      name: built.panels[panelId].name,
      frameToWorld: Object.freeze([...frameToWorld]),
      worldToFrame: Object.freeze(projection.invertTransform(frameToWorld)),
      frameOutline: frame,
      outline: Object.freeze(outline.map((point) => Object.freeze(point))),
      bounds: Object.freeze(boundsOf(outline)),
      center: Object.freeze(projection.applyTransform(frameToWorld, frameOutline ? util.center(frame) : [0, 0])),
    });
  }

  function makeLayout(mode, focusPanel, placements) {
    return Object.freeze({
      mode,
      focusPanel,
      placements: Object.freeze(placements),
      bounds: Object.freeze(unionBounds(placements.map((placement) => placement.bounds))),
    });
  }

  let cachedNetLayout = null;
  const focusLayouts = new Map();
  const panelLayouts = new Map();
  const localGeometry = new WeakMap();
  const spanLayouts = new WeakMap();

  // A rendering-only geometry adapter. Local maps keep Doc.Topo null and use Model's
  // rectangular adjacency; no projection, partial tiles or seam graph is invented.
  function mapGeometry(doc) {
    if (doc.topo) {
      return doc.topo;
    }
    const local = doc.local;
    if (!localGeometry.has(local)) {
      const { width, height } = local;
      const tiles = Array.from({ length: width * height }, (_, index) => {
        const column = index % width, row = Math.floor(index / width);
        return Object.freeze({
          index, panelId: 'local', column, row, isPartial: false, pieces: null,
          center: Object.freeze(coordinates.localTilePoint(local, column, row)),
        });
      });
      const radius = lattice.hexRadius(1);
      const shift = width > 1 ? (local.parity ? -0.5 : 0.5) : 0;
      const bounds = Object.freeze([-radius, -(height - 1) + Math.min(0, shift) - 0.5,
        (width - 1) * lattice.columnSpacing(1) + radius, Math.max(0, shift) + 0.5]);
      const [left, bottom, right, top] = bounds;
      const outline = Object.freeze([[left, bottom], [right, bottom], [right, top], [left, top]]
        .map((point) => Object.freeze(point)));
      const placement = Object.freeze({
        panelId: 'local', name: 'Local map', frameToWorld: IDENTITY, worldToFrame: IDENTITY,
        frameOutline: outline, outline, bounds,
        center: Object.freeze([(left + right) / 2, (bottom + top) / 2]),
      });
      localGeometry.set(local, Object.freeze({
        local, tileCount: tiles.length, d: 1, w: lattice.columnSpacing(1), tiles: Object.freeze(tiles),
        panels: Object.freeze({ local: Object.freeze({
          lattice: Object.freeze({ isEquatorial: false }), firstTile: 0, tileCount: tiles.length,
        }) }),
        layout: makeLayout('local', null, [placement]),
      }));
    }
    return localGeometry.get(local);
  }

  function mapLayout(doc) {
    if (doc.kind === 'panel') {
      const panelId = doc.global.panelId;
      if (!panelLayouts.has(panelId)) {
        panelLayouts.set(panelId, makeLayout('panel', panelId, [makePlacement(panelId, IDENTITY)]));
      }
      return panelLayouts.get(panelId);
    }
    if (doc.topo && doc.topo.span) {
      return spanLayout(doc.topo);
    }
    return doc.topo ? buildNetLayout() : mapGeometry(doc).layout;
  }

  // A local map spanning seams: each panel's part of the rectangle, unfolded around the
  // anchor panel (world = anchor frame, edge units, origin at tile (0, 0)).
  function spanLayout(topo) {
    if (!spanLayouts.has(topo)) {
      const { placements, home } = topo.span;
      // The anchor panel draws last so it is on top.
      const panelIds = Object.keys(placements).sort((a, b) => (a === home) - (b === home));
      spanLayouts.set(topo, makeLayout('span', null, panelIds.map((panelId) =>
        makePlacement(panelId, placements[panelId].frameToWorld, placements[panelId].frameOutline))));
    }
    return spanLayouts.get(topo);
  }

  // The drawable outline of a panel (frame units), or of the whole map for 'local'
  // (local world units).
  function getFrameOutline(geometry, panelId) {
    if (geometry.span) {
      return panelId === 'local' ? geometry.span.outline : geometry.span.placements[panelId].frameOutline;
    }
    return geometry.local ? geometry.layout.placements[0].frameOutline
      : projection.build().frames[panelId].polygon;
  }

  // Intersect the actual equatorial plane and polar rays with the drawing frame.
  // equatorSegments lists every equator segment (several for a span 'local' scope).
  function referenceGeometry(doc, panelId) {
    const geometry = mapGeometry(doc);
    if (geometry.span) {
      if (panelId !== 'local') {
        return panelReference(geometry, panelId, projection.build().frames[panelId], (point) => point, (point) => point);
      }
      // Whole span: each placement's references, in local world units.
      const equatorSegments = [];
      const poles = [];
      for (const [partId, placement] of Object.entries(geometry.span.placements)) {
        const reference = panelReference(geometry, partId, projection.build().frames[partId], (point) => point, (point) => point);
        const toWorld = (point) => projection.applyTransform(placement.frameToWorld, point);
        equatorSegments.push(...reference.equatorSegments.map((segment) => segment.map(toWorld)));
        poles.push(...reference.poles.map((pole) => ({ label: pole.label, point: toWorld(pole.point) })));
      }
      return { equator: equatorSegments.length === 1 ? equatorSegments[0] : [], equatorSegments, poles };
    }
    const local = doc.local;
    const frame = projection.build().frames[local ? local.anchor.panelId : panelId];
    const milesPerEdge = local ? projection.getMilesPerEdge(local.panelHexes) : geometry.milesPerEdge;
    const unit = local ? local.hexMiles / milesPerEdge : 1;
    const origin = local ? [local.anchor.east / milesPerEdge, local.anchor.north / milesPerEdge] : [0, 0];
    const toFrame = (point) => util.add(origin, util.scale(point, unit));
    const fromFrame = (point) => util.scale(util.subtract(point, origin), 1 / unit);
    return panelReference(geometry, panelId, frame, toFrame, fromFrame);
  }

  function panelReference(geometry, panelId, frame, toFrame, fromFrame) {
    const polygon = getFrameOutline(geometry, panelId);
    const equator = [];
    for (const [a, b] of util.boundary(polygon)) {
      const componentA = util.dot(projection.frameToSolid(frame, toFrame(a)), projection.NORTH);
      const componentB = util.dot(projection.frameToSolid(frame, toFrame(b)), projection.NORTH);
      if (Math.abs(componentA) < 1e-10 && !equator.some((point) => util.pointDistance(point, a) < 1e-9)) {
        equator.push(a);
      }
      if (componentA * componentB < 0 && Math.abs(componentA) >= 1e-10 && Math.abs(componentB) >= 1e-10) {
        equator.push(util.add(a, util.scale(util.subtract(b, a), componentA / (componentA - componentB))));
      }
    }
    const poles = [];
    for (const [label, sign] of [['N', 1], ['S', -1]]) {
      const direction = util.scale(projection.NORTH, sign);
      const denominator = util.dot(direction, frame.normal3D);
      if (denominator <= 1e-10) {
        continue;
      }
      const distance = util.dot(frame.origin3D, frame.normal3D) / denominator;
      const point = fromFrame(projection.solidToFrame(frame, util.scale(direction, distance)));
      if (util.pointInConvex(point, polygon)) {
        poles.push({ label, point });
      }
    }
    return { equator, equatorSegments: equator.length === 2 ? [equator] : [], poles };
  }

  // Every panel at its place in the net.
  function buildNetLayout() {
    if (!cachedNetLayout) {
      const built = projection.build();
      cachedNetLayout = makeLayout('net', null,
        Object.keys(built.panels).map((panelId) => makePlacement(panelId, built.frames[panelId].frameToNet)));
    }
    return cachedNetLayout;
  }

  // One panel north-up (world = its frame) with every edge-neighbour unfolded across
  // the shared seam. Neighbours come first so the focus panel draws on top.
  function buildFocusLayout(focusPanel) {
    if (!focusLayouts.has(focusPanel)) {
      const built = projection.build();
      assertCondition(built.panels[focusPanel] !== undefined, `Unknown panel: ${focusPanel}`);
      const placements = [];
      for (const seam of built.seams) {
        if (seam.panelA === focusPanel) {
          placements.push(makePlacement(seam.panelB, seam.bToA));
        } else if (seam.panelB === focusPanel) {
          placements.push(makePlacement(seam.panelA, seam.aToB));
        }
      }
      placements.push(makePlacement(focusPanel, IDENTITY));
      focusLayouts.set(focusPanel, makeLayout('focus', focusPanel, placements));
    }
    return focusLayouts.get(focusPanel);
  }

  function findPlacement(layout, panelId) {
    return layout.placements.find((placement) => placement.panelId === panelId) || null;
  }

  // The topmost placement whose panel polygon contains the world point.
  function placementAt(layout, world) {
    for (let index = layout.placements.length - 1; index >= 0; index--) {
      const placement = layout.placements[index];
      if (!boundsIntersect(placement.bounds, [world[0], world[1], world[0], world[1]])) {
        continue;
      }
      const framePoint = projection.applyTransform(placement.worldToFrame, world);
      if (util.pointInConvex(framePoint, placement.frameOutline)) {
        return { placement, framePoint };
      }
    }
    return null;
  }

  // Tiles drawn per panel ----------------------------------------------------------------

  const groupCache = new WeakMap();

  // Groups of tiles to draw inside a panel's polygon, each with the transform from the
  // owning panel's frame to this panel's frame. Equatorial panels also draw the edge
  // columns of their strip neighbours, whose whole hexes overhang this panel slightly.
  function panelTileGroups(topo, panelId) {
    let byPanel = groupCache.get(topo);
    if (!byPanel) {
      byPanel = new Map();
      groupCache.set(topo, byPanel);
    }
    if (byPanel.has(panelId)) {
      return byPanel.get(panelId);
    }
    const info = topo.panels[panelId];
    assertCondition(info !== undefined, `Unknown panel: ${panelId}`);
    const groups = [{
      owner: panelId,
      toPanel: IDENTITY,
      tileIndices: Int32Array.from({ length: info.tileCount }, (_, index) => info.firstTile + index),
    }];
    if (info.lattice.isEquatorial && !topo.singlePanel) {
      const built = projection.build();
      const halfWidth = built.equatorialWidth / 2;
      const radius = lattice.hexRadius(topo.d);
      for (const otherId of [info.westPanel, info.eastPanel]) {
        if (!otherId || !topo.panels[otherId]) {
          continue;
        }
        const seam = projection.findSeam(otherId, panelId);
        const toPanel = seam.panelA === otherId ? seam.aToB : seam.bToA;
        const other = topo.panels[otherId];
        const tileIndices = [];
        for (let tileIndex = other.firstTile; tileIndex < other.firstTile + other.tileCount; tileIndex++) {
          const east = projection.applyTransform(toPanel, topo.tiles[tileIndex].center)[0];
          if (east + radius > -halfWidth && east - radius < halfWidth) {
            tileIndices.push(tileIndex);
          }
        }
        groups.push({ owner: otherId, toPanel, tileIndices: Int32Array.from(tileIndices) });
      }
    }
    const frozen = Object.freeze(groups.map((group) => Object.freeze(group)));
    byPanel.set(panelId, frozen);
    return frozen;
  }

  // Tiles of a group that may touch frameBounds (the view box in the panel's frame).
  function visibleTiles(topo, group, frameBounds) {
    const radius = lattice.hexRadius(topo.d);
    const [minX, minY, maxX, maxY] = frameBounds;
    const identity = group.toPanel === IDENTITY;
    const visible = [];
    for (const tileIndex of group.tileIndices) {
      const center = identity ? topo.tiles[tileIndex].center : projection.applyTransform(group.toPanel, topo.tiles[tileIndex].center);
      if (center[0] + radius >= minX && center[0] - radius <= maxX
        && center[1] + radius >= minY && center[1] - radius <= maxY) {
        visible.push(tileIndex);
      }
    }
    return visible;
  }

  // The tile that owns a world point, or null. Returns { tileIndex, panelId, framePoint } with
  // panelId the tile's own panel and framePoint the point in that panel's frame. The point
  // can lie inside a neighbouring panel's outline: on the east/west seams between
  // equatorial panels, edge hexes belong wholly to their own panel, so the tip of a hex
  // that pokes across the seam still belongs to that hex (prompt.md, "Map projection").
  // Partial tiles on the other seams are clipped to their panel, so there the panel
  // containing the point owns it. drawPanel is the panel whose outline contains the point.
  function hitTest(topo, layout, world) {
    const hit = placementAt(layout, world);
    if (hit === null) {
      return null;
    }
    const drawPanel = hit.placement.panelId;
    if (topo.local) {
      const xy = coordinates.localPointToTile(topo.local, hit.framePoint);
      return xy ? { tileIndex: xy[1] * topo.local.width + xy[0], panelId: 'local', framePoint: hit.framePoint, drawPanel } : null;
    }
    const [q, j] = topology.latticeNearest(topo.panels[drawPanel].lattice, hit.framePoint[0], hit.framePoint[1]);
    const tileIndex = topology.locateLattice(topo, drawPanel, q, j);
    if (tileIndex < 0) {
      return null;
    }
    const panelId = topo.tiles[tileIndex].panelId;
    let framePoint = hit.framePoint;
    if (panelId !== drawPanel) {
      const seam = projection.findSeam(drawPanel, panelId);
      framePoint = projection.applyTransform(seam.panelA === drawPanel ? seam.aToB : seam.bToA, framePoint);
    }
    return { tileIndex, panelId, framePoint, drawPanel };
  }

  // Feature geometry is computed in panel frames, never by joining net positions.
  function panelTransform(from, to) {
    if (from === to) {
      return IDENTITY;
    }
    const seam = projection.findSeam(from, to);
    assertCondition(seam !== null && seam !== undefined, `Panels ${from} and ${to} do not share an edge`);
    return seam.panelA === from ? seam.aToB : seam.bToA;
  }

  // The panel itself and each edge neighbour it is drawn beside. In a local span only
  // neighbours unfolded next to it count; global feature drawing uses every seam.
  function panelCopies(panelId, topo = null) {
    const copies = [{ panelId, transform: IDENTITY }];
    if (topo && topo.span) {
      for (const seam of projection.build().seams) {
        const otherId = seam.panelA === panelId ? seam.panelB : seam.panelB === panelId ? seam.panelA : null;
        if (otherId && topology.spanLinked(topo, panelId, otherId)) {
          copies.push({ panelId: otherId, transform: seam.panelA === panelId ? seam.aToB : seam.bToA });
        }
      }
      return copies;
    }
    for (const seam of projection.build().seams) {
      if (seam.panelA === panelId) {
        copies.push({ panelId: seam.panelB, transform: seam.aToB });
      } else if (seam.panelB === panelId) {
        copies.push({ panelId: seam.panelA, transform: seam.bToA });
      }
    }
    return copies;
  }

  // A partial tile's lattice centre can lie outside its panel. Keep its glyph/path
  // anchor inside the largest visible piece; the saved tile coordinate is unchanged.
  function featureAnchor(topo, tileIndex) {
    const tile = topo.tiles[tileIndex];
    if (!tile.pieces) {
      return tile.center;
    }
    const piece = tile.pieces.reduce((best, next) =>
      Math.abs(util.polygonArea(next.polygon)) > Math.abs(util.polygonArea(best.polygon)) ? next : best);
    return util.center(piece.polygon);
  }

  function featureCopies(topo, layout, tileIndex) {
    return panelCopies(topo.tiles[tileIndex].panelId, topo).flatMap((copy) => {
      const placement = findPlacement(layout, copy.panelId);
      return placement ? [{
        placement,
        frameToWorld: projection.composeTransforms(copy.transform, placement.frameToWorld),
      }] : [];
    });
  }

  const overlayCurveCache = new WeakMap();

  // Catmull-Rom tangents yield cubic curves through the tile anchors. At a seam both
  // panels get the SAME curve, transformed and clipped when drawn, including cut edges.
  function overlayCurves(topo, overlay) {
    const cached = overlayCurveCache.get(overlay);
    if (cached && cached.topo === topo) {
      return cached.curves;
    }
    const tileIndices = overlay.tileIndices;
    const curves = [];
    const pointIn = (tileIndex, panelId) => projection.applyTransform(panelTransform(topo.tiles[tileIndex].panelId, panelId), featureAnchor(topo, tileIndex));
    for (let index = 0; index + 1 < tileIndices.length; index++) {
      const indexA = tileIndices[index];
      const indexB = tileIndices[index + 1];
      const a = topo.tiles[indexA].panelId;
      const b = topo.tiles[indexB].panelId;
      const pointA = featureAnchor(topo, indexA);
      const pointB = pointIn(indexB, a);
      const prev = pointIn(tileIndices[Math.max(0, index - 1)], a);
      const nextInB = pointIn(tileIndices[Math.min(tileIndices.length - 1, index + 2)], b);
      const controlB = util.subtract(featureAnchor(topo, indexB), util.scale(util.subtract(nextInB, pointIn(indexA, b)), 1 / 6));
      const control = [
        pointA,
        util.add(pointA, util.scale(util.subtract(pointB, prev), 1 / 6)),
        projection.applyTransform(panelTransform(b, a), controlB),
        pointB,
      ];
      for (const copy of panelCopies(a, topo)) {
        const mapped = control.map((point) => projection.applyTransform(copy.transform, point));
        if (boundsIntersect(boundsOf(mapped), boundsOf(getFrameOutline(topo, copy.panelId)))) {
          curves.push({ panelId: copy.panelId, pointIndex: index, control: mapped });
        }
      }
    }
    overlayCurveCache.set(overlay, { topo, curves });
    return curves;
  }

  function cubicPoint(control, t) {
    const u = 1 - t;
    return [0, 1].map((axis) => u ** 3 * control[0][axis]
      + 3 * u * u * t * control[1][axis]
      + 3 * u * t * t * control[2][axis] + t ** 3 * control[3][axis]);
  }

  function distanceToSegment(point, pointA, pointB) {
    const delta = util.subtract(pointB, pointA);
    const squared = util.dot(delta, delta);
    const t = squared === 0 ? 0 : Math.max(0, Math.min(1, util.dot(util.subtract(point, pointA), delta) / squared));
    return util.pointDistance(point, util.add(pointA, util.scale(delta, t)));
  }

  function flattenCurve(control, tolerance = 0.5) {
    const points = [control[0]];
    const subdivide = (curvePoints, depth) => {
      if (depth === 16 || Math.max(distanceToSegment(curvePoints[1], curvePoints[0], curvePoints[3]), distanceToSegment(curvePoints[2], curvePoints[0], curvePoints[3])) <= tolerance) {
        points.push(curvePoints[3]);
        return;
      }
      const [first, second] = splitCurve(curvePoints);
      subdivide(first, depth + 1);
      subdivide(second, depth + 1);
    };
    subdivide(control, 0);
    return points;
  }

  function splitCurve(curvePoints, t = 0.5) {
    const mid = (a, b) => util.add(util.scale(a, 1 - t), util.scale(b, t));
    const a = mid(curvePoints[0], curvePoints[1]), b = mid(curvePoints[1], curvePoints[2]), c = mid(curvePoints[2], curvePoints[3]);
    const d = mid(a, b), e = mid(b, c), f = mid(d, e);
    return [[curvePoints[0], a, d, f], [f, e, c, curvePoints[3]]];
  }

  const OVERLAY_STYLES = Object.freeze({
    river: Object.freeze({ color: '#236eae', spanWidth: 3, dash: Object.freeze([]) }),

    const xy = coordinates.localPointToTile(local, [
      framePoint[0] * scale - local.anchor.east / local.hexMiles,
      framePoint[1] * scale - local.anchor.north / local.hexMiles,

      const point = tilePoint(source, tileIndex);
      map[tileIndex] = tileAtPoint(target, point.panelId, point.point);

  // Copies terrain, landmarks, labels and overlays from Source onto the empty Target
  // (both must use the same panel size). Options: covered (output bitmap),
  // keepPoints (single-tile paths), hasPartialCoverage (include source slivers).
  // Returns Target.
  function transfer(source, target, options = {}) {

    const covered = options.covered;
    if (covered) {
      assertCondition(covered.length === target.tileCount, 'Coverage must match the target grid');
      covered.fill(0);
    }
    const ratio = model.hexMiles(source) / model.hexMiles(target);
    const sourceToTarget = mapSourceTiles(source, target);
    const centerSource = new Int32Array(target.tileCount);
    for (let tileIndex = 0; tileIndex < target.tileCount; tileIndex++) {
      const point = tilePoint(target, tileIndex);
      centerSource[tileIndex] = tileAtPoint(source, point.panelId, point.point);
      if (covered && centerSource[tileIndex] >= 0) {

      // Source (e.g. a clipped tip at an isolated panel's equatorial boundary).
      if (targetIndex >= 0 && (coarser || options.hasPartialCoverage && centerSource[targetIndex] < 0)) {
        if (!votes.has(targetIndex)) {
          votes.set(targetIndex, new Uint32Array(terrain.TERRAINS.length));
        }
        votes.get(targetIndex)[source.terrainIds[sourceIndex]]++;
      }
    });
    for (let tileIndex = 0; tileIndex < target.tileCount; tileIndex++) {
      target.terrainIds[tileIndex] = votes.has(tileIndex) ? mostCommon(votes.get(tileIndex), centerTerrain(tileIndex)) : centerTerrain(tileIndex);
      if (covered && votes.has(tileIndex)) {
        covered[tileIndex] = 1;
      }
    }
    for (const sourceIndex of [...source.landmarks.keys()].sort((indexA, indexB) => indexA - indexB)) {
      const targetIndex = sourceToTarget[sourceIndex];
      if (targetIndex >= 0 && !target.landmarks.has(targetIndex)) {
        model.setLandmark(target, targetIndex, source.landmarks.get(sourceIndex));
      }
    }
    const round = (value) => Math.round(value * 100) / 100 || 0;
    for (const label of source.labels) {
      const targetIndex = sourceToTarget[label.tileIndex];
      if (targetIndex >= 0) {
        // Label units are 1/48 hex: keep the label's size and offset on the ground.
        model.addLabel(target, {
          ...label, tileIndex: targetIndex, size: Math.max(0.01, round(label.size * ratio)),
          dx: round(label.dx * ratio), dy: round(label.dy * ratio),
        });
      }
    }
    const usedIds = new Set(source.overlays.map((overlay) => overlay.id));

      overlayPieces(target, overlay.tileIndices.map((tileIndex) => sourceToTarget[tileIndex]), options.keepPoints ? 1 : 2).forEach((tileIndices, pieceIndex) => {
        let id = overlay.id;
        if (pieceIndex > 0) {
          let suffix = pieceIndex + 1;
          while (usedIds.has(`${overlay.id}_${suffix}`)) {
            suffix++;
          }
          id = `${overlay.id}_${suffix}`;
          usedIds.add(id);
        }
        model.addOverlay(target, { type: overlay.type, name: overlay.name, style: overlay.style, id, tileIndices });
      });
    }

  }

  function mostCommon(voteCounts, center) {
    const bestIndex = Math.max(...voteCounts);
    return voteCounts[center] === bestIndex ? center : voteCounts.indexOf(bestIndex);
  }

  // Splits a mapped overlay path where it leaves the map, drops repeats, and bridges
  // tiles that are no longer adjacent with shortest paths.
  function overlayPieces(target, mapped, minimum = 2) {
    const pieces = [];
    let piece = [];
    const finish = () => {
      if (piece.length >= minimum) {

      }
      piece = [];
    };
    for (const tileIndex of mapped) {
      if (tileIndex < 0) {
        finish();
        continue;
      }
      const last = piece.length > 0 ? piece[piece.length - 1] : -1;
      if (last === tileIndex) {
        continue;
      }
      if (last < 0 || model.areAdjacent(target, last, tileIndex)) {
        piece.push(tileIndex);
        continue;
      }
      const path = edit.findPath(target, last, tileIndex);
      if (path) {

  // A rectangular crop uses local-map options. A whole-panel crop uses
  // { kind: 'panel', panelId, scaleName, name? }. Both inherit Source's panel size.
  function crop(source, options) {

    if (options.kind === 'panel') {
      assertCondition(options.systemName === undefined || options.systemName === 'regional', 'Panel crops require regional hexes');
      const target = model.createPanelMap({
        name: options.name === undefined ? source.name : options.name,
        panelId: options.panelId, tileScale: options.scaleName, panelHexes: panelHexes(source),
      });
      return transfer(source, target, { keepPoints: true });
    }
    const target = model.createLocalMap({
      name: options.name === undefined ? source.name : options.name,
      width: options.width, height: options.height, systemName: options.systemName, scaleName: options.scaleName,
      anchor: options.anchor, panelHexes: panelHexes(source),
    });
    return transfer(source, target);
  }

  function emptyCopy(doc) {
    return { ...doc, terrainIds: new Uint8Array(doc.tileCount), landmarks: new Map(), overlays: [], labels: [], revision: 0 };
  }

  function uniqueId(base, used) {
    let id = base;
    for (let suffix = 2; used.has(id); suffix++) {
      id = `${base}_${suffix}`;
    }
    used.add(id);
    return id;
  }

  // Replaces only imported coverage, preserving Target's geometry and outside content.
  // Prepare all changes before touching Target; onChange groups them into undo history.
  function merge(source, target, onChange = () => {}) {
    const system = (doc) => doc.local ? doc.local.systemName : 'regional';
    assertCondition(system(source) === system(target), 'Cannot merge local (yard-scale) and regional (mile-scale) hex systems');
    assertCondition(panelHexes(source) === panelHexes(target), 'Both maps must use the same panel size');
    const covered = new Uint8Array(target.tileCount);
    const imported = transfer(source, emptyCopy(target), { covered, keepPoints: true, hasPartialCoverage: true });
    const tileIndices = [];
    covered.forEach((covered, tileIndex) => {
      if (covered) {
        tileIndices.push(tileIndex);
      }
    });
    if (tileIndices.length === 0) {
      return { tileIndices, coveredCount: 0 };
    }
    const merged = {
      ...target, terrainIds: target.terrainIds.slice(), landmarks: new Map(target.landmarks),
      overlays: target.overlays.slice(), labels: target.labels.slice(),
    };
    const changes = [];
    const record = (change) => {
      if (change) {
        changes.push(change);
      }
    };
    for (const tileIndex of tileIndices) {
      record(model.setTerrain(merged, tileIndex, imported.terrainIds[tileIndex]));
      record(model.setLandmark(merged, tileIndex, imported.landmarks.get(tileIndex) || null));
    }
    const overlayIds = new Set(target.overlays.map((overlay) => overlay.id));
    for (const overlay of target.overlays) {
      if (overlay.tileIndices.some((tileIndex) => covered[tileIndex])) {
        const pieces = overlayPieces(target, overlay.tileIndices.map((tileIndex) => covered[tileIndex] ? -1 : tileIndex), 1);
        record(model.removeOverlay(merged, overlay.id));
        pieces.forEach((piece, pieceIndex) => record(model.addOverlay(merged, {
          ...overlay, id: pieceIndex === 0 ? overlay.id : uniqueId(overlay.id, overlayIds), tileIndices: piece,
        })));
      }
    }
    for (const overlay of imported.overlays) {
      const pieces = overlayPieces(target, overlay.tileIndices.map((tileIndex) => covered[tileIndex] ? tileIndex : -1), 1);
      for (const piece of pieces) {
        record(model.addOverlay(merged, { ...overlay, id: uniqueId(overlay.id, overlayIds), tileIndices: piece }));
      }
    }
    for (const label of target.labels) {
      if (covered[label.tileIndex]) {
        record(model.removeLabel(merged, label.id));
      }
    }
    const labelIds = new Set(merged.labels.map((label) => label.id));
    for (const label of imported.labels) {
      if (covered[label.tileIndex]) {
        record(model.addLabel(merged, { ...label, id: uniqueId(label.id, labelIds) }));
      }
    }
    for (const change of changes) {
      onChange(model.applyChange(target, change));
    }
    return { tileIndices, coveredCount: tileIndices.length };
  }

  // Tile scales a map of this kind can be rescaled to, as [systemName, scaleName] pairs.
  function rescaleOptions(doc) {
    if (doc.kind === 'global') {
      return topology.TILE_SCALES.map((scaleName) => ['regional', scaleName]);
    }
    if (doc.kind === 'panel') {
      return ['XL', 'L', 'M'].map((scaleName) => ['regional', scaleName]);
    }
    return Object.keys(lattice.SCALES).flatMap((systemName) =>
      Object.keys(lattice.SCALES[systemName].sizes).map((scaleName) => [systemName, scaleName]));
  }

  // Local map options at a new scale: the same ground (at least one tile) and the same
  // north-west corner. Hexes are one unit high with a circumradius of 1/√3, so the west
  // tip and top edge of tile (0, 0) stay put.
  function localRescaleOptions(local, systemName, scaleName) {
    const newMiles = lattice.scaleMiles(systemName, scaleName);
    const ratio = local.hexMiles / newMiles;
    return {
      width: Math.max(1, Math.round(local.width * ratio)),
      height: Math.max(1, Math.round(local.height * ratio)),
      systemName, scaleName, panelHexes: local.panelHexes,
      anchor: coordinates.makeLocation(local.anchor.panelId,
        local.anchor.east + (newMiles - local.hexMiles) / Math.sqrt(3),
        local.anchor.north + (local.hexMiles - newMiles) / 2),
    };
  }

  // A copy of Doc at another tile scale. Global and panel maps keep their extent; a local
  // map keeps its ground size and north-west corner.
  function rescale(doc, systemName, scaleName) {
    assertCondition(rescaleOptions(doc).some(([s, z]) => s === systemName && z === scaleName),
      `A ${doc.kind} map cannot use the ${systemName} ${scaleName} scale`);
    if (doc.kind !== 'local') {
      const options = { name: doc.name, panelHexes: doc.global.panelHexes, tileScale: scaleName };
      const target = doc.kind === 'global' ? model.createGlobalMap(options)
        : model.createPanelMap({ ...options, panelId: doc.global.panelId });
      return transfer(doc, target);
    }
    return crop(doc, localRescaleOptions(doc.local, systemName, scaleName));
  }

  rpgMap.Resample = Object.freeze({
    normalizePoint,
    tilePoint,
    tileAtPoint,
    transfer,
    crop,
    merge,
    rescaleOptions,
    localRescaleOptions,
    rescale,
  });

          `size=${util.formatNumber(label.size)}`, `rot=${util.formatNumber(label.rotation)}`,
          `dx=${util.formatNumber(label.dx)}`, `dy=${util.formatNumber(label.dy)}`, quote(label.text),

    }
    check(firstId === MAGIC, firstIndex + 1,
      `Not a map file: the first line must be "${MAGIC}"`);
    const sections = [];
    for (let index = firstIndex + 1; index < lines.length; index++) {
      const lineNumber = index + 1;
      const line = lines[index].trim();
      if (line === '' || line.startsWith('#')) {
        continue;
      }
      const match = /^\[\s*([A-Za-z]+)(?:\s+([^\]]*?))?\s*\]$/.exec(line);
      if (line.startsWith('[')) {
        check(match !== null, lineNumber, `Malformed section header: ${line}`);
        sections.push({ name: match[1].toLowerCase(), argument: match[2] || '', lineNumber, lines: [] });
        continue;
      }
      check(sections.length > 0, lineNumber, 'Content before the first [section]');
      sections[sections.length - 1].lines.push({ lineNumber, text: line });
    }
    return sections;
  }

  // Leading "key = value" lines of a section; returns { Values, next }.
  function readKeyValues(section, allowed) {
    const values = {};
    let next = 0;
    for (; next < section.lines.length; next++) {
      const { lineNumber, text } = section.lines[next];
      const match = /^([A-Za-z]+)\s*=\s*(.*)$/.exec(text);
      if (!match) {
        break;
      }
      const key = match[1];
      check(allowed.includes(key), lineNumber, `Unknown key "${key}" in [${section.name}]`);
      check(!(key in values), lineNumber, `Duplicate key "${key}"`);
      let value = match[2].trim();
      if (value.startsWith('"')) {
        const [text2, end] = readQuoted(value, 0, lineNumber);
        check(value.slice(end).trim() === '', lineNumber, `Unexpected text after the quoted value of "${key}"`);
        value = text2;
      }
      values[key] = { value, lineNumber };
    }
    return { values, next };
  }

  function requireValue(values, key, section) {
    check(key in values, section.lineNumber, `[${section.name}] needs "${key} = …"`);
    return values[key];
  }

  function parseInteger(value, key) {
    check(/^-?\d+$/.test(value.value), value.lineNumber, `"${key}" must be an integer, found "${value.value}"`);
    return Number(value.value);
  }

  function parseNumber(value, key, lineNumber) {
    check(/^-?(\d+(\.\d*)?|\.\d+)(e[-+]?\d+)?$/i.test(value), lineNumber, `"${key}" must be a number, found "${value}"`);
    return Number(value) || 0;
  }

  // isFlat: the file has a [local] grid, so the map stays one flat grid even if it
  // crosses a panel seam (files written before local maps could span seams).
  function createDocument(section, isFlat = false) {
    const { values, next } = readKeyValues(section,
      ['kind', 'name', 'panelHexes', 'tileScale', 'panel', 'width', 'height', 'system', 'size', 'anchor']);
    check(next === section.lines.length, section.lines[next] ? section.lines[next].lineNumber : 0, 'Expected "key = value" in [map]');
    const kind = requireValue(values, 'kind', section);
    const name = values.name ? values.name.value : '';
    const panelHexes = values.panelHexes ? parseInteger(values.panelHexes, 'panelHexes') : undefined;
    if (kind.value === 'global' || kind.value === 'panel') {
      for (const key of ['width', 'height', 'system', 'size', 'anchor']) {
        check(!(key in values), values[key] && values[key].lineNumber, `"${key}" is only for local maps`);
      }
      const tileScale = values.tileScale ? values.tileScale.value : undefined;
      if (kind.value === 'panel') {
        const panel = requireValue(values, 'panel', section);
        const panelId = coordinates.panelIdByName(panel.value);
        check(panelId !== null, panel.lineNumber, `Unknown panel "${panel.value}"`);
        return atLine(section.lineNumber, () => model.createPanelMap({ panelHexes, tileScale, panelId, name }));
      }
      check(!('panel' in values), values.panel && values.panel.lineNumber, '"panel" is only for single-panel maps');
      return atLine(section.lineNumber, () => model.createGlobalMap({ panelHexes, tileScale, name }));
    }
    check(kind.value === 'local', kind.lineNumber, `Map kind must be "global", "panel" or "local", found "${kind.value}"`);
    check(!('panel' in values), values.panel && values.panel.lineNumber, '"panel" is only for single-panel maps');
    check(!('tileScale' in values), values.tileScale && values.tileScale.lineNumber, '"tileScale" is only for global maps');
    const anchor = requireValue(values, 'anchor', section);
    const system = requireValue(values, 'system', section);
    const size = requireValue(values, 'size', section);
    check(system.value in lattice.SCALES, system.lineNumber, `Unknown scale system "${system.value}"`);
    check(size.value in lattice.SCALES[system.value].sizes, size.lineNumber, `Unknown ${system.value} size "${size.value}"`);
    return atLine(section.lineNumber, () => model.createLocalMap({
      width: parseInteger(requireValue(values, 'width', section), 'width'),
      height: parseInteger(requireValue(values, 'height', section), 'height'),
      systemName: system.value,
      scaleName: size.value,
      anchor: atLine(anchor.lineNumber, () => coordinates.parseUniversal(anchor.value)),
      panelHexes,
      name,
      isFlat,
    }));
  }

  // [legend] lines "<char> <terrain key>"; returns Map char → terrain id.
  function parseLegend(section) {
    const byChar = new Map();
    const keys = new Set();
    for (const { lineNumber, text } of section.lines) {
      const match = /^(\S)\s+(\S+)$/.exec(text);
      check(match !== null, lineNumber, `Expected "<char> <terrain>" in [legend], found "${text}"`);
      const [, char, key] = match;
      check(!FORBIDDEN_TERRAIN_CHARS.includes(char), lineNumber, `"${char}" cannot stand for a terrain`);
      const item = terrain.byKey(key);
      check(item !== null, lineNumber, `Unknown terrain "${key}"`);
      check(!byChar.has(char), lineNumber, `Character "${char}" is defined twice`);
      check(!keys.has(key), lineNumber, `Terrain "${key}" is defined twice`);
      byChar.set(char, item.id);
      keys.add(key);
    }
    return byChar;
  }

  function defaultLegend() {
    return new Map(terrain.TERRAINS.map((item) => [item.char, item.id]));
  }

  // Reads a terrain grid section into Doc.terrainIds.
  function parseGrid(doc, section, grid, legend, extraKeys) {
    const { values, next } = readKeyValues(section, ['columns', 'rows', ...extraKeys]);
    const where = `[${section.name}${section.argument ? ' ' + section.argument : ''}]`;
    const columnCount = parseInteger(requireValue(values, 'columns', section), 'columns');
    const rowCount = parseInteger(requireValue(values, 'rows', section), 'rows');
    check(columnCount === grid.columnCount, values.columns.lineNumber, `${where} must have columns = ${grid.columnCount}, found ${columnCount}`);
    check(rowCount === grid.rowCount, values.rows.lineNumber, `${where} must have rows = ${grid.rowCount}, found ${rowCount}`);
    if (values.latticeColumn) {
      check(parseInteger(values.latticeColumn, 'latticeColumn') === grid.latticeColumn, values.latticeColumn.lineNumber,
        `${where} must have latticeColumn = ${grid.latticeColumn}`);
    }
    if (values.latticeRow) {
      check(parseInteger(values.latticeRow, 'latticeRow') === grid.latticeRow, values.latticeRow.lineNumber,
        `${where} must have latticeRow = ${grid.latticeRow}`);
    }
    const rows = section.lines.slice(next);
    check(rows.length === rowCount, rows.length > rowCount ? rows[rowCount].lineNumber : section.lineNumber,
      `${where} has ${rows.length} terrain rows, expected ${rowCount}`);
    rows.forEach(({ lineNumber, text }, row) => {
      check(text.length === columnCount, lineNumber, `Terrain row is ${text.length} characters wide, expected ${columnCount}`);
      for (let column = 0; column < columnCount; column++) {
        const char = text[column];
        const tileIndex = grid.tileIndices[row * columnCount + column];
        if (tileIndex < 0) {
          check(char === RESERVED, lineNumber, `Column ${column + 1} is not a tile of this panel and must be "${RESERVED}", found "${char}"`);
          continue;
        }
        check(char !== RESERVED, lineNumber, `Column ${column + 1} is a tile and needs a terrain character, found "${RESERVED}"`);
        const id = legend.get(char);
        check(id !== undefined, lineNumber, `Unknown terrain character "${char}" in column ${column + 1}`);
        doc.terrainIds[tileIndex] = id;
      }
    });
  }

  function expectNoTokens(tokens, lineNumber) {
    check(tokens.length === 0, lineNumber, `Unexpected "${tokens.length ? (tokens[0].key ? tokens[0].key + '=' : '') + tokens[0].value : ''}"`);
  }

  function takePairs(tokens, allowed, lineNumber) {
    const pairs = {};
    for (let index = 0; index < tokens.length;) {
      const token = tokens[index];
      if (token.kind !== 'pair') {
        index++;
        continue;
      }
      check(allowed.includes(token.key), lineNumber, `Unknown option "${token.key}"`);
      check(!(token.key in pairs), lineNumber, `Duplicate option "${token.key}"`);
      pairs[token.key] = token.value;
      tokens.splice(index, 1);
    }
    return pairs;
  }

  function takeString(tokens, lineNumber, what, required) {
    const index = tokens.findIndex((token) => token.kind === 'string');
    check(index >= 0 || !required, lineNumber, `Missing quoted ${what}`);
    return index < 0 ? '' : tokens.splice(index, 1)[0].value;
  }

  // "<location> <type> ["name"] [notes="…"]"
  function parseLandmarks(doc, section) {
    for (const { lineNumber, text } of section.lines) {
      const tokens = tokenize(text, lineNumber);
      const { tileIndex } = parseLocation(doc, takeWords(tokens, 3), lineNumber);
      const type = takeWords(tokens, 1);
      check(type.length === 1, lineNumber, 'Missing landmark type');
      const pairs = takePairs(tokens, ['notes'], lineNumber);
      const name = takeString(tokens, lineNumber, 'name', false);
      expectNoTokens(tokens, lineNumber);
      check(!doc.landmarks.has(tileIndex), lineNumber, `A landmark already exists at ${formatLocation(doc, tileIndex)} (one per tile)`);
      atLine(lineNumber, () => model.setLandmark(doc, tileIndex, { type: type[0], name, notes: pairs.notes === undefined ? '' : pairs.notes }));
    }
  }

  // "<location> <category> [id=…] [size=…] [rot=…] [dx=…] [dy=…] "text""
  function parseLabels(doc, section) {
    for (const { lineNumber, text } of section.lines) {
      const tokens = tokenize(text, lineNumber);
      const { tileIndex } = parseLocation(doc, takeWords(tokens, 3), lineNumber);
      const category = takeWords(tokens, 1);
      check(category.length === 1, lineNumber, 'Missing label category');
      const pairs = takePairs(tokens, ['id', 'size', 'rot', 'dx', 'dy'], lineNumber);
      const labelText = takeString(tokens, lineNumber, 'label text', true);
      expectNoTokens(tokens, lineNumber);
      const props = { tileIndex, text: labelText, category: category[0] };
      if (pairs.id !== undefined) {
        props.id = pairs.id;
      }
      for (const [key, prop] of [['size', 'size'], ['rot', 'rotation'], ['dx', 'dx'], ['dy', 'dy']]) {
        if (pairs[key] !== undefined) {
          props[prop] = parseNumber(pairs[key], key, lineNumber);
        }
      }
      atLine(lineNumber, () => model.addLabel(doc, props));
    }
  }

  // "<type> <id> [style=…] ["name"] : <location>; [<panel>] <east> <north>; …"
  function parseOverlays(doc, section) {
    for (const { lineNumber, text } of section.lines) {
      const tokens = tokenize(text, lineNumber);
      const colon = tokens.findIndex((token) => token.kind === 'punct' && token.value === ':');
      check(colon >= 0, lineNumber, 'Missing ":" before the overlay points');
      const headerTokens = tokens.slice(0, colon);
      const points = tokens.slice(colon + 1);
      const headerFields = takeWords(headerTokens, 2);
      check(headerFields.length === 2, lineNumber, 'Expected "<type> <id>" before the overlay name');
      const pairs = takePairs(headerTokens, ['style'], lineNumber);
      const name = takeString(headerTokens, lineNumber, 'name', false);
      expectNoTokens(headerTokens, lineNumber);
      const tileIndices = [];
      let panelId = null;
      let words = [];
      for (let index = 0; index <= points.length; index++) {
        const token = points[index];
        if (token === undefined || (token.kind === 'punct' && token.value === ';')) {
          check(words.length > 0, lineNumber, `Empty overlay point ${tileIndices.length + 1}`);
          const point = parseLocation(doc, words, lineNumber, panelId);
          tileIndices.push(point.tileIndex);
          panelId = point.panelId;
          words = [];
          continue;
        }
        check(token.kind === 'word', lineNumber, `Unexpected "${token.value}" in overlay point ${tileIndices.length + 1}`);
        words.push(token.value);
      }
      atLine(lineNumber, () => model.addOverlay(doc, {
        type: headerFields[0], id: headerFields[1], name, style: pairs.style === undefined ? '' : pairs.style, tileIndices,
      }));
    }
  }

  // Text → document. Throws an Error with lineNumber (1-based) on the first problem.
  function parse(text) {
    util.assertCondition(typeof text === 'string', 'Map file text must be a string');
    const sections = splitSections(text);
    const seen = new Map();
    for (const section of sections) {
      const key = section.name === 'panel' ? `panel ${section.argument.toLowerCase()}` : section.name;
      check(['map', 'legend', 'panel', 'local', 'landmarks', 'labels', 'overlays'].includes(section.name), section.lineNumber,
        `Unknown section [${section.name}]`);
      check(section.name === 'panel' || section.argument === '', section.lineNumber, `[${section.name}] takes no argument`);
      check(!seen.has(key), section.lineNumber, `Duplicate section [${section.name}${section.argument ? ' ' + section.argument : ''}] (first on line ${seen.get(key)})`);
      seen.set(key, section.lineNumber);
    }
    const mapSection = sections.find((section) => section.name === 'map');
    check(mapSection !== undefined, 0, 'Missing [map] section');
    check(sections[0] === mapSection, sections[0].lineNumber, '[map] must be the first section');
    const doc = createDocument(mapSection, sections.some((section) => section.name === 'local'));
    const legendSection = sections.find((section) => section.name === 'legend');
    const legend = legendSection ? parseLegend(legendSection) : defaultLegend();
    if (doc.topo) {
      const built = projection.build();
      const remaining = new Set(doc.topo.panelIds);
      for (const section of sections) {
        if (section.name === 'local') {
          throw fileError(section.lineNumber, '[local] is only for local maps');
        }
        if (section.name === 'panel') {
          const panelId = coordinates.panelIdByName(section.argument);
          check(panelId !== null, section.lineNumber, `Unknown panel "${section.argument}"`);
          check(doc.topo.panelIds.includes(panelId), section.lineNumber, `Panel "${section.argument}" is outside this map`);
          parseGrid(doc, section, panelGrid(doc.topo, panelId), legend, ['latticeColumn', 'latticeRow']);
          remaining.delete(panelId);
        }
      }
      check(remaining.size === 0, 0, `Missing panel sections: ${greekPanelOrder().filter((panelId) => remaining.has(panelId)).map((panelId) => built.panels[panelId].name).join(', ')}`);
    } else {
      for (const section of sections) {
        check(section.name !== 'panel', section.lineNumber, '[panel …] is only for global maps and local maps that cross panel seams');
      }
      const localSection = sections.find((section) => section.name === 'local');
      check(localSection !== undefined, 0, 'Missing [local] section');
      parseGrid(doc, localSection, localGrid(doc), legend, []);
    }
    for (const section of sections) {
      if (section.name === 'landmarks') {
        parseLandmarks(doc, section);
      } else if (section.name === 'labels') {
        parseLabels(doc, section);
      } else if (section.name === 'overlays') {
        parseOverlays(doc, section);
      }
    }
    doc.revision = 0;
    return doc;
  }

  // A file name from the map name: "<name>.map.txt" with unsafe characters replaced.
  function fileName(doc) {
    const base = doc.name.trim().replace(/[^A-Za-z0-9 _.-]+/g, '_').replace(/\s+/g, '-').replace(/^[.-]+/, '');
    return (base || 'map') + FILE_EXTENSION;
  }

  rpgMap.FileFormat = Object.freeze({
    MAGIC,
    FILE_EXTENSION,
    quote,
    tokenize,
    coordinateDecimals,
    write,
    parse,
    fileName,
  });
})(globalThis);
</script>

<script data-module="Regions">
(function (root) {
  'use strict';
  const rpgMap = root.RpgMap = root.RpgMap || {};
  const { Util: util, Projection: projection, Lattice: lattice, Terrain: terrain, Model: model, View: view } = rpgMap;
  const { assertCondition } = util;
  const TOLERANCE = 1e-8;

  // Export geometry is in hex heights, y north/up, regardless of physical scale.
  function outlineShape(doc, panelId) {
    const geometry = view.mapGeometry(doc);
    assertCondition(doc.local ? panelId === 'local' : Object.hasOwn(geometry.panels, panelId), 'Choose a valid export panel');
    return view.getFrameOutline(geometry, panelId).map((point) => util.scale(point, 1 / geometry.d));
  }

  // Trace directed edges, keeping the region/land on the left. Open chains are
  // visited first; remaining edges are closed outer rings or holes.
  function tracePaths(edges, points) {
    const outgoing = new Map(), incoming = new Map();
    for (const edge of edges) {
      assertCondition(!outgoing.has(edge.indexA) && !incoming.has(edge.indexB), 'Ambiguous region boundary');
      outgoing.set(edge.indexA, edge);
      incoming.set(edge.indexB, edge);
    }
    const seen = new Set(), paths = [];
    for (const first of [...edges.filter((edge) => !incoming.has(edge.indexA)), ...edges]) {
      if (seen.has(first)) {
        continue;
      }
      const pathPoints = [points[first.indexA]];
      let edge = first;
      while (edge && !seen.has(edge)) {
        seen.add(edge);
        pathPoints.push(points[edge.indexB]);
        edge = outgoing.get(edge.indexB);
      }
      assertCondition(!edge || edge === first, 'Region boundary joins a different chain');
      paths.push({ points: pathPoints, isClosed: edge === first });
    }
    return paths;
  }

  function build(doc, panelId = doc.local ? 'local' : doc.global.panelId || null) {
    const geometry = view.mapGeometry(doc);
    const outline = outlineShape(doc, panelId);
    const toHex = [1 / geometry.d, 0, 0, 1 / geometry.d, 0, 0];
    let data;
    if (geometry.span && panelId === 'local') {
      // A local map spanning seams: each panel's part is built in its own unfolded place.
      // Parts are not stitched, so regions and shorelines stop at the seams.
      data = { points: [], cells: [], edges: [], regions: [], shorelines: [] };
      for (const [partId, placement] of Object.entries(geometry.span.placements)) {
        const partToHex = projection.composeTransforms(placement.frameToWorld, toHex);
        const part = buildPart(doc, geometry, partId, partToHex,
          placement.frameOutline.map((point) => projection.applyTransform(partToHex, point)));
        const points = data.points.length, cells = data.cells.length, regions = data.regions.length;
        for (const edge of part.edges) {
          edge.indexA += points;
          edge.indexB += points;
          edge.cellIndices = edge.cellIndices.map((cellIndex) => cellIndex + cells);
        }
        for (const cell of part.cells) {
          cell.vertexIndices = cell.vertexIndices.map((vertex) => vertex + points);
          cell.regionIndex += regions;
        }
        data.points.push(...part.points);
        data.cells.push(...part.cells);
        data.edges.push(...part.edges);
        data.regions.push(...part.regions);
        data.shorelines.push(...part.shorelines);
      }
    } else {
      data = buildPart(doc, geometry, panelId, toHex, outline);
    }
    return { panelId, outline, bounds: view.boundsOf(outline), ...data };
  }

  // Cells, regions and shorelines of panelId's tiles: panelToHex maps its frame to
  // export units, and clip (export units) bounds the drawing.
  function buildPart(doc, geometry, panelId, panelToHex, clip) {
    const points = [], cells = [], edges = [];
    const buckets = new Map(), edgesByVertices = new Map();
    // Adjacent hexes and clipped seam copies can differ in their last float bits.
    // Check neighbouring buckets too, rather than relying on rounded equality.
    // Buckets are nested numeric maps (x, then y) to avoid string keys at L scale.
    const vertex = (point) => {
      const columnIndex = Math.floor(point[0] / TOLERANCE), rowIndex = Math.floor(point[1] / TOLERANCE);
      for (let dx = -1; dx <= 1; dx++) {
        const column = buckets.get(columnIndex + dx);
        if (!column) {
          continue;
        }
        for (let dy = -1; dy <= 1; dy++) {
          for (const vertex of column.get(rowIndex + dy) || []) {
            if (util.pointDistance(point, points[vertex]) <= TOLERANCE) {
              return vertex;
            }
          }
        }
      }
      const vertex = points.length;
      points.push(point);
      const column = buckets.get(columnIndex) || buckets.set(columnIndex, new Map()).get(columnIndex);
      (column.get(rowIndex) || column.set(rowIndex, []).get(rowIndex)).push(vertex);
      return vertex;
    };
    for (const group of view.panelTileGroups(geometry, panelId)) {
      const toHex = projection.composeTransforms(group.toPanel, panelToHex);
      for (const tileIndex of group.tileIndices) {
        const tile = geometry.tiles[tileIndex];
        const polygons = tile.pieces
          ? tile.pieces.filter((piece) => piece.panelId === panelId).map((piece) => piece.polygon)
          : [lattice.hexPolygon(tile.center, geometry.d)];
        for (const polygon of polygons) {
          const mapped = polygon.map((point) => projection.applyTransform(toHex, point));
          const clipped = util.clipPolygonToConvex(mapped, clip);
          if (clipped.length < 3 || Math.abs(util.polygonArea(clipped)) < 1e-12) {
            continue;
          }
          const vertices = clipped.map(vertex);
          const vertexIndices = vertices.filter((vertex, index) => vertex !== vertices[(index + 1) % vertices.length]);
          if (vertexIndices.length < 3) {
            continue;
          }
          const cell = { tileIndex, terrainId: model.getTerrain(doc, tileIndex), vertexIndices, edges: [] };
          const cellIndex = cells.length;
          cells.push(cell);
          for (const [indexA, indexB] of util.boundary(vertexIndices)) {
            const key = indexA < indexB ? `${indexA}:${indexB}` : `${indexB}:${indexA}`;
            let edge = edgesByVertices.get(key);
            if (!edge) {
              edge = { indexA, indexB, cellIndices: [] };
              edgesByVertices.set(key, edge);
              edges.push(edge);
            } else {
              assertCondition(edge.cellIndices.length === 1 && edge.indexA === indexB && edge.indexB === indexA, 'Overlapping export tiles');
            }
            edge.cellIndices.push(cellIndex);
            cell.edges.push(edge);
          }
        }
      }
    }
    const cellRegions = new Int32Array(cells.length).fill(-1), regions = [];
    for (let start = 0; start < cells.length; start++) {
      if (cellRegions[start] !== -1) {
        continue;
      }
      const regionIndex = regions.length, terrainId = cells[start].terrainId;
      const queue = [start], tiles = new Set(), boundary = [];
      cellRegions[start] = regionIndex;
      for (let head = 0; head < queue.length; head++) {
        const cellIndex = queue[head], cell = cells[cellIndex];
        tiles.add(cell.tileIndex);
        for (const edge of cell.edges) {
          const otherIndex = edge.cellIndices.find((index) => index !== cellIndex);
          if (otherIndex === undefined || cells[otherIndex].terrainId !== terrainId) {
            boundary.push(edge.cellIndices[0] === cellIndex ? edge : { indexA: edge.indexB, indexB: edge.indexA });
          } else if (cellRegions[otherIndex] === -1) {
            cellRegions[otherIndex] = regionIndex;
            queue.push(otherIndex);
          }
        }
      }
      const paths = tracePaths(boundary, points);
      assertCondition(paths.every((path) => path.isClosed), 'Unclosed terrain region');
      regions.push({ terrainId, tileIndices: [...tiles], loops: paths.map((path) => path.points) });
    }
    cells.forEach((cell, cellIndex) => {
      cell.regionIndex = cellRegions[cellIndex];
    });
    const shoreEdges = [];
    for (const edge of edges) {
      if (edge.cellIndices.length !== 2) {
        continue; // An export boundary has no water on its other side.
      }
      const firstWater = terrain.isWater(cells[edge.cellIndices[0]].terrainId);
      const secondWater = terrain.isWater(cells[edge.cellIndices[1]].terrainId);
      if (firstWater !== secondWater) {
        shoreEdges.push(firstWater ? { indexA: edge.indexB, indexB: edge.indexA } : edge);
      }
    }
    return { points, cells, edges, regions, shorelines: tracePaths(shoreEdges, points) };
  }

  // Chaikin corner cutting, preserving the endpoints of panel-clipped coastlines.
  function smoothPath(path, passes = 2) {
    assertCondition(Number.isInteger(passes) && passes >= 0 && passes <= 3, 'Shoreline smoothing needs 0 to 3 passes');
    let points = path.points.map((point) => [...point]);
