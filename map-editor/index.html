      const width = Math.max(1, Number(widthInput.value) || 1);
      const height = Math.max(1, Number(heightInput.value) || 1);
      anchor.value = coordinates.formatUniversal(coordinates.makeLocation(center.panelId,
        center.east - (width - 1) / 2 * lattice.columnSpacing(newMiles), center.north + (height - 1) / 2 * newMiles), 10);
    };
    const preview = element('p', { id: 'crop-map-preview', className: 'tool-help' });
    const errorText = element('p', { id: 'crop-map-error', className: 'dialog-error', role: 'alert' });
    const openButton = element('button', { id: 'crop-open', type: 'submit', className: 'tool-button', textContent: 'Open crop' });
    const panelField = field('crop-panel', 'Panel', panel);
    const localFields = element('div', {}, [
      field('crop-width', 'Width (hexes)', widthInput), field('crop-height', 'Height (hexes)', heightInput),
      field('crop-anchor', 'Anchor of tile (0, 0), in miles', anchor),
    ]);
    const form = element('form', { id: 'crop-map-form', noValidate: true }, [
      element('h2', { id: 'crop-map-title', textContent: 'Crop map' }),
      field('crop-name', 'Name', name),
      field('crop-kind', 'Crop shape', kind), panelField,
      field('crop-scale', 'Hex size', scale),
      localFields,
      element('p', { className: 'tool-help', textContent: 'Larger hexes take the most common terrain of the tiles they cover; smaller hexes repeat the tile they lie in. Landmarks, labels, roads, trails and rivers are copied where they fall inside the crop.' }),
      preview, errorText,
      element('div', { className: 'property-actions' }, [
        openButton,
        actionButton('crop-download', 'Download', () => submit(false)),
        actionButton('crop-cancel', 'Cancel', () => dialog.close()),
      ]),
    ]);
    const options = () => {
      const [systemName, scaleName] = scale.value.split(' ');
      if (kind.value === 'panel') {
        return { kind: 'panel', name: name.value, panelId: panel.value, systemName, scaleName };
      }
      return {
        name: name.value, width: Number(widthInput.value), height: Number(heightInput.value), systemName, scaleName,
        anchor: coordinates.parseUniversal(anchor.value), panelHexes: doc.global ? doc.global.panelHexes : doc.local.panelHexes,
      };
    };
    function updateScales() {
      const previous = scale.value;
      const options = kind.value === 'panel' ? ['XL', 'L', 'M'].map((size) => ['regional', size])
        : Object.keys(lattice.SCALES).flatMap((systemName) => lattice.SIZES.map((size) => [systemName, size]));
      scale.replaceChildren(...options.map(([systemName, size]) => element('option', {
        value: `${systemName} ${size}`, textContent: scaleText(systemName, size),
      })));
      scale.value = options.some(([systemName, size]) => `${systemName} ${size}` === previous)
        ? previous : 'regional M';
      update();
    }
    function update() {
      errorText.textContent = '';
      const isPanel = kind.value === 'panel';
      panelField.hidden = !isPanel;
      panel.disabled = !isPanel;
      localFields.hidden = isPanel;
      for (const control of [widthInput, heightInput, anchor]) {
        control.disabled = isPanel;
      }
      if (!isPanel) {
        centerAnchor();
      }
      try {
        const checked = options();
        if (!isPanel) {
          coordinates.createLocalMap(checked);
        }
        const ratio = hexMiles / lattice.scaleMiles(checked.systemName, checked.scaleName);
        const ratioText = Math.abs(ratio - 1) < 1e-9 ? 'Same hex size as this map.'
          : ratio > 1 ? `Each hex here becomes about ${util.formatNumber(ratio, 1)} hexes across.`
            : `Each new hex covers about ${util.formatNumber(1 / ratio, 1)} hexes across.`;
        const extent = isPanel ? `The entire ${projection.build().panels[checked.panelId].name} panel, clipped to its outline.`
          : localSpanText(checked);
        preview.textContent = `${ratioText} ${extent} Tiles outside this map start as water.`;
      } catch (caught) {
        preview.textContent = `Check crop settings: ${caught.message}`;
      }
    }
    function submit(open) {
      errorText.textContent = '';
      if (!form.reportValidity()) {
        errorText.textContent = 'Check the highlighted crop settings.';
        return;
      }
      let checked;
      try {
        checked = options();
      } catch (caught) {
        errorText.textContent = caught.message;
        return;
      }
      finishResample(dialog, form, preview, errorText, () => resample.crop(doc, checked), open, 'cropped', update);
    }
    form.addEventListener('input', update);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submit(true);
    });
    dialog.replaceChildren(form);
    update();
    state.spaceDown = false;
    dialog.showModal();
  }

  // Changes the tile scale of the open map, resampling terrain and features.
  function rescaleMap() {
    const dialog = root.document.getElementById('rescale-map-dialog');
    if (dialog.open) {
      return;
    }
    if (state.stroke || state.labelDrag) {
      setMessage('Finish the current edit before rescaling');
      return;
    }
    const doc = state.doc;
    const [systemName, scaleName] = currentScale(doc);
    const options = resample.rescaleOptions(doc).filter(([s, z]) => s !== systemName || z !== scaleName);
    const scale = selectControl(options.map(([s, z]) => [`${s} ${z}`, scaleText(s, z)]),
      options.length ? `${options[0][0]} ${options[0][1]}` : '', () => update());
    const preview = element('p', { id: 'rescale-map-preview', className: 'tool-help' });
    const errorText = element('p', { id: 'rescale-map-error', className: 'dialog-error', role: 'alert' });
    const form = element('form', { id: 'rescale-map-form', noValidate: true }, [
      element('h2', { id: 'rescale-map-title', textContent: 'Rescale map' }),
      element('p', { className: 'tool-help', textContent: `Current scale: ${scaleText(systemName, scaleName)}.` }),
      field('rescale-scale', 'New hex size', scale),
      element('p', { className: 'tool-help', textContent: 'Larger hexes take the most common terrain of the tiles they cover; smaller hexes repeat the tile they lie in. Undo history is cleared.' }),
      preview, errorText,
      element('div', { className: 'property-actions' }, [
        element('button', { id: 'rescale-open', type: 'submit', className: 'tool-button', textContent: 'Rescale', disabled: options.length === 0 }),
        actionButton('rescale-download', 'Download', () => submit(false), options.length === 0),
        actionButton('rescale-cancel', 'Cancel', () => dialog.close()),
      ]),
    ]);
    const selected = () => scale.value.split(' ');
    function update() {
      errorText.textContent = '';
      if (options.length === 0) {
        preview.textContent = 'This map has no other tile scale.';
        return;
      }
      try {
        const [newSystem, newScale] = selected();
        if (!doc.local) {
          preview.textContent = doc.kind === 'global' ? 'The whole world at the new tile scale.' : 'The whole panel at the new tile scale.';
          return;
        }
        const options = resample.localRescaleOptions(doc.local, newSystem, newScale);
        preview.textContent = `${options.width} x ${options.height} hexes covering the same ground, keeping the north-west corner. ${localSpanText(options)}`;
      } catch (caught) {
        preview.textContent = `Check the scale: ${caught.message}`;
      }
    }
    function submit(open) {
      const [newSystem, newScale] = selected();
      finishResample(dialog, form, preview, errorText, () => resample.rescale(doc, newSystem, newScale), open, 'rescaled', update);
    }
    form.addEventListener('input', update);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submit(true);
    });
    dialog.replaceChildren(form);
    update();
    state.spaceDown = false;
    dialog.showModal();
  }

  function openMap() {
    if (confirmDiscard('open another map')) {
      root.document.getElementById('open-file').click();
    }
  }

  // Parses map text; returns the document or null after reporting the error.
  function parseMap(text, sourceText) {
    try {
      return fileFormat.parse(text);
    } catch (caught) {
      setMessage(`${sourceText}: ${caught.message}`);
      return null;
    }
  }

  function openFileChosen(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (file) {
      setMessage(`Opening ${file.name}\u2026`);
      file.text().then((text) => runAfterPaint(() => {
        const doc = parseMap(text, `Can't open ${file.name}`);
        if (doc) {
          loadDocument(doc, `Opened ${file.name}`);
          clearAutosave();
        }
      }), (caught) => setMessage(`Can't read ${file.name}: ${caught.message}`));
    }
  }

  function importMap() {
    if (state.stroke || state.labelDrag) {
      setMessage('Finish the current edit before importing');
      return;
    }
    root.document.getElementById('import-file').click();
  }

  function importFileChosen(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) {
      return;
    }
    const target = state.doc;
    const revision = target.revision;
    setMessage(`Importing ${file.name}\u2026`);
    file.text().then((text) => runAfterPaint(() => {
      try {
        if (state.doc !== target || target.revision !== revision || state.stroke || state.labelDrag
          || root.document.querySelector('dialog[open]')) {
          throw new Error('The map changed while reading the file; select the import file again');
        }
        const source = fileFormat.parse(text);
        let result;
        const command = history.perform(state.history, `Import ${file.name}`, (doc, record) => {
          result = resample.merge(source, doc, record);
        });
        if (command) {
          tilesChanged(result.tileIndices);
          state.pathAction = 'select';
          syncSelection();
          buildProperties();
          setHover(state.hoverTile);
        }
        setMessage(result.coveredCount === 0 ? `No overlap with ${file.name}; nothing imported`
          : command ? `Imported ${file.name}: replaced contents of ${countText(result.coveredCount)} (Undo available)`
            : `${file.name}: overlapping contents are already identical`);
      } catch (caught) {
        setMessage(`Can't import ${file.name}: ${caught.message}`);
      }
    }), (caught) => setMessage(`Can't read ${file.name}: ${caught.message}`));
  }

  // Runs work after the browser has painted pending changes (e.g. a busy message),
  // so long synchronous work such as large exports shows feedback first.
  function runAfterPaint(work) {
    root.requestAnimationFrame(() => root.setTimeout(work, 0));
  }

  function setBusy(form, busy) {
    form.setAttribute('aria-busy', String(busy));
    for (const button of form.querySelectorAll('button')) {
      button.disabled = busy;
    }
  }

  function download(text, type, name) {
    const url = root.URL.createObjectURL(new root.Blob([text], { type: type }));
    const link = element('a', { href: url, download: name });
    root.document.body.append(link);
    link.click();
    link.remove();
    root.setTimeout(() => root.URL.revokeObjectURL(url), 0);
  }

  function saveMap() {
    endStroke();
    finishLabelDrag(false);
    const name = fileFormat.fileName(state.doc);
    download(fileFormat.write(state.doc), 'text/plain', name);
    state.savedRevision = state.doc.revision;
    clearAutosave();
    setMessage(`Saved ${name}`);
  }

  function exportMap() {
    const dialog = root.document.getElementById('export-map-dialog');
    if (dialog.open) {
      return;
    }
    if (state.stroke || state.labelDrag) {
      setMessage('Finish the current edit before exporting');
      return;
    }
    const doc = state.doc;
    const geometry = view.mapGeometry(doc);
    const hit = view.hitTest(geometry, state.layout, [state.camera.centerX, state.camera.centerY]);
    const panelId = doc.local ? 'local' : doc.global.panelId || state.layout.focusPanel
      || (state.selectedTile >= 0 ? geometry.tiles[state.selectedTile].panelId : null)
      || (hit ? hit.panelId : Object.keys(projection.SECTOR_LABELS)[0]);
    const panel = selectControl(doc.local ? [['local', 'Whole local map']]
      : Object.keys(projection.SECTOR_LABELS).filter((id) => Object.hasOwn(doc.topo.panels, id))
        .map((id) => [id, projection.build().panels[id].name]), panelId, () => updatePreview());
    panel.disabled = doc.kind !== 'global';
    const widthInput = element('input', { type: 'number', required: true, min: '1', max: String(Number.MAX_SAFE_INTEGER),
      step: '1', value: String(svgExport.DEFAULT_WIDTH) });
    const boxes = {};
    const layerRows = svgExport.LAYER_DEFINITIONS.map(([key, name, defaultEnabled]) => {
      const checked = key === 'terrain' ? state.layers.showTerrain : key === 'grid' ? state.layers.showGrid
        : Object.hasOwn(state.layers, key) ? state.layers[key] : defaultEnabled;
      const box = element('input', { id: `export-${key}`, type: 'checkbox', checked: checked });
      boxes[key] = box;
      return element('label', { className: 'layer-toggle', htmlFor: box.id }, [box, ` ${name}`]);
    });
    const preview = element('p', { id: 'export-map-preview', className: 'tool-help' });
    const errorText = element('p', { id: 'export-map-error', className: 'dialog-error', role: 'alert' });
    const form = element('form', { id: 'export-map-form', noValidate: true }, [
      element('h2', { id: 'export-map-title', textContent: 'Export SVG' }),
      field('export-panel', 'Scope', panel), field('export-width', 'Width (pixels; height keeps aspect ratio)', widthInput),
      element('fieldset', {}, [element('legend', { textContent: 'Include layers' }), ...layerRows]),
      element('p', { className: 'tool-help', textContent: 'Exports north-up, clipped to this panel or the whole local map. Transparent where terrain colours are omitted. Embellishments draw terrain patterns in their own regions; with terrain colours off, filled motifs are white.' }),
      preview, errorText,
      element('div', { className: 'property-actions' }, [
        element('button', { id: 'export-download', type: 'submit', className: 'tool-button', textContent: 'Download SVG' }),
        actionButton('export-cancel', 'Cancel', () => dialog.close()),
      ]),
    ]);
    function updatePreview() {
      boxes.landmarkNames.disabled = !boxes.landmark.checked;
      errorText.textContent = '';
      try {
        const size = svgExport.dimensions(doc, panel.value, Number(widthInput.value), boxes.reference.checked);
        const estimate = svgExport.estimate(doc, panel.value, boxes.embellishment.checked);
        const large = estimate.bytes < LARGE_EXPORT_BYTES ? ''
          : ` Large export: ${estimate.tileCount.toLocaleString('en-US')} tiles, up to about ${util.formatNumber(estimate.bytes / 1e6, 0)} MB; it may take a few seconds.`
            + (boxes.embellishment.checked ? ' Turning off embellishments makes it much smaller.' : '');
        preview.textContent = `${size.width} x ${size.height} px - ${svgExport.fileName(doc, panel.value)}. Export does not save or change the map.${large}`;
      } catch (caught) {
        preview.textContent = `Check export settings: ${caught.message}`;
      }
    }
    form.addEventListener('input', updatePreview);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorText.textContent = '';
      if (!form.reportValidity()) {
        errorText.textContent = 'Check the highlighted export settings.';
        return;
      }
      const options = {
        panelId: panel.value, width: Number(widthInput.value),
        layers: Object.fromEntries(Object.entries(boxes).map(([key, box]) => [key, box.checked])),
      };
      setBusy(form, true);
      preview.textContent = 'Exporting\u2026';
      runAfterPaint(() => {
        try {
          const start = root.performance.now();
          const text = svgExport.write(doc, options);
          const name = svgExport.fileName(doc, options.panelId);
          download(text, 'image/svg+xml;charset=utf-8', name);
          dialog.close();
          setMessage(`Exported ${name} (${util.formatNumber(text.length / 1e6, 1)} MB, ${util.formatNumber((root.performance.now() - start) / 1000, 1)} s)`);
        } catch (caught) {
          updatePreview();
          errorText.textContent = `Export failed: ${caught.message}`;
        } finally {
          setBusy(form, false);
        }
      });
    });
    dialog.replaceChildren(form);
    updatePreview();
    state.spaceDown = false;
    dialog.showModal();
  }

  // Autosave keeps unsaved work in localStorage; it is cleared on save, open and new.
  function scheduleAutosave() {
    root.clearTimeout(state.autosaveTimer);
    state.autosaveTimer = root.setTimeout(autosave, AUTOSAVE_DELAY_MS);
  }

  function autosave() {
    root.clearTimeout(state.autosaveTimer);
    state.autosaveTimer = 0;
    // Keep the earlier autosave while its restore offer is still showing.
    if (!isDirty() || !root.document.getElementById('restore-banner').hidden) {
      return;
    }
    try {
      // Persisted field names are a compatibility contract, not variable names.
      root.localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ 'szText': fileFormat.write(state.doc), 'nTime': Date.now() }));
    } catch (caught) {
      setMessage(`Autosave failed: ${caught.message}`);
    }
  }

  function clearAutosave() {
    root.clearTimeout(state.autosaveTimer);
    state.autosaveTimer = 0;
    root.document.getElementById('restore-banner').hidden = true;
    try {
      root.localStorage.removeItem(AUTOSAVE_KEY);
    } catch (caught) {
      // Storage unavailable: nothing to clear.
    }
  }

  function readAutosave() {
    try {
      const saved = JSON.parse(root.localStorage.getItem(AUTOSAVE_KEY) || 'null');
      return saved && typeof saved['szText'] === 'string'
        ? { text: saved['szText'], timestamp: saved['nTime'] } : null;
    } catch (caught) {
      return null;
    }
  }

  function offerRestore() {
    const saved = readAutosave();
    const banner = root.document.getElementById('restore-banner');
    if (!saved) {
      return;
    }
    const doc = parseMap(saved.text, 'Autosave is unreadable');
    if (!doc) {
      clearAutosave();
      return;
    }
    root.document.getElementById('restore-text').textContent =
      `Unsaved map "${doc.name || 'Untitled'}" from ${new Date(saved.timestamp).toLocaleString()} was found.`;
    root.document.getElementById('restore-accept').onclick = () => {
      if (confirmDiscard('restore the autosaved map')) {
        banner.hidden = true;
        loadDocument(doc, 'Restored unsaved work', true);
      }
    };
    root.document.getElementById('restore-discard').onclick = () => {
      banner.hidden = true;
      clearAutosave();
      setMessage('Discarded the autosaved map');
      if (isDirty()) {
        scheduleAutosave();
      }
    };
    banner.hidden = false;
  }

  function fitNet() {
    view.fitBounds(state.camera, state.layout.bounds);
    requestDraw();
  }

  // Fits the focus panel, or in the net view the panel under the view centre.
  function fitPanel() {
    if (state.doc.local) {
      fitNet();
      return;
    }
    let panelId = state.layout.focusPanel;
    if (!panelId) {
      const hit = view.placementAt(state.layout, [state.camera.centerX, state.camera.centerY]);
      panelId = hit ? hit.placement.panelId : null;
    }
    if (panelId) {
      view.fitBounds(state.camera, view.findPlacement(state.layout, panelId).bounds);
    } else {
      view.fitBounds(state.camera, state.layout.bounds);
    }
    requestDraw();
  }

  // Switches to the focus view of panelId, keeping framePoint (a point in that panel's
  // frame) at the view centre, or fitting the panel when framePoint is null.
  function showFocus(panelId, framePoint = null) {
    if (state.doc.kind !== 'global') {
      setMessage('Panel focus with neighbours is only available for global world maps');
      return;
    }
    state.layout = view.buildFocusLayout(panelId);
    if (framePoint) {
      view.centerOn(state.camera, framePoint);
    } else {
      view.fitBounds(state.camera, view.findPlacement(state.layout, panelId).bounds);
    }
    syncControls();
    requestDraw();
  }

  // Back to the net, keeping the current view centre where it was on the focus panel.
  function showNet() {
    if (state.doc.kind !== 'global') {
      setMessage('This map has no world net view; use Fit all');
      return;
    }
    if (state.layout.mode === 'focus') {
      const frame = projection.build().frames[state.layout.focusPanel];
      const center = projection.applyTransform(frame.frameToNet, [state.camera.centerX, state.camera.centerY]);
      state.layout = view.buildNetLayout();
      view.centerOn(state.camera, center);
    }
    syncControls();
    requestDraw();
  }

  function focusAtViewCenter() {
    if (state.doc.kind !== 'global') {
      setMessage('Panel focus with neighbours is only available for global world maps');
      return;
    }
    const hit = view.placementAt(state.layout, [state.camera.centerX, state.camera.centerY]);
    if (hit) {
      showFocus(hit.placement.panelId, hit.framePoint);
    }
  }

  function syncControls() {
    const select = root.document.getElementById('focus-panel');
    select.value = state.layout.focusPanel || '';
    const isolated = state.doc.kind !== 'global';
    select.disabled = isolated;
    root.document.getElementById('view-net').disabled = isolated;
    root.document.getElementById('fit-panel').disabled = state.doc.kind === 'local';
    state.miniCanvas.setAttribute('aria-label', state.doc.local ? 'Local map navigator' : isolated ? 'Single panel navigator' : 'Net navigator');
    root.document.getElementById('view-net').setAttribute('aria-pressed', String(state.layout.mode === 'net'));
  }

  function buildToolbar() {
    const built = projection.build();
    const greek = Object.keys(projection.SECTOR_LABELS);
    const select = element('select', { id: 'focus-panel', title: 'Focus view: one panel north-up with its neighbours unfolded' }, [
      element('option', { value: '', textContent: 'Focus panel\u2026' }),
      ...greek.map((panelId) => element('option', { value: panelId, textContent: `${built.panels[panelId].letter} ${built.panels[panelId].name}` })),
    ]);
    select.addEventListener('change', () => (select.value ? showFocus(select.value) : showNet()));
    const openInput = element('input', { id: 'open-file', type: 'file', accept: `.txt,${fileFormat.FILE_EXTENSION},text/plain`, hidden: true });
    openInput.addEventListener('change', () => openFileChosen(openInput));
    const importInput = element('input', { id: 'import-file', type: 'file', accept: `.txt,${fileFormat.FILE_EXTENSION},text/plain`, hidden: true });
    importInput.addEventListener('change', () => importFileChosen(importInput));
    const buttons = [
      element('button', { id: 'file-new', type: 'button', textContent: 'New', title: 'Create a global world, single panel or local map', onclick: newMap }),
      element('button', { id: 'file-open', type: 'button', textContent: 'Open\u2026', title: 'Open a .map.txt file (Ctrl+O)', onclick: openMap }),
      element('button', { id: 'file-import', type: 'button', textContent: 'Import / merge\u2026', title: 'Replace overlapping terrain and features from another map at this map\'s hex size; Undo available', onclick: importMap }),
      element('button', { id: 'file-save', type: 'button', textContent: 'Save', title: 'Download the map as a .map.txt file (Ctrl+S)', onclick: saveMap }),
      element('button', { id: 'file-export', type: 'button', textContent: 'Export SVG', title: 'Export one panel or a local map as SVG', onclick: exportMap }),
      element('button', { id: 'file-crop', type: 'button', textContent: 'Crop\u2026', title: 'Copy a rectangle or entire panel into a new map, optionally at another hex size', onclick: cropMap }),
      element('button', { id: 'file-rescale', type: 'button', textContent: 'Rescale\u2026', title: 'Change the tile scale of this map', onclick: rescaleMap }),
      openInput, importInput,
      element('span', { className: 'toolbar-gap' }),
      element('button', { id: 'view-net', type: 'button', textContent: 'Net view', title: 'Show the whole net (N)', onclick: showNet }),
      select,
      element('button', { id: 'fit-net', type: 'button', textContent: 'Fit all', title: 'Fit the whole view (Home)', onclick: fitNet }),
      element('button', { id: 'fit-panel', type: 'button', textContent: 'Fit panel', title: 'Fit the focus panel or the panel at the centre (F)', onclick: fitPanel }),
      element('span', { className: 'toolbar-gap' }),
      element('button', { id: 'undo', type: 'button', textContent: 'Undo', title: 'Undo (Ctrl+Z)', onclick: () => undoOrRedo(true) }),
      element('button', { id: 'redo', type: 'button', textContent: 'Redo', title: 'Redo (Ctrl+Y or Ctrl+Shift+Z)', onclick: () => undoOrRedo(false) }),
    ];
    root.document.getElementById('toolbar-actions').replaceChildren(...buttons);
  }

  function buildLayerList() {
    const rows = LAYER_TOGGLES.map(([key, label]) => {
      const box = element('input', { type: 'checkbox', checked: state.layers[key], id: `layer-${key}` });
      box.disabled = key === 'showNames' && state.doc.kind === 'local' && !state.doc.topo;
      box.addEventListener('change', () => {
        state.layers[key] = box.checked;
        buildProperties();
        requestDraw();
      });
      return element('label', { className: 'layer-toggle' }, [box, ` ${key === 'showOutlines' && state.doc.local ? 'Map outline' : label}`]);
    });
    root.document.getElementById('layer-list').replaceChildren(...rows);
  }

  function buildToolList() {
    const buttons = TOOLS.map(([id, label, , title]) =>
      element('button', { id: `tool-${id}`, type: 'button', className: 'tool-button', textContent: label, title: title, onclick: () => setTool(id) }));
    const slider = element('input', { id: 'brush-radius', type: 'range', min: '0', max: String(edit.MAX_BRUSH_RADIUS), step: '1', value: String(state.brushRadius) });
    slider.addEventListener('input', () => setBrushRadius(Number(slider.value)));
    const brushOptions = element('div', { id: 'brush-options', className: 'tool-option' }, [
      element('label', { htmlFor: 'brush-radius', title: 'Brush radius in tiles ([ and ])' }, ['Radius ']),
      slider,
      element('span', { id: 'brush-radius-value', textContent: String(state.brushRadius) }),
    ]);
    const activeTerrain = element('div', { className: 'tool-option', title: 'Active terrain: click a terrain under Properties to change it' }, [
      element('span', { id: 'active-terrain-swatch', className: 'swatch' }),
      element('span', { id: 'active-terrain-name' }),
    ]);
    root.document.getElementById('tool-list').replaceChildren(
      element('div', { className: 'tool-buttons' }, buttons), brushOptions, activeTerrain,
      element('div', { id: 'feature-options' }));
  }

  function buildLegend() {
    const rows = terrain.TERRAINS.map((item) => {
      const row = element('div', { className: 'legend-row', role: 'radio', tabIndex: 0, title: `Paint with ${item.name}` }, [
        element('span', { className: 'swatch', style: `background:${item.color}` }),
        element('code', { textContent: item.char }),
        ` ${item.name}`,
      ]);
      row.dataset.terrain = String(item.id);
      row.addEventListener('click', () => setTerrain(item.id));
      row.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          setTerrain(item.id);
        }
      });
      return row;
    });
    root.document.getElementById('property-list').replaceChildren(
      element('h2', { textContent: 'Terrain' }), element('div', { role: 'radiogroup', ariaLabel: 'Active terrain' }, rows));
  }

  function field(id, title, control) {
    control.id = id;
    return element('label', { className: 'property-field', htmlFor: id }, [
      element('span', { textContent: title }), control,
    ]);
  }

  function selectControl(options, value, onChange) {
    const select = element('select', {}, options.map(([key, text]) => element('option', { value: key, textContent: text })));
    select.value = value;
    select.onchange = () => onChange(select.value);
    return select;
  }

  function actionButton(id, text, onClick, disabled = false) {
    return element('button', { id: id, type: 'button', className: 'tool-button', textContent: text, onclick: onClick, disabled: disabled });
  }

  function featureName(layer, item) {
    return layer === 'label' ? item.text : `${item.type}: ${item.name || item.id || '(unnamed)'}`;
  }

  function selectionTile(selection) {
    const item = edit.getFeature(state.doc, selection);
    return !item ? -1 : selection.layer === 'landmark' ? selection.key
      : selection.layer === 'label' ? item.tileIndex : item.tileIndices[selection.pointIndex || 0];
  }

  function syncSelection() {
    const item = edit.getFeature(state.doc, state.selection);
    if (!item) {
      state.selection = null;
    } else if (state.selection.layer === 'overlay') {
      state.selection.pointIndex = Math.min(state.selection.pointIndex || 0, item.tileIndices.length - 1);
    }
    if (state.selection) {
      state.selectedTile = selectionTile(state.selection);
    }
  }

  function selectFeature(selection) {
    state.selection = selection ? { layer: selection.layer, key: selection.key, pointIndex: selection.pointIndex || 0 } : null;
    syncSelection();
    buildProperties();
    requestDraw();
  }

  function applyFeatureEdit(action, selectChanged = false) {
    try {
      const command = action();
      if (command && selectChanged) {
        const change = command.changes[0];
        state.selection = { layer: change.layer, key: change.key, pointIndex: 0 };
      }
      syncSelection();
      buildProperties();
      if (command) {
        tilesChanged(edit.commandTiles(command));
        setMessage(command.label);
      }
      return true;
    } catch (caught) {
      setMessage(`Can't edit: ${caught.message}`);
      return false;
    }
  }

  function startPath() {
    selectFeature(null);
    state.pathAction = 'new';
    buildProperties();
    setMessage('Click the first tile of the new path');
  }

  function finishPath() {
    state.pathAction = 'select';
    buildProperties();
    setMessage('Path finished; click a path to select it');
  }

  function buildFeatureOptions() {
    const fields = [];
    if (state.tool === 'overlay') {
      fields.push(field('overlay-type', 'New path type', selectControl(
        model.OVERLAY_TYPES.map((type) => [type, type]), state.overlayType, (value) => {
          state.overlayType = value;
          startPath();
        })));
      fields.push(actionButton('path-new', 'New path', startPath));
    } else if (state.tool === 'landmark') {
      fields.push(field('landmark-type', 'New landmark type', selectControl(
        terrain.LANDMARK_TYPES.map((item) => [item.key, item.name]), state.landmarkKey, (value) => { state.landmarkKey = value; })));
    } else if (state.tool === 'label') {
      fields.push(field('label-category', 'New label category', selectControl(
        model.LABEL_CATEGORIES.map((category) => [category, category]), state.labelCategory, (value) => { state.labelCategory = value; })));
      fields.push(actionButton('label-new', 'New label', () => {
        selectFeature(null);
        state.newLabel = true;
        setMessage('Click a tile to add another label');
      }));
    } else if (state.tool === 'select' || state.tool === 'erase') {
      fields.push(field('target-layer', 'Target layer', selectControl([
        ['all', 'Any feature'], ['terrain', 'Terrain'], ['road', 'Roads'], ['trail', 'Trails'], ['river', 'Rivers'],
        ['landmark', 'Landmarks'], ['label', 'Labels'],
      ], state.targetLayer, (value) => {
        state.targetLayer = value;
        state.selectedTile = -1;
        selectFeature(null);
      })));
    }
    root.document.getElementById('feature-options').replaceChildren(...fields);
  }

  function featuresAt(tileIndex, filter = 'all') {
    if (!model.isTile(state.doc, tileIndex)) {
      return [];
    }
    const features = [
      ...model.overlaysAt(state.doc, tileIndex).map((item) => ({ layer: 'overlay', key: item.id, pointIndex: item.tileIndices.indexOf(tileIndex), item })),
      ...[model.getLandmark(state.doc, tileIndex)].filter(Boolean).map((item) => ({ layer: 'landmark', key: tileIndex, item })),
      ...model.labelsAt(state.doc, tileIndex).map((item) => ({ layer: 'label', key: item.id, item })),
    ];
    return features.filter(({ layer, item }) => renderer.featureVisible(state.layers, layer, item)
      && (filter === 'all' || filter === layer || (layer === 'overlay' && filter === item.type)));
  }

  function buildProperties() {
    const showTerrain = ['pan', 'brush', 'fill', 'eyedropper'].includes(state.tool)
      || (['select', 'erase'].includes(state.tool) && state.targetLayer === 'terrain');
    root.document.getElementById('property-list').hidden = !showTerrain;
    const container = root.document.getElementById('feature-properties');
    container.hidden = showTerrain;
    if (showTerrain) {
      return;
    }
    const selection = state.selection;
    const item = edit.getFeature(state.doc, selection);
    const fields = [];
    const atTile = featuresAt(state.selectedTile);
    if (atTile.length > 1) {
      fields.push(field('feature-choice', 'Features on this tile', selectControl(
        atTile.map((entry, index) => [String(index), featureName(entry.layer, entry.item) + (entry.item.id ? ` [${entry.item.id}]` : '')]),
        String(atTile.findIndex((entry) => selection && entry.layer === selection.layer && entry.key === selection.key)),
        (index) => {
          state.pathAction = 'select';
          selectFeature(atTile[Number(index)]);
        })));
    }
    if (!item) {
      const help = state.tool === 'overlay' ? 'Click a tile to start a path, then click to extend. Gaps follow the shortest tile path. Escape finishes.'
        : state.tool === 'landmark' ? 'Click a tile to place a landmark, or an existing symbol to edit it.'
        : state.tool === 'label' ? 'Click a tile to add a label. Select existing text to edit it.'
        : state.tool === 'erase' ? 'Click to erase only the target layer. For overlapping features, use Select and the feature chooser first.'
        : 'Click a feature to inspect it. Hidden layers cannot be selected or erased.';
      fields.push(element('p', { className: 'tool-help', textContent: help }));
      container.replaceChildren(...fields);
      return;
    }
    const { layer, key } = selection;
    fields.push(element('h2', { textContent: featureName(layer, item) }));
    if (!renderer.featureVisible(state.layers, layer, item)) {
      fields.push(element('p', { className: 'tool-help', textContent: 'This layer is hidden. Show it to edit the feature.' }));
      container.replaceChildren(...fields);
      return;
    }
    const editProps = (props) => applyFeatureEdit(() => edit.setFeature(state.history, layer, key, props));
    const textField = (key, title, number = false) => {
      const input = element('input', { type: number ? 'number' : 'text', value: String(item[key]), step: 'any' });
      if (number) {
        input.required = true;
        if (key === 'size') {
          input.min = '0.1';
        }
      }
      input.onchange = () => {
        if (input.reportValidity()) {
          editProps({ [key]: number ? Number(input.value) : input.value });
        }
      };
      fields.push(field(`feature-${key}`, title, input));
    };
    if (layer === 'overlay') {
      fields.push(field('feature-type', 'Type', selectControl(model.OVERLAY_TYPES.map((panelId) => [panelId, panelId]), item.type, (type) => editProps({ type }))));
      textField('name', 'Name');
      textField('style', 'Style (letters, digits, - or _)');
      fields.push(field('path-point', 'Selected point', selectControl(item.tileIndices.map((tileIndex, index) => [
        String(index), `${index + 1}: ${tileLocationText(tileIndex)}`,
      ]), String(selection.pointIndex), (index) => selectFeature({ ...selection, pointIndex: Number(index) }))));
      const pointIndex = selection.pointIndex;
      fields.push(element('div', { className: 'property-actions' }, [
        actionButton('path-extend', 'Extend end', () => {
          setTool('overlay');
          state.pathAction = 'extend';
          buildProperties();
          setMessage('Click a tile to extend the path from its end');
        }),
        actionButton('path-insert', 'Insert after point', () => {
          setTool('overlay');
          state.pathAction = 'insert';
          buildProperties();
          setMessage('Click a tile to insert after the selected point');
        }),
        actionButton('path-remove', 'Remove point', () => applyFeatureEdit(() => edit.removeOverlayPoint(state.history, key, pointIndex))),
        actionButton('path-split', 'Split at point', () => applyFeatureEdit(() => edit.splitOverlay(state.history, key, pointIndex)), pointIndex === 0 || pointIndex === item.tileIndices.length - 1),
        actionButton('path-finish', 'Finish path', finishPath),
      ]));
      fields.push(element('p', { className: 'tool-help', textContent: `Path mode: ${state.pathAction}. Select a point to insert, remove or split. Removing an interior point reroutes around that tile.` }));
      const others = state.doc.overlays.filter((other) => other.id !== key && other.type === item.type);
      if (others.length > 0) {
        const target = selectControl(others.map((other) => [other.id, other.name || other.id]), others[0].id, () => {});
        const fromEnd = selectControl([['end', 'End'], ['start', 'Start']], 'end', () => {});
        const toEnd = selectControl([['start', 'Start'], ['end', 'End']], 'start', () => {});
        fields.push(field('join-target', 'Join to (same type)', target), field('join-from', 'This endpoint', fromEnd), field('join-to', 'Other endpoint', toEnd),
          actionButton('path-join', 'Join paths', () => applyFeatureEdit(() => edit.joinOverlays(state.history, key, target.value, fromEnd.value === 'start', toEnd.value === 'end'))),
          element('p', { className: 'tool-help', textContent: 'Join keeps this path\'s name/style, removes the other path, and bridges any gap.' }));
      }
    } else if (layer === 'landmark') {
      fields.push(field('feature-type', 'Type', selectControl(terrain.LANDMARK_TYPES.map((type) => [type.key, type.name]), item.type, (type) => editProps({ type }))));
      textField('name', 'Name');
      textField('notes', 'Notes (one line)');
      fields.push(locationNote(key));
    } else {
      textField('text', 'Text');
      fields.push(field('feature-category', 'Category', selectControl(model.LABEL_CATEGORIES.map((panelId) => [panelId, panelId]), item.category, (category) => editProps({ category }))));
      textField('size', 'Size (48 units = one hex)', true);
      textField('rotation', 'Rotation (clockwise degrees)', true);
      textField('dx', 'Offset right (units)', true);
      textField('dy', 'Offset down (units)', true);
      fields.push(locationNote(item.tileIndex));
      fields.push(element('p', { className: 'tool-help', textContent: 'Drag the white handle to move; drag the yellow handle to rotate. Escape cancels a drag. Each drag is one undo step.' }));
    }
    fields.push(element('div', { className: 'property-actions' }, [
      actionButton('feature-delete', `Delete ${layer}`, deleteSelected),
    ]));
    container.replaceChildren(...fields);
  }

  function locationNote(tileIndex) {
    return element('p', { className: 'tool-help feature-location', textContent: `${tileLocationText(tileIndex)} \u00b7 ${trueLocationText(tileIndex)}` });
  }

  function deleteSelected() {
    const item = edit.getFeature(state.doc, state.selection);
    if (item && renderer.featureVisible(state.layers, state.selection.layer, item)) {
      const { layer, key } = state.selection;
      state.pathAction = 'select';
      applyFeatureEdit(() => edit.setFeature(state.history, layer, key, null));
    }
  }

  function pickFeature(screen, hit, filter) {
    const feature = renderer.hitFeature(state.renderer, state, screen, filter);
    return feature || (hit ? featuresAt(hit.tileIndex, filter).at(-1) : null);
  }

  function featureClick(screen, hit) {
    const tool = state.tool;
    const filter = tool === 'select' || tool === 'erase' ? state.targetLayer : tool;
    state.selectedTile = hit ? hit.tileIndex : -1;
    if (filter === 'terrain') {
      selectFeature(null);
      if (hit && state.layers.showTerrain) {
        if (tool === 'erase') {
          const command = history.perform(state.history, 'Erase terrain', (doc, record) => record(model.setTerrain(doc, hit.tileIndex, terrain.WATER_ID)));
          tilesChanged(edit.commandTiles(command));
          setMessage(command ? 'Erased terrain' : 'Terrain is already water');
        } else {
          pickTerrain(hit.tileIndex);
        }
      }
      return;
    }
    const feature = pickFeature(screen, hit, filter);
    if (tool === 'erase') {
      if (feature) {
        selectFeature(feature);
        deleteSelected();
      } else {
        setMessage('No visible feature in the target layer here');
      }
      return;
    }
    if (tool === 'select') {
      selectFeature(feature);
      return;
    }
    if (tool === 'overlay' && state.pathAction !== 'select' && state.pathAction !== 'new') {
      const selected = edit.getFeature(state.doc, state.selection);
      if (!selected || state.selection.layer !== 'overlay' || !state.layers[selected.type]) {
        setMessage('Select a visible path first');
        return;
      }
      if (hit) {
        const { key, pointIndex } = state.selection;
        const insert = state.pathAction === 'insert';
        if (applyFeatureEdit(() => insert ? edit.insertOverlayPoint(state.history, key, pointIndex, hit.tileIndex) : edit.extendOverlay(state.history, key, hit.tileIndex))) {
          const tileIndices = model.getOverlay(state.doc, key).tileIndices;
          state.selection.pointIndex = insert ? tileIndices.indexOf(hit.tileIndex, pointIndex) : tileIndices.length - 1;
          if (insert) {
            state.pathAction = 'select';
          }
          syncSelection();
          buildProperties();
        }
      }
      return;
    }
    if (feature && !(tool === 'overlay' && state.pathAction === 'new') && !(tool === 'label' && state.newLabel)) {
      selectFeature(feature);
      return;
    }
    if (!hit) {
      selectFeature(null);
      return;
    }
    const layerKey = tool === 'overlay' ? state.overlayType : tool;
    if (!state.layers[layerKey]) {
      setMessage(`Show the ${layerKey} layer before adding a feature`);
      return;
    }
    if (tool === 'overlay') {
      if (applyFeatureEdit(() => edit.setFeature(state.history, 'overlay', null, { type: state.overlayType, tileIndices: [hit.tileIndex] }), true)) {
        state.pathAction = 'extend';
        buildProperties();
      }
    } else if (tool === 'landmark') {
      applyFeatureEdit(() => edit.setFeature(state.history, 'landmark', hit.tileIndex, { type: state.landmarkKey }), true);
    } else if (tool === 'label') {
      applyFeatureEdit(() => edit.setFeature(state.history, 'label', null, { tileIndex: hit.tileIndex, category: state.labelCategory, text: 'Label' }), true);
      state.newLabel = false;
    }
  }

  function startLabelDrag(screen) {
    if (!['label', 'select'].includes(state.tool) || (state.tool === 'select' && !['all', 'label'].includes(state.targetLayer)) || state.newLabel) {
      return false;
    }
    const hit = renderer.hitFeature(state.renderer, state, screen, 'label');
    if (!hit || !hit.handleKind) {
      return false;
    }
    const label = model.getLabel(state.doc, hit.key);
    const screenToFrame = projection.invertTransform(hit.frameToScreen);
    state.labelDrag = { label, handleKind: hit.handleKind, screenToFrame, startPoint: projection.applyTransform(screenToFrame, screen) };
    state.labelPreview = label;
    return true;
  }

  function moveLabelDrag(screen) {
    const drag = state.labelDrag;
    if (!drag) {
      return;
    }
    const point = projection.applyTransform(drag.screenToFrame, screen);
    const label = drag.label;
    const geometry = view.mapGeometry(state.doc);
    const unit = geometry.d / view.LABEL_UNITS_PER_HEX;
    if (drag.handleKind === 'move') {
      state.labelPreview = { ...label, dx: label.dx + (point[0] - drag.startPoint[0]) / unit, dy: label.dy - (point[1] - drag.startPoint[1]) / unit };
    } else {
      const t = view.labelTransform(geometry, label);
      const interiorAngle = (point) => Math.atan2(-(point[1] - t[5]), point[0] - t[4]);
      const delta = interiorAngle(point) - interiorAngle(drag.startPoint);
      state.labelPreview = { ...label, rotation: label.rotation + Math.atan2(Math.sin(delta), Math.cos(delta)) * 180 / Math.PI };
    }
    requestDraw();
  }

  function finishLabelDrag(cancel) {
    if (!state.labelDrag) {
      return;
    }
    const label = state.labelPreview;
    state.labelPreview = null;
    state.labelDrag = null;
    if (cancel) {
      setMessage('Label drag cancelled');
    } else {
      applyFeatureEdit(() => edit.setFeature(state.history, 'label', label.id, { dx: label.dx, dy: label.dy, rotation: label.rotation }));
    }
    requestDraw();
  }

  function localPoint(event, target) {
    const rect = target.getBoundingClientRect();
    return [event.clientX - rect.left, event.clientY - rect.top];
  }

  // The left button drives the active tool; the middle or right button, Space+drag
  // and the Pan tool pan. Alt+click picks a terrain with any editing tool.
  function attachCanvasEvents(canvas) {
    let drag = null;
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    canvas.addEventListener('pointerdown', (event) => {
      if (drag) {
        return;
      }
      const point = localPoint(event, canvas);
      const pan = event.button === 1 || event.button === 2 || state.spaceDown || state.tool === 'pan';
      if (event.button === 1) {
        event.preventDefault();
      }
      if (pan) {
        drag = { mode: 'pan', pointer: event.pointerId, last: point };
        canvas.classList.add('dragging');
      } else if (event.button === 0) {
        if (!event.altKey && startLabelDrag(point)) {
          drag = { mode: 'label', pointer: event.pointerId };
          canvas.setPointerCapture(event.pointerId);
          return;
        }
        const hit = hitAt(point);
        if (event.altKey || state.tool === 'eyedropper') {
          if (hit) {
            pickTerrain(hit.tileIndex);
          }
          return;
        }
        if (state.tool === 'fill') {
          if (hit) {
            fillAt(hit.tileIndex);
          }
          return;
        }
        if (state.tool !== 'brush') {
          featureClick(point, hit);
          return;
        }
        state.stroke = edit.beginStroke(state.history, state.terrainId, state.brushRadius);
        drag = { mode: 'paint', pointer: event.pointerId };
        strokeAt(point);
      } else {
        return;
      }
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', (event) => {
      const point = localPoint(event, canvas);
      if (drag && drag.pointer === event.pointerId) {
        if (drag.mode === 'pan') {
          view.pan(state.camera, point[0] - drag.last[0], point[1] - drag.last[1]);
          drag.last = point;
          requestDraw();
        } else if (drag.mode === 'label') {
          moveLabelDrag(point);
        } else if (state.stroke) {
          strokeAt(point);
        }
      }
      hoverAt(point);
    });
    const endDrag = (event) => {
      if (drag && drag.pointer === event.pointerId) {
        if (drag.mode === 'paint') {
          endStroke();
        } else if (drag.mode === 'label') {
          finishLabelDrag(event.type !== 'pointerup');
        }
        drag = null;
        canvas.classList.remove('dragging');
      }
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);
    canvas.addEventListener('pointerleave', () => setHover(-1));
    canvas.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (state.labelDrag) {
        return;
      }
      const delta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
      view.zoomAt(state.camera, localPoint(event, canvas), Math.exp(-delta * 0.0015));
      hoverAt(localPoint(event, canvas));
      requestDraw();
    }, { passive: false });
    canvas.addEventListener('dblclick', (event) => {
      if (state.tool !== 'pan' || state.doc.kind !== 'global') {
        return;
      }
      const hit = view.placementAt(state.layout, view.screenToWorld(state.camera, localPoint(event, canvas)));
      if (hit && (state.layout.mode === 'net' || hit.placement.panelId !== state.layout.focusPanel)) {
        showFocus(hit.placement.panelId, state.layout.mode === 'net' ? null : hit.framePoint);
      }
    });
  }

  function attachMinimapEvents(miniCanvas) {
    miniCanvas.addEventListener('click', (event) => {
      if (!state.miniCamera) {
        return;
      }
      const net = view.screenToWorld(state.miniCamera, localPoint(event, miniCanvas));
      if (state.layout.mode !== 'focus') {
        view.centerOn(state.camera, net);
        requestDraw();
        return;
      }
      const hit = view.placementAt(view.buildNetLayout(), net);
      if (hit) {
        showFocus(hit.placement.panelId, hit.framePoint);
      }
    });
  }

  function attachKeyboard() {
    root.addEventListener('keyup', (event) => {
      if (event.key === ' ') {
        state.spaceDown = false;
      }
    });
    root.addEventListener('blur', () => {
      state.spaceDown = false;
    });
    root.addEventListener('keydown', (event) => {
      if (root.document.querySelector('dialog[open]')) {
        return;
      }
      const tag = event.target && event.target.tagName;
      const textEntry = tag === 'TEXTAREA' || (tag === 'INPUT' && event.target.type !== 'range' && event.target.type !== 'checkbox');
      if (state.labelDrag) {
        if (event.key === 'Escape') {
          finishLabelDrag(true);
        }
        event.preventDefault();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && !event.altKey && !textEntry) {
        const key = event.key.toLowerCase();
        if (key === 'z' || key === 'y') {
          event.preventDefault();
          undoOrRedo(key === 'z' && !event.shiftKey);
        } else if (key === 's') {
          event.preventDefault();
          saveMap();
        } else if (key === 'o') {
          event.preventDefault();
          openMap();
        }
        return;
      }
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }
      if (event.key === 'Escape') {
        endStroke();
        state.newLabel = false;
        finishPath();
        return;
      }
      if ((event.key === 'Delete' || event.key === 'Backspace') && !['pan', 'brush', 'fill', 'eyedropper'].includes(state.tool)) {
        event.preventDefault();
        deleteSelected();
        return;
      }
      if (event.key === ' ') {
        event.preventDefault();
        state.spaceDown = true;
        return;
      }
      const tool = TOOLS.find((entry) => entry[2] === event.key.toLowerCase());
      if (tool) {
        event.preventDefault();
        setTool(tool[0]);
        return;
      }
      if (event.key === '[' || event.key === ']') {
        event.preventDefault();
        setBrushRadius(state.brushRadius + (event.key === ']' ? 1 : -1));
        return;
      }
      const step = KEY_PAN_PIXELS * (event.shiftKey ? 4 : 1);
      const center = [state.camera.width / 2, state.camera.height / 2];
      const actions = {
        ArrowLeft: () => view.pan(state.camera, step, 0),
        ArrowRight: () => view.pan(state.camera, -step, 0),
        ArrowUp: () => view.pan(state.camera, 0, step),
        ArrowDown: () => view.pan(state.camera, 0, -step),
        '+': () => view.zoomAt(state.camera, center, KEY_ZOOM_FACTOR),
        '=': () => view.zoomAt(state.camera, center, KEY_ZOOM_FACTOR),
        '-': () => view.zoomAt(state.camera, center, 1 / KEY_ZOOM_FACTOR),
        Home: fitNet,
        f: fitPanel,
        n: showNet,
        p: focusAtViewCenter,
      };
      const action = actions[event.key];
      if (action) {
        event.preventDefault();
        action();
        requestDraw();
      }
    });
  }

  // A new global map seeded with the deterministic demo terrain (no undo history).
  function createDemoDocument() {
    const doc = model.createGlobalMap({ name: 'Demo' });
    view.demoTerrain(doc.topo, 1).forEach((id, tileIndex) => model.setTerrain(doc, tileIndex, id));
    return doc;
  }

  function start() {
    const canvas = root.document.getElementById('map-canvas');
    state.miniCanvas = root.document.getElementById('minimap');
    state.renderer = renderer.create(canvas);
    state.doc = createDemoDocument();
    state.savedRevision = state.doc.revision;
    state.history = history.create(state.doc);
    state.layout = view.buildNetLayout();
    buildToolbar();
    buildToolList();
    buildLayerList();
    buildLegend();
    setTool(state.tool);
    setTerrain(state.terrainId);
    syncUndoButtons();
    attachCanvasEvents(canvas);
    attachMinimapEvents(state.miniCanvas);
    attachKeyboard();
    const rect = canvas.getBoundingClientRect();
    view.resizeCamera(state.camera, rect.width, rect.height);
    view.fitBounds(state.camera, state.layout.bounds);
    new root.ResizeObserver(requestDraw).observe(canvas);
    root.addEventListener('pagehide', autosave);
    syncControls();
    offerRestore();
    requestDraw();
  }

  rpgMap.App = Object.freeze({ VERSION, state, start, showFocus, showNet, fitNet, fitPanel, setTool, setTerrain, setBrushRadius, undoOrRedo, newMap, saveMap, exportMap, autosave, isDirty });

  if (root.document.readyState === 'loading') {
    root.document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})(globalThis);
</script>
</body>
