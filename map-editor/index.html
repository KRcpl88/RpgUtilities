      Context.rect(dX - Topo.dW / 2 - dInflate, dY - Topo.dD / 2 - dInflate, Topo.dW + 2 * dInflate, Topo.dD + 2 * dInflate);
    } else if (Tile.rgPieces) {
      Tile.rgPieces.forEach((Piece) => TracePolygon(Context, Piece.rgrgdPolygon));
    } else {
      const dRadius = Lattice.HexRadius(Topo.dD) + dInflate;
      Context.moveTo(dX + dRadius, dY);
      for (let nIndex = 1; nIndex < 6; nIndex++) {
        Context.lineTo(dX + dRadius * g_rgrgdHexUnit[nIndex][0], dY + dRadius * g_rgrgdHexUnit[nIndex][1]);
      }
      Context.closePath();
    }
  }

  // Traces rgnTiles in chunks, calling fnPaint after each chunk's path is built.
  function PaintTiles(Context, Topo, rgnTiles, fSmall, dInflate, fnPaint) {
    for (let nStart = 0; nStart < rgnTiles.length; nStart += g_nPathChunk) {
      Context.beginPath();
      const nEnd = Math.min(rgnTiles.length, nStart + g_nPathChunk);
      for (let nIndex = nStart; nIndex < nEnd; nIndex++) {
        TraceTile(Context, Topo, rgnTiles[nIndex], fSmall, dInflate);
      }
      fnPaint();
    }
  }

  function IntersectBounds(rgdFirst, rgdSecond) {
    return [Math.max(rgdFirst[0], rgdSecond[0]), Math.max(rgdFirst[1], rgdSecond[1]),
      Math.min(rgdFirst[2], rgdSecond[2]), Math.min(rgdFirst[3], rgdSecond[3])];
  }

  // Draws terrain fills and/or the hex grid for every visible panel. dScale is screen
  // pixels per world unit (layouts are rigid, so the same in every panel frame).
  function DrawTiles(Context, dRatio, Doc, Layout, rgdWorldToScreen, rgdViewBounds, dScale, Options) {
    const Topo = View.MapGeometry(Doc);
    const dHexPixels = Topo.dD * dScale;
    const fSmall = dHexPixels < g_dSmallHexPixels;
    const fGrid = Options.fGrid && dHexPixels >= g_dGridMinPixels;
    if (!Options.fTerrain && !fGrid) {
      return;
    }
    for (const Placement of Layout.rgPlacements) {
      if (!View.BoundsIntersect(Placement.rgdBounds, rgdViewBounds)) {
        continue;
      }
      const rgdFrameBounds = View.TransformBounds(Placement.rgdWorldToFrame, IntersectBounds(Placement.rgdBounds, rgdViewBounds));
      Context.save();
      SetTransform(Context, dRatio, Projection.ComposeTransforms(Placement.rgdFrameToWorld, rgdWorldToScreen));
      Context.beginPath();
      TracePolygon(Context, Placement.rgrgdFrameOutline);
      Context.clip();
      for (const Group of View.PanelTileGroups(Topo, Placement.szPanel)) {
        const rgnVisible = View.VisibleTiles(Topo, Group, rgdFrameBounds);
        if (rgnVisible.length === 0) {
          continue;
        }
        Context.save();
        const rgdT = Group.rgdToPanel;
        Context.transform(rgdT[0], rgdT[1], rgdT[2], rgdT[3], rgdT[4], rgdT[5]);
        if (Options.fTerrain) {
          const Buckets = new Map();
          for (const nTile of rgnVisible) {
            const nId = Doc.rgnTerrain[nTile];
            (Buckets.get(nId) || Buckets.set(nId, []).get(nId)).push(nTile);
          }
          const dInflate = g_dSeamPixels / dScale;
          // Inflated neighbours overlap, so paint in terrain-id order: then a partial
          // repaint layers the overlaps exactly as a full redraw does.
          for (const [nId, rgnTiles] of [...Buckets].sort((A, B) => A[0] - B[0])) {
            Context.fillStyle = Terrain.ById(nId).szColor;
            PaintTiles(Context, Topo, rgnTiles, fSmall, dInflate, () => Context.fill());
          }
        }
        if (fGrid) {
          Context.lineWidth = 1 / dScale;
          Context.strokeStyle = g_szGridColor;
          PaintTiles(Context, Topo, rgnVisible, false, 0, () => Context.stroke());
        }
        Context.restore();
      }
      Context.restore();
    }
  }

  // A cached terrain image of a whole layout, used when hexes are too small to draw.
  // Edits reported through MarkTilesChanged are repainted in place; any other document
  // change (a revision the raster was not told about) rebuilds it.
  function GetRaster(Renderer, szKey, Doc, Layout, dScale) {
    const Cached = Renderer.Rasters.get(szKey);
    if (Cached && Cached.Doc === Doc && Cached.Layout === Layout && Cached.nRevision === Doc.nRevision && Cached.dScale === dScale) {
      if (Cached.DirtyTiles.size > g_nMaxRepaintTiles) {
        Cached.Context.setTransform(1, 0, 0, 1, 0, 0);
        Cached.Context.clearRect(0, 0, Cached.Canvas.width, Cached.Canvas.height);
        DrawTiles(Cached.Context, 1, Doc, Layout, Cached.rgdWorldToRaster, Cached.rgdBounds, dScale, { fTerrain: true, fGrid: false });
      } else if (Cached.DirtyTiles.size > 0) {
        RepaintRasterTiles(Cached);
      }
      Cached.DirtyTiles.clear();
      return Cached;
    }
    const rgdBounds = Layout.rgdBounds;
    const Canvas = Root.document.createElement('canvas');
    Canvas.width = Math.max(1, Math.ceil((rgdBounds[2] - rgdBounds[0]) * dScale));
    Canvas.height = Math.max(1, Math.ceil((rgdBounds[3] - rgdBounds[1]) * dScale));
    const Context = Canvas.getContext('2d');
    const rgdWorldToRaster = [dScale, 0, 0, -dScale, -rgdBounds[0] * dScale, rgdBounds[3] * dScale];
    DrawTiles(Context, 1, Doc, Layout, rgdWorldToRaster, rgdBounds, dScale, { fTerrain: true, fGrid: false });
    const Raster = { Canvas, Context, Doc, Layout, nRevision: Doc.nRevision, dScale, rgdBounds, rgdWorldToRaster, DirtyTiles: new Set() };
    Renderer.Rasters.set(szKey, Raster);
    return Raster;
  }

  // Records tiles whose terrain just changed (the document is at its new revision), so
  // cached rasters repaint only those tiles on their next use.
  function MarkTilesChanged(Renderer, Doc, rgnTiles) {
    for (const Raster of Renderer.Rasters.values()) {
      if (Raster.Doc === Doc) {
        rgnTiles.forEach((nTile) => Raster.DirtyTiles.add(nTile));
        Raster.nRevision = Doc.nRevision;
      }
    }
  }

  // Where a tile is drawn in a layout: its own placement plus, for equatorial edge
  // columns, the strip neighbours whose polygons its hex overhangs. Yields world centres.
  function TileWorldCenters(Topo, Layout, nTile) {
    const Tile = Topo.rgTiles[nTile];
    const rgrgdCenters = [];
    const Own = View.FindPlacement(Layout, Tile.szPanel);
    if (Own) {
      rgrgdCenters.push(Projection.ApplyTransform(Own.rgdFrameToWorld, Tile.rgdCenter));
    }
    const Info = Topo.Panels[Tile.szPanel];
    if (Info.Lattice.fEquatorial) {
      for (const szOther of [Info.szWest, Info.szEast]) {
        const Other = View.FindPlacement(Layout, szOther);
        if (Other) {
          const Seam = Projection.FindSeam(Tile.szPanel, szOther);
          const rgdToOther = Seam.szPanelA === Tile.szPanel ? Seam.rgdAToB : Seam.rgdBToA;
          rgrgdCenters.push(Projection.ApplyTransform(Other.rgdFrameToWorld, Projection.ApplyTransform(rgdToOther, Tile.rgdCenter)));
        }
      }
    }
    return rgrgdCenters;
  }

  // Clears and redraws whole-pixel boxes around each dirty tile; tiles overlapping the
  // boxes are redrawn too, clipped to the boxes, so neighbours stay intact.
  function RepaintRasterTiles(Raster) {
    const { Context, Doc, Layout, dScale, rgdWorldToRaster } = Raster;
    const Topo = View.MapGeometry(Doc);
    const dRadius = Lattice.HexRadius(Topo.dD);
    const rgrgnBoxes = [];
    for (const nTile of Raster.DirtyTiles) {
      for (const rgdWorld of TileWorldCenters(Topo, Layout, nTile)) {
        const [dX, dY] = Projection.ApplyTransform(rgdWorldToRaster, rgdWorld);
        const dHalf = dRadius * dScale + 2;
        rgrgnBoxes.push([Math.floor(dX - dHalf), Math.floor(dY - dHalf), Math.ceil(dX + dHalf), Math.ceil(dY + dHalf)]);
      }
    }
    if (rgrgnBoxes.length === 0) {
      return;
    }
    const rgdPixelBounds = View.UnionBounds(rgrgnBoxes);
    const rgdRasterToWorld = Projection.InvertTransform(rgdWorldToRaster);
    const rgdWorldBounds = View.TransformBounds(rgdRasterToWorld, rgdPixelBounds);
    Context.save();
    Context.setTransform(1, 0, 0, 1, 0, 0);
    Context.beginPath();
    rgrgnBoxes.forEach(([nLeft, nTop, nRight, nBottom]) => Context.rect(nLeft, nTop, nRight - nLeft, nBottom - nTop));
    Context.clip();
    Context.clearRect(rgdPixelBounds[0], rgdPixelBounds[1], rgdPixelBounds[2] - rgdPixelBounds[0], rgdPixelBounds[3] - rgdPixelBounds[1]);
    DrawTiles(Context, 1, Doc, Layout, rgdWorldToRaster, rgdWorldBounds, dScale, { fTerrain: true, fGrid: false });
    Context.restore();
  }

  function MainRasterScale(Doc, Layout) {
    const rgdBounds = Layout.rgdBounds;
    const dExtent = Math.max(rgdBounds[2] - rgdBounds[0], rgdBounds[3] - rgdBounds[1]);
    return Math.min(g_dRasterHexPixels / View.MapGeometry(Doc).dD, g_nRasterMaxPixels / dExtent);
  }

  function DrawRaster(Context, dRatio, Raster, rgdWorldToScreen) {
    const rgdRasterToWorld = [1 / Raster.dScale, 0, 0, -1 / Raster.dScale, Raster.rgdBounds[0], Raster.rgdBounds[3]];
    Context.save();
    SetTransform(Context, dRatio, Projection.ComposeTransforms(rgdRasterToWorld, rgdWorldToScreen));
    Context.imageSmoothingEnabled = true;
    Context.drawImage(Raster.Canvas, 0, 0);
    Context.restore();
  }

  function TraceScreenOutline(Context, Camera, Placement) {
    TracePolygon(Context, Placement.rgrgdOutline.map((rgdPoint) => View.WorldToScreen(Camera, rgdPoint)));
  }

  // Panel shading, outlines and names, drawn in CSS pixels.
  function DrawPanelDecorations(Context, dRatio, State) {
    const { Camera, Layout, Layers } = State;
    Context.save();
    Context.setTransform(dRatio, 0, 0, dRatio, 0, 0);
    if (Layout.szMode === 'focus') {
      Context.beginPath();
      Layout.rgPlacements.filter((Placement) => Placement.szPanel !== Layout.szFocus)
        .forEach((Placement) => TraceScreenOutline(Context, Camera, Placement));
      Context.fillStyle = 'rgba(16, 21, 28, 0.4)';
      Context.fill();
    }
    if (Layers.fOutlines) {
      Context.beginPath();
      Layout.rgPlacements.forEach((Placement) => TraceScreenOutline(Context, Camera, Placement));
      Context.lineWidth = 1.25;
      Context.strokeStyle = g_szOutlineColor;
      Context.lineJoin = 'round';
      Context.stroke();
      if (Layout.szMode === 'focus') {
        Context.beginPath();
        TraceScreenOutline(Context, Camera, View.FindPlacement(Layout, Layout.szFocus));
        Context.lineWidth = 2;
        Context.strokeStyle = g_szFocusColor;
        Context.stroke();
      }
    }
    if (Layers.fNames && Layout.szMode !== 'local') {
      Context.textAlign = 'center';
      Context.textBaseline = 'middle';
      Context.lineJoin = 'round';
      for (const Placement of Layout.rgPlacements) {
        const dPanelPixels = (Placement.rgdBounds[2] - Placement.rgdBounds[0]) * Camera.dScale;
        if (dPanelPixels < 50) {
          continue;
        }
        const nFont = Math.round(Math.min(22, Math.max(10, dPanelPixels * 0.06)));
        const [dX, dY] = View.WorldToScreen(Camera, Placement.rgdCenter);
        Context.font = `600 ${nFont}px system-ui, sans-serif`;
        Context.lineWidth = 3;
        Context.strokeStyle = 'rgba(16, 21, 28, 0.75)';
        Context.strokeText(Placement.szName, dX, dY);
        Context.fillStyle = '#f2f2f2';
        Context.fillText(Placement.szName, dX, dY);
      }
    }
    Context.restore();
  }

  // Outlines tiles in their own panels' placements (tiles of panels not in the layout
  // are skipped).
  function OutlineTiles(Context, dRatio, State, rgdWorldToScreen, rgnTiles, dWidth, szColor) {
    const { Doc, Layout } = State;
    const Topo = View.MapGeometry(Doc);
    const ByPanel = new Map();
    for (const nTile of rgnTiles) {
      const szPanel = Topo.rgTiles[nTile].szPanel;
      (ByPanel.get(szPanel) || ByPanel.set(szPanel, []).get(szPanel)).push(nTile);
    }
    for (const [szPanel, rgnPanelTiles] of ByPanel) {
      const Placement = View.FindPlacement(Layout, szPanel);
      if (!Placement) {
        continue;
      }
      Context.save();
      SetTransform(Context, dRatio, Projection.ComposeTransforms(Placement.rgdFrameToWorld, rgdWorldToScreen));
      Context.beginPath();
      rgnPanelTiles.forEach((nTile) => TraceTile(Context, Topo, nTile, false));
      Context.lineWidth = dWidth / State.Camera.dScale;
      Context.lineJoin = 'round';
      Context.strokeStyle = szColor;
      Context.stroke();
      Context.restore();
    }
  }

  // The brush footprint (State.rgnPreviewTiles) and the hovered tile.
  function DrawHover(Context, dRatio, State, rgdWorldToScreen) {
    const rgnPreview = State.rgnPreviewTiles || [];
    if (rgnPreview.length > 1) {
      OutlineTiles(Context, dRatio, State, rgdWorldToScreen, rgnPreview, 1.25, g_szPreviewColor);
    }
    if (State.nHoverTile >= 0) {
      OutlineTiles(Context, dRatio, State, rgdWorldToScreen, [State.nHoverTile], 2, g_szHoverColor);
    }
  }

  const g_OverlayStyles = Object.freeze({
    river: { szColor: '#236eae', dWidth: 3, rgDash: [] },
    road: { szColor: '#704224', dWidth: 2.5, rgDash: [] },
    trail: { szColor: '#805e3b', dWidth: 1.8, rgDash: [4, 3] },
  });
  const g_LandmarkPaths = new Map();

  function FeatureVisible(Layers, szLayer, Item) {
    return szLayer === 'overlay' ? Layers[Item.szType] !== false : Layers[szLayer] !== false;
  }

  function IsSelected(State, szLayer, Key) {
    return State.Selection && State.Selection.szLayer === szLayer && State.Selection.Key === Key;
  }

  function ScreenDot(Context, rgdPoint, dRadius, szFill) {
    Context.beginPath();
    Context.arc(rgdPoint[0], rgdPoint[1], dRadius, 0, 2 * Math.PI);
    Context.fillStyle = szFill;
    Context.fill();
    Context.lineWidth = 1;
    Context.strokeStyle = '#10151c';
    Context.stroke();
  }

  function DrawFeatures(Renderer, State, rgdWorldToScreen) {
    const { Context, dRatio } = Renderer;
    const { Doc, Layout, Camera, Layers } = State;
    const Topo = View.MapGeometry(Doc);
    Renderer.rgFeatureHits = [];
    const ByPanel = new Map(Layout.rgPlacements.map((Placement) => [Placement.szPanel, []]));
    for (const Overlay of Doc.rgOverlays) {
      if (!FeatureVisible(Layers, 'overlay', Overlay)) {
        continue;
      }
      for (const Curve of View.OverlayCurves(Topo, Overlay)) {
        if (ByPanel.has(Curve.szPanel)) {
          ByPanel.get(Curve.szPanel).push({ Overlay, Curve });
        }
      }
    }
    for (const Placement of Layout.rgPlacements) {
      Context.save();
      Context.setTransform(dRatio, 0, 0, dRatio, 0, 0);
      Context.beginPath();
      TraceScreenOutline(Context, Camera, Placement);
      Context.clip();
      const rgdPanelToScreen = Projection.ComposeTransforms(Placement.rgdFrameToWorld, rgdWorldToScreen);
      const AddHit = (Hit) => Renderer.rgFeatureHits.push({ ...Hit, szDrawPanel: Placement.szPanel });
      for (const { Overlay, Curve } of ByPanel.get(Placement.szPanel)) {
        const Style = g_OverlayStyles[Overlay.szType];
        const dWidth = Style.dWidth * Math.max(0.7, Math.min(2, Topo.dD * Camera.dScale / 32));
        const rg = Curve.rgrgdControl.map((Point) => Projection.ApplyTransform(rgdPanelToScreen, Point));
        Context.beginPath();
        Context.moveTo(...rg[0]);
        Context.bezierCurveTo(...rg[1], ...rg[2], ...rg[3]);
        Context.lineCap = 'round';
        Context.lineJoin = 'round';
        if (IsSelected(State, 'overlay', Overlay.szId)) {
          Context.strokeStyle = g_szHoverColor;
          Context.lineWidth = dWidth + 4;
          Context.stroke();
        }
        Context.setLineDash(Style.rgDash);
        Context.strokeStyle = Style.szColor;
        Context.lineWidth = dWidth;
        Context.stroke();
        Context.setLineDash([]);
        AddHit({ szLayer: 'overlay', Key: Overlay.szId, nPoint: Curve.nPoint, rgrgdPoints: View.FlattenCurve(rg), dRadius: Math.max(5, dWidth / 2 + 2) });
      }
      for (const Overlay of Doc.rgOverlays) {
        if (!FeatureVisible(Layers, 'overlay', Overlay) || (Overlay.rgnTiles.length > 1 && !IsSelected(State, 'overlay', Overlay.szId))) {
          continue;
        }
        Overlay.rgnTiles.forEach((nTile, nPoint) => {
          const Copy = View.FeatureCopies(Topo, Layout, nTile).find((Item) => Item.Placement === Placement);
          if (!Copy) {
            return;
          }
          const rgdScreen = Projection.ApplyTransform(Projection.ComposeTransforms(Copy.rgdFrameToWorld, rgdWorldToScreen), View.FeatureAnchor(Topo, nTile));
          const fPoint = IsSelected(State, 'overlay', Overlay.szId) && State.Selection.nPoint === nPoint;
          ScreenDot(Context, rgdScreen, fPoint ? 5 : 3, fPoint ? '#ffffff' : g_OverlayStyles[Overlay.szType].szColor);
          AddHit({ szLayer: 'overlay', Key: Overlay.szId, nPoint, rgdScreen, dRadius: 6 });
        });
      }
      if (Layers.landmark !== false) {
        for (const [nTile, Landmark] of Doc.Landmarks) {
          const Copy = View.FeatureCopies(Topo, Layout, nTile).find((Item) => Item.Placement === Placement);
          if (!Copy) {
            continue;
          }
          const rgdT = Projection.ComposeTransforms(Copy.rgdFrameToWorld, rgdWorldToScreen);
          const rgdScreen = Projection.ApplyTransform(rgdT, View.FeatureAnchor(Topo, nTile));
          const dSize = Math.max(6, Math.min(26, Topo.dD * Camera.dScale * 0.55));
          if (IsSelected(State, 'landmark', nTile)) {
            ScreenDot(Context, rgdScreen, dSize * 0.7 + 3, g_szHoverColor);
          }
          if (!g_LandmarkPaths.has(Landmark.szType)) {
            g_LandmarkPaths.set(Landmark.szType, new Root.Path2D(Terrain.LandmarkType(Landmark.szType).szPath));
          }
          Context.save();
          Context.translate(...rgdScreen);
          Context.rotate(Math.atan2(rgdT[1], rgdT[0]));
          Context.scale(dSize / 24, dSize / 24);
          Context.fillStyle = '#f9edcc';
          Context.strokeStyle = '#28221b';
          Context.lineWidth = 1.8;
          Context.fill(g_LandmarkPaths.get(Landmark.szType));
          Context.stroke(g_LandmarkPaths.get(Landmark.szType));
          Context.restore();
          AddHit({ szLayer: 'landmark', Key: nTile, rgdScreen, dRadius: Math.max(6, dSize * 0.6) });
        }
      }
      if (Layers.label !== false) {
        for (const Stored of Doc.rgLabels) {
          const Label = State.LabelPreview && State.LabelPreview.szId === Stored.szId ? State.LabelPreview : Stored;
          const Copy = View.FeatureCopies(Topo, Layout, Label.nTile).find((Item) => Item.Placement === Placement);
          if (!Copy) {
            continue;
          }
          const rgdFrameToScreen = Projection.ComposeTransforms(Copy.rgdFrameToWorld, rgdWorldToScreen);
          const rgdTextToScreen = Projection.ComposeTransforms(View.LabelTransform(Topo, Label), rgdFrameToScreen);
          Context.save();
          SetTransform(Context, dRatio, rgdTextToScreen);
          Context.font = `${Label.szCategory === 'region' ? '600' : '400'} ${Label.dSize}px system-ui, sans-serif`;
          Context.textAlign = 'center';
          Context.textBaseline = 'middle';
          const dHalfWidth = Context.measureText(Label.szText).width / 2 + 2;
          const dHalfHeight = Label.dSize * 0.65;
          Context.lineJoin = 'round';
          Context.strokeStyle = '#f9edcc';
          Context.lineWidth = Math.max(1, Label.dSize / 8);
          Context.strokeText(Label.szText, 0, 0);
          Context.fillStyle = '#201c19';
          Context.fillText(Label.szText, 0, 0);
          const fSelected = IsSelected(State, 'label', Label.szId);
          if (fSelected) {
            Context.lineWidth = 1.5 / Math.hypot(rgdTextToScreen[0], rgdTextToScreen[1]);
            Context.strokeStyle = g_szHoverColor;
            Context.strokeRect(-dHalfWidth, -dHalfHeight, 2 * dHalfWidth, 2 * dHalfHeight);
          }
          Context.restore();
          AddHit({ szLayer: 'label', Key: Label.szId, rgdScreenToText: Projection.InvertTransform(rgdTextToScreen), rgdFrameToScreen, dHalfWidth, dHalfHeight });
          if (fSelected) {
            const rgdCenter = Projection.ApplyTransform(rgdTextToScreen, [0, 0]);
            const rgdTop = Projection.ApplyTransform(rgdTextToScreen, [0, -dHalfHeight]);
            const dLength = Math.hypot(rgdTextToScreen[2], rgdTextToScreen[3]);
            const rgdRotate = [rgdTop[0] - 20 * rgdTextToScreen[2] / dLength, rgdTop[1] - 20 * rgdTextToScreen[3] / dLength];
            Context.beginPath();
            Context.moveTo(...rgdTop);
            Context.lineTo(...rgdRotate);
            Context.strokeStyle = g_szHoverColor;
            Context.lineWidth = 1.5;
            Context.stroke();
            for (const [szHandle, rgdScreen] of [['move', rgdCenter], ['rotate', rgdRotate]]) {
              ScreenDot(Context, rgdScreen, 5, szHandle === 'move' ? '#ffffff' : g_szHoverColor);
              AddHit({ szLayer: 'label', Key: Label.szId, szHandle, rgdScreen, dRadius: 8, rgdFrameToScreen });
            }
          }
        }
      }
      Context.restore();
    }
  }

  function HitFeature(Renderer, State, rgdScreen, szFilter = 'all') {
    const PanelHit = View.PlacementAt(State.Layout, View.ScreenToWorld(State.Camera, rgdScreen));
    if (!PanelHit) {
      return null;
    }
    for (let nIndex = Renderer.rgFeatureHits.length - 1; nIndex >= 0; nIndex--) {
      const Hit = Renderer.rgFeatureHits[nIndex];
      const fTypeMatch = Hit.szLayer === 'overlay' && State.Doc.rgOverlays.some((Item) => Item.szId === Hit.Key && Item.szType === szFilter);
      if (Hit.szDrawPanel !== PanelHit.Placement.szPanel || (szFilter !== 'all' && Hit.szLayer !== szFilter && !fTypeMatch)) {
        continue;
      }
      if (Hit.rgdScreenToText) {
        const [dX, dY] = Projection.ApplyTransform(Hit.rgdScreenToText, rgdScreen);
        if (Math.abs(dX) <= Hit.dHalfWidth && Math.abs(dY) <= Hit.dHalfHeight) {
          return Hit;
        }
      } else if (Hit.rgrgdPoints) {
        if (Hit.rgrgdPoints.slice(1).some((Point, nPoint) => View.DistanceToSegment(rgdScreen, Hit.rgrgdPoints[nPoint], Point) <= Hit.dRadius)) {
          return Hit;
        }
      } else if (Util.Distance(rgdScreen, Hit.rgdScreen) <= Hit.dRadius) {
        return Hit;
      }
    }
    return null;
  }

  // State: { Doc, Layout, Camera, Layers: { fTerrain, fGrid, fOutlines, fNames }, nHoverTile }.
  // Returns { fRaster, dHexPixels } for the status bar.
  function Draw(Renderer, State) {
    const { Canvas, Context } = Renderer;
    const { Doc, Layout, Camera, Layers } = State;
    const dRatio = SyncSize(Canvas, Camera);
    Renderer.dRatio = dRatio;
    Context.setTransform(1, 0, 0, 1, 0, 0);
    Context.fillStyle = g_szBackground;
    Context.fillRect(0, 0, Canvas.width, Canvas.height);
    const rgdWorldToScreen = View.WorldToScreenTransform(Camera);
    const rgdViewBounds = View.VisibleBounds(Camera);
    const dHexPixels = View.MapGeometry(Doc).dD * Camera.dScale;
    const dRasterScale = MainRasterScale(Doc, Layout);
    const fRaster = Layers.fTerrain && dHexPixels < g_dRasterHexPixels && Camera.dScale <= dRasterScale * 1.5;
    if (fRaster) {
      DrawRaster(Context, dRatio, GetRaster(Renderer, 'main', Doc, Layout, dRasterScale), rgdWorldToScreen);
    } else {
      DrawTiles(Context, dRatio, Doc, Layout, rgdWorldToScreen, rgdViewBounds, Camera.dScale,
        { fTerrain: Layers.fTerrain, fGrid: Layers.fGrid });
    }
    DrawPanelDecorations(Context, dRatio, State);
    DrawFeatures(Renderer, State, rgdWorldToScreen);
    DrawHover(Context, dRatio, State, rgdWorldToScreen);
    return { fRaster, dHexPixels };
  }

  // The map navigator: net or local terrain, outlines, and the main view's extent.
  function DrawMinimap(Renderer, MiniCanvas, State) {
    const NetLayout = View.MapLayout(State.Doc);
    const MiniCamera = Renderer.MiniCamera || (Renderer.MiniCamera = View.CreateCamera());
    const dRatio = SyncSize(MiniCanvas, MiniCamera);
    View.FitBounds(MiniCamera, NetLayout.rgdBounds, 4);
    const Context = MiniCanvas.getContext('2d');
    Context.setTransform(1, 0, 0, 1, 0, 0);
    Context.fillStyle = g_szBackground;
    Context.fillRect(0, 0, MiniCanvas.width, MiniCanvas.height);
    const rgdWorldToScreen = View.WorldToScreenTransform(MiniCamera);
    DrawRaster(Context, dRatio, GetRaster(Renderer, 'mini', State.Doc, NetLayout, MiniCamera.dScale * dRatio), rgdWorldToScreen);
    Context.save();
    Context.setTransform(dRatio, 0, 0, dRatio, 0, 0);
    Context.beginPath();
    NetLayout.rgPlacements.forEach((Placement) => TraceScreenOutline(Context, MiniCamera, Placement));
    Context.lineWidth = 0.75;
    Context.strokeStyle = 'rgba(230, 230, 230, 0.6)';
    Context.stroke();
    Context.lineWidth = 1.5;
    Context.strokeStyle = g_szFocusColor;
    if (State.Layout.szMode !== 'focus') {
      const [dMinX, dMinY, dMaxX, dMaxY] = View.VisibleBounds(State.Camera);
      const [dLeft, dTop] = View.WorldToScreen(MiniCamera, [dMinX, dMaxY]);
      const [dRight, dBottom] = View.WorldToScreen(MiniCamera, [dMaxX, dMinY]);
      Context.strokeRect(dLeft, dTop, dRight - dLeft, dBottom - dTop);
    } else {
      Context.beginPath();
      TraceScreenOutline(Context, MiniCamera, View.FindPlacement(NetLayout, State.Layout.szFocus));
      Context.stroke();
    }
    Context.restore();
    return MiniCamera;
  }

  RpgMap.Renderer = Object.freeze({
    g_dRasterHexPixels,
    g_dGridMinPixels,
    Create,
    Draw,
    DrawMinimap,
    MarkTilesChanged,
    FeatureVisible,
    HitFeature,
  });
})(globalThis);
</script>

<script data-module="App" data-dom="true">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Coordinates, Terrain, Model, History, View, Edit, FileFormat, Renderer } = RpgMap;

  const g_szVersion = '0.6.0';
  const g_szAutosaveKey = 'rpgmap.autosave';
  const g_nAutosaveDelayMs = 2000;
  // [id, label, hotkey, title]
  const g_rgTools = [
    ['pan', 'Pan', 'h', 'Pan the view (H). Middle/right drag or Space+drag pans with any tool.'],
    ['brush', 'Brush', 'b', 'Paint the active terrain (B). Alt+click picks a terrain.'],
    ['fill', 'Fill', 'g', 'Fill the connected area of one terrain (G). Alt+click picks a terrain.'],
    ['eyedropper', 'Pick', 'i', 'Pick the terrain of a tile (I)'],
    ['overlay', 'Path', 'o', 'Road, trail or river paths (O). Click to extend; Escape finishes.'],
    ['landmark', 'Landmark', 'k', 'Place or select a landmark (K)'],
    ['label', 'Label', 't', 'Place or select a label (T). Drag the white handle to move; yellow to rotate.'],
    ['select', 'Select', 'v', 'Select a feature (V); choose overlapping items in Properties'],
    ['erase', 'Erase', 'e', 'Erase from the target layer (E), without changing other layers'],
  ];
  const g_dKeyPanPixels = 60;
  const g_dKeyZoomFactor = 1.25;
  const g_rgLayerToggles = [
    ['fTerrain', 'Terrain'],
    ['fGrid', 'Hex grid'],
    ['fOutlines', 'Panel outlines'],
    ['fNames', 'Panel names'],
    ['road', 'Roads'],
    ['trail', 'Trails'],
    ['river', 'Rivers'],
    ['landmark', 'Landmarks'],
    ['label', 'Labels'],
  ];

  const State = {
    Doc: null,
    History: null,
    Layout: null,
    Camera: View.CreateCamera(),
    Layers: { fTerrain: true, fGrid: true, fOutlines: true, fNames: true, road: true, trail: true, river: true, landmark: true, label: true },
    nHoverTile: -1,
    rgnPreviewTiles: [],
    szTool: 'brush',
    nTerrainId: Terrain.ByKey('plain').nId,
    nBrushRadius: 1,
    fSpaceDown: false,
    Stroke: null,
    szMessage: '',
    Renderer: null,
    MiniCanvas: null,
    MiniCamera: null,
    fFrameQueued: false,
    LastDraw: null,
    nSavedRevision: 0,
    nAutosaveTimer: 0,
    Selection: null,
    nSelectedTile: -1,
    szOverlayType: 'road',
    szLandmarkType: 'village',
    szLabelCategory: 'location',
    szTargetLayer: 'all',
    szPathAction: 'select',
    fNewLabel: false,
    LabelPreview: null,
    LabelDrag: null,
  };

  function Element(szTag, Props = {}, rgChildren = []) {
    const Node = Root.document.createElement(szTag);
    Object.assign(Node, Props);
    rgChildren.forEach((Child) => Node.append(Child));
    return Node;
  }

  function RequestDraw() {
    if (!State.fFrameQueued) {
      State.fFrameQueued = true;
      Root.requestAnimationFrame(() => {
        State.fFrameQueued = false;
        State.LastDraw = Renderer.Draw(State.Renderer, State);
        State.MiniCamera = Renderer.DrawMinimap(State.Renderer, State.MiniCanvas, State);
        UpdateStatus();
      });
    }
  }

  function UpdateStatus() {
    const Doc = State.Doc;
    let szCoordinates = '\u00a0';
    if (State.nHoverTile >= 0) {
      const Tile = View.MapGeometry(Doc).rgTiles[State.nHoverTile];
      const szPanel = Doc.Local ? 'Local' : `${Projection.Build().Panels[Tile.szPanel].szName} (${Projection.Build().Panels[Tile.szPanel].szLetter})`;
      szCoordinates = [
        TileLocationText(State.nHoverTile),
        `${szPanel} col ${Tile.nColumn} row ${Tile.nRow}${Tile.fPartial ? ' partial' : ''}`,
        Terrain.ById(Model.GetTerrain(Doc, State.nHoverTile)).szName,
        ...[Model.GetLandmark(Doc, State.nHoverTile)].filter(Boolean).map((Item) => `${Item.szType}: ${Item.szName || '(unnamed)'}`),
        ...Model.OverlaysAt(Doc, State.nHoverTile).map((Item) => `${Item.szType}: ${Item.szName || Item.szId}`),
        ...Model.LabelsAt(Doc, State.nHoverTile).map((Item) => Item.szText),
        `tile ${State.nHoverTile}`,
      ].join(' \u00b7 ');
    }
    Root.document.getElementById('status-coordinates').textContent = szCoordinates;
    const szView = Doc.Local ? 'Local view' : State.Layout.szMode === 'net' ? 'Net view' : `Focus: ${Projection.Build().Panels[State.Layout.szFocus].szName}`;
    const Draw = State.LastDraw;
    Root.document.getElementById('status-message').textContent = [
      `${Doc.szName || 'Untitled'}${IsDirty() ? ' *' : ''}`,
      State.szMessage,
      szView,
      Doc.Local ? `${Doc.Local.nWidth} x ${Doc.Local.nHeight} ${Doc.Local.szSystem} ${Doc.Local.szScale} (${Lattice.ScaleDistance(Doc.Local.szSystem, Doc.Local.szScale)} ${Lattice.g_Scales[Doc.Local.szSystem].szUnit}/hex)`
        : `n=${Doc.Global.nPanelHexes} ${Doc.Global.szTileScale}`,
      `${Doc.nTiles.toLocaleString('en-US')} tiles`,
      Draw ? `hex ${Util.FormatNumber(Draw.dHexPixels, 1)} px${Draw.fRaster ? ' (raster)' : ''}` : '',
      `v${g_szVersion}`,
    ].filter(Boolean).join(' \u00b7 ');
  }

  function TileLocationText(nTile) {
    return Coordinates.FormatUniversal(Model.TileToUniversal(State.Doc, nTile), FileFormat.CoordinateDecimals(Model.HexMiles(State.Doc)));
  }

  function SetHover(nTile) {
    const rgnPreview = nTile >= 0 && State.szTool === 'brush' ? Edit.BrushTiles(State.Doc, nTile, State.nBrushRadius) : [];
    if (nTile !== State.nHoverTile || rgnPreview.length !== State.rgnPreviewTiles.length) {
      State.nHoverTile = nTile;
      State.rgnPreviewTiles = rgnPreview;
      RequestDraw();
    }
  }

  function HitAt(rgdScreen) {
    return View.HitTest(View.MapGeometry(State.Doc), State.Layout, View.ScreenToWorld(State.Camera, rgdScreen));
  }

  function HoverAt(rgdScreen) {
    const Hit = HitAt(rgdScreen);
    SetHover(Hit ? Hit.nTile : -1);
  }

  // Editing -------------------------------------------------------------------------

  function SetMessage(szMessage) {
    State.szMessage = szMessage;
    RequestDraw();
  }

  function TilesChanged(rgnTiles) {
    Renderer.MarkTilesChanged(State.Renderer, State.Doc, rgnTiles);
    SyncUndoButtons();
    ScheduleAutosave();
    RequestDraw();
  }

  function CountText(nCount) {
    return `${nCount.toLocaleString('en-US')} tile${nCount === 1 ? '' : 's'}`;
  }

  function SetTool(szTool) {
    EndStroke();
    FinishLabelDrag(true);
    State.szTool = szTool;
    State.szPathAction = 'select';
    State.fNewLabel = false;
    if (State.Selection && !['select', 'erase'].includes(szTool) && State.Selection.szLayer !== szTool) {
      State.Selection = null;
      State.nSelectedTile = -1;
    }
    for (const [szId] of g_rgTools) {
      const Button = Root.document.getElementById(`tool-${szId}`);
      Button.setAttribute('aria-pressed', String(szId === szTool));
    }
    Root.document.getElementById('brush-options').hidden = szTool !== 'brush';
    Root.document.getElementById('map-canvas').dataset.tool = szTool;
    BuildFeatureOptions();
    BuildProperties();
    SetHover(State.nHoverTile);
    RequestDraw();
  }

  function SetTerrain(nTerrainId) {
    State.nTerrainId = nTerrainId;
    const Item = Terrain.ById(nTerrainId);
    Root.document.querySelectorAll('.legend-row').forEach((Row) => {
      const fActive = Number(Row.dataset.terrain) === nTerrainId;
      Row.classList.toggle('active', fActive);
      Row.setAttribute('aria-checked', String(fActive));
    });
    Root.document.getElementById('active-terrain-swatch').style.background = Item.szColor;
    Root.document.getElementById('active-terrain-name').textContent = Item.szName;
  }

  function SetBrushRadius(nRadius) {
    State.nBrushRadius = Math.max(0, Math.min(Edit.g_nMaxBrushRadius, nRadius));
    Root.document.getElementById('brush-radius').value = String(State.nBrushRadius);
    Root.document.getElementById('brush-radius-value').textContent = String(State.nBrushRadius);
    SetHover(State.nHoverTile);
  }

  function PickTerrain(nTile) {
    SetTerrain(Model.GetTerrain(State.Doc, nTile));
    SetMessage(`Picked ${Terrain.ById(State.nTerrainId).szName}`);
  }

  function FillAt(nTile) {
    const { Command, rgnTiles } = Edit.Fill(State.History, nTile, State.nTerrainId);
    SetMessage(Command ? `${Command.szLabel}: ${CountText(rgnTiles.length)}` : 'Fill: no change');
    TilesChanged(rgnTiles);
  }

  function StrokeAt(rgdScreen) {
    TilesChanged(Edit.StrokeTo(State.Stroke, State.Layout, View.ScreenToWorld(State.Camera, rgdScreen)));
  }

  function EndStroke() {
    if (State.Stroke) {
      const Stroke = State.Stroke;
      State.Stroke = null;
      const Command = Edit.EndStroke(Stroke);
      SetMessage(Command ? `${Command.szLabel}: ${CountText(Edit.CommandTiles(Command).length)}` : 'Paint: no change');
      SyncUndoButtons();
    }
  }

  function UndoOrRedo(fUndo) {
    if (State.Stroke || State.LabelDrag) {
      return;
    }
    const Command = fUndo ? History.Undo(State.History) : History.Redo(State.History);
    if (Command) {
      const rgnTiles = Edit.CommandTiles(Command);
      SetMessage(`${fUndo ? 'Undo' : 'Redo'} ${Command.szLabel}${rgnTiles.length ? ': ' + CountText(rgnTiles.length) : ''}`);
      TilesChanged(rgnTiles);
      State.szPathAction = 'select';
      SyncSelection();
      BuildProperties();
      SetHover(State.nHoverTile);
    } else {
      SetMessage(fUndo ? 'Nothing to undo' : 'Nothing to redo');
    }
  }

  function SyncUndoButtons() {
    Root.document.getElementById('undo').disabled = !History.CanUndo(State.History);
    Root.document.getElementById('redo').disabled = !History.CanRedo(State.History);
  }

  // Files ---------------------------------------------------------------------------

  function IsDirty() {
    return State.Doc.nRevision !== State.nSavedRevision;
  }

  function ConfirmDiscard(szAction) {
    return !IsDirty() || Root.confirm(`Discard unsaved changes to "${State.Doc.szName || 'Untitled'}" and ${szAction}?`);
  }

  // Replaces the open document; fDirty marks it unsaved (e.g. a restored autosave).
  function LoadDocument(Doc, szMessage, fDirty = false) {
    EndStroke();
    FinishLabelDrag(true);
    State.Doc = Doc;
    State.History = History.Create(Doc);
    State.nHoverTile = -1;
    State.rgnPreviewTiles = [];
    State.Selection = null;
    State.nSelectedTile = -1;
    State.szPathAction = 'select';
    State.fNewLabel = false;
    State.nSavedRevision = fDirty ? -1 : Doc.nRevision;
    State.Layout = View.MapLayout(Doc);
    State.LastDraw = null;
    State.MiniCamera = null;
    Root.document.title = `${Doc.szName || 'Untitled'} \u2013 RPG World Map Editor`;
    SyncUndoButtons();
    BuildLayerList();
    SyncControls();
    BuildProperties();
    FitNet();
    SetMessage(szMessage);
  }

  function NewMap() {
    const Dialog = Root.document.getElementById('new-map-dialog');
    if (Dialog.open) {
      return;
    }
    EndStroke();
    FinishLabelDrag(true);
    const Current = State.Doc;
    const Local = Current.Local;
    const NumberInput = (nValue, nMin = 1, nStep = 1) => Element('input', {
      type: 'number', required: true, min: String(nMin), step: String(nStep),
      max: String(Number.MAX_SAFE_INTEGER), value: String(nValue),
    });
    const Kind = SelectControl([['global', 'Global world'], ['local', 'Local rectangle']], Current.szKind, () => UpdateFields());
    const Name = Element('input', { type: 'text', value: 'Untitled', autofocus: true });
    const PanelHexes = NumberInput(Local ? Local.nPanelHexes : Current.Global.nPanelHexes, 2, 2);
    const TileScale = SelectControl([['XL', 'XL - 216 mi per hex'], ['L', 'L - 36 mi per hex']], Current.Global ? Current.Global.szTileScale : 'XL', () => UpdateFields());
    const Width = NumberInput(Local ? Local.nWidth : 32);
    const Height = NumberInput(Local ? Local.nHeight : 24);
    const System = SelectControl([['regional', 'Regional (miles)'], ['local', 'Local (yards)']], Local ? Local.szSystem : 'regional', () => UpdateScales());
    const Size = SelectControl([], '', () => UpdateFields());
    const Hit = View.HitTest(View.MapGeometry(Current), State.Layout, [State.Camera.dCenterX, State.Camera.dCenterY]);
    const nAnchorTile = State.nSelectedTile >= 0 ? State.nSelectedTile : State.nHoverTile >= 0 ? State.nHoverTile : Hit ? Hit.nTile : -1;
    const AnchorLocation = Local ? Local.Anchor : nAnchorTile >= 0 ? Model.TileToUniversal(Current, nAnchorTile) : Coordinates.ParseUniversal('Eta 0.0E 0.0N');
    const Anchor = Element('input', { type: 'text', required: true, value: Coordinates.FormatUniversal(AnchorLocation, 10) });
    const GlobalFields = Element('fieldset', {}, [
      Element('legend', { textContent: 'Global map' }), Field('new-tile-scale', 'Tile scale', TileScale),
    ]);
    const LocalFields = Element('fieldset', {}, [
      Element('legend', { textContent: 'Local map' }),
      Field('new-width', 'Width (hexes)', Width), Field('new-height', 'Height (hexes)', Height),
      Field('new-system', 'Scale system', System), Field('new-size', 'Hex size', Size),
      Field('new-anchor', 'Anchor of tile (0, 0), in miles', Anchor),
    ]);
    const Preview = Element('p', { id: 'new-map-preview', className: 'tool-help' });
    const ErrorText = Element('p', { id: 'new-map-error', role: 'alert' });
    const Form = Element('form', { id: 'new-map-form', noValidate: true }, [
      Element('h2', { id: 'new-map-title', textContent: 'New map' }),
      Field('new-kind', 'Map type', Kind), Field('new-name', 'Name', Name),
      Field('new-panel-hexes', 'World panel hexes (even; also sets regional anchor alignment)', PanelHexes),
      GlobalFields, LocalFields, Preview, ErrorText,
      Element('div', { className: 'property-actions' }, [
        Element('button', { id: 'new-create', type: 'submit', className: 'tool-button', textContent: 'Create map' }),
        ActionButton('new-cancel', 'Cancel', () => Dialog.close()),
      ]),
    ]);
    const LocalOptions = () => ({
      nWidth: Number(Width.value), nHeight: Number(Height.value), szSystem: System.value, szScale: Size.value,
      nPanelHexes: Number(PanelHexes.value), Anchor: Coordinates.ParseUniversal(Anchor.value), szName: Name.value,
    });
    function UpdateFields() {
      const fLocal = Kind.value === 'local';
      LocalFields.hidden = LocalFields.disabled = !fLocal;
      GlobalFields.hidden = GlobalFields.disabled = fLocal;
      ErrorText.textContent = '';
      if (!fLocal) {
        Preview.textContent = 'New maps start as water. Global panel counts must be positive even integers.';
        return;
      }
      try {
        const Checked = Coordinates.CreateLocalMap(LocalOptions());
        const nDecimals = FileFormat.CoordinateDecimals(Checked.dHexMiles);
        Preview.textContent = `${Checked.szSystem === 'regional' ? 'Snapped anchor' : 'Free anchor'}: ${Coordinates.FormatUniversal(Checked.Anchor, Math.max(5, nDecimals))}. `
          + 'The local grid stays flat in this panel frame, even beyond its boundary. New maps start as water.';
      } catch (Caught) {
        Preview.textContent = `Check local settings: ${Caught.message}`;
      }
    }
    function UpdateScales(szInitial = null) {
      const szValue = szInitial || Size.value || 'M';
      const ScaleSystem = Lattice.g_Scales[System.value];
      Size.replaceChildren(...Lattice.g_rgszSizes.map((szSize) => Element('option', {
        value: szSize, textContent: `${szSize} - ${ScaleSystem.Sizes[szSize]} ${ScaleSystem.szUnit} per hex`,
      })));
      Size.value = szValue;
      UpdateFields();
    }
    Form.addEventListener('input', UpdateFields);
    Form.addEventListener('submit', (Event) => {
      Event.preventDefault();
      ErrorText.textContent = '';
      if (!Form.reportValidity()) {
        ErrorText.textContent = 'Check the highlighted map settings.';
        return;
      }
      let Doc;
      try {
        Doc = Kind.value === 'local' ? Model.CreateLocalMap(LocalOptions()) : Model.CreateGlobalMap({
          nPanelHexes: Number(PanelHexes.value), szTileScale: TileScale.value, szName: Name.value,
        });
      } catch (Caught) {
        ErrorText.textContent = Caught.message;
        return;
      }
      if (!ConfirmDiscard('create a new map')) {
        return;
      }
      Dialog.close();
      LoadDocument(Doc, `Created ${Doc.szKind} map`, true);
      ClearAutosave();
      ScheduleAutosave();
    });
    Dialog.replaceChildren(Form);
    UpdateScales(Local ? Local.szScale : 'M');
    State.fSpaceDown = false;
    Dialog.showModal();
  }

  function OpenMap() {
    if (ConfirmDiscard('open another map')) {
      Root.document.getElementById('open-file').click();
    }
  }

  // Parses map text; returns the document or null after reporting the error.
  function ParseMap(szText, szSource) {
    try {
      return FileFormat.Parse(szText);
    } catch (Caught) {
      SetMessage(`${szSource}: ${Caught.message}`);
      return null;
    }
  }

  function OpenFileChosen(Input) {
    const File = Input.files && Input.files[0];
    Input.value = '';
    if (File) {
      File.text().then((szText) => {
        const Doc = ParseMap(szText, `Can't open ${File.name}`);
        if (Doc) {
          LoadDocument(Doc, `Opened ${File.name}`);
          ClearAutosave();
        }
      }, (Caught) => SetMessage(`Can't read ${File.name}: ${Caught.message}`));
    }
  }

  function SaveMap() {
    EndStroke();
    FinishLabelDrag(false);
    const szName = FileFormat.FileName(State.Doc);
    const Url = Root.URL.createObjectURL(new Root.Blob([FileFormat.Write(State.Doc)], { type: 'text/plain' }));
    const Link = Element('a', { href: Url, download: szName });
    Root.document.body.append(Link);
    Link.click();
    Link.remove();
    Root.setTimeout(() => Root.URL.revokeObjectURL(Url), 0);
    State.nSavedRevision = State.Doc.nRevision;
    ClearAutosave();
    SetMessage(`Saved ${szName}`);
  }

  // Autosave keeps unsaved work in localStorage; it is cleared on save, open and new.
  function ScheduleAutosave() {
    Root.clearTimeout(State.nAutosaveTimer);
    State.nAutosaveTimer = Root.setTimeout(Autosave, g_nAutosaveDelayMs);
  }

  function Autosave() {
    Root.clearTimeout(State.nAutosaveTimer);
    State.nAutosaveTimer = 0;
    // Keep the earlier autosave while its restore offer is still showing.
    if (!IsDirty() || !Root.document.getElementById('restore-banner').hidden) {
      return;
    }
    try {
      Root.localStorage.setItem(g_szAutosaveKey, JSON.stringify({ szText: FileFormat.Write(State.Doc), nTime: Date.now() }));
    } catch (Caught) {
      SetMessage(`Autosave failed: ${Caught.message}`);
    }
  }

  function ClearAutosave() {
    Root.clearTimeout(State.nAutosaveTimer);
    State.nAutosaveTimer = 0;
    Root.document.getElementById('restore-banner').hidden = true;
    try {
      Root.localStorage.removeItem(g_szAutosaveKey);
    } catch (Caught) {
      // Storage unavailable: nothing to clear.
    }
  }

  function ReadAutosave() {
    try {
      const Saved = JSON.parse(Root.localStorage.getItem(g_szAutosaveKey) || 'null');
      return Saved && typeof Saved.szText === 'string' ? Saved : null;
    } catch (Caught) {
      return null;
    }
  }

  function OfferRestore() {
    const Saved = ReadAutosave();
    const Banner = Root.document.getElementById('restore-banner');
    if (!Saved) {
      return;
    }
    const Doc = ParseMap(Saved.szText, 'Autosave is unreadable');
    if (!Doc) {
      ClearAutosave();
      return;
    }
    Root.document.getElementById('restore-text').textContent =
      `Unsaved map "${Doc.szName || 'Untitled'}" from ${new Date(Saved.nTime).toLocaleString()} was found.`;
    Root.document.getElementById('restore-accept').onclick = () => {
      if (ConfirmDiscard('restore the autosaved map')) {
        Banner.hidden = true;
        LoadDocument(Doc, 'Restored unsaved work', true);
      }
    };
    Root.document.getElementById('restore-discard').onclick = () => {
      Banner.hidden = true;
      ClearAutosave();
      SetMessage('Discarded the autosaved map');
      if (IsDirty()) {
        ScheduleAutosave();
      }
    };
    Banner.hidden = false;
  }

  function FitNet() {
    View.FitBounds(State.Camera, State.Layout.rgdBounds);
    RequestDraw();
  }

  // Fits the focus panel, or in the net view the panel under the view centre.
  function FitPanel() {
    if (State.Doc.Local) {
      FitNet();
      return;
    }
    let szPanel = State.Layout.szFocus;
    if (!szPanel) {
      const Hit = View.PlacementAt(State.Layout, [State.Camera.dCenterX, State.Camera.dCenterY]);
      szPanel = Hit ? Hit.Placement.szPanel : null;
    }
    if (szPanel) {
      View.FitBounds(State.Camera, View.FindPlacement(State.Layout, szPanel).rgdBounds);
    } else {
      View.FitBounds(State.Camera, State.Layout.rgdBounds);
    }
    RequestDraw();
  }

  // Switches to the focus view of szPanel, keeping rgdFrame (a point in that panel's
  // frame) at the view centre, or fitting the panel when rgdFrame is null.
  function ShowFocus(szPanel, rgdFrame = null) {
    if (State.Doc.Local) {
      SetMessage('Panel focus is only available for global maps');
      return;
    }
    State.Layout = View.BuildFocusLayout(szPanel);
    if (rgdFrame) {
      View.CenterOn(State.Camera, rgdFrame);
    } else {
      View.FitBounds(State.Camera, View.FindPlacement(State.Layout, szPanel).rgdBounds);
    }
    SyncControls();
    RequestDraw();
  }

  // Back to the net, keeping the current view centre where it was on the focus panel.
  function ShowNet() {
    if (State.Doc.Local) {
      SetMessage('Local maps have no net view; use Fit all');
      return;
    }
    if (State.Layout.szMode === 'focus') {
      const Frame = Projection.Build().Frames[State.Layout.szFocus];
      const rgdCenter = Projection.ApplyTransform(Frame.rgdFrameToNet, [State.Camera.dCenterX, State.Camera.dCenterY]);
      State.Layout = View.BuildNetLayout();
      View.CenterOn(State.Camera, rgdCenter);
    }
    SyncControls();
    RequestDraw();
  }

  function FocusAtViewCenter() {
    if (State.Doc.Local) {
      SetMessage('Panel focus is only available for global maps');
      return;
    }
    const Hit = View.PlacementAt(State.Layout, [State.Camera.dCenterX, State.Camera.dCenterY]);
    if (Hit) {
      ShowFocus(Hit.Placement.szPanel, Hit.rgdFrame);
    }
  }

  function SyncControls() {
    const Select = Root.document.getElementById('focus-panel');
    Select.value = State.Layout.szFocus || '';
    const fLocal = State.Doc.szKind === 'local';
    Select.disabled = fLocal;
    Root.document.getElementById('view-net').disabled = fLocal;
    Root.document.getElementById('fit-panel').disabled = fLocal;
    State.MiniCanvas.setAttribute('aria-label', fLocal ? 'Local map navigator' : 'Net navigator');
    Root.document.getElementById('view-net').setAttribute('aria-pressed', String(State.Layout.szMode === 'net'));
  }

  function BuildToolbar() {
    const Built = Projection.Build();
    const rgszGreek = Object.keys(Projection.g_SectorLabels);
    const Select = Element('select', { id: 'focus-panel', title: 'Focus view: one panel north-up with its neighbours unfolded' }, [
      Element('option', { value: '', textContent: 'Focus panel\u2026' }),
      ...rgszGreek.map((szPanel) => Element('option', { value: szPanel, textContent: `${Built.Panels[szPanel].szLetter} ${Built.Panels[szPanel].szName}` })),
    ]);
    Select.addEventListener('change', () => (Select.value ? ShowFocus(Select.value) : ShowNet()));
    const OpenInput = Element('input', { id: 'open-file', type: 'file', accept: `.txt,${FileFormat.g_szFileExtension},text/plain`, hidden: true });
    OpenInput.addEventListener('change', () => OpenFileChosen(OpenInput));
    const rgButtons = [
      Element('button', { id: 'file-new', type: 'button', textContent: 'New', title: 'Create a global or local map', onclick: NewMap }),
      Element('button', { id: 'file-open', type: 'button', textContent: 'Open\u2026', title: 'Open a .map.txt file (Ctrl+O)', onclick: OpenMap }),
      Element('button', { id: 'file-save', type: 'button', textContent: 'Save', title: 'Download the map as a .map.txt file (Ctrl+S)', onclick: SaveMap }),
      OpenInput,
      Element('span', { className: 'toolbar-gap' }),
      Element('button', { id: 'view-net', type: 'button', textContent: 'Net view', title: 'Show the whole net (N)', onclick: ShowNet }),
      Select,
      Element('button', { id: 'fit-net', type: 'button', textContent: 'Fit all', title: 'Fit the whole view (Home)', onclick: FitNet }),
      Element('button', { id: 'fit-panel', type: 'button', textContent: 'Fit panel', title: 'Fit the focus panel or the panel at the centre (F)', onclick: FitPanel }),
      Element('span', { className: 'toolbar-gap' }),
      Element('button', { id: 'undo', type: 'button', textContent: 'Undo', title: 'Undo (Ctrl+Z)', onclick: () => UndoOrRedo(true) }),
      Element('button', { id: 'redo', type: 'button', textContent: 'Redo', title: 'Redo (Ctrl+Y or Ctrl+Shift+Z)', onclick: () => UndoOrRedo(false) }),
    ];
    Root.document.getElementById('toolbar-actions').replaceChildren(...rgButtons);
  }

  function BuildLayerList() {
    const rgRows = g_rgLayerToggles.map(([szKey, szLabel]) => {
      const Box = Element('input', { type: 'checkbox', checked: State.Layers[szKey], id: `layer-${szKey}` });
      Box.disabled = szKey === 'fNames' && State.Doc.szKind === 'local';
      Box.addEventListener('change', () => {
        State.Layers[szKey] = Box.checked;
        BuildProperties();
        RequestDraw();
      });
      return Element('label', { className: 'layer-toggle' }, [Box, ` ${szKey === 'fOutlines' && State.Doc.Local ? 'Map outline' : szLabel}`]);
    });
    Root.document.getElementById('layer-list').replaceChildren(...rgRows);
  }

  function BuildToolList() {
    const rgButtons = g_rgTools.map(([szId, szLabel, , szTitle]) =>
      Element('button', { id: `tool-${szId}`, type: 'button', className: 'tool-button', textContent: szLabel, title: szTitle, onclick: () => SetTool(szId) }));
    const Slider = Element('input', { id: 'brush-radius', type: 'range', min: '0', max: String(Edit.g_nMaxBrushRadius), step: '1', value: String(State.nBrushRadius) });
    Slider.addEventListener('input', () => SetBrushRadius(Number(Slider.value)));
    const BrushOptions = Element('div', { id: 'brush-options', className: 'tool-option' }, [
      Element('label', { htmlFor: 'brush-radius', title: 'Brush radius in tiles ([ and ])' }, ['Radius ']),
      Slider,
      Element('span', { id: 'brush-radius-value', textContent: String(State.nBrushRadius) }),
    ]);
    const ActiveTerrain = Element('div', { className: 'tool-option', title: 'Active terrain: click a terrain under Properties to change it' }, [
      Element('span', { id: 'active-terrain-swatch', className: 'swatch' }),
      Element('span', { id: 'active-terrain-name' }),
    ]);
    Root.document.getElementById('tool-list').replaceChildren(
      Element('div', { className: 'tool-buttons' }, rgButtons), BrushOptions, ActiveTerrain,
      Element('div', { id: 'feature-options' }));
  }

  function BuildLegend() {
    const rgRows = Terrain.g_rgTerrains.map((Item) => {
      const Row = Element('div', { className: 'legend-row', role: 'radio', tabIndex: 0, title: `Paint with ${Item.szName}` }, [
        Element('span', { className: 'swatch', style: `background:${Item.szColor}` }),
        Element('code', { textContent: Item.szChar }),
        ` ${Item.szName}`,
      ]);
      Row.dataset.terrain = String(Item.nId);
      Row.addEventListener('click', () => SetTerrain(Item.nId));
      Row.addEventListener('keydown', (Event) => {
        if (Event.key === 'Enter' || Event.key === ' ') {
          Event.preventDefault();
          SetTerrain(Item.nId);
        }
      });
      return Row;
    });
    Root.document.getElementById('property-list').replaceChildren(
      Element('h2', { textContent: 'Terrain' }), Element('div', { role: 'radiogroup', ariaLabel: 'Active terrain' }, rgRows));
  }

  function Field(szId, szTitle, Control) {
    Control.id = szId;
    return Element('label', { className: 'property-field', htmlFor: szId }, [
      Element('span', { textContent: szTitle }), Control,
    ]);
  }

  function SelectControl(rgOptions, szValue, OnChange) {
    const Select = Element('select', {}, rgOptions.map(([szKey, szText]) => Element('option', { value: szKey, textContent: szText })));
    Select.value = szValue;
    Select.onchange = () => OnChange(Select.value);
    return Select;
  }

  function ActionButton(szId, szText, OnClick, fDisabled = false) {
    return Element('button', { id: szId, type: 'button', className: 'tool-button', textContent: szText, onclick: OnClick, disabled: fDisabled });
  }

  function FeatureName(szLayer, Item) {
    return szLayer === 'label' ? Item.szText : `${Item.szType}: ${Item.szName || Item.szId || '(unnamed)'}`;
  }

  function SelectionTile(Selection) {
    const Item = Edit.GetFeature(State.Doc, Selection);
    return !Item ? -1 : Selection.szLayer === 'landmark' ? Selection.Key
      : Selection.szLayer === 'label' ? Item.nTile : Item.rgnTiles[Selection.nPoint || 0];
  }

  function SyncSelection() {
    const Item = Edit.GetFeature(State.Doc, State.Selection);
    if (!Item) {
      State.Selection = null;
    } else if (State.Selection.szLayer === 'overlay') {
      State.Selection.nPoint = Math.min(State.Selection.nPoint || 0, Item.rgnTiles.length - 1);
    }
    if (State.Selection) {
      State.nSelectedTile = SelectionTile(State.Selection);
    }
  }

  function SelectFeature(Selection) {
    State.Selection = Selection ? { szLayer: Selection.szLayer, Key: Selection.Key, nPoint: Selection.nPoint || 0 } : null;
    SyncSelection();
    BuildProperties();
    RequestDraw();
  }

  function ApplyFeatureEdit(Action, fSelectChanged = false) {
    try {
      const Command = Action();
      if (Command && fSelectChanged) {
        const Change = Command.rgChanges[0];
        State.Selection = { szLayer: Change.szLayer, Key: Change.Key, nPoint: 0 };
      }
      SyncSelection();
      BuildProperties();
      if (Command) {
        TilesChanged(Edit.CommandTiles(Command));
        SetMessage(Command.szLabel);
      }
      return true;
    } catch (Caught) {
      SetMessage(`Can't edit: ${Caught.message}`);
      return false;
    }
  }

  function StartPath() {
    SelectFeature(null);
    State.szPathAction = 'new';
    BuildProperties();
    SetMessage('Click the first tile of the new path');
  }

  function FinishPath() {
    State.szPathAction = 'select';
    BuildProperties();
    SetMessage('Path finished; click a path to select it');
  }

  function BuildFeatureOptions() {
    const rgFields = [];
    if (State.szTool === 'overlay') {
      rgFields.push(Field('overlay-type', 'New path type', SelectControl(
        Model.g_rgszOverlayTypes.map((szType) => [szType, szType]), State.szOverlayType, (szValue) => {
          State.szOverlayType = szValue;
          StartPath();
        })));
      rgFields.push(ActionButton('path-new', 'New path', StartPath));
    } else if (State.szTool === 'landmark') {
      rgFields.push(Field('landmark-type', 'New landmark type', SelectControl(
        Terrain.g_rgLandmarkTypes.map((Item) => [Item.szKey, Item.szName]), State.szLandmarkType, (szValue) => { State.szLandmarkType = szValue; })));
    } else if (State.szTool === 'label') {
      rgFields.push(Field('label-category', 'New label category', SelectControl(
        Model.g_rgszLabelCategories.map((szCategory) => [szCategory, szCategory]), State.szLabelCategory, (szValue) => { State.szLabelCategory = szValue; })));
      rgFields.push(ActionButton('label-new', 'New label', () => {
        SelectFeature(null);
        State.fNewLabel = true;
        SetMessage('Click a tile to add another label');
      }));
    } else if (State.szTool === 'select' || State.szTool === 'erase') {
      rgFields.push(Field('target-layer', 'Target layer', SelectControl([
        ['all', 'Any feature'], ['terrain', 'Terrain'], ['road', 'Roads'], ['trail', 'Trails'], ['river', 'Rivers'],
        ['landmark', 'Landmarks'], ['label', 'Labels'],
      ], State.szTargetLayer, (szValue) => {
        State.szTargetLayer = szValue;
        State.nSelectedTile = -1;
        SelectFeature(null);
      })));
    }
    Root.document.getElementById('feature-options').replaceChildren(...rgFields);
  }

  function FeaturesAt(nTile, szFilter = 'all') {
    if (!Model.IsTile(State.Doc, nTile)) {
      return [];
    }
    const rgFeatures = [
      ...Model.OverlaysAt(State.Doc, nTile).map((Item) => ({ szLayer: 'overlay', Key: Item.szId, nPoint: Item.rgnTiles.indexOf(nTile), Item })),
      ...[Model.GetLandmark(State.Doc, nTile)].filter(Boolean).map((Item) => ({ szLayer: 'landmark', Key: nTile, Item })),
      ...Model.LabelsAt(State.Doc, nTile).map((Item) => ({ szLayer: 'label', Key: Item.szId, Item })),
    ];
    return rgFeatures.filter(({ szLayer, Item }) => Renderer.FeatureVisible(State.Layers, szLayer, Item)
      && (szFilter === 'all' || szFilter === szLayer || (szLayer === 'overlay' && szFilter === Item.szType)));
  }

  function BuildProperties() {
    const fTerrain = ['pan', 'brush', 'fill', 'eyedropper'].includes(State.szTool)
      || (['select', 'erase'].includes(State.szTool) && State.szTargetLayer === 'terrain');
    Root.document.getElementById('property-list').hidden = !fTerrain;
    const Container = Root.document.getElementById('feature-properties');
    Container.hidden = fTerrain;
    if (fTerrain) {
      return;
    }
    const Selection = State.Selection;
    const Item = Edit.GetFeature(State.Doc, Selection);
    const rgFields = [];
    const rgAtTile = FeaturesAt(State.nSelectedTile);
    if (rgAtTile.length > 1) {
      rgFields.push(Field('feature-choice', 'Features on this tile', SelectControl(
        rgAtTile.map((Entry, nIndex) => [String(nIndex), FeatureName(Entry.szLayer, Entry.Item) + (Entry.Item.szId ? ` [${Entry.Item.szId}]` : '')]),
        String(rgAtTile.findIndex((Entry) => Selection && Entry.szLayer === Selection.szLayer && Entry.Key === Selection.Key)),
        (szIndex) => {
          State.szPathAction = 'select';
          SelectFeature(rgAtTile[Number(szIndex)]);
        })));
    }
    if (!Item) {
      const szHelp = State.szTool === 'overlay' ? 'Click a tile to start a path, then click to extend. Gaps follow the shortest tile path. Escape finishes.'
        : State.szTool === 'landmark' ? 'Click a tile to place a landmark, or an existing symbol to edit it.'
        : State.szTool === 'label' ? 'Click a tile to add a label. Select existing text to edit it.'
        : State.szTool === 'erase' ? 'Click to erase only the target layer. For overlapping features, use Select and the feature chooser first.'
        : 'Click a feature to inspect it. Hidden layers cannot be selected or erased.';
      rgFields.push(Element('p', { className: 'tool-help', textContent: szHelp }));
      Container.replaceChildren(...rgFields);
      return;
    }
    const { szLayer, Key } = Selection;
    rgFields.push(Element('h2', { textContent: FeatureName(szLayer, Item) }));
    if (!Renderer.FeatureVisible(State.Layers, szLayer, Item)) {
      rgFields.push(Element('p', { className: 'tool-help', textContent: 'This layer is hidden. Show it to edit the feature.' }));
      Container.replaceChildren(...rgFields);
      return;
    }
    const EditProps = (Props) => ApplyFeatureEdit(() => Edit.SetFeature(State.History, szLayer, Key, Props));
    const TextField = (szKey, szTitle, fNumber = false) => {
      const Input = Element('input', { type: fNumber ? 'number' : 'text', value: String(Item[szKey]), step: 'any' });
      if (fNumber) {
        Input.required = true;
        if (szKey === 'dSize') {
          Input.min = '0.1';
        }
      }
      Input.onchange = () => {
        if (Input.reportValidity()) {
          EditProps({ [szKey]: fNumber ? Number(Input.value) : Input.value });
        }
      };
      rgFields.push(Field(`feature-${szKey}`, szTitle, Input));
    };
    if (szLayer === 'overlay') {
      rgFields.push(Field('feature-type', 'Type', SelectControl(Model.g_rgszOverlayTypes.map((sz) => [sz, sz]), Item.szType, (szType) => EditProps({ szType }))));
      TextField('szName', 'Name');
      TextField('szStyle', 'Style (letters, digits, - or _)');
      rgFields.push(Field('path-point', 'Selected point', SelectControl(Item.rgnTiles.map((nTile, nIndex) => [
        String(nIndex), `${nIndex + 1}: ${TileLocationText(nTile)}`,
      ]), String(Selection.nPoint), (szIndex) => SelectFeature({ ...Selection, nPoint: Number(szIndex) }))));
      const nPoint = Selection.nPoint;
      rgFields.push(Element('div', { className: 'property-actions' }, [
        ActionButton('path-extend', 'Extend end', () => {
          SetTool('overlay');
          State.szPathAction = 'extend';
          BuildProperties();
          SetMessage('Click a tile to extend the path from its end');
        }),
        ActionButton('path-insert', 'Insert after point', () => {
          SetTool('overlay');
          State.szPathAction = 'insert';
          BuildProperties();
          SetMessage('Click a tile to insert after the selected point');
        }),
        ActionButton('path-remove', 'Remove point', () => ApplyFeatureEdit(() => Edit.RemoveOverlayPoint(State.History, Key, nPoint))),
        ActionButton('path-split', 'Split at point', () => ApplyFeatureEdit(() => Edit.SplitOverlay(State.History, Key, nPoint)), nPoint === 0 || nPoint === Item.rgnTiles.length - 1),
        ActionButton('path-finish', 'Finish path', FinishPath),
      ]));
      rgFields.push(Element('p', { className: 'tool-help', textContent: `Path mode: ${State.szPathAction}. Select a point to insert, remove or split. Removing an interior point reroutes around that tile.` }));
      const rgOthers = State.Doc.rgOverlays.filter((Other) => Other.szId !== Key && Other.szType === Item.szType);
      if (rgOthers.length > 0) {
        const Target = SelectControl(rgOthers.map((Other) => [Other.szId, Other.szName || Other.szId]), rgOthers[0].szId, () => {});
        const FromEnd = SelectControl([['end', 'End'], ['start', 'Start']], 'end', () => {});
        const ToEnd = SelectControl([['start', 'Start'], ['end', 'End']], 'start', () => {});
        rgFields.push(Field('join-target', 'Join to (same type)', Target), Field('join-from', 'This endpoint', FromEnd), Field('join-to', 'Other endpoint', ToEnd),
          ActionButton('path-join', 'Join paths', () => ApplyFeatureEdit(() => Edit.JoinOverlays(State.History, Key, Target.value, FromEnd.value === 'start', ToEnd.value === 'end'))),
          Element('p', { className: 'tool-help', textContent: 'Join keeps this path\'s name/style, removes the other path, and bridges any gap.' }));
      }
    } else if (szLayer === 'landmark') {
      rgFields.push(Field('feature-type', 'Type', SelectControl(Terrain.g_rgLandmarkTypes.map((Type) => [Type.szKey, Type.szName]), Item.szType, (szType) => EditProps({ szType }))));
      TextField('szName', 'Name');
      TextField('szNotes', 'Notes (one line)');
    } else {
      TextField('szText', 'Text');
      rgFields.push(Field('feature-category', 'Category', SelectControl(Model.g_rgszLabelCategories.map((sz) => [sz, sz]), Item.szCategory, (szCategory) => EditProps({ szCategory }))));
      TextField('dSize', 'Size (48 units = one hex)', true);
      TextField('dRotation', 'Rotation (clockwise degrees)', true);
      TextField('dDx', 'Offset right (units)', true);
      TextField('dDy', 'Offset down (units)', true);
      rgFields.push(Element('p', { className: 'tool-help', textContent: 'Drag the white handle to move; drag the yellow handle to rotate. Escape cancels a drag. Each drag is one undo step.' }));
    }
    rgFields.push(Element('div', { className: 'property-actions' }, [
      ActionButton('feature-delete', `Delete ${szLayer}`, DeleteSelected),
    ]));
    Container.replaceChildren(...rgFields);
  }

  function DeleteSelected() {
    const Item = Edit.GetFeature(State.Doc, State.Selection);
    if (Item && Renderer.FeatureVisible(State.Layers, State.Selection.szLayer, Item)) {
      const { szLayer, Key } = State.Selection;
      State.szPathAction = 'select';
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, szLayer, Key, null));
    }
  }

  function PickFeature(rgdScreen, Hit, szFilter) {
    const Feature = Renderer.HitFeature(State.Renderer, State, rgdScreen, szFilter);
    return Feature || (Hit ? FeaturesAt(Hit.nTile, szFilter).at(-1) : null);
  }

  function FeatureClick(rgdScreen, Hit) {
    const szTool = State.szTool;
    const szFilter = szTool === 'select' || szTool === 'erase' ? State.szTargetLayer : szTool;
    State.nSelectedTile = Hit ? Hit.nTile : -1;
    if (szFilter === 'terrain') {
      SelectFeature(null);
      if (Hit && State.Layers.fTerrain) {
        if (szTool === 'erase') {
          const Command = History.Perform(State.History, 'Erase terrain', (Doc, Record) => Record(Model.SetTerrain(Doc, Hit.nTile, Terrain.g_nWaterId)));
          TilesChanged(Edit.CommandTiles(Command));
          SetMessage(Command ? 'Erased terrain' : 'Terrain is already water');
        } else {
          PickTerrain(Hit.nTile);
        }
      }
      return;
    }
    const Feature = PickFeature(rgdScreen, Hit, szFilter);
    if (szTool === 'erase') {
      if (Feature) {
        SelectFeature(Feature);
        DeleteSelected();
      } else {
        SetMessage('No visible feature in the target layer here');
      }
      return;
    }
    if (szTool === 'select') {
      SelectFeature(Feature);
      return;
    }
    if (szTool === 'overlay' && State.szPathAction !== 'select' && State.szPathAction !== 'new') {
      const Selected = Edit.GetFeature(State.Doc, State.Selection);
      if (!Selected || State.Selection.szLayer !== 'overlay' || !State.Layers[Selected.szType]) {
        SetMessage('Select a visible path first');
        return;
      }
      if (Hit) {
        const { Key, nPoint } = State.Selection;
        const fInsert = State.szPathAction === 'insert';
        if (ApplyFeatureEdit(() => fInsert ? Edit.InsertOverlayPoint(State.History, Key, nPoint, Hit.nTile) : Edit.ExtendOverlay(State.History, Key, Hit.nTile))) {
          const rgnTiles = Model.GetOverlay(State.Doc, Key).rgnTiles;
          State.Selection.nPoint = fInsert ? rgnTiles.indexOf(Hit.nTile, nPoint) : rgnTiles.length - 1;
          if (fInsert) {
            State.szPathAction = 'select';
          }
          SyncSelection();
          BuildProperties();
        }
      }
      return;
    }
    if (Feature && !(szTool === 'overlay' && State.szPathAction === 'new') && !(szTool === 'label' && State.fNewLabel)) {
      SelectFeature(Feature);
      return;
    }
    if (!Hit) {
      SelectFeature(null);
      return;
    }
    const szLayerKey = szTool === 'overlay' ? State.szOverlayType : szTool;
    if (!State.Layers[szLayerKey]) {
      SetMessage(`Show the ${szLayerKey} layer before adding a feature`);
      return;
    }
    if (szTool === 'overlay') {
      if (ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'overlay', null, { szType: State.szOverlayType, rgnTiles: [Hit.nTile] }), true)) {
        State.szPathAction = 'extend';
        BuildProperties();
      }
    } else if (szTool === 'landmark') {
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'landmark', Hit.nTile, { szType: State.szLandmarkType }), true);
    } else if (szTool === 'label') {
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'label', null, { nTile: Hit.nTile, szCategory: State.szLabelCategory, szText: 'Label' }), true);
      State.fNewLabel = false;
    }
  }

  function StartLabelDrag(rgdScreen) {
    if (!['label', 'select'].includes(State.szTool) || (State.szTool === 'select' && !['all', 'label'].includes(State.szTargetLayer)) || State.fNewLabel) {
      return false;
    }
    const Hit = Renderer.HitFeature(State.Renderer, State, rgdScreen, 'label');
    if (!Hit || !Hit.szHandle) {
      return false;
    }
    const Label = Model.GetLabel(State.Doc, Hit.Key);
    const rgdScreenToFrame = Projection.InvertTransform(Hit.rgdFrameToScreen);
    State.LabelDrag = { Label, szHandle: Hit.szHandle, rgdScreenToFrame, rgdStart: Projection.ApplyTransform(rgdScreenToFrame, rgdScreen) };
    State.LabelPreview = Label;
    return true;
  }

  function MoveLabelDrag(rgdScreen) {
    const Drag = State.LabelDrag;
    if (!Drag) {
      return;
    }
    const rgdPoint = Projection.ApplyTransform(Drag.rgdScreenToFrame, rgdScreen);
    const Label = Drag.Label;
    const Geometry = View.MapGeometry(State.Doc);
    const dUnit = Geometry.dD / View.g_dLabelUnitsPerHex;
    if (Drag.szHandle === 'move') {
      State.LabelPreview = { ...Label, dDx: Label.dDx + (rgdPoint[0] - Drag.rgdStart[0]) / dUnit, dDy: Label.dDy - (rgdPoint[1] - Drag.rgdStart[1]) / dUnit };
    } else {
      const rgdT = View.LabelTransform(Geometry, Label);
      const Angle = (Point) => Math.atan2(-(Point[1] - rgdT[5]), Point[0] - rgdT[4]);
      const dDelta = Angle(rgdPoint) - Angle(Drag.rgdStart);
      State.LabelPreview = { ...Label, dRotation: Label.dRotation + Math.atan2(Math.sin(dDelta), Math.cos(dDelta)) * 180 / Math.PI };
    }
    RequestDraw();
  }

  function FinishLabelDrag(fCancel) {
    if (!State.LabelDrag) {
      return;
    }
    const Label = State.LabelPreview;
    State.LabelPreview = null;
    State.LabelDrag = null;
    if (fCancel) {
      SetMessage('Label drag cancelled');
    } else {
      ApplyFeatureEdit(() => Edit.SetFeature(State.History, 'label', Label.szId, { dDx: Label.dDx, dDy: Label.dDy, dRotation: Label.dRotation }));
    }
    RequestDraw();
  }

  function LocalPoint(Event, Target) {
    const Rect = Target.getBoundingClientRect();
    return [Event.clientX - Rect.left, Event.clientY - Rect.top];
  }

  // The left button drives the active tool; the middle or right button, Space+drag
  // and the Pan tool pan. Alt+click picks a terrain with any editing tool.
  function AttachCanvasEvents(Canvas) {
    let Drag = null;
    Canvas.addEventListener('contextmenu', (Event) => Event.preventDefault());
    Canvas.addEventListener('pointerdown', (Event) => {
      if (Drag) {
        return;
      }
      const rgdPoint = LocalPoint(Event, Canvas);
      const fPan = Event.button === 1 || Event.button === 2 || State.fSpaceDown || State.szTool === 'pan';
      if (Event.button === 1) {
        Event.preventDefault();
      }
      if (fPan) {
        Drag = { szMode: 'pan', nPointer: Event.pointerId, rgdLast: rgdPoint };
        Canvas.classList.add('dragging');
      } else if (Event.button === 0) {
        if (!Event.altKey && StartLabelDrag(rgdPoint)) {
          Drag = { szMode: 'label', nPointer: Event.pointerId };
          Canvas.setPointerCapture(Event.pointerId);
          return;
        }
        const Hit = HitAt(rgdPoint);
        if (Event.altKey || State.szTool === 'eyedropper') {
          if (Hit) {
            PickTerrain(Hit.nTile);
          }
          return;
        }
        if (State.szTool === 'fill') {
          if (Hit) {
            FillAt(Hit.nTile);
          }
          return;
        }
        if (State.szTool !== 'brush') {
          FeatureClick(rgdPoint, Hit);
          return;
        }
        State.Stroke = Edit.BeginStroke(State.History, State.nTerrainId, State.nBrushRadius);
        Drag = { szMode: 'paint', nPointer: Event.pointerId };
        StrokeAt(rgdPoint);
      } else {
        return;
      }
      Canvas.setPointerCapture(Event.pointerId);
    });
    Canvas.addEventListener('pointermove', (Event) => {
      const rgdPoint = LocalPoint(Event, Canvas);
      if (Drag && Drag.nPointer === Event.pointerId) {
        if (Drag.szMode === 'pan') {
          View.Pan(State.Camera, rgdPoint[0] - Drag.rgdLast[0], rgdPoint[1] - Drag.rgdLast[1]);
          Drag.rgdLast = rgdPoint;
          RequestDraw();
        } else if (Drag.szMode === 'label') {
          MoveLabelDrag(rgdPoint);
        } else if (State.Stroke) {
          StrokeAt(rgdPoint);
        }
      }
      HoverAt(rgdPoint);
    });
    const EndDrag = (Event) => {
      if (Drag && Drag.nPointer === Event.pointerId) {
        if (Drag.szMode === 'paint') {
          EndStroke();
        } else if (Drag.szMode === 'label') {
          FinishLabelDrag(Event.type !== 'pointerup');
        }
        Drag = null;
        Canvas.classList.remove('dragging');
      }
    };
    Canvas.addEventListener('pointerup', EndDrag);
    Canvas.addEventListener('pointercancel', EndDrag);
    Canvas.addEventListener('lostpointercapture', EndDrag);
    Canvas.addEventListener('pointerleave', () => SetHover(-1));
    Canvas.addEventListener('wheel', (Event) => {
      Event.preventDefault();
      if (State.LabelDrag) {
        return;
      }
      const dDelta = Event.deltaMode === 1 ? Event.deltaY * 16 : Event.deltaY;
      View.ZoomAt(State.Camera, LocalPoint(Event, Canvas), Math.exp(-dDelta * 0.0015));
      HoverAt(LocalPoint(Event, Canvas));
      RequestDraw();
    }, { passive: false });
    Canvas.addEventListener('dblclick', (Event) => {
      if (State.szTool !== 'pan' || State.Doc.Local) {
        return;
      }
      const Hit = View.PlacementAt(State.Layout, View.ScreenToWorld(State.Camera, LocalPoint(Event, Canvas)));
      if (Hit && (State.Layout.szMode === 'net' || Hit.Placement.szPanel !== State.Layout.szFocus)) {
        ShowFocus(Hit.Placement.szPanel, State.Layout.szMode === 'net' ? null : Hit.rgdFrame);
      }
    });
  }

  function AttachMinimapEvents(MiniCanvas) {
    MiniCanvas.addEventListener('click', (Event) => {
      if (!State.MiniCamera) {
        return;
      }
      const rgdNet = View.ScreenToWorld(State.MiniCamera, LocalPoint(Event, MiniCanvas));
      if (State.Layout.szMode !== 'focus') {
        View.CenterOn(State.Camera, rgdNet);
        RequestDraw();
        return;
      }
      const Hit = View.PlacementAt(View.BuildNetLayout(), rgdNet);
      if (Hit) {
        ShowFocus(Hit.Placement.szPanel, Hit.rgdFrame);
      }
    });
  }

  function AttachKeyboard() {
    Root.addEventListener('keyup', (Event) => {
      if (Event.key === ' ') {
        State.fSpaceDown = false;
      }
    });
    Root.addEventListener('blur', () => {
      State.fSpaceDown = false;
    });
    Root.addEventListener('keydown', (Event) => {
      if (Root.document.getElementById('new-map-dialog').open) {
        return;
      }
      const szTag = Event.target && Event.target.tagName;
      const fTextEntry = szTag === 'TEXTAREA' || (szTag === 'INPUT' && Event.target.type !== 'range' && Event.target.type !== 'checkbox');
      if (State.LabelDrag) {
        if (Event.key === 'Escape') {
          FinishLabelDrag(true);
        }
        Event.preventDefault();
        return;
      }
      if ((Event.ctrlKey || Event.metaKey) && !Event.altKey && !fTextEntry) {
        const szKey = Event.key.toLowerCase();
        if (szKey === 'z' || szKey === 'y') {
          Event.preventDefault();
          UndoOrRedo(szKey === 'z' && !Event.shiftKey);
        } else if (szKey === 's') {
          Event.preventDefault();
          SaveMap();
        } else if (szKey === 'o') {
          Event.preventDefault();
          OpenMap();
        }
        return;
      }
      if (szTag === 'INPUT' || szTag === 'SELECT' || szTag === 'TEXTAREA' || Event.ctrlKey || Event.metaKey || Event.altKey) {
        return;
      }
      if (Event.key === 'Escape') {
        EndStroke();
        State.fNewLabel = false;
        FinishPath();
        return;
      }
      if ((Event.key === 'Delete' || Event.key === 'Backspace') && !['pan', 'brush', 'fill', 'eyedropper'].includes(State.szTool)) {
        Event.preventDefault();
        DeleteSelected();
        return;
      }
      if (Event.key === ' ') {
        Event.preventDefault();
        State.fSpaceDown = true;
        return;
      }
      const Tool = g_rgTools.find((Entry) => Entry[2] === Event.key.toLowerCase());
      if (Tool) {
        Event.preventDefault();
        SetTool(Tool[0]);
        return;
      }
      if (Event.key === '[' || Event.key === ']') {
        Event.preventDefault();
        SetBrushRadius(State.nBrushRadius + (Event.key === ']' ? 1 : -1));
        return;
      }
      const dStep = g_dKeyPanPixels * (Event.shiftKey ? 4 : 1);
      const rgdCenter = [State.Camera.nWidth / 2, State.Camera.nHeight / 2];
      const Actions = {
        ArrowLeft: () => View.Pan(State.Camera, dStep, 0),
        ArrowRight: () => View.Pan(State.Camera, -dStep, 0),
        ArrowUp: () => View.Pan(State.Camera, 0, dStep),
        ArrowDown: () => View.Pan(State.Camera, 0, -dStep),
        '+': () => View.ZoomAt(State.Camera, rgdCenter, g_dKeyZoomFactor),
        '=': () => View.ZoomAt(State.Camera, rgdCenter, g_dKeyZoomFactor),
        '-': () => View.ZoomAt(State.Camera, rgdCenter, 1 / g_dKeyZoomFactor),
        Home: FitNet,
        f: FitPanel,
        n: ShowNet,
        p: FocusAtViewCenter,
      };
      const Action = Actions[Event.key];
      if (Action) {
        Event.preventDefault();
        Action();
        RequestDraw();
      }
    });
  }

  // A new global map seeded with the deterministic demo terrain (no undo history).
  function CreateDemoDocument() {
    const Doc = Model.CreateGlobalMap({ szName: 'Demo' });
    View.DemoTerrain(Doc.Topo, 1).forEach((nId, nTile) => Model.SetTerrain(Doc, nTile, nId));
    return Doc;
  }

  function Start() {
    const Canvas = Root.document.getElementById('map-canvas');
    State.MiniCanvas = Root.document.getElementById('minimap');
    State.Renderer = Renderer.Create(Canvas);
    State.Doc = CreateDemoDocument();
    State.nSavedRevision = State.Doc.nRevision;
    State.History = History.Create(State.Doc);
    State.Layout = View.BuildNetLayout();
    BuildToolbar();
    BuildToolList();
    BuildLayerList();
    BuildLegend();
    SetTool(State.szTool);
    SetTerrain(State.nTerrainId);
    SyncUndoButtons();
    AttachCanvasEvents(Canvas);
    AttachMinimapEvents(State.MiniCanvas);
    AttachKeyboard();
    const Rect = Canvas.getBoundingClientRect();
    View.ResizeCamera(State.Camera, Rect.width, Rect.height);
    View.FitBounds(State.Camera, State.Layout.rgdBounds);
    new Root.ResizeObserver(RequestDraw).observe(Canvas);
    Root.addEventListener('pagehide', Autosave);
    SyncControls();
    OfferRestore();
    RequestDraw();
  }

  RpgMap.App = Object.freeze({ g_szVersion, State, Start, ShowFocus, ShowNet, FitNet, FitPanel, SetTool, SetTerrain, SetBrushRadius, UndoOrRedo, NewMap, SaveMap, Autosave, IsDirty });

  if (Root.document.readyState === 'loading') {
    Root.document.addEventListener('DOMContentLoaded', Start);
  } else {
    Start();
  }
})(globalThis);
</script>
</body>
</html>
