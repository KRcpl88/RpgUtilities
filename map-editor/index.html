<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG World Map Editor</title>
<!--
  Single-file, framework-free hex map editor.

  Module convention: every <script data-module="Name"> block is a self-contained
  IIFE that registers exactly one object on globalThis.RpgMap[Name] and reads its
  dependencies from globalThis.RpgMap. Blocks appear in dependency order.
  Blocks marked data-dom="true" touch the browser DOM and are skipped by the
  Node unit tests (tests/_load.cjs); all other blocks must be DOM-free.
-->
<style>
  :root {
    --bg: #1e1f22;
    --panel: #2b2d31;
    --panel-border: #3c3f45;
    --text: #e6e6e6;
    --text-dim: #9a9ca3;
    --accent: #6ea8fe;
    --canvas-bg: #10151c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 220px 1fr 260px;
    grid-template-areas:
      "toolbar toolbar toolbar"
      "tools viewport properties"
      "status status status";
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #toolbar {
    grid-area: toolbar;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
  }
  #toolbar h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #toolbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  aside {
    overflow: auto;
    padding: 10px;
    background: var(--panel);
  }
  #tool-panel { grid-area: tools; border-right: 1px solid var(--panel-border); }
  #properties-panel { grid-area: properties; border-left: 1px solid var(--panel-border); }
  aside h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #viewport {
    grid-area: viewport;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--canvas-bg);
  }
  #map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #map-canvas.dragging { cursor: grabbing; }
  #minimap {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 240px;
    height: 120px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: var(--canvas-bg);
    cursor: pointer;
  }
  #toolbar button, #toolbar select {
    padding: 3px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: #383a40;
    color: var(--text);
    font: inherit;
  }
  #toolbar button:hover, #toolbar select:hover { border-color: var(--accent); }
  #toolbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #map-canvas[data-tool="pan"] { cursor: grab; }
  #map-canvas[data-tool="pan"].dragging, #map-canvas.dragging { cursor: grabbing; }
  #toolbar .toolbar-gap { display: inline-block; width: 12px; }
  #toolbar button:disabled { opacity: 0.45; border-color: var(--panel-border); }
  #restore-banner {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: var(--panel);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  #restore-banner[hidden] { display: none; }
  #restore-banner button {
    padding: 2px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: #383a40;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  #restore-banner button:hover { border-color: var(--accent); }
  .tool-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
  .tool-button {
    padding: 4px 6px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    background: #383a40;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  .tool-button:hover { border-color: var(--accent); }
  .tool-button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tool-option { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px; }
  .tool-option input[type="range"] { flex: 1; min-width: 0; }
  .tool-option[hidden] { display: none; }
  .property-field { display: block; margin: 8px 0; }
  .property-field[hidden] { display: none; }
  .property-field span { display: block; color: var(--text-dim); }
  .property-field input, .property-field select {
    width: 100%; padding: 4px; background: #383a40; color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 3px; font: inherit;
  }
  .property-actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .property-actions button:disabled { opacity: 0.45; cursor: default; }
  .tool-help { color: var(--text-dim); font-size: 12px; }
  .map-dialog {
    width: min(460px, 90vw); max-height: 90vh; overflow: auto;
    background: var(--panel); color: var(--text); border: 1px solid var(--accent);
    border-radius: 6px; padding: 18px;
  }
  .map-dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
  .map-dialog h2 { margin: 0 0 12px; font-size: 18px; }
  .map-dialog fieldset { margin: 8px 0; border: 1px solid var(--panel-border); }
  .map-dialog fieldset[hidden] { display: none; }
  .dialog-error { color: #ffb4a9; }
  #tool-list { margin-bottom: 12px; }
  .layer-toggle { display: block; margin: 2px 0; cursor: pointer; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 1px 0; padding: 1px 4px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
  .legend-row:hover { border-color: var(--panel-border); }
  .legend-row.active { border-color: var(--accent); background: rgba(255, 255, 255, 0.06); }
  .legend-row code { width: 1.2em; text-align: center; color: var(--text-dim); }
  .swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, 0.4); }
  #layer-list { margin-bottom: 12px; }
  #status-bar {
    grid-area: status;
    display: flex;
    gap: 18px;
    padding: 3px 12px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
<header id="toolbar">
  <h1>RPG World Map Editor</h1>
  <div id="toolbar-actions"></div>
</header>
<aside id="tool-panel" aria-label="Tools">
  <h2>Tools</h2>
  <div id="tool-list"></div>
  <h2>Layers</h2>
  <div id="layer-list"></div>
</aside>
<main id="viewport">
  <canvas id="map-canvas" aria-label="Map"></canvas>
  <canvas id="minimap" aria-label="Net navigator" title="Click to move the view"></canvas>
  <div id="restore-banner" role="alert" hidden>
    <span id="restore-text"></span>
    <button type="button" id="restore-accept">Restore</button>
    <button type="button" id="restore-discard">Discard</button>
  </div>
</main>
<aside id="properties-panel" aria-label="Properties">
  <h2>Properties</h2>
  <div id="property-list"></div>
  <div id="feature-properties" hidden></div>
</aside>
<footer id="status-bar">
  <span id="status-coordinates">&nbsp;</span>
  <span id="status-message"></span>
</footer>
<dialog id="new-map-dialog" class="map-dialog" aria-labelledby="new-map-title"></dialog>
<dialog id="export-map-dialog" class="map-dialog" aria-labelledby="export-map-title"></dialog>
<dialog id="crop-map-dialog" class="map-dialog" aria-labelledby="crop-map-title"></dialog>
<dialog id="rescale-map-dialog" class="map-dialog" aria-labelledby="rescale-map-title"></dialog>

<script data-module="Util">
(function (root) {
  'use strict';
  const rpgMap = root.RpgMap = root.RpgMap || {};

  const EPSILON = 1e-9;

  function assertCondition(condition, message) {
    if (!condition) {
      throw new Error(message);
    }
  }

  function add(left, right) {
    return left.map((value, index) => value + right[index]);
  }

  function subtract(left, right) {
    return left.map((value, index) => value - right[index]);
  }

  function scale(vector, factor) {
    return vector.map((value) => value * factor);
  }

  function dot(left, right) {
    let sum = 0;
    for (let index = 0; index < left.length; index++) {
      sum += left[index] * right[index];
    }
    return sum;
  }

  function cross(left, right) {
    return [
      left[1] * right[2] - left[2] * right[1],
      left[2] * right[0] - left[0] * right[2],
      left[0] * right[1] - left[1] * right[0],
    ];
  }

  function vectorLength(vector) {
    return Math.sqrt(dot(vector, vector));
  }

  function pointDistance(left, right) {
    return vectorLength(subtract(left, right));
  }

  function unit(vector) {
    const length = vectorLength(vector);
    assertCondition(length > 0, 'Cannot normalize a zero-length vector');
    return scale(vector, 1 / length);
  }

  function center(points) {
    assertCondition(points.length > 0, 'Cannot center an empty point set');
    const sum = points[0].map(() => 0);
    for (const point of points) {
      for (let axis = 0; axis < sum.length; axis++) {
        sum[axis] += point[axis];
      }
    }
    return scale(sum, 1 / points.length);
  }

  // Consecutive pairs around a closed boundary, including the closing pair.
  function boundary(items) {
    return items.map((item, index) => [item, items[(index + 1) % items.length]]);
  }

  // Signed shoelace area; positive for counter-clockwise polygons (x right, y up).
  function polygonArea(polygon) {
    let twiceArea = 0;
    for (const [firstPoint, secondPoint] of boundary(polygon)) {
      twiceArea += firstPoint[0] * secondPoint[1] - secondPoint[0] * firstPoint[1];
    }
    return twiceArea / 2;
  }

  function edgeSide(startPoint, end, point) {
    return (end[0] - startPoint[0]) * (point[1] - startPoint[1])
      - (end[1] - startPoint[1]) * (point[0] - startPoint[0]);
  }

  // Sutherland-Hodgman clip of any polygon by a convex counter-clockwise polygon.
  function clipPolygonToConvex(subject, clip) {
    let output = subject;
    for (const [startPoint, end] of boundary(clip)) {
      if (output.length === 0) {
        break;
      }
      const input = output;
      output = [];
      for (let index = 0; index < input.length; index++) {
        const point = input[index];
        const next = input[(index + 1) % input.length];
        const pointSide = edgeSide(startPoint, end, point);
        const nextSide = edgeSide(startPoint, end, next);
        if (pointSide >= 0) {
          output.push(point);
        }
        if ((pointSide >= 0) !== (nextSide >= 0)) {
          const t = pointSide / (pointSide - nextSide);
          output.push([
            point[0] + t * (next[0] - point[0]),
            point[1] + t * (next[1] - point[1]),
          ]);
        }
      }
    }
    const result = output.filter((point, index) =>
      pointDistance(point, output[(index + 1) % output.length]) > 1e-14);
    return result.length >= 3 ? result : [];
  }

  // Cyrus-Beck clip of segment A→B by a convex counter-clockwise polygon.
  // Returns the parameter interval [t0, t1] inside the polygon, or null.
  function clipSegmentToConvex(pointA, pointB, clip) {
    let t0 = 0;
    let t1 = 1;
    const direction = subtract(pointB, pointA);
    for (const [startPoint, end] of boundary(clip)) {
      const start = edgeSide(startPoint, end, pointA);
      const rate = (end[0] - startPoint[0]) * direction[1] - (end[1] - startPoint[1]) * direction[0];
      if (Math.abs(rate) < 1e-300) {
        if (start < 0) {
          return null;
        }
        continue;
      }
      const t = -start / rate;
      if (rate > 0) {
        t0 = Math.max(t0, t);
      } else {
        t1 = Math.min(t1, t);
      }
      if (t0 > t1) {
        return null;
      }
    }
    return [t0, t1];
  }

  // Allocation-free: hot in hit testing and embellishment scatter.
  function pointInConvex(point, clip, tolerance = EPSILON) {
    const count = clip.length;
    for (let index = 0; index < count; index++) {
      const startPoint = clip[index], end = clip[(index + 1) % count];
      const x = startPoint[0] - end[0], y = startPoint[1] - end[1];
      if (edgeSide(startPoint, end, point) / Math.sqrt(x * x + y * y) < -tolerance) {
        return false;
      }
    }
    return true;
  }

  // Mulberry32: small, fast, deterministic PRNG returning floats in [0, 1).
  function createRng(seed) {
    let state = seed >>> 0;
    return function () {
      state = (state + 0x6D2B79F5) >>> 0;
      let value = state;
      value = Math.imul(value ^ (value >>> 15), value | 1);
      value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
      return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Order-sensitive 32-bit hash of integers, used to seed per-tile randomness.
  function hashIntegers(...values) {
    let hash = 0x811C9DC5;
    for (const value of values) {
      hash = Math.imul(hash ^ (value | 0), 0x01000193) >>> 0;
      hash ^= hash >>> 13;
    }
    return Math.imul(hash ^ (hash >>> 16), 0x85EBCA6B) >>> 0;
  }

  // Fixed-precision number text without trailing zeros or a signed zero.
  function formatNumber(value, decimals = 6) {
    const fixed = value.toFixed(decimals);
    const text = fixed.includes('.') ? fixed.replace(/\.?0+$/, '') : fixed;
    return (text === '-0' || text === '') ? '0' : text;
  }

  rpgMap.Util = Object.freeze({
    EPSILON,
    assertCondition,
    add,
    subtract,
    scale,
    dot,
    cross,
    vectorLength,
    pointDistance,
    unit,
    center,
    boundary,
    polygonArea,
    clipPolygonToConvex,
    clipSegmentToConvex,
    pointInConvex,
    createRng,
    hashIntegers,
    formatNumber,
  });
})(globalThis);
</script>

<script data-module="Projection">
(function (root) {
  'use strict';
  const rpgMap = root.RpgMap = root.RpgMap || {};
  const util = rpgMap.Util;
  const { assertCondition, subtract, dot, cross, unit, center, boundary, pointDistance } = util;

  // Port of tools/generate_map_projection.py (geometry, net and validation),
  // keeping its geometry and ordering, plus panel frames and seam transforms.
  const TOLERANCE = 1e-9;
  const ACUTE_ANGLE = Math.acos(-1 / 3) * 180 / Math.PI;
  const OBTUSE_ANGLE = (360 - ACUTE_ANGLE) / 2;
  const XL_HEX_MILES = 216;
  const NORTH = Object.freeze(unit([1, -1, -1]));

  const SECTOR_LABELS = Object.freeze({
    'Hyz+-': '\u03b1', 'Hxz--': '\u03b2', 'Hxy--': '\u03b3',
    'Hyz-+': '\u03b4', 'Hxz++': '\u03b5', 'Hxy++': '\u03b6',
    'Hxz+-': '\u03b7', 'Hyz--': '\u03b8', 'Hxy+-': '\u03b9',
    'Hxy-+': '\u03ba', 'Hxz-+': '\u03bb', 'Hyz++': '\u03bc',
    'Sz-': '\u03bd', 'Sy-': '\u03be', 'Sx+': '\u03bf',
    'Sx-': '\u03c0', 'Sz+': '\u03c1', 'Sy+': '\u03c3',
  });
  const SECTOR_NAMES = Object.freeze({
    '\u03b1': 'Alpha', '\u03b2': 'Beta', '\u03b3': 'Gamma',
    '\u03b4': 'Delta', '\u03b5': 'Epsilon', '\u03b6': 'Zeta',
    '\u03b7': 'Eta', '\u03b8': 'Theta', '\u03b9': 'Iota',
    '\u03ba': 'Kappa', '\u03bb': 'Lambda', '\u03bc': 'Mu',
    '\u03bd': 'Nu', '\u03be': 'Xi', '\u03bf': 'Omicron',
    '\u03c0': 'Pi', '\u03c1': 'Rho', '\u03c3': 'Sigma',
  });

  const STRIP = ['Hxy++', 'Hyz+-', 'Hxz--', 'Hxy--', 'Hyz-+', 'Hxz++'];
  const ATTACHMENTS = [
    ['Hxy++', ['Sx+', 'Hxz+-'], ['Hyz++', 'Sy+']],
    ['Hxz--', ['Sz-', 'Hyz--'], ['Hxy-+', 'Sx-']],
    ['Hyz-+', ['Sy-', 'Hxy+-'], ['Hxz-+', 'Sz+']],
  ];

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  function compareStrings(left, right) {
    return left < right ? -1 : (left > right ? 1 : 0);
  }

  function edgeKey(firstId, secondId) {
    return [firstId, secondId].sort(compareStrings);
  }

  function keyText(keyParts) {
    return keyParts.join('|');
  }

  function interiorAngle(previous, vertex, following) {
    const cosine = dot(unit(subtract(previous, vertex)), unit(subtract(following, vertex)));
    return Math.acos(Math.max(-1, Math.min(1, cosine))) * 180 / Math.PI;
  }

  // Python itertools.product((-1, 1), repeat=n): the last position varies fastest.
  function signProduct(count) {
    let result = [[]];
    for (let index = 0; index < count; index++) {
      const next = [];
      for (const prefix of result) {
        for (const sign of [-1, 1]) {
          next.push([...prefix, sign]);
        }
      }
      result = next;
    }
    return result;
  }

  function combinations(items, count) {
    if (count === 0) {
      return [[]];
    }
    const result = [];
    for (let index = 0; index <= items.length - count; index++) {
      for (const rest of combinations(items.slice(index + 1), count - 1)) {
        result.push([items[index], ...rest]);
      }
    }
    return result;
  }

  function countKinds(kinds) {
    const counts = {};
    for (const kind of kinds) {
      counts[kind] = (counts[kind] || 0) + 1;
    }
    return counts;
  }

  function sameCounts(left, right) {
    const keys = Object.keys(left);
    return keys.length === Object.keys(right).length
      && keys.every((key) => left[key] === right[key]);
  }

  function buildSolidVertices() {
    const small = 0.5;
    const corner = small + 1 / Math.sqrt(3);
    const large = small + 2 / Math.sqrt(3);
    const points = signProduct(3).map((signs) => signs.map((sign) => sign * corner));
    for (let axis = 0; axis < 3; axis++) {
      for (const signs of signProduct(3)) {
        points.push(signs.map((sign, coordinate) =>
          sign * (coordinate === axis ? large : small)));
      }
    }
    const vertices = {};
    points.forEach((point, index) => {
      vertices[`V${pad2(index + 1)}`] = point;
    });
    return { vertices, large, corner };
  }

  function buildSolid() {
    const { vertices, large, corner } = buildSolidVertices();
    const faces = {};
    for (const [count, prefix, offset] of [[1, 'S', large], [2, 'H', 2 * corner]]) {
      for (const axes of combinations([0, 1, 2], count)) {
        for (const signs of signProduct(count)) {
          const normal = [0, 1, 2].map((axis) =>
            axes.includes(axis) ? signs[axes.indexOf(axis)] : 0);
          const name = prefix + axes.map((axis) => 'xyz'[axis]).join('')
            + signs.map((sign) => (sign > 0 ? '+' : '-')).join('');
          const ids = Object.keys(vertices).filter((id) =>
            Math.abs(dot(vertices[id], normal) - offset) < TOLERANCE);
          const origin = center(ids.map((id) => vertices[id]));
          const axisX = unit(subtract(vertices[ids[0]], origin));
          const axisY = cross(unit(normal), axisX);
          const angleOf = (id) => {
            const relative = subtract(vertices[id], origin);
            return Math.atan2(dot(relative, axisY), dot(relative, axisX));
          };
          ids.sort((left, right) => angleOf(left) - angleOf(right));
          faces[name] = {
            id: name,
            kind: count === 1 ? 'square' : 'hexagon',
            vertices: ids,
            normal: unit(normal),
          };
        }
      }
    }
    const edgeFaces = {};
    for (const [id, face] of Object.entries(faces)) {
      for (const [firstId, secondId] of boundary(face.vertices)) {
        const key = keyText(edgeKey(firstId, secondId));
        (edgeFaces[key] = edgeFaces[key] || []).push(id);
      }
    }
    const edges = {};
    Object.keys(edgeFaces).sort(compareStrings).forEach((key, index) => {
      edges[key] = { id: `E${pad2(index + 1)}`, vertices: key.split('|'), faces: edgeFaces[key] };
    });
    return { vertices, faces, edges };
  }

  function addNetVertex(netVertices, solidId, point) {
    const id = `N${pad2(Object.keys(netVertices).length + 1)}`;
    netVertices[id] = { id: id, position: point, solid_vertex: solidId };
    return id;
  }

  function initializeNet(vertices, faces, strip) {
    const rootThree = Math.sqrt(3);
    const small = 0.5;
    const corner = 0.5 + 1 / rootThree;
    const large = 0.5 + 2 / rootThree;
    const componentA = Math.sqrt(2 / 3);
    const componentB = 1 / rootThree;
    const c = 2 * Math.sqrt(2) / 3;
    const rootSolid = [
      [large, small, small], [large, small, -small],
      [corner, corner, -corner], [small, large, -small],
      [small, large, small], [corner, corner, corner],
    ];
    const rootFlat = [
      [0, 0.5], [componentA, 0.5 + componentB], [componentA + c, 0.5 + componentB - 1 / 3],
      [componentA + c, -0.5 + componentB - 1 / 3], [c, -5 / 6], [0, -0.5],
    ];
    const pointIds = {};
    for (const [id, point] of Object.entries(vertices)) {
      pointIds[point.join(',')] = id;
    }
    const netVertices = {};
    const netFaces = {};
    const faceMaps = {};

    // Reflect the seed face so its outward winding is preserved in the net.
    const rootMap = {};
    rootSolid.forEach((solid, index) => {
      const solidId = pointIds[solid.join(',')];
      assertCondition(solidId !== undefined, 'Root vertex is not a solid vertex');
      const flat = rootFlat[index];
      rootMap[solidId] = addNetVertex(netVertices, solidId, [-flat[0], flat[1]]);
    });
    faceMaps[strip[0]] = rootMap;
    netFaces[strip[0]] = {
      id: strip[0], kind: 'hexagon', placement: 'strip',
      vertices: faces[strip[0]].vertices.map((id) => rootMap[id]),
      parent: null, hinge: null,
    };
    return { netVertices, netFaces, faceMaps };
  }

  function attachNetFace(vertices, faces, edges, netVertices, netFaces, faceMaps,
    parent, child, placement) {
    assertCondition(!(child in netFaces), `Repeated face: ${child}`);
    const shared = faces[parent].vertices
      .filter((id) => faces[child].vertices.includes(id))
      .sort(compareStrings);
    assertCondition(shared.length === 2, `Faces do not share an edge: ${parent}, ${child}`);
    const [firstId, secondId] = shared;
    const solidStart = vertices[firstId];
    const solidEnd = vertices[secondId];
    const flatStart = netVertices[faceMaps[parent][firstId]].position;
    const flatEnd = netVertices[faceMaps[parent][secondId]].position;
    const axis3D = unit(subtract(solidEnd, solidStart));
    const childCenter = center(faces[child].vertices.map((id) => vertices[id]));
    const toward = subtract(childCenter, solidStart);
    const alongAxis = dot(toward, axis3D);
    const inward3D = unit(toward.map((value, index) => value - alongAxis * axis3D[index]));
    const axis2D = unit(subtract(flatEnd, flatStart));
    const perpendicular = [-axis2D[1], axis2D[0]];
    const parentCenter = center(netFaces[parent].vertices.map((id) => netVertices[id].position));
    const side = dot(subtract(parentCenter, flatStart), perpendicular);
    const sign = (side < 0 || Object.is(side, -0)) ? 1 : -1;
    const childMap = {};
    for (const solidId of faces[child].vertices) {
      if (shared.includes(solidId)) {
        childMap[solidId] = faceMaps[parent][solidId];
      } else {
        const relative = subtract(vertices[solidId], solidStart);
        const along = dot(relative, axis3D);
        const across = dot(relative, inward3D);
        const point = flatStart.map((start, index) =>
          start + along * axis2D[index] + sign * across * perpendicular[index]);
        childMap[solidId] = addNetVertex(netVertices, solidId, point);
      }
    }
    faceMaps[child] = childMap;
    netFaces[child] = {
      id: child, kind: faces[child].kind, placement: placement,
      vertices: faces[child].vertices.map((id) => childMap[id]),
      parent: parent, hinge: edges[keyText(shared)].id,
    };
  }

  function buildNetEdges(netVertices, netFaces, edges) {
    const netEdges = {};
    for (const [id, face] of Object.entries(netFaces)) {
      for (const [firstId, secondId] of boundary(face.vertices)) {
        const keyParts = edgeKey(firstId, secondId);
        const key = keyText(keyParts);
        if (!(key in netEdges)) {
          const solidKey = keyText(edgeKey(
            netVertices[firstId].solid_vertex, netVertices[secondId].solid_vertex));
          netEdges[key] = {
            id: `NE${pad2(Object.keys(netEdges).length + 1)}`, vertices: keyParts,
            solid_edge: edges[solidKey].id, faces: [],
          };
        }
        netEdges[key].faces.push(id);
      }
    }
    const copies = {};
    for (const edge of Object.values(netEdges)) {
      edge.kind = edge.faces.length === 2 ? 'fold' : 'cut';
      (copies[edge.solid_edge] = copies[edge.solid_edge] || []).push(edge);
    }
    for (const pair of Object.values(copies)) {
      for (const edge of pair) {
        const other = pair.find((candidate) => candidate !== edge);
        edge.mate = other ? other.id : null;
      }
    }
    return netEdges;
  }

  function buildNet(vertices, faces, edges) {
    const { netVertices, netFaces, faceMaps } = initializeNet(vertices, faces, STRIP);
    for (let index = 1; index < STRIP.length; index++) {
      attachNetFace(vertices, faces, edges, netVertices, netFaces, faceMaps,
        STRIP[index - 1], STRIP[index], 'strip');
    }
    for (const [parent, top, bottom] of ATTACHMENTS) {
      for (const child of top) {
        attachNetFace(vertices, faces, edges, netVertices, netFaces, faceMaps, parent, child, 'top');
      }
      for (const child of bottom) {
        attachNetFace(vertices, faces, edges, netVertices, netFaces, faceMaps, parent, child, 'bottom');
      }
    }
    const netEdges = buildNetEdges(netVertices, netFaces, edges);
    return { netVertices, netFaces, netEdges, strip: [...STRIP].reverse() };
  }

  function interiorsOverlap(first, second) {
    // Separating-axis theorem for the convex faces; touching edges are allowed.
    for (const polygon of [first, second]) {
      for (const [startPoint, end] of boundary(polygon)) {
        const direction = subtract(end, startPoint);
        const axis = unit([-direction[1], direction[0]]);
        const left = first.map((point) => dot(point, axis));
        const right = second.map((point) => dot(point, axis));
        if (Math.min(Math.max(...left), Math.max(...right))
          - Math.max(Math.min(...left), Math.min(...right)) <= TOLERANCE) {
          return false;
        }
      }
    }
    return true;
  }

  function validateFaceAngles(id, face, solid, flat, incidences, expectedCount, errors) {
    const acute = [];
    face.vertices.forEach((vertexId, index) => {
      incidences[vertexId].push(id);
      let expected = 90;
      if (expectedCount === 6) {
        const corner = Number(vertexId.slice(1)) <= 8;
        expected = corner ? ACUTE_ANGLE : OBTUSE_ANGLE;
        if (corner) {
          acute.push(index);
        }
      }
      const previous = (index + expectedCount - 1) % expectedCount;
      for (const polygon of [solid, flat]) {
        const angle = interiorAngle(polygon[previous], polygon[index], polygon[(index + 1) % expectedCount]);
        errors.maxAngle = Math.max(errors.maxAngle, Math.abs(angle - expected));
        errors.maxLength = Math.max(errors.maxLength,
          Math.abs(pointDistance(polygon[previous], polygon[index]) - 1));
      }
      assertCondition(Math.abs(dot(subtract(solid[index], solid[0]), face.normal)) < TOLERANCE,
        `Nonplanar face: ${id}`);
    });
    return acute;
  }

  function validateHexagonEdges(id, face, faces, edges, acute) {
    assertCondition(acute.length === 2 && acute[1] - acute[0] === 3,
      `Acute vertices must be opposite: ${id}`);
    const squareEdges = [];
    boundary(face.vertices).forEach(([firstId, secondId], index) => {
      const adjacent = edges[keyText(edgeKey(firstId, secondId))].faces;
      if (adjacent.some((otherId) => faces[otherId].kind === 'square')) {
        squareEdges.push(index);
        assertCondition(!acute.includes(index) && !acute.includes((index + 1) % 6),
          `Square at an acute vertex: ${id}`);
      }
    });
    assertCondition(squareEdges.length === 2 && squareEdges[1] - squareEdges[0] === 3,
      `Square edges must be opposite: ${id}`);
  }

  function validateFaces(vertices, faces, edges, netVertices, netFaces) {
    const errors = { maxLength: 0, maxAngle: 0, maxDistance: 0 };
    const incidences = {};
    for (const id of Object.keys(vertices)) {
      incidences[id] = [];
    }
    const polygons = {};
    for (const [id, face] of Object.entries(faces)) {
      const solid = face.vertices.map((vertexId) => vertices[vertexId]);
      const netFace = netFaces[id];
      const flat = netFace.vertices.map((vertexId) => netVertices[vertexId].position);
      const area = boundary(flat).reduce((sum, [firstPoint, secondPoint]) =>
        sum + firstPoint[0] * secondPoint[1] - secondPoint[0] * firstPoint[1], 0);
      assertCondition(area > 0, `Net face must be viewed from outside: ${id}`);
      polygons[id] = flat;
      assertCondition(netFace.vertices.map((vertexId) => netVertices[vertexId].solid_vertex).join()
        === face.vertices.join(), `Vertex correspondence: ${id}`);
      const expectedCount = face.kind === 'hexagon' ? 6 : 4;
      assertCondition(solid.length === expectedCount, `Polygon size: ${id}`);
      const acute = validateFaceAngles(id, face, solid, flat, incidences, expectedCount, errors);
      if (expectedCount === 6) {
        validateHexagonEdges(id, face, faces, edges, acute);
      }
      for (const [firstIndex, second] of combinations([...Array(expectedCount).keys()], 2)) {
        errors.maxDistance = Math.max(errors.maxDistance, Math.abs(
          pointDistance(solid[firstIndex], solid[second]) - pointDistance(flat[firstIndex], flat[second])));
      }
    }
    return { incidences, polygons, errors };
  }

  function validateSolidIncidences(faces, edges, incidences) {
    for (const [vertexId, faceIds] of Object.entries(incidences)) {
      const expected = Number(vertexId.slice(1)) <= 8 ? { hexagon: 3 } : { hexagon: 2, square: 1 };
      assertCondition(sameCounts(countKinds(faceIds.map((id) => faces[id].kind)), expected),
        `Vertex incidence: ${vertexId}`);
    }
    for (const edge of Object.values(edges)) {
      assertCondition(edge.faces.length === 2, `Nonmanifold edge: ${edge.id}`);
    }
  }

  function validateSeams(edges, netVertices, netEdges) {
    const copies = {};
    const netEdgeIds = {};
    for (const edge of Object.values(netEdges)) {
      netEdgeIds[edge.id] = edge;
    }
    let folds = 0;
    for (const edge of Object.values(netEdges)) {
      (copies[edge.solid_edge] = copies[edge.solid_edge] || []).push(edge);
      if (edge.kind === 'fold') {
        folds++;
        assertCondition(edge.faces.length === 2 && edge.mate === null, 'Invalid fold');
      } else {
        assertCondition(edge.faces.length === 1 && edge.mate in netEdgeIds, 'Unpaired cut');
        const mate = netEdgeIds[edge.mate];
        assertCondition(mate.mate === edge.id && mate.solid_edge === edge.solid_edge, 'Cut seam mismatch');
      }
    }
    assertCondition(folds === 17, 'The 18-face tree must have 17 hinges');
    for (const edge of Object.values(edges)) {
      const pair = copies[edge.id];
      assertCondition(pair.length === 1 || pair.length === 2, 'Wrong number of edge copies');
      assertCondition(pair.flatMap((copy) => copy.faces).sort(compareStrings).join()
        === [...edge.faces].sort(compareStrings).join(), 'Folded edge incidence does not close');
      for (const copy of pair) {
        assertCondition(keyText(edgeKey(...copy.vertices.map((id) => netVertices[id].solid_vertex)))
          === keyText(edge.vertices), 'Folded endpoints do not close');
      }
    }
  }

  function validateHingeTree(netFaces, netEdges) {
    const visited = new Set();
    for (const [id, face] of Object.entries(netFaces)) {
      assertCondition(visited.has(face.parent) || (visited.size === 0 && face.parent === null),
        'Disconnected or cyclic hinge tree');
      if (face.parent !== null) {
        assertCondition(Object.values(netEdges).some((edge) =>
          edge.kind === 'fold' && edge.solid_edge === face.hinge
          && edge.faces.length === 2 && edge.faces.includes(id) && edge.faces.includes(face.parent)),
        'Parent hinge missing');
      }
      visited.add(id);
    }
  }

  function validateStrip(faces, netVertices, netEdges, strip, polygons) {
    const centers = strip.map((id) => center(polygons[id]));
    const y = centers.map((point) => point[1]);
    assertCondition(Math.max(...y) - Math.min(...y) < TOLERANCE, 'Strip centers are not horizontal');
    assertCondition(centers.every((point, index) =>
      index === 0 || centers[index - 1][0] < point[0]), 'Strip must be ordered left to right');
    const edgeCenter = (edge) => center(edge.vertices.map((vertexId) => netVertices[vertexId].position));
    strip.forEach((id, index) => {
      for (const side of ['top', 'bottom']) {
        const centerY = centers[index][1];
        const sideEdges = Object.values(netEdges).filter((edge) => edge.faces.includes(id)
          && Math.abs(netVertices[edge.vertices[0]].position[0] - netVertices[edge.vertices[1]].position[0]) > TOLERANCE
          && (edgeCenter(edge)[1] > centerY) === (side === 'top'));
        sideEdges.sort((left, right) => edgeCenter(left)[0] - edgeCenter(right)[0]);
        const pattern = sideEdges.map((edge) => {
          const otherId = edge.faces.find((face) => face !== id);
          return otherId === undefined ? '-' : faces[otherId].kind;
        });
        const expected = index % 2 === 1
          ? (side === 'top' ? ['hexagon', 'square'] : ['square', 'hexagon'])
          : ['-', '-'];
        assertCondition(pattern.join() === expected.join(), `Incorrect ${side} attachment pattern: ${id}`);
      }
    });
  }

  function validate(vertices, faces, edges, netVertices, netFaces, netEdges, strip) {
    const vertexCount = Object.keys(vertices).length;
    const edgeCount = Object.keys(edges).length;
    const faceCount = Object.keys(faces).length;
    const netVertexCount = Object.keys(netVertices).length;
    const netEdgeCount = Object.keys(netEdges).length;
    const netFaceCount = Object.keys(netFaces).length;
    assertCondition(vertexCount === 32 && edgeCount === 48 && faceCount === 18, 'Solid counts');
    assertCondition(sameCounts(countKinds(Object.values(faces).map((face) => face.kind)), { hexagon: 12, square: 6 }),
      'Face types');
    assertCondition(netFaceCount === faceCount && Object.keys(faces).every((id) => id in netFaces),
      'Every solid face must appear exactly once');
    assertCondition(netVertexCount === 62 && netEdgeCount === 79, 'Net counts');
    assertCondition(vertexCount - edgeCount + faceCount === 2, 'Solid Euler characteristic');
    assertCondition(netVertexCount - netEdgeCount + netFaceCount === 1, 'Net Euler characteristic');
    const { incidences, polygons, errors } = validateFaces(vertices, faces, edges, netVertices, netFaces);
    validateSolidIncidences(faces, edges, incidences);
    assertCondition(errors.maxLength < TOLERANCE, 'Unequal side lengths');
    assertCondition(errors.maxAngle < TOLERANCE, 'Incorrect interior angles');
    assertCondition(errors.maxDistance < TOLERANCE, "Unfolding changed a face's geometry");
    for (const [firstId, secondId] of combinations(Object.keys(polygons), 2)) {
      assertCondition(!interiorsOverlap(polygons[firstId], polygons[secondId]),
        `Overlapping faces: ${firstId}, ${secondId}`);
    }
    validateSeams(edges, netVertices, netEdges);
    validateHingeTree(netFaces, netEdges);
    validateStrip(faces, netVertices, netEdges, strip, polygons);
    return {
      solid_counts: { vertices: 32, edges: 48, faces: 18 },
      net_counts: { vertices: 62, edges: 79, faces: 18, hinges: 17, cut_pairs: 31 },
      edge_length_tolerance: TOLERANCE,
      angle_tolerance_degrees: TOLERANCE,
      face_distance_tolerance: TOLERANCE,
      overlapping_face_pairs: 0,
      folded_seams_match: true,
    };
  }

  // 2D affine transforms use the canvas/SVG matrix layout [a, b, c, d, e, f]:
  // x' = a x + c y + e, y' = b x + d y + f.
  function applyTransform(t, point) {
    return [
      t[0] * point[0] + t[2] * point[1] + t[4],
      t[1] * point[0] + t[3] * point[1] + t[5],
    ];
  }

  // Returns the transform that applies firstPoint, then secondPoint.
  function composeTransforms(firstPoint, secondPoint) {
    const [a, b, c, d, e, f] = secondPoint;
    return [
      a * firstPoint[0] + c * firstPoint[1], b * firstPoint[0] + d * firstPoint[1],
      a * firstPoint[2] + c * firstPoint[3], b * firstPoint[2] + d * firstPoint[3],
      a * firstPoint[4] + c * firstPoint[5] + e, b * firstPoint[4] + d * firstPoint[5] + f,
    ];
  }

  function invertTransform(t) {
    const [a, b, c, d, e, f] = t;
    const determinant = a * d - b * c;
    assertCondition(Math.abs(determinant) > TOLERANCE, 'Transform is not invertible');
    return [
      d / determinant, -b / determinant, -c / determinant, a / determinant,
      (c * f - d * e) / determinant, (b * e - a * f) / determinant,
    ];
  }

  // Proper rigid motion (rotation + translation) taking segment P0→P1 onto Q0→Q1.
  function rigidFromSegments(p0, p1, q0, q1) {
    const from = unit(subtract(p1, p0));
    const to = unit(subtract(q1, q0));
    const cos = from[0] * to[0] + from[1] * to[1];
    const sin = from[0] * to[1] - from[1] * to[0];
    const rotation = [cos, sin, -sin, cos, 0, 0];
    const rotated = applyTransform(rotation, p0);
    return [cos, sin, -sin, cos, q0[0] - rotated[0], q0[1] - rotated[1]];
  }

  // Frame coordinates are [east, north] in edge units, measured in the panel plane
  // from the panel centre (which lies on the equator for equatorial panels).
  function solidToFrame(frame, point) {
    const relative = subtract(point, frame.origin3D);
    return [dot(relative, frame.east3D), dot(relative, frame.north3D)];
  }

  function frameToSolid(frame, framePoint) {
    return frame.origin3D.map((origin, axis) =>
      origin + framePoint[0] * frame.east3D[axis] + framePoint[1] * frame.north3D[axis]);
  }

  function buildFrame(face, vertices, netVertices, netFace) {
    const solid = face.vertices.map((id) => vertices[id]);
    const flat = netFace.vertices.map((id) => netVertices[id].position);
    const normal = face.normal;
    const isEquatorial = Math.abs(dot(normal, NORTH)) < TOLERANCE;
    const alongNormal = dot(NORTH, normal);
    const north3D = unit(NORTH.map((value, axis) => value - alongNormal * normal[axis]));
    const east3D = cross(north3D, normal);
    const frame = {
      origin3D: center(solid),
      east3D,
      north3D,
      normal3D: [...normal],
    };
    const polygon = solid.map((point) => solidToFrame(frame, point));
    // Frame → net is the rigid motion matching the first boundary edge; faces in
    // the net are viewed from outside, so no reflection is needed.
    const frameToNet = rigidFromSegments(polygon[0], polygon[1], flat[0], flat[1]);
    polygon.forEach((point, index) => {
      assertCondition(pointDistance(applyTransform(frameToNet, point), flat[index]) < TOLERANCE,
        `Frame placement does not match the net: ${face.id}`);
    });
    let northVertex = null;
    let southVertex = null;
    if (!isEquatorial) {
      const norths = polygon.map((point) => point[1]);
      const north = norths.indexOf(Math.max(...norths));
      const south = norths.indexOf(Math.min(...norths));
      assertCondition(Math.abs(polygon[north][0]) < TOLERANCE && Math.abs(polygon[south][0]) < TOLERANCE,
        `Panel north must run through opposite vertices: ${face.id}`);
      northVertex = face.vertices[north];
      southVertex = face.vertices[south];
    }
    return Object.freeze({
      ...frame,
      panelId: face.id,
      isEquatorial,
      vertexIds: [...face.vertices],
      polygon,
      originNet: applyTransform(frameToNet, [0, 0]),
      eastNet: [frameToNet[0], frameToNet[1]],
      northNet: [frameToNet[2], frameToNet[3]],
      frameToNet,
      netToFrame: invertTransform(frameToNet),
      northVertex,
      southVertex,
    });
  }

  // Seam transform A→B maps frame-A coordinates to frame-B coordinates after
  // unfolding B about the shared edge into A's plane (a proper isometry).
  function buildSeam(edge, frames, vertices) {
    const [panelA, panelB] = edge.faces;
    const [startPoint, end] = edge.vertices.map((id) => vertices[id]);
    const frameA = frames[panelA];
    const frameB = frames[panelB];
    const aToB = rigidFromSegments(
      solidToFrame(frameA, startPoint), solidToFrame(frameA, end),
      solidToFrame(frameB, startPoint), solidToFrame(frameB, end));
    return Object.freeze({
      edge: edge.id,
      vertexIds: [...edge.vertices],
      panelA,
      panelB,
      aToB,
      bToA: invertTransform(aToB),
    });
  }

  function deepFreeze(value, seen = new Set()) {
    if (value && typeof value === 'object' && !seen.has(value)) {
      seen.add(value);
      Object.freeze(value);
      Object.values(value).forEach((item) => deepFreeze(item, seen));
    }
    return value;
  }

  let projectionCache = null;

  // Builds (once) the solid, net, validation summary, panel frames and seams.
  function build() {
    if (projectionCache) {
      return projectionCache;
    }
    const { vertices, faces, edges } = buildSolid();
    const { netVertices, netFaces, netEdges, strip } = buildNet(vertices, faces, edges);
    const validation = validate(vertices, faces, edges, netVertices, netFaces, netEdges, strip);
    const frames = {};
    const panels = {};
    for (const [id, face] of Object.entries(faces)) {
      const frame = buildFrame(face, vertices, netVertices, netFaces[id]);
      const letter = SECTOR_LABELS[id];
      frames[id] = frame;
      panels[id] = Object.freeze({
        id, letter, name: SECTOR_NAMES[letter], kind: face.kind, isEquatorial: frame.isEquatorial, frame,
      });
    }
    const seams = Object.values(edges).map((edge) => buildSeam(edge, frames, vertices));
    const equatorialIds = strip.filter((id) => frames[id].isEquatorial);
    assertCondition(equatorialIds.length === 6, 'The strip must hold the six equatorial panels');
    const equatorial = frames[equatorialIds[0]];
    const equatorialWidth = Math.max(...equatorial.polygon.map((point) => point[0]))
      - Math.min(...equatorial.polygon.map((point) => point[0]));
    projectionCache = deepFreeze({
      vertices, faces, edges, netVertices, netFaces, netEdges,
      strip,
      equatorialWestToEast: equatorialIds,
      validation,
      panels,
      frames,
      seams,
      equatorialWidth,
    });
    return projectionCache;
  }

  // Miles per unit edge when hexes XL columns span an equatorial panel west to east
  // (column spacing is 216·√3/2 miles for flat-top hexes).
  function getMilesPerEdge(hexes) {
    assertCondition(Number.isInteger(hexes) && hexes > 0 && hexes % 2 === 0,
      'Panel size must be a positive even number of XL hexes');
    return hexes * XL_HEX_MILES * Math.sqrt(3) / 2 / build().equatorialWidth;
  }

  function findSeam(panelA, panelB) {
    return build().seams.find((seam) =>
      (seam.panelA === panelA && seam.panelB === panelB)
      || (seam.panelA === panelB && seam.panelB === panelA)) || null;
  }

  rpgMap.Projection = Object.freeze({
    TOLERANCE,
    XL_HEX_MILES,
    NORTH,
    SECTOR_LABELS,
    SECTOR_NAMES,
    build,
    getMilesPerEdge,
    findSeam,
    solidToFrame,
    frameToSolid,
    applyTransform,
    composeTransforms,
    invertTransform,
    rigidFromSegments,
    interiorsOverlap,
  });
})(globalThis);
</script>

<script data-module="Lattice">
(function (root) {
  'use strict';
  const rpgMap = root.RpgMap = root.RpgMap || {};
  const { assertCondition } = rpgMap.Util;

  // Flat-top hex lattice math, independent of panels and units.
  // Offset coordinates (q, j): column q runs north-south at x = q·w; odd columns
  // are shifted half a hex north, so a centre is at (q·w, (j + ½·odd(q))·d),
  // where d is the distance between adjacent centres and w = d·√3/2.
  // Axial (q, r) has centre (q·w, (r + q/2)·d); cube is (x, y, z) = (q, −q−r, r).
  const ROOT_THREE = Math.sqrt(3);
  const YARDS_PER_MILE = 1760;
  const SIZES = Object.freeze(['S', 'M', 'L', 'XL']);
  const SCALES = Object.freeze({
    regional: Object.freeze({ unit: 'mi', sizes: Object.freeze({ S: 1, M: 6, L: 36, XL: 216 }) }),
    local: Object.freeze({ unit: 'yd', sizes: Object.freeze({ S: 1, M: 10, L: 100, XL: 600 }) }),
  });
  // Axial steps to the six neighbours, in the order N, NE, SE, S, SW, NW.
  const DIRECTIONS = Object.freeze([[0, 1], [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1]]
    .map((step) => Object.freeze(step)));
  // HexPolygon vertex indices of the edge shared with each neighbour direction.
  const DIRECTION_EDGES = Object.freeze([[1, 2], [0, 1], [5, 0], [4, 5], [3, 4], [2, 3]]
    .map((edge) => Object.freeze(edge)));

  function clean(value) {
    return value || 0;
  }

  function isOdd(value) {
    return (value & 1) !== 0;
  }

  function scaleDistance(systemName, size) {
    const system = SCALES[systemName];
    assertCondition(system && size in system.sizes, `Unknown scale: ${systemName} ${size}`);
    return system.sizes[size];
  }

  function scaleMiles(systemName, size) {
    const distance = scaleDistance(systemName, size);
    return systemName === 'local' ? distance / YARDS_PER_MILE : distance;
  }

  // Number of fine hexes per coarse hex along a column; 1 or an even integer.
  function scaleRatio(systemName, coarse, fine) {
    const ratio = scaleDistance(systemName, coarse) / scaleDistance(systemName, fine);
    assertCondition(Number.isInteger(ratio) && (ratio === 1 || ratio % 2 === 0),
      `Scale ${coarse} does not nest ${fine} by an even ratio`);
    return ratio;
  }

  function columnSpacing(d) {
    return d * ROOT_THREE / 2;
  }

  function hexRadius(d) {
    return d / ROOT_THREE;
  }

  function hexArea(d) {
    return d * d * ROOT_THREE / 2;
  }

        return { width, height, d, anchorPoint, rectangle, placed };
      }
      const blocked = (w, h) => crossesInterior(tear[0], tear[1], spanRectangle(local.parity, w, h, d), tolerance);
      const clearWidth = largestClear(width - 1, (w) => blocked(w, height));
      const clearHeight = largestClear(height - 1, (h) => blocked(width, h));
      assertCondition(clearWidth > 0 || clearHeight > 0,
        'The local map would wrap around a panel corner next to its anchor; move the anchor away from the corner');
      if (clearWidth * height > width * clearHeight) {
        width = clearWidth;
      } else {
        height = clearHeight;
      }
    }
  }

  // The tiles of a regional local map that crosses panel seams (null when the map lies
  // inside its anchor panel and stays a flat local grid). Local must already be cropped
  // by UnfoldSpan. Tiles follow the global rules of each panel (whole hexes at equatorial
  // east/west seams, clipped partial tiles at the others) and are kept when their centre,
  // unfolded into the anchor frame, falls in a cell of the local W × H block.
  function buildSpan(local) {
    if (local.systemName !== 'regional') {
      return null;
    }
    const key = [local.panelHexes, local.scaleName, local.anchor.panelId, ...local.anchorLattice, local.width, local.height].join(':');
    if (spanCache.has(key)) {
      return spanCache.get(key);
    }
    const unfold = unfoldSpan(local);
    assertCondition(unfold.width === local.width && unfold.height === local.height, 'Local map size must be cropped at panel corners');
    let topo = null;
    if (unfold.placed.size > 1) {
      topo = assembleSpan(local, unfold);
    }
    if (spanCache.size >= SPAN_CACHE_SIZE) {
      spanCache.delete(spanCache.keys().next().value);
    }
    spanCache.set(key, topo);
    return topo;
  }

  function assembleSpan(local, unfold) {
    const built = projection.build();
    const { d, placed, rectangle } = unfold;
    const ratio = lattice.scaleRatio('regional', 'XL', local.scaleName);
    const hexArea = lattice.hexArea(d);
    const column = lattice.columnSpacing(1);
    const { width, height, parity } = local;
    const inBlock = (world) => {
      const [q, j] = lattice.pointToOffset(world[0] / d + parity * column, world[1] / d + parity / 2, 1);
      const columnIndex = q - parity;
      const rowIndex = -j;
      return columnIndex >= 0 && rowIndex >= 0 && columnIndex < width && rowIndex < height;
    };
    // Drawing is clipped to the tile rectangle itself; unfolding used a margin so it
    // could see corners just beyond the map edge.
    const outline = spanRectangle(parity, width, height, d, 0);
    const frameOutlines = new Map();
    for (const [panelId, toWorld] of placed) {
      const toFrame = projection.invertTransform(toWorld);
      const clip = util.clipPolygonToConvex(built.frames[panelId].polygon,
        outline.map((point) => projection.applyTransform(toFrame, point)));
      if (clip.length >= 3 && Math.abs(util.polygonArea(clip)) > 1e-9 * hexArea) {
        frameOutlines.set(panelId, clip);
      }
    }
    // Panels unfolded side by side across a seam, in both directions ("A>B").
    const links = {};
    for (const seam of built.seams) {
      const pointA = placed.get(seam.panelA);
      const pointB = placed.get(seam.panelB);
      if (frameOutlines.has(seam.panelA) && frameOutlines.has(seam.panelB)
        && sameTransform(projection.composeTransforms(seam.bToA, pointA), pointB)) {
        links[`${seam.panelA}>${seam.panelB}`] = true;
        links[`${seam.panelB}>${seam.panelA}`] = true;
      }
    }
    const placedPanelIds = Object.keys(built.panels).filter((panelId) => frameOutlines.has(panelId));
    const linked = (from, to) => links[`${from}>${to}`] === true;
    const strip = built.equatorialWestToEast;
    const tiles = [];
    const panels = {};
    const lookups = {};
    const regionsByPanel = {};
    const placements = {};
    let isFlat = true;
    for (const panelId of placedPanelIds) {
      const toWorld = placed.get(panelId);
      const toFrame = projection.invertTransform(toWorld);
      const frameRectangle = rectangle.map((point) => projection.applyTransform(toFrame, point));
      const panelLatticeInfo = panelLattice(panelId, local.panelHexes, ratio);
      const regions = buildRegions(built, panelId);
      regionsByPanel[panelId] = regions;
      const frameOutline = frameOutlines.get(panelId);
      // Keep tiles whose centre lies in a cell of the block and that are visible in it.
      const candidates = collectPanelTiles({ lattice: panelLatticeInfo, isSinglePanel: false }, regions, hexArea, {
        box: polygonBounds([{ polygon: frameRectangle }]),
        accept: (center) => inBlock(projection.applyTransform(toWorld, center)),
      }).filter((candidate) => (candidate.pieces
        ? candidate.pieces.filter((piece) => piece.panelId === panelId).map((piece) => piece.polygon)
        : [lattice.hexPolygon(candidate.center, d)])
        .some((polygon) => Math.abs(util.polygonArea(util.clipPolygonToConvex(polygon, frameOutline))) > MIN_AREA_FRACTION * hexArea));
      candidates.sort((left, right) => (right.j - left.j) || (left.q - right.q));
      const qMin = candidates.reduce((min, candidate) => Math.min(min, candidate.q), Infinity);
      const qMax = candidates.reduce((max, candidate) => Math.max(max, candidate.q), -Infinity);
      const jMax = candidates.length ? candidates[0].j : 0;
      const jMin = candidates.length ? candidates[candidates.length - 1].j : 0;
      const lookup = new Map();
      const firstTile = tiles.length;
      for (const candidate of candidates) {
        const index = tiles.length;
        isFlat = isFlat && panelId === local.anchor.panelId && candidate.pieces === null;
        lookup.set(makeKey(candidate.q, candidate.j), index);
        tiles.push(Object.freeze({
          index,
          panelId,
          column: candidate.q - qMin,
          row: jMax - candidate.j,
          latticeColumn: candidate.q,
          latticeRow: candidate.j,
          center: Object.freeze(candidate.center),
          area: candidate.area,
          isPartial: candidate.pieces !== null,
          pieces: candidate.pieces ? Object.freeze(candidate.pieces) : null,
        }));
      }
      lookups[panelId] = lookup;
      const stripIndex = strip.indexOf(panelId);
      const westPanel = stripIndex >= 0 ? strip[(stripIndex + 5) % 6] : null;
      const eastPanel = stripIndex >= 0 ? strip[(stripIndex + 1) % 6] : null;
      panels[panelId] = Object.freeze({
        panelId,
        lattice: panelLatticeInfo,
        firstTile,
        tileCount: tiles.length - firstTile,
        columnCount: candidates.length ? qMax - qMin + 1 : 0,
        rowCount: candidates.length ? jMax - jMin + 1 : 0,
        latticeColumnMin: candidates.length ? qMin : 0,
        latticeRowMax: jMax,
        westPanel: westPanel && linked(panelId, westPanel) ? westPanel : null,
        eastPanel: eastPanel && linked(panelId, eastPanel) ? eastPanel : null,
      });
      placements[panelId] = Object.freeze({
        frameToWorld: Object.freeze([...toWorld]),
        frameOutline: Object.freeze(frameOutline.map((point) => Object.freeze(point))),
      });
    }
    if (isFlat && tiles.length === width * height) {
      return null;
    }
    const topo = {
      panelHexes: local.panelHexes,
      tileScale: local.scaleName,
      singlePanel: null,
      ratio,
      milesPerEdge: projection.getMilesPerEdge(local.panelHexes),
      d,
      w: lattice.columnSpacing(d),
      hexArea,
      panelIds: Object.freeze(placedPanelIds.filter((panelId) => panels[panelId].tileCount > 0)),
      panels: Object.freeze(panels),
      lookups: Object.freeze(lookups),
      tiles: Object.freeze(tiles),
      tileCount: tiles.length,
      span: Object.freeze({
        home: local.anchor.panelId,
        anchorPoint: Object.freeze([...unfold.anchorPoint]),
        outline: Object.freeze(outline.map((point) => Object.freeze(point))),
        placements: Object.freeze(placements),
        links: Object.freeze(links),
      }),
    };
    const { offsets, neighborIndices } = buildAdjacency(topo, regionsByPanel, built, linked);
    topo.adjacencyOffsets = offsets;
    topo.adjacency = neighborIndices;
    return Object.freeze(topo);
  }

  // True when tiles of from are also drawn (by seam transform) in to's placement.
  function spanLinked(topo, from, to) {
    return from === to || !topo.span || topo.span.links[`${from}>${to}`] === true;
  }

  function tileAt(topo, panelId, q, j) {
    const lookup = topo.lookups[panelId];
    assertCondition(lookup !== undefined, `Unknown panel: ${panelId}`);
    const index = lookup.get(makeKey(q, j));
    return index === undefined ? -1 : index;
  }

  // Like TileAt, but equatorial columns past the panel's east/west edge resolve
  // to the neighbouring strip panel (the strip lattice is continuous and wraps).
  function locateLattice(topo, panelId, q, j) {
    const info = topo.panels[panelId];
    if (!info && topo.span) {
      return -1;
    }
    const panelLatticeInfo = info.lattice;
    if (panelLatticeInfo.isEquatorial && !topo.singlePanel) {
      const column = q - panelLatticeInfo.columnShift;
      // Local spans omit strip neighbours that are absent or not unfolded beside this panel.
      if (column < 0) {
        return info.westPanel ? tileAt(topo, info.westPanel, q + panelLatticeInfo.columnCount, j) : -1;
      }
      if (column >= panelLatticeInfo.columnCount) {
        return info.eastPanel ? tileAt(topo, info.eastPanel, q - panelLatticeInfo.columnCount, j) : -1;
      }
    }
    return tileAt(topo, panelId, q, j);
  }

  function tileByColumnRow(topo, panelId, column, row) {
    const info = topo.panels[panelId];
    assertCondition(info !== undefined, `Unknown panel: ${panelId}`);
    return tileAt(topo, panelId, column + info.latticeColumnMin, info.latticeRowMax - row);
  }

  function neighbors(topo, tileIndex) {
    return topo.adjacency.subarray(topo.adjacencyOffsets[tileIndex], topo.adjacencyOffsets[tileIndex + 1]);
  }

  function areAdjacent(topo, firstIndex, second) {
    return neighbors(topo, firstIndex).includes(second);
  }

  // The tile's drawable outline(s) in its own panel frame.
  function tilePolygons(topo, tileIndex) {
    const tile = topo.tiles[tileIndex];
    return tile.pieces
      ? tile.pieces.map((piece) => piece.polygon)
      : [lattice.hexPolygon(tile.center, topo.d)];
  }

  rpgMap.Topology = Object.freeze({
    DEFAULT_PANEL_HEXES,
    TILE_SCALES,
    MIN_AREA_FRACTION,
    panelLattice,
    latticeCenter,
    latticeNearest,
    build,
    SPAN_MARGIN,
    spanRectangle,
    unfoldSpan,
    buildSpan,
    spanLinked,
    tileAt,
    locateLattice,
    tileByColumnRow,
    neighbors,
    areAdjacent,
    tilePolygons,
  });
})(globalThis);
</script>

<script data-module="Coordinates">
(function (root) {
  'use strict';
  const rpgMap = root.RpgMap = root.RpgMap || {};
  const { Util: util, Projection: projection, Lattice: lattice, Topology: topology } = rpgMap;
  const { assertCondition } = util;

  // Universal coordinates: (panel, east, north) in miles, measured in the panel
  // plane from the panel reference point (on the equator for equatorial panels).
  const SNAP_FRACTION = 0.25;

  function panelIdByName(name) {
    const lower = String(name).toLowerCase();
    const panel = Object.values(projection.build().panels).find((item) => item.name.toLowerCase() === lower);
    return panel ? panel.id : null;
  }

  function makeLocation(panelId, east, north) {
    return Object.freeze({ panelId, east, north });
  }

  function tileToUniversal(topo, tileIndex) {
    const tile = topo.tiles[tileIndex];
    assertCondition(tile !== undefined, `Unknown tile: ${tileIndex}`);
    return makeLocation(tile.panelId, tile.center[0] * topo.milesPerEdge, tile.center[1] * topo.milesPerEdge);
  }

  // Nearest tile of the location's panel, or −1 if none lies within 0.25·d.
  function universalToTile(topo, location) {
    const info = topo.panels[location.panelId];
    if (info === undefined && topo.span && projection.build().panels[location.panelId]) {
      return -1;
    }
    assertCondition(info !== undefined, `Unknown panel: ${location.panelId}`);
    const point = [location.east / topo.milesPerEdge, location.north / topo.milesPerEdge];
    const [q, j] = topology.latticeNearest(info.lattice, point[0], point[1]);
    const tileIndex = topology.tileAt(topo, location.panelId, q, j);
    if (tileIndex < 0 || util.pointDistance(topo.tiles[tileIndex].center, point) > SNAP_FRACTION * topo.d) {
      return -1;
    }
    return tileIndex;
  }

  function formatAxis(value, decimals, positive, negative) {
    const magnitude = Math.abs(value).toFixed(decimals);
    const zero = Number(magnitude) === 0;
    return magnitude + (value < 0 && !zero ? negative : positive);
  }

  // For example "Eta 187.1W 324.0N".
  function formatUniversal(location, decimals = 1) {
    const panel = projection.build().panels[location.panelId];
    assertCondition(panel !== undefined, `Unknown panel: ${location.panelId}`);
    return `${panel.name} ${formatAxis(location.east, decimals, 'E', 'W')} ${formatAxis(location.north, decimals, 'N', 'S')}`;
  }

  function parseUniversal(text) {
    const match = /^\s*([A-Za-z]+)\s+(\d+(?:\.\d+)?)([EWew])\s+(\d+(?:\.\d+)?)([NSns])\s*$/.exec(text);
    assertCondition(match !== null, `Invalid universal coordinate: ${text}`);
    const panelId = panelIdByName(match[1]);
    assertCondition(panelId !== null, `Unknown panel name: ${match[1]}`);
    const east = Number(match[2]) * (match[3].toUpperCase() === 'W' ? -1 : 1);
    const north = Number(match[4]) * (match[5].toUpperCase() === 'S' ? -1 : 1);
    assertCondition(Number.isFinite(east) && Number.isFinite(north), 'Universal distances must be finite');
    return makeLocation(panelId, east || 0, north || 0);
  }

  // True (spherical) coordinates are for display only: a panel-plane point is projected
  // centrally onto the globe. The prime meridian runs through eta's opposite vertex
  // (+1, +1, −1); true east is north × outward, matching the panel frames.
  const PRIME_MERIDIAN = Object.freeze(util.unit(util.subtract([1, 1, -1],
    util.scale(projection.NORTH, util.dot([1, 1, -1], projection.NORTH)))));
  const TRUE_EAST = Object.freeze(util.cross(projection.NORTH, PRIME_MERIDIAN));

  // { latitude, longitude } in degrees (east and north positive) plus
  // northBearing: the clockwise angle in degrees from panel north to true north at the
  // point (null at a pole). milesPerEdge converts universal miles to frame units.
  function trueCoordinates(location, milesPerEdge) {
    const frame = projection.build().frames[location.panelId];
    assertCondition(frame !== undefined, `Unknown panel: ${location.panelId}`);
    assertCondition(milesPerEdge > 0, 'Miles per edge must be positive');
    const solid = projection.frameToSolid(frame, [location.east / milesPerEdge, location.north / milesPerEdge]);
    const point = util.unit(solid);
    const sinLatitude = Math.max(-1, Math.min(1, util.dot(point, projection.NORTH)));
    const latitude = Math.asin(sinLatitude) * 180 / Math.PI;
    const pole = 1 - Math.abs(sinLatitude) < 1e-12;
    const longitude = pole ? 0
      : Math.atan2(util.dot(point, TRUE_EAST), util.dot(point, PRIME_MERIDIAN)) * 180 / Math.PI;
    // Central projection maps meridians to straight lines: the meridian through the
    // point meets the panel plane along normal × (north × point).
    let northBearing = null;
    if (!pole) {
      let direction = util.cross(frame.normal3D, util.cross(projection.NORTH, solid));
      const trueNorth = util.subtract(projection.NORTH, util.scale(point, sinLatitude));
      if (util.dot(direction, trueNorth) < 0) {
        direction = util.scale(direction, -1);
      }
      northBearing = Math.atan2(util.dot(direction, frame.east3D), util.dot(direction, frame.north3D)) * 180 / Math.PI;
    }
    return Object.freeze({ latitude, longitude: longitude === -180 ? 180 : longitude, northBearing });
  }

  // For example "35.264°N 30.000°W".
  function formatTrue(trueLocation, decimals = 3) {
    return `${formatAxis(trueLocation.latitude, decimals, '\u00b0N', '\u00b0S')} ${formatAxis(trueLocation.longitude, decimals, '\u00b0E', '\u00b0W')}`;
  }

  // Decimal places that resolve about a tenth of a hex in degrees.
  function trueDecimals(hexMiles, milesPerEdge) {
    const built = projection.build();
    const planeDistance = util.dot(built.frames[built.equatorialWestToEast[0]].origin3D,
      built.frames[built.equatorialWestToEast[0]].normal3D);
    const degrees = hexMiles / milesPerEdge / planeDistance * 180 / Math.PI;
    return Math.max(1, Math.min(9, Math.ceil(-Math.log10(degrees / 10))));
  }

  // A flat local map: width × height flat-top hexes, tile (0, 0) in the north-west,
  // x east and y south, oriented to panel north at the anchor (centre of tile (0, 0)).
  // Regional anchors snap to the global lattice of the same scale, so local tiles nest.
  // A regional map may cross panel seams (Topology.BuildSpan) but is cropped so it stops
  // short of any panel corner it would wrap around; Options.isFlat skips that cropping.
  function createLocalMap(options) {
    const { width, height, systemName, scaleName, anchor } = options;
    const panelHexes = options.panelHexes === undefined ? topology.DEFAULT_PANEL_HEXES : options.panelHexes;
    assertCondition(Number.isSafeInteger(width) && width > 0 && Number.isSafeInteger(height) && height > 0
      && Number.isSafeInteger(width * height),
      'Local map size must be positive integers');
    assertCondition(Number.isSafeInteger(panelHexes) && panelHexes > 0 && panelHexes % 2 === 0,
      'Panel hexes must be a positive even integer');
    assertCondition(anchor && Number.isFinite(anchor.east) && Number.isFinite(anchor.north), 'Local anchor distances must be finite');
    assertCondition(projection.build().panels[anchor.panelId] !== undefined, `Unknown panel: ${anchor.panelId}`);
    const hexMiles = lattice.scaleMiles(systemName, scaleName);
    let snappedAnchor = makeLocation(anchor.panelId, anchor.east, anchor.north);
    let parity = 0;
    let anchorLattice = null;
    if (systemName === 'regional') {
      const panelLatticeInfo = topology.panelLattice(anchor.panelId, panelHexes, lattice.scaleRatio('regional', 'XL', scaleName));
      const milesPerEdge = panelLatticeInfo.milesPerEdge;
      const [q, j] = topology.latticeNearest(panelLatticeInfo, anchor.east / milesPerEdge, anchor.north / milesPerEdge);
      const center = topology.latticeCenter(panelLatticeInfo, q, j);
      snappedAnchor = makeLocation(anchor.panelId, center[0] * milesPerEdge, center[1] * milesPerEdge);
      parity = lattice.isOdd(q) ? 1 : 0;
      anchorLattice = Object.freeze([q, j]);
    }
    const isFlat = systemName !== 'regional' || options.isFlat === true;
    let croppedWidth = width;
    let croppedHeight = height;
    if (!isFlat) {
      // Regional maps may cross panel seams but must stop short of panel corner vertices.
      const unfold = topology.unfoldSpan({
        width, height, scaleName, panelHexes, anchor: snappedAnchor, parity, anchorLattice,
      });
      croppedWidth = unfold.width;
      croppedHeight = unfold.height;
    }
    return Object.freeze({
      width: croppedWidth, height: croppedHeight, systemName, scaleName, panelHexes, hexMiles, anchor: snappedAnchor,
      parity, anchorLattice,
    });
  }

  // The panels holding a regional local map's tiles and its size after cropping at panel
  // corners: for previews (the span is cached, so creating the map afterwards is quick).
  function previewLocalSpan(options) {
    const local = createLocalMap(options);
    if (local.systemName !== 'regional' || options.isFlat === true) {
      return Object.freeze({ width: local.width, height: local.height, panelIds: [local.anchor.panelId] });
    }
    const topo = topology.buildSpan(local);
    const home = local.anchor.panelId;
    const panelIds = topo ? [...topo.panelIds].sort((a, b) => (b === home) - (a === home)) : [home];
    return Object.freeze({ width: local.width, height: local.height, panelIds });
  }

  // Local display coordinates: one hex high, with tile (0, 0) at the origin.
  // Keeping the anchor out of this space avoids precision loss at yard scales.
  function localTilePoint(local, columnIndex, rowIndex) {
    const shift = (lattice.isOdd(columnIndex + local.parity) ? 1 : 0) - local.parity;
    return [columnIndex * lattice.columnSpacing(1), shift / 2 - rowIndex];
  }

  function localPointToTile(local, point) {
    const [q, j] = lattice.pointToOffset(
      point[0] + local.parity * lattice.columnSpacing(1), point[1] + local.parity / 2, 1);
    const columnIndex = q - local.parity;
    const rowIndex = -j || 0;
    return columnIndex >= 0 && rowIndex >= 0 && columnIndex < local.width && rowIndex < local.height ? [columnIndex, rowIndex] : null;
  }

  function localTileToUniversal(local, columnIndex, rowIndex) {
    const [x, y] = localTilePoint(local, columnIndex, rowIndex);
    return makeLocation(
      local.anchor.panelId,
      local.anchor.east + x * local.hexMiles,
      local.anchor.north + y * local.hexMiles,
    );
  }

  // Local tile [x, y] nearest the location, or null if outside the map or > 0.25·d away.
  function universalToLocalTile(local, location) {
    if (location.panelId !== local.anchor.panelId) {
      return null;
    }
    const d = local.hexMiles;
    const xy = localPointToTile(local, [(location.east - local.anchor.east) / d, (location.north - local.anchor.north) / d]);
    if (!xy) {
      return null;
    }
    const [columnIndex, rowIndex] = xy;
    const center = localTileToUniversal(local, columnIndex, rowIndex);
    const distance = Math.hypot(center.east - location.east, center.north - location.north);
    return distance > SNAP_FRACTION * d ? null : [columnIndex, rowIndex];
  }

  rpgMap.Coordinates = Object.freeze({
    SNAP_FRACTION,
    panelIdByName,
    makeLocation,
    tileToUniversal,
    universalToTile,
    formatUniversal,
    parseUniversal,
    trueCoordinates,
    formatTrue,
    trueDecimals,
    createLocalMap,
    previewLocalSpan,
    localTilePoint,
    localPointToTile,
    localTileToUniversal,
    universalToLocalTile,
  });
})(globalThis);
</script>

    ['i', 'islands', 'Islands', '#6b9cc8', true],
    ['o', 'lakes', 'Lakes', '#5b93c9', true],
    ['v', 'firth', 'Firth', '#5a8bb0', true],
    ['.', 'plain', 'Plain', '#c9d98f', false],
    ['h', 'hills', 'Hills', '#b5b56e', false],
    ['M', 'mountains', 'Mountains', '#9a8a74', false],
