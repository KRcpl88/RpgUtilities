  // Traces tileIndices in chunks, calling paint after each chunk's path is built.
  function paintTiles(context, topo, tileIndices, small, inflate, paint) {
    for (let start = 0; start < tileIndices.length; start += PATH_CHUNK) {
      context.beginPath();
      const end = Math.min(tileIndices.length, start + PATH_CHUNK);
      for (let index = start; index < end; index++) {
        traceTile(context, topo, tileIndices[index], small, inflate);
      }
      paint();
    }
  }

  function intersectBounds(firstPoint, secondPoint) {
    return [Math.max(firstPoint[0], secondPoint[0]), Math.max(firstPoint[1], secondPoint[1]),
      Math.min(firstPoint[2], secondPoint[2]), Math.min(firstPoint[3], secondPoint[3])];
  }

  // Draws terrain fills and/or the hex grid for every visible panel. scale is screen
  // pixels per world unit (layouts are rigid, so the same in every panel frame).
  function drawTiles(context, ratio, doc, layout, worldToScreen, viewBounds, scale, options) {
    const topo = view.mapGeometry(doc);
    const hexPixels = topo.d * scale;
    const small = hexPixels < SMALL_HEX_PIXELS;
    const showGrid = options.showGrid && hexPixels >= GRID_MIN_PIXELS;
    if (!options.showTerrain && !showGrid) {
      return;
    }
    for (const placement of layout.placements) {
      if (!view.boundsIntersect(placement.bounds, viewBounds)) {
        continue;
      }
      const frameBounds = view.transformBounds(placement.worldToFrame, intersectBounds(placement.bounds, viewBounds));
      context.save();
      setTransform(context, ratio, projection.composeTransforms(placement.frameToWorld, worldToScreen));
      context.beginPath();
      tracePolygon(context, placement.frameOutline);
      context.clip();
      for (const group of view.panelTileGroups(topo, placement.panelId)) {
        const visible = view.visibleTiles(topo, group, frameBounds);
        if (visible.length === 0) {
          continue;
        }
        context.save();
        const t = group.toPanel;
        context.transform(t[0], t[1], t[2], t[3], t[4], t[5]);
        if (options.showTerrain) {
          const buckets = new Map();
          for (const tileIndex of visible) {
            const id = doc.terrainIds[tileIndex];
            (buckets.get(id) || buckets.set(id, []).get(id)).push(tileIndex);
          }
          const inflate = SEAM_PIXELS / scale;
          // Inflated neighbours overlap, so paint in terrain-id order: then a partial
          // repaint layers the overlaps exactly as a full redraw does.
          for (const [id, tileIndices] of [...buckets].sort((a, b) => a[0] - b[0])) {
            context.fillStyle = terrain.byId(id).color;
            paintTiles(context, topo, tileIndices, small, inflate, () => context.fill());
          }
        }
        if (showGrid) {
          context.lineWidth = 1 / scale;
          context.strokeStyle = GRID_COLOR;
          paintTiles(context, topo, visible, false, 0, () => context.stroke());
        }
        context.restore();
      }
      context.restore();
    }
  }

  // A cached terrain image of a whole layout, used when hexes are too small to draw.
  // Edits reported through MarkTilesChanged are repainted in place; any other document
  // change (a revision the raster was not told about) rebuilds it.
  function getRaster(renderer, key, doc, layout, scale) {
    const cached = renderer.rasters.get(key);
    if (cached && cached.doc === doc && cached.layout === layout && cached.revision === doc.revision && cached.scale === scale) {
      if (cached.dirtyTiles.size > MAX_REPAINT_TILES) {
        cached.context.setTransform(1, 0, 0, 1, 0, 0);
        cached.context.clearRect(0, 0, cached.canvas.width, cached.canvas.height);
        drawTiles(cached.context, 1, doc, layout, cached.worldToRaster, cached.bounds, scale, { showTerrain: true, showGrid: false });
      } else if (cached.dirtyTiles.size > 0) {
        repaintRasterTiles(cached);
      }
      cached.dirtyTiles.clear();
      return cached;
    }
    const bounds = layout.bounds;
    const canvas = root.document.createElement('canvas');
    canvas.width = Math.max(1, Math.ceil((bounds[2] - bounds[0]) * scale));
    canvas.height = Math.max(1, Math.ceil((bounds[3] - bounds[1]) * scale));
    const context = canvas.getContext('2d');
    const worldToRaster = [scale, 0, 0, -scale, -bounds[0] * scale, bounds[3] * scale];
    drawTiles(context, 1, doc, layout, worldToRaster, bounds, scale, { showTerrain: true, showGrid: false });
    const raster = { canvas, context, doc, layout, revision: doc.revision, scale, bounds, worldToRaster, dirtyTiles: new Set() };
    renderer.rasters.set(key, raster);
    return raster;
  }

  // Records tiles whose terrain just changed (the document is at its new revision), so
  // cached rasters repaint only those tiles on their next use.
  function markTilesChanged(renderer, doc, tileIndices) {
    for (const raster of renderer.rasters.values()) {
      if (raster.doc === doc) {
        tileIndices.forEach((tileIndex) => raster.dirtyTiles.add(tileIndex));
        raster.revision = doc.revision;
      }
    }
  }

  // Where a tile is drawn in a layout: its own placement plus, for equatorial edge
  // columns, the strip neighbours whose polygons its hex overhangs. Yields world centres.
  function tileWorldCenters(topo, layout, tileIndex) {
    const tile = topo.tiles[tileIndex];
    const centers = [];
    const own = view.findPlacement(layout, tile.panelId);
    if (own) {
      centers.push(projection.applyTransform(own.frameToWorld, tile.center));
    }
    const info = topo.panels[tile.panelId];
    if (info.lattice.isEquatorial) {
      for (const otherId of [info.westPanel, info.eastPanel]) {
        const other = view.findPlacement(layout, otherId);
        if (other) {
          const seam = projection.findSeam(tile.panelId, otherId);
          const toOther = seam.panelA === tile.panelId ? seam.aToB : seam.bToA;
          centers.push(projection.applyTransform(other.frameToWorld, projection.applyTransform(toOther, tile.center)));
        }
      }
    }
    return centers;
  }

  // Clears and redraws whole-pixel boxes around each dirty tile; tiles overlapping the
  // boxes are redrawn too, clipped to the boxes, so neighbours stay intact.
  function repaintRasterTiles(raster) {
    const { context, doc, layout, scale, worldToRaster } = raster;
    const topo = view.mapGeometry(doc);
    const radius = lattice.hexRadius(topo.d);
    const boxes = [];
    for (const tileIndex of raster.dirtyTiles) {
      for (const world of tileWorldCenters(topo, layout, tileIndex)) {
        const [x, y] = projection.applyTransform(worldToRaster, world);
        const half = radius * scale + 2;
        boxes.push([Math.floor(x - half), Math.floor(y - half), Math.ceil(x + half), Math.ceil(y + half)]);
      }
    }
    if (boxes.length === 0) {
      return;
    }
    const pixelBounds = view.unionBounds(boxes);
    const rasterToWorld = projection.invertTransform(worldToRaster);
    const worldBounds = view.transformBounds(rasterToWorld, pixelBounds);
    context.save();
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.beginPath();
    boxes.forEach(([left, top, right, bottom]) => context.rect(left, top, right - left, bottom - top));
    context.clip();
    context.clearRect(pixelBounds[0], pixelBounds[1], pixelBounds[2] - pixelBounds[0], pixelBounds[3] - pixelBounds[1]);
    drawTiles(context, 1, doc, layout, worldToRaster, worldBounds, scale, { showTerrain: true, showGrid: false });
    context.restore();
  }

  function mainRasterScale(doc, layout) {
    const bounds = layout.bounds;
    const extent = Math.max(bounds[2] - bounds[0], bounds[3] - bounds[1]);
    return Math.min(RASTER_HEX_PIXELS / view.mapGeometry(doc).d, RASTER_MAX_PIXELS / extent);
  }

  function drawRaster(context, ratio, raster, worldToScreen) {
    const rasterToWorld = [1 / raster.scale, 0, 0, -1 / raster.scale, raster.bounds[0], raster.bounds[3]];
    context.save();
    setTransform(context, ratio, projection.composeTransforms(rasterToWorld, worldToScreen));
    context.imageSmoothingEnabled = true;
    context.drawImage(raster.canvas, 0, 0);
    context.restore();
  }

  function traceScreenOutline(context, camera, placement) {
    tracePolygon(context, placement.outline.map((point) => view.worldToScreen(camera, point)));
  }

  // Panel shading, outlines and names, drawn in CSS pixels.
  function drawPanelDecorations(context, ratio, state) {
    const { camera, layout, layers } = state;
    context.save();
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    if (layout.mode === 'focus') {
      context.beginPath();
      layout.placements.filter((placement) => placement.panelId !== layout.focusPanel)
        .forEach((placement) => traceScreenOutline(context, camera, placement));
      context.fillStyle = 'rgba(16, 21, 28, 0.4)';
      context.fill();
    }
    if (layers.showOutlines) {
      context.beginPath();
      layout.placements.forEach((placement) => traceScreenOutline(context, camera, placement));
      context.lineWidth = 1.25;
      context.strokeStyle = OUTLINE_COLOR;
      context.lineJoin = 'round';
      context.stroke();
      if (layout.mode === 'focus') {
        context.beginPath();
        traceScreenOutline(context, camera, view.findPlacement(layout, layout.focusPanel));
        context.lineWidth = 2;
        context.strokeStyle = FOCUS_COLOR;
        context.stroke();
      }
    }
    if (layers.showNames && layout.mode !== 'local') {
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineJoin = 'round';
      for (const placement of layout.placements) {
        const panelPixels = (placement.bounds[2] - placement.bounds[0]) * camera.scale;
        if (panelPixels < 50) {
          continue;
        }
        const font = Math.round(Math.min(22, Math.max(10, panelPixels * 0.06)));
        const [x, y] = view.worldToScreen(camera, placement.center);
        context.font = `600 ${font}px system-ui, sans-serif`;
        context.lineWidth = 3;
        context.strokeStyle = 'rgba(16, 21, 28, 0.75)';
        context.strokeText(placement.name, x, y);
        context.fillStyle = '#f2f2f2';
        context.fillText(placement.name, x, y);
      }
    }
    context.restore();
  }

  function drawReferences(context, ratio, state, worldToScreen) {
    if (!state.layers.reference) {
      return;
    }
    for (const placement of state.layout.placements) {
      const reference = view.referenceGeometry(state.doc, placement.panelId);
      const transform = projection.composeTransforms(placement.frameToWorld, worldToScreen);
      const toScreen = (point) => projection.applyTransform(transform, point);
      context.save();
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.strokeStyle = context.fillStyle = '#d32f2f';
      context.lineWidth = 1.5;
      if (reference.equator.length === 2) {
        context.beginPath();
        context.moveTo(...toScreen(reference.equator[0]));
        context.lineTo(...toScreen(reference.equator[1]));
        context.stroke();
      }
      for (const pole of reference.poles) {
        const [x, y] = toScreen(pole.point);
        const center = toScreen(util.center(placement.frameOutline));
        const direction = util.pointDistance(center, [x, y]) > 1e-9 ? util.unit(util.subtract(center, [x, y])) : [0, -1];
        context.beginPath();
        context.arc(x, y, 9, 0, Math.PI * 2);
        context.moveTo(x - 13, y);
        context.lineTo(x + 13, y);
        context.moveTo(x, y - 13);
        context.lineTo(x, y + 13);
        context.stroke();
        context.font = '600 13px system-ui, sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.strokeStyle = '#ffffff';
        context.lineWidth = 3;
        context.strokeText(pole.label, x + direction[0] * 20, y + direction[1] * 20);
        context.fillText(pole.label, x + direction[0] * 20, y + direction[1] * 20);
        context.strokeStyle = '#d32f2f';
        context.lineWidth = 1.5;
      }
      context.restore();
    }
  }

  // Outlines tiles in their own panels' placements (tiles of panels not in the layout
  // are skipped).
  function outlineTiles(context, ratio, state, worldToScreen, tileIndices, spanWidth, color) {
    const { doc, layout } = state;
    const topo = view.mapGeometry(doc);
    const byPanel = new Map();
    for (const tileIndex of tileIndices) {
      const panelId = topo.tiles[tileIndex].panelId;
      (byPanel.get(panelId) || byPanel.set(panelId, []).get(panelId)).push(tileIndex);
    }
    for (const [panelId, panelTiles] of byPanel) {
      const placement = view.findPlacement(layout, panelId);
      if (!placement) {
        continue;
      }
      context.save();
      setTransform(context, ratio, projection.composeTransforms(placement.frameToWorld, worldToScreen));
      context.beginPath();
      panelTiles.forEach((tileIndex) => traceTile(context, topo, tileIndex, false));
      context.lineWidth = spanWidth / state.camera.scale;
      context.lineJoin = 'round';
      context.strokeStyle = color;
      context.stroke();
      context.restore();
    }
  }

  // The brush footprint (State.previewTiles) and the hovered tile.
  function drawHover(context, ratio, state, worldToScreen) {
    const preview = state.previewTiles || [];
    if (preview.length > 1) {
      outlineTiles(context, ratio, state, worldToScreen, preview, 1.25, PREVIEW_COLOR);
    }
    if (state.hoverTile >= 0) {
      outlineTiles(context, ratio, state, worldToScreen, [state.hoverTile], 2, HOVER_COLOR);
    }
  }

  const OVERLAY_STYLES = view.OVERLAY_STYLES;
  const LANDMARK_PATHS = new Map();

  function featureVisible(layers, layer, item) {
    return layer === 'overlay' ? layers[item.type] !== false : layers[layer] !== false;
  }

  function isSelected(state, layer, key) {
    return state.selection && state.selection.layer === layer && state.selection.key === key;
  }

  function screenDot(context, point, radius, fill) {
    context.beginPath();
    context.arc(point[0], point[1], radius, 0, 2 * Math.PI);
    context.fillStyle = fill;
    context.fill();
    context.lineWidth = 1;
    context.strokeStyle = '#10151c';
    context.stroke();
  }

  function drawFeatures(renderer, state, worldToScreen) {
    const { context, ratio } = renderer;
    const { doc, layout, camera, layers } = state;
    const topo = view.mapGeometry(doc);
    renderer.featureHits = [];
    const byPanel = new Map(layout.placements.map((placement) => [placement.panelId, []]));
    for (const overlay of doc.overlays) {
      if (!featureVisible(layers, 'overlay', overlay)) {
        continue;
      }
      for (const curve of view.overlayCurves(topo, overlay)) {
        if (byPanel.has(curve.panelId)) {
          byPanel.get(curve.panelId).push({ overlay, curve });
        }
      }
    }
    for (const placement of layout.placements) {
      context.save();
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.beginPath();
      traceScreenOutline(context, camera, placement);
      context.clip();
      const panelToScreen = projection.composeTransforms(placement.frameToWorld, worldToScreen);
      const addHit = (hit) => renderer.featureHits.push({ ...hit, drawPanel: placement.panelId });
      for (const { overlay, curve } of byPanel.get(placement.panelId)) {
        const style = OVERLAY_STYLES[overlay.type];
        const spanWidth = style.spanWidth * Math.max(0.7, Math.min(2, topo.d * camera.scale / 32));
        const curvePoints = curve.control.map((point) => projection.applyTransform(panelToScreen, point));
        context.beginPath();
        context.moveTo(...curvePoints[0]);
        context.bezierCurveTo(...curvePoints[1], ...curvePoints[2], ...curvePoints[3]);
        context.lineCap = 'round';
        context.lineJoin = 'round';
        if (isSelected(state, 'overlay', overlay.id)) {
          context.strokeStyle = HOVER_COLOR;
          context.lineWidth = spanWidth + 4;
          context.stroke();
        }
        context.setLineDash(style.dash);
        context.strokeStyle = style.color;
        context.lineWidth = spanWidth;
        context.stroke();
        context.setLineDash([]);
        addHit({ layer: 'overlay', key: overlay.id, pointIndex: curve.pointIndex, points: view.flattenCurve(curvePoints), radius: Math.max(5, spanWidth / 2 + 2) });
      }
      for (const overlay of doc.overlays) {
        if (!featureVisible(layers, 'overlay', overlay) || (overlay.tileIndices.length > 1 && !isSelected(state, 'overlay', overlay.id))) {
          continue;
        }
        overlay.tileIndices.forEach((tileIndex, pointIndex) => {
          const copy = view.featureCopies(topo, layout, tileIndex).find((item) => item.placement === placement);
          if (!copy) {
            return;
          }
          const screen = projection.applyTransform(projection.composeTransforms(copy.frameToWorld, worldToScreen), view.featureAnchor(topo, tileIndex));
          const point = isSelected(state, 'overlay', overlay.id) && state.selection.pointIndex === pointIndex;
          screenDot(context, screen, point ? 5 : 3, point ? '#ffffff' : OVERLAY_STYLES[overlay.type].color);
          addHit({ layer: 'overlay', key: overlay.id, pointIndex, screen, radius: 6 });
        });
      }
      if (layers.landmark !== false) {
        for (const [tileIndex, landmark] of doc.landmarks) {
          const copy = view.featureCopies(topo, layout, tileIndex).find((item) => item.placement === placement);
          if (!copy) {
            continue;
          }
          const t = projection.composeTransforms(copy.frameToWorld, worldToScreen);
          const screen = projection.applyTransform(t, view.featureAnchor(topo, tileIndex));
          const size = Math.max(6, Math.min(26, topo.d * camera.scale * 0.55));
          if (isSelected(state, 'landmark', tileIndex)) {
            screenDot(context, screen, size * 0.7 + 3, HOVER_COLOR);
          }
          if (!LANDMARK_PATHS.has(landmark.type)) {
            LANDMARK_PATHS.set(landmark.type, new root.Path2D(terrain.landmarkType(landmark.type).path));
          }
          context.save();
          context.translate(...screen);
          context.rotate(Math.atan2(t[1], t[0]));
          context.scale(size / 24, size / 24);
          context.fillStyle = '#f9edcc';
          context.strokeStyle = '#28221b';
          context.lineWidth = 1.8;
          context.fill(LANDMARK_PATHS.get(landmark.type));
          context.stroke(LANDMARK_PATHS.get(landmark.type));
          context.restore();
          addHit({ layer: 'landmark', key: tileIndex, screen, radius: Math.max(6, size * 0.6) });
        }
      }
      if (layers.label !== false) {
        for (const stored of doc.labels) {
          const label = state.labelPreview && state.labelPreview.id === stored.id ? state.labelPreview : stored;
          const copy = view.featureCopies(topo, layout, label.tileIndex).find((item) => item.placement === placement);
          if (!copy) {
            continue;
          }
          const frameToScreen = projection.composeTransforms(copy.frameToWorld, worldToScreen);
          const textToScreen = projection.composeTransforms(view.labelTransform(topo, label), frameToScreen);
          context.save();
          setTransform(context, ratio, textToScreen);
          context.font = `${label.category === 'region' ? '600' : '400'} ${label.size}px system-ui, sans-serif`;
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          const halfWidth = context.measureText(label.text).width / 2 + 2;
          const halfHeight = label.size * 0.65;
          context.lineJoin = 'round';
          context.strokeStyle = '#f9edcc';
          context.lineWidth = Math.max(1, label.size / 8);
          context.strokeText(label.text, 0, 0);
          context.fillStyle = '#201c19';
          context.fillText(label.text, 0, 0);
          const selected = isSelected(state, 'label', label.id);
          if (selected) {
            context.lineWidth = 1.5 / Math.hypot(textToScreen[0], textToScreen[1]);
            context.strokeStyle = HOVER_COLOR;
            context.strokeRect(-halfWidth, -halfHeight, 2 * halfWidth, 2 * halfHeight);
          }
          context.restore();
          addHit({ layer: 'label', key: label.id, screenToText: projection.invertTransform(textToScreen), frameToScreen, halfWidth, halfHeight });
          if (selected) {
            const center = projection.applyTransform(textToScreen, [0, 0]);
            const topPoint = projection.applyTransform(textToScreen, [0, -halfHeight]);
            const length = Math.hypot(textToScreen[2], textToScreen[3]);
            const rotate = [topPoint[0] - 20 * textToScreen[2] / length, topPoint[1] - 20 * textToScreen[3] / length];
            context.beginPath();
            context.moveTo(...topPoint);
            context.lineTo(...rotate);
            context.strokeStyle = HOVER_COLOR;
            context.lineWidth = 1.5;
            context.stroke();
            for (const [handleKind, screen] of [['move', center], ['rotate', rotate]]) {
              screenDot(context, screen, 5, handleKind === 'move' ? '#ffffff' : HOVER_COLOR);
              addHit({ layer: 'label', key: label.id, handleKind, screen, radius: 8, frameToScreen });
            }
          }
        }
      }
      context.restore();
    }
  }

  function hitFeature(renderer, state, screen, filter = 'all') {
    const panelHit = view.placementAt(state.layout, view.screenToWorld(state.camera, screen));
    if (!panelHit) {
      return null;
    }
    for (let index = renderer.featureHits.length - 1; index >= 0; index--) {
      const hit = renderer.featureHits[index];
      const typeMatch = hit.layer === 'overlay' && state.doc.overlays.some((item) => item.id === hit.key && item.type === filter);
      if (hit.drawPanel !== panelHit.placement.panelId || (filter !== 'all' && hit.layer !== filter && !typeMatch)) {
        continue;
      }
      if (hit.screenToText) {
        const [x, y] = projection.applyTransform(hit.screenToText, screen);
        if (Math.abs(x) <= hit.halfWidth && Math.abs(y) <= hit.halfHeight) {
          return hit;
        }
      } else if (hit.points) {
        if (hit.points.slice(1).some((point, pointIndex) => view.distanceToSegment(screen, hit.points[pointIndex], point) <= hit.radius)) {
          return hit;
        }
      } else if (util.pointDistance(screen, hit.screen) <= hit.radius) {
        return hit;
      }
    }
    return null;
  }

  // State: { Doc, Layout, Camera, Layers: { showTerrain, showGrid, showOutlines, showNames }, hoverTile }.
  // Returns { raster, hexPixels } for the status bar.
  function draw(renderer, state) {
    const { canvas, context } = renderer;
    const { doc, layout, camera, layers } = state;
    const ratio = syncSize(canvas, camera);
    renderer.ratio = ratio;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = BACKGROUND;
    context.fillRect(0, 0, canvas.width, canvas.height);
    const worldToScreen = view.worldToScreenTransform(camera);
    const viewBounds = view.visibleBounds(camera);
    const hexPixels = view.mapGeometry(doc).d * camera.scale;
    const rasterScale = mainRasterScale(doc, layout);
    const raster = layers.showTerrain && hexPixels < RASTER_HEX_PIXELS && camera.scale <= rasterScale * 1.5;
    if (raster) {
      drawRaster(context, ratio, getRaster(renderer, 'main', doc, layout, rasterScale), worldToScreen);
    } else {
      drawTiles(context, ratio, doc, layout, worldToScreen, viewBounds, camera.scale,
        { showTerrain: layers.showTerrain, showGrid: layers.showGrid });
    }
    drawPanelDecorations(context, ratio, state);
    drawFeatures(renderer, state, worldToScreen);
    drawReferences(context, ratio, state, worldToScreen);
    drawHover(context, ratio, state, worldToScreen);
    return { raster, hexPixels };
  }

  // The map navigator: net or local terrain, outlines, and the main view's extent.
  function drawMinimap(renderer, miniCanvas, state) {
    const netLayout = view.mapLayout(state.doc);
    const miniCamera = renderer.miniCamera || (renderer.miniCamera = view.createCamera());
    const ratio = syncSize(miniCanvas, miniCamera);
    view.fitBounds(miniCamera, netLayout.bounds, 4);
    const context = miniCanvas.getContext('2d');
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = BACKGROUND;
    context.fillRect(0, 0, miniCanvas.width, miniCanvas.height);
    const worldToScreen = view.worldToScreenTransform(miniCamera);
    drawRaster(context, ratio, getRaster(renderer, 'mini', state.doc, netLayout, miniCamera.scale * ratio), worldToScreen);
    context.save();
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.beginPath();
    netLayout.placements.forEach((placement) => traceScreenOutline(context, miniCamera, placement));
    context.lineWidth = 0.75;
    context.strokeStyle = 'rgba(230, 230, 230, 0.6)';
    context.stroke();
    context.lineWidth = 1.5;
    context.strokeStyle = FOCUS_COLOR;
    if (state.layout.mode !== 'focus') {
      const [minX, minY, maxX, maxY] = view.visibleBounds(state.camera);
      const [left, top] = view.worldToScreen(miniCamera, [minX, maxY]);
      const [right, bottom] = view.worldToScreen(miniCamera, [maxX, minY]);

  function tileLocationText(tileIndex) {

  function setHover(tileIndex) {

  function setTerrain(terrainId) {

    root.document.getElementById('brush-radius-value').textContent = String(state.brushRadius);
    setHover(state.hoverTile);
  }

  function pickTerrain(tileIndex) {
    setTerrain(model.getTerrain(state.doc, tileIndex));
    setMessage(`Picked ${terrain.byId(state.terrainId).name}`);
  }

  function fillAt(tileIndex) {
    const { command, tileIndices } = edit.fill(state.history, tileIndex, state.terrainId);
    setMessage(command ? `${command.label}: ${countText(tileIndices.length)}` : 'Fill: no change');

  }

  function strokeAt(screen) {
    tilesChanged(edit.strokeTo(state.stroke, state.layout, view.screenToWorld(state.camera, screen)));
  }

  function newMap() {

    finishLabelDrag(true);
    const current = state.doc;
    const local = current.local;
    const numberInput = (value, min = 1, step = 1) => element('input', {
      type: 'number', required: true, min: String(min), step: String(step),
      max: String(Number.MAX_SAFE_INTEGER), value: String(value),

    const name = element('input', { type: 'text', value: 'Untitled', autofocus: true });
    const panelHexes = numberInput(local ? local.panelHexes : current.global.panelHexes, 2, 2);
    const tileScale = selectControl([['XL', 'XL - 216 mi per hex'], ['L', 'L - 36 mi per hex'], ['M', 'M - 6 mi per hex']], current.global ? current.global.tileScale : 'XL', () => updateFields());
    const panel = selectControl(Object.keys(projection.SECTOR_LABELS).map((id) =>
      [id, projection.build().panels[id].name]), current.global && current.global.panelId || state.layout.focusPanel || coordinates.panelIdByName('Eta'), () => updateFields());
    const panelField = field('new-panel', 'Panel', panel);
    const widthInput = numberInput(local ? local.width : 32);
    const heightInput = numberInput(local ? local.height : 24);

    const size = selectControl([], '', () => updateFields());

    const anchorTile = state.selectedTile >= 0 ? state.selectedTile : state.hoverTile >= 0 ? state.hoverTile : hit ? hit.tileIndex : -1;
    const anchorLocation = local ? local.anchor : anchorTile >= 0 ? model.tileToUniversal(current, anchorTile) : coordinates.parseUniversal('Eta 0.0E 0.0N');
    const anchor = element('input', { type: 'text', required: true, value: coordinates.formatUniversal(anchorLocation, 10) });
    const projectedLegend = element('legend', { textContent: 'Global map' });

    });

      const isPanel = kind.value === 'panel';
      projectedLegend.textContent = isPanel ? 'Single-panel map' : 'Global map';
      localFields.hidden = localFields.disabled = !local;
      globalFields.hidden = globalFields.disabled = local;

      const scaleName = tileScale.value;
      const scales = isPanel ? ['XL', 'L', 'M'] : ['XL', 'L'];
      if (tileScale.options.length !== scales.length) {
        tileScale.replaceChildren(...scales.map((size) => element('option', {
          value: size, textContent: `${size} - ${lattice.SCALES.regional.sizes[size]} mi per hex`,
        })));
        tileScale.value = scales.includes(scaleName) ? scaleName : 'XL';

      if (!local) {
        preview.textContent = (isPanel ? 'The complete selected panel only, with no neighbours or wrapping. ' : '')
          + 'New maps start as water. Panel size is measured in XL hexes regardless of tile scale and must be a positive even integer.';

  // Describes how a local map meets panel seams, for dialog previews.

    if (span.panelIds.length === 1) {

  }

      }
    });
  }

  // Copies a rectangle or an entire panel, optionally at another tile scale.
  function cropMap() {
    const dialog = root.document.getElementById('crop-map-dialog');
    if (dialog.open) {
      return;
    }

    });

    const widthInput = numberInput(32);
    const heightInput = numberInput(24);
    const scale = selectControl(Object.keys(lattice.SCALES).flatMap((systemName) => lattice.SIZES.map((size) =>
      [`${systemName} ${size}`, scaleText(systemName, size)])), `${sourceSystem} ${sourceScale}`, () => update());
    const kind = selectControl([['local', 'Rectangle'], ['panel', 'Entire panel']], 'local', () => updateScales());
    // Centre the default crop on the selected tile, or else on the view centre.
    const hit = view.hitTest(view.mapGeometry(doc), state.layout, [state.camera.centerX, state.camera.centerY]);
    const centerTile = state.selectedTile >= 0 ? state.selectedTile : hit ? hit.tileIndex : 0;
    const center = model.tileToUniversal(doc, centerTile);
    const panel = selectControl(Object.keys(projection.SECTOR_LABELS).map((panelId) =>
      [panelId, projection.build().panels[panelId].name]), doc.global && doc.global.panelId || state.layout.focusPanel || center.panelId, () => update());
    const hexMiles = model.hexMiles(doc);
    const anchor = element('input', { type: 'text', required: true });
    let anchorEdited = false;
    anchor.addEventListener('input', () => {
      anchorEdited = true;
    });

    const centerAnchor = () => {
