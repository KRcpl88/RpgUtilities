    rgNeighborSets.forEach((Neighbors, nIndex) => {
      rgnOffsets[nIndex + 1] = rgnOffsets[nIndex] + Neighbors.size;
    });
    const rgnNeighbors = new Int32Array(rgnOffsets[rgNeighborSets.length]);
    rgNeighborSets.forEach((Neighbors, nIndex) => {
      rgnNeighbors.set([...Neighbors].sort((nLeft, nRight) => nLeft - nRight), rgnOffsets[nIndex]);
    });
    return { rgnOffsets, rgnNeighbors };
  }

  // Builds (and caches) the tiles and adjacency of a global map.
  function Build(nPanelHexes = g_nDefaultPanelHexes, szTileScale = 'XL', szSinglePanel = null) {
    ValidatePanelHexes(nPanelHexes);
    Require((szSinglePanel === null ? g_rgszTileScales : ['XL', 'L', 'M']).includes(szTileScale),
      `Unsupported ${szSinglePanel === null ? 'global' : 'panel'} tile scale: ${szTileScale}`);
    const Built = Projection.Build();
    Require(szSinglePanel === null || Object.hasOwn(Built.Panels, szSinglePanel), `Unknown panel: ${szSinglePanel}`);
    const szKey = `${nPanelHexes}:${szTileScale}:${szSinglePanel}`;
    if (g_Cache.has(szKey)) {
      return g_Cache.get(szKey);
    }
    const nRatio = Lattice.ScaleRatio('regional', 'XL', szTileScale);
    const rgszPanels = szSinglePanel === null ? Object.keys(Built.Panels) : [szSinglePanel];
    const rgszStrip = Built.rgszEquatorialWestToEast;
    const dD = PanelLattice(rgszPanels[0], nPanelHexes, nRatio).dD;
    const dHexArea = Lattice.HexArea(dD);
    const rgTiles = [];
    const Panels = {};
    const Lookups = {};
    const RegionsByPanel = {};
    for (const szPanel of rgszPanels) {
      const PanelLatticeInfo = PanelLattice(szPanel, nPanelHexes, nRatio);
      const rgRegions = BuildRegions(Built, szPanel).slice(0, szSinglePanel === null ? undefined : 1);
      RegionsByPanel[szPanel] = rgRegions;
      const rgCandidates = CollectPanelTiles({ Lattice: PanelLatticeInfo, fSinglePanel: szSinglePanel !== null }, rgRegions, dHexArea);
      rgCandidates.sort((Left, Right) => (Right.nJ - Left.nJ) || (Left.nQ - Right.nQ));
      const nQMin = PanelLatticeInfo.fEquatorial && szSinglePanel === null
        ? PanelLatticeInfo.nColumnShift
        : rgCandidates.reduce((nMin, Candidate) => Math.min(nMin, Candidate.nQ), Infinity);
      const nQMax = rgCandidates.reduce((nMax, Candidate) => Math.max(nMax, Candidate.nQ), -Infinity);
      const nJMax = rgCandidates[0].nJ;
      const nJMin = rgCandidates[rgCandidates.length - 1].nJ;
      const Lookup = new Map();
      const nFirstTile = rgTiles.length;
      for (const Candidate of rgCandidates) {
        const nIndex = rgTiles.length;
        Lookup.set(Key(Candidate.nQ, Candidate.nJ), nIndex);
        rgTiles.push(Object.freeze({
          nIndex,
          szPanel,
          nColumn: Candidate.nQ - nQMin,
          nRow: nJMax - Candidate.nJ,
          nLatticeColumn: Candidate.nQ,
          nLatticeRow: Candidate.nJ,
          rgdCenter: Object.freeze(Candidate.rgdCenter),
          dArea: Candidate.dArea,
          fPartial: Candidate.rgPieces !== null,
          rgPieces: Candidate.rgPieces ? Object.freeze(Candidate.rgPieces) : null,
        }));
      }
      Lookups[szPanel] = Lookup;
      const nStrip = rgszStrip.indexOf(szPanel);
      Panels[szPanel] = Object.freeze({
        szPanel,
        Lattice: PanelLatticeInfo,
        nFirstTile,
        nTileCount: rgTiles.length - nFirstTile,
        nColumns: nQMax - nQMin + 1,
        nRows: nJMax - nJMin + 1,
        nLatticeColumnMin: nQMin,
        nLatticeRowMax: nJMax,
        szWest: nStrip >= 0 ? rgszStrip[(nStrip + 5) % 6] : null,
        szEast: nStrip >= 0 ? rgszStrip[(nStrip + 1) % 6] : null,
      });
    }
    const Topo = {
      nPanelHexes,
      szTileScale,
      szSinglePanel,
      nRatio,
      dMilesPerEdge: Projection.MilesPerEdge(nPanelHexes),
      dD,
      dW: Lattice.ColumnSpacing(dD),
      dHexArea,
      rgszPanels: Object.freeze(rgszPanels),
      Panels: Object.freeze(Panels),
      Lookups: Object.freeze(Lookups),
      rgTiles: Object.freeze(rgTiles),
      nTiles: rgTiles.length,
    };
    const { rgnOffsets, rgnNeighbors } = BuildAdjacency(Topo, RegionsByPanel, Built);
    Topo.rgnAdjacencyOffsets = rgnOffsets;
    Topo.rgnAdjacency = rgnNeighbors;
    Object.freeze(Topo);
    g_Cache.set(szKey, Topo);
    return Topo;
  }

  // Local spans ------------------------------------------------------------------
  // A regional local map whose rectangle crosses a seam is unfolded from its anchor
  // panel across every seam it meets. Each panel keeps its own lattice and the global
  // clipping rules, so tiles turn to the neighbour's orientation at the seam. World
  // space is the anchor panel's frame (edge units) minus the anchor tile centre.
  const g_dSpanMargin = 0.6; // hex heights; covers every selected tile's outline
  const g_SpanCache = new Map();
  const g_nSpanCacheSize = 8;

  function SpanLattice(Local) {
    return PanelLattice(Local.Anchor.szPanel, Local.nPanelHexes, Lattice.ScaleRatio('regional', 'XL', Local.szScale));
  }

  // The box around a W × H block of local tiles (world units), widened by dMargin hexes.
  function SpanRectangle(nParity, nWidth, nHeight, dD, dMargin = g_dSpanMargin) {
    const dRadius = Lattice.HexRadius(1);
    const dShift = nWidth > 1 ? (nParity ? -0.5 : 0.5) : 0;
    const dLeft = (-dRadius - dMargin) * dD;
    const dRight = ((nWidth - 1) * Lattice.ColumnSpacing(1) + dRadius + dMargin) * dD;
    const dBottom = (-(nHeight - 1) + Math.min(0, dShift) - 0.5 - dMargin) * dD;
    const dTop = (Math.max(0, dShift) + 0.5 + dMargin) * dD;
    return [[dLeft, dBottom], [dRight, dBottom], [dRight, dTop], [dLeft, dTop]];
  }

  function CrossesInterior(rgdA, rgdB, rgrgdClip, dTolerance) {
    const rgdInterval = Util.ClipSegmentToConvex(rgdA, rgdB, rgrgdClip);
    return rgdInterval !== null && (rgdInterval[1] - rgdInterval[0]) * Util.Distance(rgdA, rgdB) > dTolerance;
  }

  function SameTransform(rgdFirst, rgdSecond) {
    return rgdFirst.every((dValue, nIndex) => Math.abs(dValue - rgdSecond[nIndex]) <= 1e-9);
  }

  // Each panel edge in the panel's frame, with the transform from the neighbour's frame.
  function PanelEdges(Built, szPanel) {
    const Frame = Built.Frames[szPanel];
    return Built.Seams.filter((Seam) => Seam.szPanelA === szPanel || Seam.szPanelB === szPanel).map((Seam) => {
      const fA = Seam.szPanelA === szPanel;
      return {
        szOther: fA ? Seam.szPanelB : Seam.szPanelA,
        rgdOtherToPanel: fA ? Seam.rgdBToA : Seam.rgdAToB,
        rgrgdEnds: Seam.rgszVertices.map((szId) => Projection.SolidToFrame(Frame, Built.Vertices[szId])),
      };
    });
  }

  // Largest n in [1, nMax] for which fnBlocked(n) is false (0 if none); fnBlocked is
  // monotone (the rectangle only grows with n).
  function LargestClear(nMax, fnBlocked) {
    if (nMax < 1 || fnBlocked(1)) {
      return 0;
    }
    let nLow = 1;
    let nHigh = nMax;
    while (nLow < nHigh) {
      const nMid = Math.ceil((nLow + nHigh) / 2);
      if (fnBlocked(nMid)) {
        nHigh = nMid - 1;
      } else {
        nLow = nMid;
      }
    }
    return nLow;
  }

  // Unfolds panels across the seams that the local rectangle meets. A panel reached
  // twice with different placements is a tear: the map would wrap around a panel corner
  // vertex, which cannot lie flat. The rectangle is then cut back (width or height,
  // whichever keeps more area) so its edge stops before the tear, and unfolding repeats.
  // Local needs { nWidth, nHeight, szScale, nPanelHexes, Anchor, nParity, rgnAnchorLattice }.
  // Returns { nWidth, nHeight, dD, rgdAnchor, rgrgdRectangle, Placed: Map panel → frame-to-world }.
  function UnfoldSpan(Local) {
    const Built = Projection.Build();
    const PanelLatticeInfo = SpanLattice(Local);
    const { dD } = PanelLatticeInfo;
    const szHome = Local.Anchor.szPanel;
    const rgdAnchor = LatticeCenter(PanelLatticeInfo, Local.rgnAnchorLattice[0], Local.rgnAnchorLattice[1]);
    const rgdHomeToWorld = [1, 0, 0, 1, -rgdAnchor[0], -rgdAnchor[1]];
    const dTolerance = 1e-9 * dD;
    const EdgesByPanel = new Map();
    const Edges = (szPanel) => EdgesByPanel.get(szPanel) || EdgesByPanel.set(szPanel, PanelEdges(Built, szPanel)).get(szPanel);
    let { nWidth, nHeight } = Local;
    for (;;) {
      const rgrgdRectangle = SpanRectangle(Local.nParity, nWidth, nHeight, dD);
      const Placed = new Map([[szHome, rgdHomeToWorld]]);
      const rgszQueue = [szHome];
      let rgrgdTear = null;
      for (let nHead = 0; nHead < rgszQueue.length && !rgrgdTear; nHead++) {
        const rgdToWorld = Placed.get(rgszQueue[nHead]);
        for (const Edge of Edges(rgszQueue[nHead])) {
          const [rgdA, rgdB] = Edge.rgrgdEnds.map((rgdPoint) => Projection.ApplyTransform(rgdToWorld, rgdPoint));
          if (!CrossesInterior(rgdA, rgdB, rgrgdRectangle, dTolerance)) {
            continue;
          }
          const rgdOtherToWorld = Projection.ComposeTransforms(Edge.rgdOtherToPanel, rgdToWorld);
          if (!Placed.has(Edge.szOther)) {
            Placed.set(Edge.szOther, rgdOtherToWorld);
            rgszQueue.push(Edge.szOther);
          } else if (!SameTransform(Placed.get(Edge.szOther), rgdOtherToWorld)) {
            rgrgdTear = [rgdA, rgdB];
            break;
          }
        }
      }
      if (!rgrgdTear) {
        return { nWidth, nHeight, dD, rgdAnchor, rgrgdRectangle, Placed };
      }
      const fnBlocked = (nW, nH) => CrossesInterior(rgrgdTear[0], rgrgdTear[1], SpanRectangle(Local.nParity, nW, nH, dD), dTolerance);
      const nClearWidth = LargestClear(nWidth - 1, (nW) => fnBlocked(nW, nHeight));
      const nClearHeight = LargestClear(nHeight - 1, (nH) => fnBlocked(nWidth, nH));
      Require(nClearWidth > 0 || nClearHeight > 0,
        'The local map would wrap around a panel corner next to its anchor; move the anchor away from the corner');
      if (nClearWidth * nHeight > nWidth * nClearHeight) {
        nWidth = nClearWidth;
      } else {
        nHeight = nClearHeight;
      }
    }
  }

  // The tiles of a regional local map that crosses panel seams (null when the map lies
  // inside its anchor panel and stays a flat local grid). Local must already be cropped
  // by UnfoldSpan. Tiles follow the global rules of each panel (whole hexes at equatorial
  // east/west seams, clipped partial tiles at the others) and are kept when their centre,
  // unfolded into the anchor frame, falls in a cell of the local W × H block.
  function BuildSpan(Local) {
    if (Local.szSystem !== 'regional') {
      return null;
    }
    const szKey = [Local.nPanelHexes, Local.szScale, Local.Anchor.szPanel, ...Local.rgnAnchorLattice, Local.nWidth, Local.nHeight].join(':');
    if (g_SpanCache.has(szKey)) {
      return g_SpanCache.get(szKey);
    }
    const Unfold = UnfoldSpan(Local);
    Require(Unfold.nWidth === Local.nWidth && Unfold.nHeight === Local.nHeight, 'Local map size must be cropped at panel corners');
    let Topo = null;
    if (Unfold.Placed.size > 1) {
      Topo = AssembleSpan(Local, Unfold);
    }
    if (g_SpanCache.size >= g_nSpanCacheSize) {
      g_SpanCache.delete(g_SpanCache.keys().next().value);
    }
    g_SpanCache.set(szKey, Topo);
    return Topo;
  }

  function AssembleSpan(Local, Unfold) {
    const Built = Projection.Build();
    const { dD, Placed, rgrgdRectangle } = Unfold;
    const nRatio = Lattice.ScaleRatio('regional', 'XL', Local.szScale);
    const dHexArea = Lattice.HexArea(dD);
    const dColumn = Lattice.ColumnSpacing(1);
    const { nWidth, nHeight, nParity } = Local;
    const fnInBlock = (rgdWorld) => {
      const [nQ, nJ] = Lattice.PointToOffset(rgdWorld[0] / dD + nParity * dColumn, rgdWorld[1] / dD + nParity / 2, 1);
      const nX = nQ - nParity;
      const nY = -nJ;
      return nX >= 0 && nY >= 0 && nX < nWidth && nY < nHeight;
    };
    // Drawing is clipped to the tile rectangle itself; unfolding used a margin so it
    // could see corners just beyond the map edge.
    const rgrgdOutline = SpanRectangle(nParity, nWidth, nHeight, dD, 0);
    const FrameOutlines = new Map();
    for (const [szPanel, rgdToWorld] of Placed) {
      const rgdToFrame = Projection.InvertTransform(rgdToWorld);
      const rgrgdClip = Util.ClipPolygonToConvex(Built.Frames[szPanel].rgrgdPolygon,
        rgrgdOutline.map((rgdPoint) => Projection.ApplyTransform(rgdToFrame, rgdPoint)));
      if (rgrgdClip.length >= 3 && Math.abs(Util.PolygonArea(rgrgdClip)) > 1e-9 * dHexArea) {
        FrameOutlines.set(szPanel, rgrgdClip);
      }
    }
    // Panels unfolded side by side across a seam, in both directions ("A>B").
    const Links = {};
    for (const Seam of Built.Seams) {
      const rgdA = Placed.get(Seam.szPanelA);
      const rgdB = Placed.get(Seam.szPanelB);
      if (FrameOutlines.has(Seam.szPanelA) && FrameOutlines.has(Seam.szPanelB)
        && SameTransform(Projection.ComposeTransforms(Seam.rgdBToA, rgdA), rgdB)) {
        Links[`${Seam.szPanelA}>${Seam.szPanelB}`] = true;
        Links[`${Seam.szPanelB}>${Seam.szPanelA}`] = true;
      }
    }
    const rgszPlaced = Object.keys(Built.Panels).filter((szPanel) => FrameOutlines.has(szPanel));
    const fnLinked = (szFrom, szTo) => Links[`${szFrom}>${szTo}`] === true;
    const rgszStrip = Built.rgszEquatorialWestToEast;
    const rgTiles = [];
    const Panels = {};
    const Lookups = {};
    const RegionsByPanel = {};
    const Placements = {};
    let fFlat = true;
    for (const szPanel of rgszPlaced) {
      const rgdToWorld = Placed.get(szPanel);
      const rgdToFrame = Projection.InvertTransform(rgdToWorld);
      const rgrgdFrameRectangle = rgrgdRectangle.map((rgdPoint) => Projection.ApplyTransform(rgdToFrame, rgdPoint));
      const PanelLatticeInfo = PanelLattice(szPanel, Local.nPanelHexes, nRatio);
      const rgRegions = BuildRegions(Built, szPanel);
      RegionsByPanel[szPanel] = rgRegions;
      const rgrgdFrameOutline = FrameOutlines.get(szPanel);
      // Keep tiles whose centre lies in a cell of the block and that are visible in it.
      const rgCandidates = CollectPanelTiles({ Lattice: PanelLatticeInfo, fSinglePanel: false }, rgRegions, dHexArea, {
        Box: Bounds([{ rgrgdPolygon: rgrgdFrameRectangle }]),
        fnAccept: (rgdCenter) => fnInBlock(Projection.ApplyTransform(rgdToWorld, rgdCenter)),
      }).filter((Candidate) => (Candidate.rgPieces
        ? Candidate.rgPieces.filter((Piece) => Piece.szPanel === szPanel).map((Piece) => Piece.rgrgdPolygon)
        : [Lattice.HexPolygon(Candidate.rgdCenter, dD)])
        .some((rgrgdPolygon) => Math.abs(Util.PolygonArea(Util.ClipPolygonToConvex(rgrgdPolygon, rgrgdFrameOutline))) > g_dMinAreaFraction * dHexArea));
      rgCandidates.sort((Left, Right) => (Right.nJ - Left.nJ) || (Left.nQ - Right.nQ));
      const nQMin = rgCandidates.reduce((nMin, Candidate) => Math.min(nMin, Candidate.nQ), Infinity);
      const nQMax = rgCandidates.reduce((nMax, Candidate) => Math.max(nMax, Candidate.nQ), -Infinity);
      const nJMax = rgCandidates.length ? rgCandidates[0].nJ : 0;
      const nJMin = rgCandidates.length ? rgCandidates[rgCandidates.length - 1].nJ : 0;
      const Lookup = new Map();
      const nFirstTile = rgTiles.length;
      for (const Candidate of rgCandidates) {
        const nIndex = rgTiles.length;
        fFlat = fFlat && szPanel === Local.Anchor.szPanel && Candidate.rgPieces === null;
        Lookup.set(Key(Candidate.nQ, Candidate.nJ), nIndex);
        rgTiles.push(Object.freeze({
          nIndex,
          szPanel,
          nColumn: Candidate.nQ - nQMin,
          nRow: nJMax - Candidate.nJ,
          nLatticeColumn: Candidate.nQ,
          nLatticeRow: Candidate.nJ,
          rgdCenter: Object.freeze(Candidate.rgdCenter),
          dArea: Candidate.dArea,
          fPartial: Candidate.rgPieces !== null,
          rgPieces: Candidate.rgPieces ? Object.freeze(Candidate.rgPieces) : null,
        }));
      }
      Lookups[szPanel] = Lookup;
      const nStrip = rgszStrip.indexOf(szPanel);
      const szWest = nStrip >= 0 ? rgszStrip[(nStrip + 5) % 6] : null;
      const szEast = nStrip >= 0 ? rgszStrip[(nStrip + 1) % 6] : null;
      Panels[szPanel] = Object.freeze({
        szPanel,
        Lattice: PanelLatticeInfo,
        nFirstTile,
        nTileCount: rgTiles.length - nFirstTile,
        nColumns: rgCandidates.length ? nQMax - nQMin + 1 : 0,
        nRows: rgCandidates.length ? nJMax - nJMin + 1 : 0,
        nLatticeColumnMin: rgCandidates.length ? nQMin : 0,
        nLatticeRowMax: nJMax,
        szWest: szWest && fnLinked(szPanel, szWest) ? szWest : null,
        szEast: szEast && fnLinked(szPanel, szEast) ? szEast : null,
      });
      Placements[szPanel] = Object.freeze({
        rgdFrameToWorld: Object.freeze([...rgdToWorld]),
        rgrgdFrameOutline: Object.freeze(rgrgdFrameOutline.map((rgdPoint) => Object.freeze(rgdPoint))),
      });
    }
    if (fFlat && rgTiles.length === nWidth * nHeight) {
      return null;
    }
    const Topo = {
      nPanelHexes: Local.nPanelHexes,
      szTileScale: Local.szScale,
      szSinglePanel: null,
      nRatio,
      dMilesPerEdge: Projection.MilesPerEdge(Local.nPanelHexes),
      dD,
      dW: Lattice.ColumnSpacing(dD),
      dHexArea,
      rgszPanels: Object.freeze(rgszPlaced.filter((szPanel) => Panels[szPanel].nTileCount > 0)),
      Panels: Object.freeze(Panels),
      Lookups: Object.freeze(Lookups),
      rgTiles: Object.freeze(rgTiles),
      nTiles: rgTiles.length,
      Span: Object.freeze({
        szHome: Local.Anchor.szPanel,
        rgdAnchor: Object.freeze([...Unfold.rgdAnchor]),
        rgrgdOutline: Object.freeze(rgrgdOutline.map((rgdPoint) => Object.freeze(rgdPoint))),
        Placements: Object.freeze(Placements),
        Links: Object.freeze(Links),
      }),
    };
    const { rgnOffsets, rgnNeighbors } = BuildAdjacency(Topo, RegionsByPanel, Built, fnLinked);
    Topo.rgnAdjacencyOffsets = rgnOffsets;
    Topo.rgnAdjacency = rgnNeighbors;
    return Object.freeze(Topo);
  }

  // True when tiles of szFrom are also drawn (by seam transform) in szTo's placement.
  function SpanLinked(Topo, szFrom, szTo) {
    return szFrom === szTo || !Topo.Span || Topo.Span.Links[`${szFrom}>${szTo}`] === true;
  }

  function TileAt(Topo, szPanel, nQ, nJ) {
    const Lookup = Topo.Lookups[szPanel];
    Require(Lookup !== undefined, `Unknown panel: ${szPanel}`);
    const nIndex = Lookup.get(Key(nQ, nJ));
    return nIndex === undefined ? -1 : nIndex;
  }

  // Like TileAt, but equatorial columns past the panel's east/west edge resolve
  // to the neighbouring strip panel (the strip lattice is continuous and wraps).
  function LocateLattice(Topo, szPanel, nQ, nJ) {
    const Info = Topo.Panels[szPanel];
    if (!Info && Topo.Span) {
      return -1;
    }
    const PanelLatticeInfo = Info.Lattice;
    if (PanelLatticeInfo.fEquatorial && !Topo.szSinglePanel) {
      const nColumn = nQ - PanelLatticeInfo.nColumnShift;
      // Local spans omit strip neighbours that are absent or not unfolded beside this panel.
      if (nColumn < 0) {
        return Info.szWest ? TileAt(Topo, Info.szWest, nQ + PanelLatticeInfo.nColumns, nJ) : -1;
      }
      if (nColumn >= PanelLatticeInfo.nColumns) {
        return Info.szEast ? TileAt(Topo, Info.szEast, nQ - PanelLatticeInfo.nColumns, nJ) : -1;
      }
    }
    return TileAt(Topo, szPanel, nQ, nJ);
  }

  function TileByColumnRow(Topo, szPanel, nColumn, nRow) {
    const Info = Topo.Panels[szPanel];
    Require(Info !== undefined, `Unknown panel: ${szPanel}`);
    return TileAt(Topo, szPanel, nColumn + Info.nLatticeColumnMin, Info.nLatticeRowMax - nRow);
  }

  function Neighbors(Topo, nTile) {
    return Topo.rgnAdjacency.subarray(Topo.rgnAdjacencyOffsets[nTile], Topo.rgnAdjacencyOffsets[nTile + 1]);
  }

  function AreAdjacent(Topo, nFirst, nSecond) {
    return Neighbors(Topo, nFirst).includes(nSecond);
  }

  // The tile's drawable outline(s) in its own panel frame.
  function TilePolygons(Topo, nTile) {
    const Tile = Topo.rgTiles[nTile];
    return Tile.rgPieces
      ? Tile.rgPieces.map((Piece) => Piece.rgrgdPolygon)
      : [Lattice.HexPolygon(Tile.rgdCenter, Topo.dD)];
  }

  RpgMap.Topology = Object.freeze({
    g_nDefaultPanelHexes,
    g_rgszTileScales,
    g_dMinAreaFraction,
    PanelLattice,
    LatticeCenter,
    LatticeNearest,
    Build,
    g_dSpanMargin,
    SpanRectangle,
    UnfoldSpan,
    BuildSpan,
    SpanLinked,
    TileAt,
    LocateLattice,
    TileByColumnRow,
    Neighbors,
    AreAdjacent,
    TilePolygons,
  });
})(globalThis);
</script>

<script data-module="Coordinates">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology } = RpgMap;
  const { Require } = Util;

  // Universal coordinates: (panel, east, north) in miles, measured in the panel
  // plane from the panel reference point (on the equator for equatorial panels).
  const g_dSnapFraction = 0.25;

  function PanelIdByName(szName) {
    const szLower = String(szName).toLowerCase();
    const Panel = Object.values(Projection.Build().Panels).find((Item) => Item.szName.toLowerCase() === szLower);
    return Panel ? Panel.szId : null;
  }

  function MakeLocation(szPanel, dEast, dNorth) {
    return Object.freeze({ szPanel, dEast, dNorth });
  }

  function TileToUniversal(Topo, nTile) {
    const Tile = Topo.rgTiles[nTile];
    Require(Tile !== undefined, `Unknown tile: ${nTile}`);
    return MakeLocation(Tile.szPanel, Tile.rgdCenter[0] * Topo.dMilesPerEdge, Tile.rgdCenter[1] * Topo.dMilesPerEdge);
  }

  // Nearest tile of the location's panel, or −1 if none lies within 0.25·d.
  function UniversalToTile(Topo, Location) {
    const Info = Topo.Panels[Location.szPanel];
    if (Info === undefined && Topo.Span && Projection.Build().Panels[Location.szPanel]) {
      return -1;
    }
    Require(Info !== undefined, `Unknown panel: ${Location.szPanel}`);
    const rgdPoint = [Location.dEast / Topo.dMilesPerEdge, Location.dNorth / Topo.dMilesPerEdge];
    const [nQ, nJ] = Topology.LatticeNearest(Info.Lattice, rgdPoint[0], rgdPoint[1]);
    const nTile = Topology.TileAt(Topo, Location.szPanel, nQ, nJ);
    if (nTile < 0 || Util.Distance(Topo.rgTiles[nTile].rgdCenter, rgdPoint) > g_dSnapFraction * Topo.dD) {
      return -1;
    }
    return nTile;
  }

  function FormatAxis(dValue, nDecimals, szPositive, szNegative) {
    const szMagnitude = Math.abs(dValue).toFixed(nDecimals);
    const fZero = Number(szMagnitude) === 0;
    return szMagnitude + (dValue < 0 && !fZero ? szNegative : szPositive);
  }

  // For example "Eta 187.1W 324.0N".
  function FormatUniversal(Location, nDecimals = 1) {
    const Panel = Projection.Build().Panels[Location.szPanel];
    Require(Panel !== undefined, `Unknown panel: ${Location.szPanel}`);
    return `${Panel.szName} ${FormatAxis(Location.dEast, nDecimals, 'E', 'W')} ${FormatAxis(Location.dNorth, nDecimals, 'N', 'S')}`;
  }

  function ParseUniversal(szText) {
    const Match = /^\s*([A-Za-z]+)\s+(\d+(?:\.\d+)?)([EWew])\s+(\d+(?:\.\d+)?)([NSns])\s*$/.exec(szText);
    Require(Match !== null, `Invalid universal coordinate: ${szText}`);
    const szPanel = PanelIdByName(Match[1]);
    Require(szPanel !== null, `Unknown panel name: ${Match[1]}`);
    const dEast = Number(Match[2]) * (Match[3].toUpperCase() === 'W' ? -1 : 1);
    const dNorth = Number(Match[4]) * (Match[5].toUpperCase() === 'S' ? -1 : 1);
    Require(Number.isFinite(dEast) && Number.isFinite(dNorth), 'Universal distances must be finite');
    return MakeLocation(szPanel, dEast || 0, dNorth || 0);
  }

  // True (spherical) coordinates are for display only: a panel-plane point is projected
  // centrally onto the globe. The prime meridian runs through eta's opposite vertex
  // (+1, +1, −1); true east is north × outward, matching the panel frames.
  const g_rgdPrimeMeridian = Object.freeze(Util.Unit(Util.Subtract([1, 1, -1],
    Util.Scale(Projection.g_North, Util.Dot([1, 1, -1], Projection.g_North)))));
  const g_rgdTrueEast = Object.freeze(Util.Cross(Projection.g_North, g_rgdPrimeMeridian));

  // { dLatitude, dLongitude } in degrees (east and north positive) plus
  // dNorthBearing: the clockwise angle in degrees from panel north to true north at the
  // point (null at a pole). dMilesPerEdge converts universal miles to frame units.
  function TrueCoordinates(Location, dMilesPerEdge) {
    const Frame = Projection.Build().Frames[Location.szPanel];
    Require(Frame !== undefined, `Unknown panel: ${Location.szPanel}`);
    Require(dMilesPerEdge > 0, 'Miles per edge must be positive');
    const rgdSolid = Projection.FrameToSolid(Frame, [Location.dEast / dMilesPerEdge, Location.dNorth / dMilesPerEdge]);
    const rgdPoint = Util.Unit(rgdSolid);
    const dSinLatitude = Math.max(-1, Math.min(1, Util.Dot(rgdPoint, Projection.g_North)));
    const dLatitude = Math.asin(dSinLatitude) * 180 / Math.PI;
    const fPole = 1 - Math.abs(dSinLatitude) < 1e-12;
    const dLongitude = fPole ? 0
      : Math.atan2(Util.Dot(rgdPoint, g_rgdTrueEast), Util.Dot(rgdPoint, g_rgdPrimeMeridian)) * 180 / Math.PI;
    // Central projection maps meridians to straight lines: the meridian through the
    // point meets the panel plane along normal × (north × point).
    let dNorthBearing = null;
    if (!fPole) {
      let rgdDirection = Util.Cross(Frame.rgdNormal3D, Util.Cross(Projection.g_North, rgdSolid));
      const rgdTrueNorth = Util.Subtract(Projection.g_North, Util.Scale(rgdPoint, dSinLatitude));
      if (Util.Dot(rgdDirection, rgdTrueNorth) < 0) {
        rgdDirection = Util.Scale(rgdDirection, -1);
      }
      dNorthBearing = Math.atan2(Util.Dot(rgdDirection, Frame.rgdEast3D), Util.Dot(rgdDirection, Frame.rgdNorth3D)) * 180 / Math.PI;
    }
    return Object.freeze({ dLatitude, dLongitude: dLongitude === -180 ? 180 : dLongitude, dNorthBearing });
  }

  // For example "35.264°N 30.000°W".
  function FormatTrue(True, nDecimals = 3) {
    return `${FormatAxis(True.dLatitude, nDecimals, '\u00b0N', '\u00b0S')} ${FormatAxis(True.dLongitude, nDecimals, '\u00b0E', '\u00b0W')}`;
  }

  // Decimal places that resolve about a tenth of a hex in degrees.
  function TrueDecimals(dHexMiles, dMilesPerEdge) {
    const Built = Projection.Build();
    const dPlaneDistance = Util.Dot(Built.Frames[Built.rgszEquatorialWestToEast[0]].rgdOrigin3D,
      Built.Frames[Built.rgszEquatorialWestToEast[0]].rgdNormal3D);
    const dDegrees = dHexMiles / dMilesPerEdge / dPlaneDistance * 180 / Math.PI;
    return Math.max(1, Math.min(9, Math.ceil(-Math.log10(dDegrees / 10))));
  }

  // A flat local map: nWidth × nHeight flat-top hexes, tile (0, 0) in the north-west,
  // x east and y south, oriented to panel north at the anchor (centre of tile (0, 0)).
  // Regional anchors snap to the global lattice of the same scale, so local tiles nest.
  // A regional map may cross panel seams (Topology.BuildSpan) but is cropped so it stops
  // short of any panel corner it would wrap around; Options.fFlat skips that cropping.
  function CreateLocalMap(Options) {
    const { nWidth, nHeight, szSystem, szScale, Anchor } = Options;
    const nPanelHexes = Options.nPanelHexes === undefined ? Topology.g_nDefaultPanelHexes : Options.nPanelHexes;
    Require(Number.isSafeInteger(nWidth) && nWidth > 0 && Number.isSafeInteger(nHeight) && nHeight > 0
      && Number.isSafeInteger(nWidth * nHeight),
      'Local map size must be positive integers');
    Require(Number.isSafeInteger(nPanelHexes) && nPanelHexes > 0 && nPanelHexes % 2 === 0,
      'Panel hexes must be a positive even integer');
    Require(Anchor && Number.isFinite(Anchor.dEast) && Number.isFinite(Anchor.dNorth), 'Local anchor distances must be finite');
    Require(Projection.Build().Panels[Anchor.szPanel] !== undefined, `Unknown panel: ${Anchor.szPanel}`);
    const dHexMiles = Lattice.ScaleMiles(szSystem, szScale);
    let SnappedAnchor = MakeLocation(Anchor.szPanel, Anchor.dEast, Anchor.dNorth);
    let nParity = 0;
    let rgnAnchorLattice = null;
    if (szSystem === 'regional') {
      const PanelLatticeInfo = Topology.PanelLattice(Anchor.szPanel, nPanelHexes, Lattice.ScaleRatio('regional', 'XL', szScale));
      const dMilesPerEdge = PanelLatticeInfo.dMilesPerEdge;
      const [nQ, nJ] = Topology.LatticeNearest(PanelLatticeInfo, Anchor.dEast / dMilesPerEdge, Anchor.dNorth / dMilesPerEdge);
      const rgdCenter = Topology.LatticeCenter(PanelLatticeInfo, nQ, nJ);
      SnappedAnchor = MakeLocation(Anchor.szPanel, rgdCenter[0] * dMilesPerEdge, rgdCenter[1] * dMilesPerEdge);
      nParity = Lattice.IsOdd(nQ) ? 1 : 0;
      rgnAnchorLattice = Object.freeze([nQ, nJ]);
    }
    const fFlat = szSystem !== 'regional' || Options.fFlat === true;
    let nCroppedWidth = nWidth;
    let nCroppedHeight = nHeight;
    if (!fFlat) {
      // Regional maps may cross panel seams but must stop short of panel corner vertices.
      const Unfold = Topology.UnfoldSpan({
        nWidth, nHeight, szScale, nPanelHexes, Anchor: SnappedAnchor, nParity, rgnAnchorLattice,
      });
      nCroppedWidth = Unfold.nWidth;
      nCroppedHeight = Unfold.nHeight;
    }
    return Object.freeze({
      nWidth: nCroppedWidth, nHeight: nCroppedHeight, szSystem, szScale, nPanelHexes, dHexMiles, Anchor: SnappedAnchor,
      nParity, rgnAnchorLattice,
    });
  }

  // The panels holding a regional local map's tiles and its size after cropping at panel
  // corners: for previews (the span is cached, so creating the map afterwards is quick).
  function PreviewLocalSpan(Options) {
    const Local = CreateLocalMap(Options);
    if (Local.szSystem !== 'regional' || Options.fFlat === true) {
      return Object.freeze({ nWidth: Local.nWidth, nHeight: Local.nHeight, rgszPanels: [Local.Anchor.szPanel] });
    }
    const Topo = Topology.BuildSpan(Local);
    const szHome = Local.Anchor.szPanel;
    const rgszPanels = Topo ? [...Topo.rgszPanels].sort((szA, szB) => (szB === szHome) - (szA === szHome)) : [szHome];
    return Object.freeze({ nWidth: Local.nWidth, nHeight: Local.nHeight, rgszPanels });
  }

  // Local display coordinates: one hex high, with tile (0, 0) at the origin.
  // Keeping the anchor out of this space avoids precision loss at yard scales.
  function LocalTilePoint(Local, nX, nY) {
    const nShift = (Lattice.IsOdd(nX + Local.nParity) ? 1 : 0) - Local.nParity;
    return [nX * Lattice.ColumnSpacing(1), nShift / 2 - nY];
  }

  function LocalPointToTile(Local, rgdPoint) {
    const [nQ, nJ] = Lattice.PointToOffset(
      rgdPoint[0] + Local.nParity * Lattice.ColumnSpacing(1), rgdPoint[1] + Local.nParity / 2, 1);
    const nX = nQ - Local.nParity;
    const nY = -nJ || 0;
    return nX >= 0 && nY >= 0 && nX < Local.nWidth && nY < Local.nHeight ? [nX, nY] : null;
  }

  function LocalTileToUniversal(Local, nX, nY) {
    const [dX, dY] = LocalTilePoint(Local, nX, nY);
    return MakeLocation(
      Local.Anchor.szPanel,
      Local.Anchor.dEast + dX * Local.dHexMiles,
      Local.Anchor.dNorth + dY * Local.dHexMiles,
    );
  }

  // Local tile [x, y] nearest the location, or null if outside the map or > 0.25·d away.
  function UniversalToLocalTile(Local, Location) {
    if (Location.szPanel !== Local.Anchor.szPanel) {
      return null;
    }
    const dD = Local.dHexMiles;
    const rgnXY = LocalPointToTile(Local, [(Location.dEast - Local.Anchor.dEast) / dD, (Location.dNorth - Local.Anchor.dNorth) / dD]);
    if (!rgnXY) {
      return null;
    }
    const [nX, nY] = rgnXY;
    const Center = LocalTileToUniversal(Local, nX, nY);
    const dDistance = Math.hypot(Center.dEast - Location.dEast, Center.dNorth - Location.dNorth);
    return dDistance > g_dSnapFraction * dD ? null : [nX, nY];
  }

  RpgMap.Coordinates = Object.freeze({
    g_dSnapFraction,
    PanelIdByName,
    MakeLocation,
    TileToUniversal,
    UniversalToTile,
    FormatUniversal,
    ParseUniversal,
    TrueCoordinates,
    FormatTrue,
    TrueDecimals,
    CreateLocalMap,
    PreviewLocalSpan,
    LocalTilePoint,
    LocalPointToTile,
    LocalTileToUniversal,
    UniversalToLocalTile,
  });
})(globalThis);
</script>

<script data-module="Terrain">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};

  // The single terrain table: the ID is the index stored in Model terrain arrays and
  // must never be reordered, because saved files and history refer to it by char.
  // Embellish describes the SVG terrain pattern (plan §8), or is null for none.
  const g_rgTerrainDefinitions = [
    ['~', 'water', 'Water', '#4a7fb5', true],
    ['i', 'islands', 'Islands', '#6b9cc8', true],
    ['o', 'lakes', 'Lakes', '#5b93c9', true],
    ['v', 'firth', 'Firth', '#5a8bb0', true],
    ['.', 'plain', 'Plain', '#c9d98f', false],
    ['h', 'hills', 'Hills', '#b5b56e', false],
    ['M', 'mountains', 'Mountains', '#9a8a74', false],
    ['A', 'mountainPeak', 'Mountain peak', '#7d6e5d', false],
    ['d', 'desert', 'Desert', '#e8d49a', false],
    ['D', 'sandDunes', 'Sand dunes', '#e3c27a', false],
    ['f', 'forest', 'Forest', '#5f8f4e', false],
    ['m', 'marsh', 'Marsh', '#8fae8a', false],
    ['g', 'mangrove', 'Mangrove', '#6f9a6a', false],
    ['t', 'tundra', 'Tundra', '#d8dfd9', false],
    ['c', 'canyon', 'Canyon', '#c0815a', false],
    ['b', 'badlands', 'Badlands', '#b89a7a', false],
    ['=', 'farmland', 'Farmland', '#d9cf7c', false],

  // Pattern layouts in hex heights: 'scatter' puts one motif at each staggered lattice
  // point inside a region, 'tile' one motif per tile and 'field' tiles a brick grid.
  // Ink strokes motifs, Accent draws water marks, Body fills them (null: terrain colour).
  const g_EmbellishDefinitions = {
    islands: ['scatter', 0.34, 0.28, 0.8, '#253c46', null, '#d8c690'],
    hills: ['scatter', 0.34, 0.22, 1, '#5e592b', null, null],
    mountains: ['scatter', 0.42, 0.34, 1, '#463a30', null, null],
    mountainPeak: ['tile', 1, 1, 1, '#3d3229', null, null],
    desert: ['scatter', 0.3, 0.2, 0.9, '#9c7a3a', null, null],
    sandDunes: ['scatter', 0.36, 0.22, 1, '#8f6a2c', null, null],
    forest: ['scatter', 0.24, 0.2, 1, '#2b4824', '#4a3320', null],
    marsh: ['scatter', 0.22, 0.18, 0.9, '#3f5f2a', '#3d6f8a', null],
    mangrove: ['scatter', 0.24, 0.2, 0.95, '#2f4a2a', '#3d6f8a', null],
    tundra: ['scatter', 0.24, 0.16, 0.9, '#5d6f76', null, null],
    canyon: ['scatter', 0.42, 0.3, 1, '#6a3a22', null, null],
    badlands: ['scatter', 0.32, 0.24, 1, '#6f472c', null, null],
    farmland: ['field', 0.3, 0.24, 1, '#7a6a32', '#a39352', null],
  };

  const g_rgTerrains = Object.freeze(g_rgTerrainDefinitions.map(([szChar, szKey, szName, szColor, fWater], nId) => {
    const Definition = g_EmbellishDefinitions[szKey];
    const Embellish = Definition ? Object.freeze({
      szLayout: Definition[0], dDx: Definition[1], dDy: Definition[2], dChance: Definition[3],
      szInk: Definition[4], szAccent: Definition[5] || Definition[4], szBody: Definition[6],
    }) : null;
    return Object.freeze({ nId, szChar, szKey, szName, szColor, fWater, Embellish });
  }));

  // Marks a cell of a panel's bounding rectangle that is not a tile of that panel.
  const g_szReservedChar = '_';
  const g_nWaterId = 0;

  const g_ByChar = new Map(g_rgTerrains.map((Terrain) => [Terrain.szChar, Terrain]));
  const g_ByKey = new Map(g_rgTerrains.map((Terrain) => [Terrain.szKey, Terrain]));

  const g_rgLandmarkTypes = Object.freeze([
    ['village', 'Village', 'M-8 0L0-8L8 0V9H-8ZM-3 9V2H3V9'],
    ['town', 'Town', 'M-10 0L-4-7L2 0V9H-10ZM0-2L5-9L10-2V9H2M-6 9V3H-2V9'],
    ['city', 'City', 'M-10 9V-3H-7V-7H-3V-3H3V-9H7V-3H10V9ZM-3 9V2H3V9'],
    ['castle', 'Castle', 'M-10 9V-9H-6V-5H-2V-9H2V-5H6V-9H10V9ZM-3 9V2Q0-3 3 2V9'],
    ['fortress', 'Fortress', 'M0-11L11 0L0 11L-11 0ZM-4-4H4V4H-4Z'],
    ['tower', 'Tower', 'M-6 9V-5H-8V-10H-4V-7H0V-10H4V-7H8V-5H6V9ZM-2 9V3H2V9'],
    ['ruins', 'Ruins', 'M-10 9V-6L-5-3V9ZM1 9V-9L6-5L10-7V9ZM-10 9H10'],
    ['mine', 'Mine', 'M-9-6Q0-13 9-6L1-7L-6 10L-9 9L-2-7ZM-9-1L9 8M9-1L-9 8'],
    ['temple', 'Temple', 'M-11-3L0-11L11-3ZM-9 0H9M-7 0V7M0 0V7M7 0V7M-10 7H10V10H-10Z'],
    ['cave', 'Cave', 'M-11 9L-7-5L0-11L8-5L11 9ZM-5 9V1Q0-7 5 1V9Z'],
    ['dungeon', 'Dungeon', 'M-9 9V-2Q0-15 9-2V9ZM-5 8V-3M0 8V-6M5 8V-3M-8 2H8'],
  ].map(([szKey, szName, szPath]) => Object.freeze({ szKey, szName, szPath })));
  const g_LandmarksByKey = new Map(g_rgLandmarkTypes.map((Landmark) => [Landmark.szKey, Landmark]));

  function ById(nId) {
    return Number.isInteger(nId) ? (g_rgTerrains[nId] || null) : null;
  }

  function ByChar(szChar) {
    return g_ByChar.get(szChar) || null;
  }

  function ByKey(szKey) {
    return g_ByKey.get(szKey) || null;
  }

  function IsValidId(nId) {
    return ById(nId) !== null;
  }

  function IsWater(nId) {
    const Terrain = ById(nId);
    return Terrain !== null && Terrain.fWater;
  }

  function LandmarkType(szKey) {
    return g_LandmarksByKey.get(szKey) || null;
  }

  function IsLandmarkType(szKey) {
    return g_LandmarksByKey.has(szKey);
  }

  RpgMap.Terrain = Object.freeze({
    g_rgTerrains,
    g_szReservedChar,
    g_nWaterId,
    g_rgLandmarkTypes,
    ById,
    ByChar,
    ByKey,
    IsValidId,
    IsWater,
    LandmarkType,
    IsLandmarkType,
  });
})(globalThis);
</script>

<script data-module="Model">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Projection, Lattice, Topology, Coordinates, Terrain } = RpgMap;
  const { Require } = Util;

  // A map document. Mutators validate their input, apply the change, and return a
  // change record { szLayer, Key, nIndex, Before, After } (or null for a no-op) that
  // History stores and ApplyChange replays in either direction.
  const g_nFormatVersion = 1;
  const g_rgszOverlayTypes = Object.freeze(['road', 'trail', 'river']);
  const g_rgszLabelCategories = Object.freeze(['region', 'location', 'city']);
  const g_LabelDefaultSizes = Object.freeze({ region: 28, location: 14, city: 18 });
  const g_rgszLayers = Object.freeze(['terrain', 'landmark', 'overlay', 'label']);
  const g_IdPattern = /^[A-Za-z][A-Za-z0-9_-]*$/;
  const g_StylePattern = /^[A-Za-z0-9_-]*$/;
  const g_ControlPattern = /[\u0000-\u001f\u007f]/;

  function NewDocument(szKind, szName, nTiles) {
    return {
      nVersion: g_nFormatVersion,
      szKind,
      szName,
      Global: null,
      Local: null,
      Topo: null,
      nTiles,
      rgnTerrain: new Uint8Array(nTiles).fill(Terrain.g_nWaterId),
      Landmarks: new Map(),
      rgOverlays: [],
      rgLabels: [],
      nRevision: 0,
    };
  }

  function CheckText(szText, szWhat) {
    Require(typeof szText === 'string', `${szWhat} must be a string`);
    Require(!g_ControlPattern.test(szText), `${szWhat} must not contain control characters`);
    return szText;
  }

  function CreateGlobalMap(Options = {}) {
    return CreateProjectedMap(Options, false);
  }

  function CreatePanelMap(Options = {}) {
    return CreateProjectedMap(Options, true);
  }

  function CreateProjectedMap(Options, fSinglePanel) {
    const nPanelHexes = Options.nPanelHexes === undefined ? Topology.g_nDefaultPanelHexes : Options.nPanelHexes;
    const szTileScale = Options.szTileScale === undefined ? 'XL' : Options.szTileScale;
    Require(Number.isSafeInteger(nPanelHexes) && nPanelHexes > 0 && nPanelHexes % 2 === 0,
      'Panel hexes must be a positive even integer');
    const szPanel = fSinglePanel ? Options.szPanel : null;
    Require(!fSinglePanel || typeof szPanel === 'string', 'Choose a panel for the single-panel map');
    const Topo = Topology.Build(nPanelHexes, szTileScale, szPanel);
    const Doc = NewDocument(fSinglePanel ? 'panel' : 'global', CheckText(Options.szName === undefined ? '' : Options.szName, 'Map name'), Topo.nTiles);
    Doc.Global = Object.freeze(fSinglePanel ? { nPanelHexes, szTileScale, szPanel } : { nPanelHexes, szTileScale });
    Doc.Topo = Topo;
    return Doc;
  }

  // Options as Coordinates.CreateLocalMap (fFlat: true keeps one flat grid even across
  // panel seams, as in files written before maps could span seams), plus szName.
  function CreateLocalMap(Options) {
    const Local = Coordinates.CreateLocalMap(Options);
    // Regional maps crossing panel seams take per-panel tiles (Topo.Span); others stay flat.
    const Topo = Options.fFlat === true ? null : Topology.BuildSpan(Local);
    const Doc = NewDocument('local', CheckText(Options.szName === undefined ? '' : Options.szName, 'Map name'),
      Topo ? Topo.nTiles : Local.nWidth * Local.nHeight);
    Doc.Local = Local;
    Doc.Topo = Topo;
    return Doc;
  }

  // Local tiles are numbered row by row from the north-west: index = y·width + x.
  function LocalTileIndex(Doc, nX, nY) {
    const { nWidth, nHeight } = Doc.Local;
    if (!Number.isInteger(nX) || !Number.isInteger(nY) || nX < 0 || nY < 0 || nX >= nWidth || nY >= nHeight) {
      return -1;
    }
    return nY * nWidth + nX;
  }

  function LocalTileXY(Doc, nTile) {
    return [nTile % Doc.Local.nWidth, Math.floor(nTile / Doc.Local.nWidth)];
  }

  function TileToUniversal(Doc, nTile) {
    CheckTile(Doc, nTile);
    return Doc.Topo ? Coordinates.TileToUniversal(Doc.Topo, nTile)
      : Coordinates.LocalTileToUniversal(Doc.Local, ...LocalTileXY(Doc, nTile));
  }

  function MilesPerEdge(Doc) {
    return Doc.Topo ? Doc.Topo.dMilesPerEdge : Projection.MilesPerEdge(Doc.Local.nPanelHexes);
  }

  // True latitude/longitude of the tile centre (display only; see Coordinates.TrueCoordinates).
  function TrueCoordinates(Doc, nTile) {
    return Coordinates.TrueCoordinates(TileToUniversal(Doc, nTile), MilesPerEdge(Doc));
  }

  function HexMiles(Doc) {
    return Doc.Topo ? Doc.Topo.dD * Doc.Topo.dMilesPerEdge : Doc.Local.dHexMiles;
  }

  function IsTile(Doc, nTile) {
    return Number.isInteger(nTile) && nTile >= 0 && nTile < Doc.nTiles;
  }

  function Neighbors(Doc, nTile) {
    Require(IsTile(Doc, nTile), `Unknown tile: ${nTile}`);
    if (Doc.Topo) {
      return Array.from(Topology.Neighbors(Doc.Topo, nTile));
    }
    // Local (x, y) is lattice offset (x + parity, −y): x east, y south, odd columns north.
    const [nX, nY] = LocalTileXY(Doc, nTile);
    const nParity = Doc.Local.nParity;
    return Lattice.OffsetNeighbors(nX + nParity, -nY)
      .map(([nQ, nJ]) => LocalTileIndex(Doc, nQ - nParity, -nJ))
      .filter((nIndex) => nIndex >= 0);
  }

  function AreAdjacent(Doc, nFirst, nSecond) {
    if (!IsTile(Doc, nFirst) || !IsTile(Doc, nSecond)) {
      return false;
    }
    return Doc.Topo ? Topology.AreAdjacent(Doc.Topo, nFirst, nSecond) : Neighbors(Doc, nFirst).includes(nSecond);
  }

  function CheckTile(Doc, nTile) {
    Require(IsTile(Doc, nTile), `Unknown tile: ${nTile}`);
  }

  function CheckId(szId, szWhat) {
    Require(typeof szId === 'string' && g_IdPattern.test(szId), `Invalid ${szWhat} id: ${szId}`);
  }

  function CheckFinite(dValue, szWhat) {
    Require(typeof dValue === 'number' && Number.isFinite(dValue), `${szWhat} must be a finite number`);
  }

  // The smallest "<prefix><n>" not already used, so ids never depend on history.
  function NextId(rgItems, szPrefix) {
    const Used = new Set(rgItems.map((Item) => Item.szId));
    let nNumber = 1;
    while (Used.has(szPrefix + nNumber)) {
      nNumber++;
    }
    return szPrefix + nNumber;
  }

  function IndexOfId(rgItems, szId) {
    return rgItems.findIndex((Item) => Item.szId === szId);
  }

  // Terrain ------------------------------------------------------------------

  function GetTerrain(Doc, nTile) {
    CheckTile(Doc, nTile);
    return Doc.rgnTerrain[nTile];
  }

  function SetTerrain(Doc, nTile, nTerrainId) {
    CheckTile(Doc, nTile);
    Require(Terrain.IsValidId(nTerrainId), `Unknown terrain id: ${nTerrainId}`);
    const nBefore = Doc.rgnTerrain[nTile];
    if (nBefore === nTerrainId) {
      return null;
    }
    return ApplyChange(Doc, { szLayer: 'terrain', Key: nTile, nIndex: -1, Before: nBefore, After: nTerrainId });
  }

  // Landmarks: at most one per tile, keyed by tile index ------------------------

  function MakeLandmark(Props) {
    Require(Terrain.IsLandmarkType(Props.szType), `Unknown landmark type: ${Props.szType}`);
    return Object.freeze({
      szType: Props.szType,
      szName: CheckText(Props.szName === undefined ? '' : Props.szName, 'Landmark name'),
      szNotes: CheckText(Props.szNotes === undefined ? '' : Props.szNotes, 'Landmark notes'),
    });
  }

  function GetLandmark(Doc, nTile) {
    CheckTile(Doc, nTile);
    return Doc.Landmarks.get(nTile) || null;
  }

  // Places, replaces or edits the tile's landmark; null removes it.
  function SetLandmark(Doc, nTile, Props) {
    CheckTile(Doc, nTile);
    const Before = Doc.Landmarks.get(nTile) || null;
    const After = Props === null ? null : MakeLandmark(Props);
    if (Before === null && After === null) {
      return null;
    }
    return ApplyChange(Doc, { szLayer: 'landmark', Key: nTile, nIndex: -1, Before, After });
  }

  function RemoveLandmark(Doc, nTile) {
    return SetLandmark(Doc, nTile, null);
  }

  // Overlays: road, trail or river paths of adjacent tiles ----------------------

  function CheckPath(Doc, rgnTiles) {
    Require(Array.isArray(rgnTiles) && rgnTiles.length > 0, 'An overlay needs at least one tile');
    rgnTiles.forEach((nTile) => CheckTile(Doc, nTile));
    for (let nIndex = 1; nIndex < rgnTiles.length; nIndex++) {
      Require(AreAdjacent(Doc, rgnTiles[nIndex - 1], rgnTiles[nIndex]),
        `Overlay tiles ${rgnTiles[nIndex - 1]} and ${rgnTiles[nIndex]} (points ${nIndex - 1} and ${nIndex}) are not adjacent`);
    }
  }

  function MakeOverlay(Doc, Props) {
    Require(g_rgszOverlayTypes.includes(Props.szType), `Unknown overlay type: ${Props.szType}`);
    CheckId(Props.szId, 'overlay');
    const szStyle = Props.szStyle === undefined ? '' : Props.szStyle;
    Require(typeof szStyle === 'string' && g_StylePattern.test(szStyle), `Invalid overlay style: ${szStyle}`);
    CheckPath(Doc, Props.rgnTiles);
    return Object.freeze({
      szId: Props.szId,
      szType: Props.szType,
      szName: CheckText(Props.szName === undefined ? '' : Props.szName, 'Overlay name'),
      szStyle,
      rgnTiles: Object.freeze(Props.rgnTiles.slice()),
    });
  }

  function GetOverlay(Doc, szId) {
    return Doc.rgOverlays.find((Overlay) => Overlay.szId === szId) || null;
  }

  function OverlaysAt(Doc, nTile) {
    return Doc.rgOverlays.filter((Overlay) => Overlay.rgnTiles.includes(nTile));
  }

  // Props: { szType, rgnTiles, szName?, szStyle?, szId? }. The id defaults to "<type><n>".
  function AddOverlay(Doc, Props) {
    const szId = Props.szId === undefined ? NextId(Doc.rgOverlays, String(Props.szType)) : Props.szId;
    Require(GetOverlay(Doc, szId) === null, `Duplicate overlay id: ${szId}`);
    const After = MakeOverlay(Doc, { ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'overlay', Key: szId, nIndex: Doc.rgOverlays.length, Before: null, After });
  }

  function UpdateOverlay(Doc, szId, Props) {
    const nIndex = IndexOfId(Doc.rgOverlays, szId);
    Require(nIndex >= 0, `Unknown overlay: ${szId}`);
    const Before = Doc.rgOverlays[nIndex];
    const After = MakeOverlay(Doc, { ...Before, ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'overlay', Key: szId, nIndex, Before, After });
  }

  function RemoveOverlay(Doc, szId) {
    const nIndex = IndexOfId(Doc.rgOverlays, szId);
    Require(nIndex >= 0, `Unknown overlay: ${szId}`);
    return ApplyChange(Doc, { szLayer: 'overlay', Key: szId, nIndex, Before: Doc.rgOverlays[nIndex], After: null });
  }

  // Labels: text attached to a tile ---------------------------------------------

  function MakeLabel(Doc, Props) {
    CheckId(Props.szId, 'label');
    CheckTile(Doc, Props.nTile);
    Require(g_rgszLabelCategories.includes(Props.szCategory), `Unknown label category: ${Props.szCategory}`);
    const szText = CheckText(Props.szText, 'Label text');
    Require(szText.trim().length > 0, 'Label text must not be empty');
    const dSize = Props.dSize === undefined ? g_LabelDefaultSizes[Props.szCategory] : Props.dSize;
    CheckFinite(dSize, 'Label size');
    Require(dSize > 0, 'Label size must be positive');
    const Label = {
      szId: Props.szId,
      nTile: Props.nTile,
      szText,
      szCategory: Props.szCategory,
      dSize,
      dRotation: Props.dRotation === undefined ? 0 : Props.dRotation,
      dDx: Props.dDx === undefined ? 0 : Props.dDx,
      dDy: Props.dDy === undefined ? 0 : Props.dDy,
    };
    CheckFinite(Label.dRotation, 'Label rotation');
    CheckFinite(Label.dDx, 'Label dx');
    CheckFinite(Label.dDy, 'Label dy');
    return Object.freeze(Label);
  }

  function GetLabel(Doc, szId) {
    return Doc.rgLabels.find((Label) => Label.szId === szId) || null;
  }

  function LabelsAt(Doc, nTile) {
    return Doc.rgLabels.filter((Label) => Label.nTile === nTile);
  }

  // Props: { nTile, szText, szCategory, dSize?, dRotation?, dDx?, dDy?, szId? }.
  function AddLabel(Doc, Props) {
    const szId = Props.szId === undefined ? NextId(Doc.rgLabels, 'label') : Props.szId;
    Require(GetLabel(Doc, szId) === null, `Duplicate label id: ${szId}`);
    const After = MakeLabel(Doc, { ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'label', Key: szId, nIndex: Doc.rgLabels.length, Before: null, After });
  }

  function UpdateLabel(Doc, szId, Props) {
    const nIndex = IndexOfId(Doc.rgLabels, szId);
    Require(nIndex >= 0, `Unknown label: ${szId}`);
    const Before = Doc.rgLabels[nIndex];
    const After = MakeLabel(Doc, { ...Before, ...Props, szId });
    return ApplyChange(Doc, { szLayer: 'label', Key: szId, nIndex, Before, After });
  }

  function RemoveLabel(Doc, szId) {
    const nIndex = IndexOfId(Doc.rgLabels, szId);
    Require(nIndex >= 0, `Unknown label: ${szId}`);
    return ApplyChange(Doc, { szLayer: 'label', Key: szId, nIndex, Before: Doc.rgLabels[nIndex], After: null });
  }

  // Replaying changes -------------------------------------------------------------

  function ApplyListChange(rgItems, Change, Before, After) {
    if (Before === null) {
      rgItems.splice(Change.nIndex, 0, After);
      return;
    }
    const nIndex = IndexOfId(rgItems, Change.Key);
    Require(nIndex >= 0, `Cannot apply change: ${Change.Key} is missing`);
    if (After === null) {
      rgItems.splice(nIndex, 1);
    } else {
      rgItems[nIndex] = After;
    }
  }

  // Sets the changed item to After (fForward) or Before, and returns the change.
  function ApplyChange(Doc, Change, fForward = true) {
    const Before = fForward ? Change.Before : Change.After;
    const After = fForward ? Change.After : Change.Before;
    switch (Change.szLayer) {
      case 'terrain':
        Doc.rgnTerrain[Change.Key] = After;
        break;
      case 'landmark':
        if (After === null) {
          Doc.Landmarks.delete(Change.Key);
        } else {
          Doc.Landmarks.set(Change.Key, After);
        }
        break;
      case 'overlay':
        ApplyListChange(Doc.rgOverlays, Change, Before, After);
        break;
      case 'label':
        ApplyListChange(Doc.rgLabels, Change, Before, After);
        break;
      default:
        Require(false, `Unknown change layer: ${Change.szLayer}`);
    }
    Doc.nRevision++;
    return Change;
  }

  RpgMap.Model = Object.freeze({
    g_nFormatVersion,
    g_rgszOverlayTypes,
    g_rgszLabelCategories,
    g_LabelDefaultSizes,
    g_rgszLayers,
    CreateGlobalMap,
    CreatePanelMap,
    CreateLocalMap,
    LocalTileIndex,
    LocalTileXY,
    TileToUniversal,
    MilesPerEdge,
    TrueCoordinates,
    HexMiles,
    IsTile,
    Neighbors,
    AreAdjacent,
    GetTerrain,
    SetTerrain,
    GetLandmark,
    SetLandmark,
    RemoveLandmark,
    GetOverlay,
    OverlaysAt,
    AddOverlay,
    UpdateOverlay,
    RemoveOverlay,
    GetLabel,
    LabelsAt,
    AddLabel,
    UpdateLabel,
    RemoveLabel,
    ApplyChange,
  });
})(globalThis);
</script>

<script data-module="History">
(function (Root) {
  'use strict';
  const RpgMap = Root.RpgMap = Root.RpgMap || {};
  const { Util, Model } = RpgMap;
  const { Require } = Util;

  // Command-pattern undo/redo. A command is { szLabel, rgChanges } holding only the
  // Model change records; undo replays them backwards, redo forwards.
  const g_nDefaultLimit = 500;

  function Create(Doc, Options = {}) {
    const nLimit = Options.nLimit === undefined ? g_nDefaultLimit : Options.nLimit;
    Require(Number.isInteger(nLimit) && nLimit > 0, 'History limit must be a positive integer');
    return { Doc, nLimit, rgUndo: [], rgRedo: [], Pending: null };
  }

  // Starts a grouped command, such as a brush stroke. Must be closed by Commit or Cancel.
  function Begin(History, szLabel) {
    Require(History.Pending === null, 'A history group is already open');
    History.Pending = { szLabel: String(szLabel), rgChanges: [] };
  }

  // Records changes already applied to the document (nulls from no-op mutators are skipped).
  function Record(History, Changes) {
    Require(History.Pending !== null, 'History.Record needs an open group (call Begin first)');
    for (const Change of Array.isArray(Changes) ? Changes : [Changes]) {
      if (Change !== null && Change !== undefined) {
        History.Pending.rgChanges.push(Change);
      }
    }
  }

  // Merges repeated terrain/landmark changes to one tile (first Before, last After) and
  // drops those that end where they started. Overlay and label changes keep their order.
  function Coalesce(rgChanges) {
    const rgResult = [];
    const ByKey = new Map();
    for (const Change of rgChanges) {
      if (Change.szLayer !== 'terrain' && Change.szLayer !== 'landmark') {
        rgResult.push(Change);
        continue;
      }
      const szKey = `${Change.szLayer}:${Change.Key}`;
      const nIndex = ByKey.get(szKey);
      if (nIndex === undefined) {
        ByKey.set(szKey, rgResult.length);
        rgResult.push(Change);
      } else {
        rgResult[nIndex] = { ...rgResult[nIndex], After: Change.After };
      }
    }
    return rgResult.filter((Change) => Change.Before !== Change.After);
  }

  function Push(History, Command) {
    History.rgUndo.push(Command);
    if (History.rgUndo.length > History.nLimit) {
      History.rgUndo.shift();
    }
    History.rgRedo.length = 0;
  }

  // Closes the open group; returns the command, or null if it changed nothing.
  function Commit(History) {
    Require(History.Pending !== null, 'No history group is open');
    const { szLabel, rgChanges } = History.Pending;
    History.Pending = null;
    const rgCoalesced = Coalesce(rgChanges);
    if (rgCoalesced.length === 0) {
      return null;
    }
    const Command = Object.freeze({ szLabel, rgChanges: Object.freeze(rgCoalesced) });
    Push(History, Command);
    return Command;
  }

  // Reverts and discards the open group.
  function Cancel(History) {
    Require(History.Pending !== null, 'No history group is open');
    const { rgChanges } = History.Pending;
    History.Pending = null;
    for (let nIndex = rgChanges.length - 1; nIndex >= 0; nIndex--) {
      Model.ApplyChange(History.Doc, rgChanges[nIndex], false);
    }
  }

  // Runs fnMutate(Doc, fnRecord) as one command. fnMutate passes each change record
  // (for example fnRecord(Model.SetTerrain(...))) to fnRecord, which returns it.
  // If fnMutate throws, the recorded changes are reverted and the error is rethrown.
  function Perform(History, szLabel, fnMutate) {
    Begin(History, szLabel);
    const fnRecord = (Change) => {
      Record(History, Change);
      return Change;
    };
    try {
      fnMutate(History.Doc, fnRecord);
    } catch (Failure) {
      Cancel(History);
      throw Failure;
    }
    return Commit(History);
  }

  function CanUndo(History) {
    return History.Pending === null && History.rgUndo.length > 0;
  }

  function CanRedo(History) {
    return History.Pending === null && History.rgRedo.length > 0;
  }

  function Undo(History) {
    if (!CanUndo(History)) {
      return null;
    }
    const Command = History.rgUndo.pop();
    for (let nIndex = Command.rgChanges.length - 1; nIndex >= 0; nIndex--) {
      Model.ApplyChange(History.Doc, Command.rgChanges[nIndex], false);
    }
    History.rgRedo.push(Command);
    return Command;
  }

  function Redo(History) {
    if (!CanRedo(History)) {
      return null;
    }
    const Command = History.rgRedo.pop();
    for (const Change of Command.rgChanges) {
      Model.ApplyChange(History.Doc, Change, true);
    }
    History.rgUndo.push(Command);
    return Command;
  }

  function Clear(History) {
    Require(History.Pending === null, 'Cannot clear history while a group is open');
    History.rgUndo.length = 0;
    History.rgRedo.length = 0;
  }

  RpgMap.History = Object.freeze({
    g_nDefaultLimit,
    Create,
    Begin,
    Record,
    Commit,
    Cancel,
    Perform,
    CanUndo,
    CanRedo,
    Undo,
    Redo,
    Clear,
  });
})(globalThis);
</script>

<script data-module="View">
(function (Root) {

  const { Require } = Util;

  // DOM-free view geometry for the renderer. "World" space is net space for the net

  // to CSS pixels (y down), independent of the map's physical scale.
  const g_dMinScale = 4;
  const g_dMaxScale = 400000;

  function CreateCamera(nWidth = 800, nHeight = 600) {

    Camera.nHeight = Math.max(1, nHeight);

    return [dScale, 0, 0, -dScale, Camera.nWidth / 2 - Camera.dCenterX * dScale, Camera.nHeight / 2 + Camera.dCenterY * dScale];
  }

  function WorldToScreen(Camera, rgdWorld) {
    return [
      Camera.nWidth / 2 + (rgdWorld[0] - Camera.dCenterX) * Camera.dScale,
      Camera.nHeight / 2 - (rgdWorld[1] - Camera.dCenterY) * Camera.dScale,
    ];
  }

    return [
      Camera.dCenterX + (rgdScreen[0] - Camera.nWidth / 2) / Camera.dScale,
      Camera.dCenterY - (rgdScreen[1] - Camera.nHeight / 2) / Camera.dScale,

    Camera.dCenterY += dDy / Camera.dScale;

    Camera.dScale = ClampScale(Camera.dScale * dFactor, Camera.dMinScale, Camera.dMaxScale);
    const rgdAfter = ScreenToWorld(Camera, rgdScreen);
    Camera.dCenterX += rgdBefore[0] - rgdAfter[0];
    Camera.dCenterY += rgdBefore[1] - rgdAfter[1];

    Camera.dCenterX = rgdWorld[0];
    Camera.dCenterY = rgdWorld[1];
  }

  function FitBounds(Camera, rgdBounds, dMargin = 24) {
    const dWidth = Math.max(rgdBounds[2] - rgdBounds[0], 1e-9);
    const dHeight = Math.max(rgdBounds[3] - rgdBounds[1], 1e-9);
    const dAvailableX = Math.max(1, Camera.nWidth - 2 * dMargin);
    const dAvailableY = Math.max(1, Camera.nHeight - 2 * dMargin);

    return Object.freeze({
      szPanel,
      szName: Built.Panels[szPanel].szName,
      rgdFrameToWorld: Object.freeze([...rgdFrameToWorld]),
      rgdWorldToFrame: Object.freeze(Projection.InvertTransform(rgdFrameToWorld)),
      rgrgdFrameOutline: rgrgdFrame,
      rgrgdOutline: Object.freeze(rgrgdOutline.map((rgdPoint) => Object.freeze(rgdPoint))),
      rgdBounds: Object.freeze(BoundsOf(rgrgdOutline)),
      rgdCenter: Object.freeze(Projection.ApplyTransform(rgdFrameToWorld, rgrgdFrameOutline ? Util.Center(rgrgdFrame) : [0, 0])),

      // The anchor panel draws last so it is on top.
      const rgszPanels = Object.keys(Placements).sort((szA, szB) => (szA === szHome) - (szB === szHome));
      g_SpanLayouts.set(Topo, MakeLayout('span', null, rgszPanels.map((szPanel) =>
        MakePlacement(szPanel, Placements[szPanel].rgdFrameToWorld, Placements[szPanel].rgrgdFrameOutline))));
    }
    return g_SpanLayouts.get(Topo);
  }

  // The drawable outline of a panel (frame units), or of the whole map for 'local'
  // (local world units).
  function FrameOutline(Geometry, szPanel) {
    if (Geometry.Span) {
      return szPanel === 'local' ? Geometry.Span.rgrgdOutline : Geometry.Span.Placements[szPanel].rgrgdFrameOutline;
    }
    return Geometry.Local ? Geometry.Layout.rgPlacements[0].rgrgdFrameOutline
      : Projection.Build().Frames[szPanel].rgrgdPolygon;
  }

  // Intersect the actual equatorial plane and polar rays with the drawing frame.
  // rgrgrgdEquatorSegments lists every equator segment (several for a span 'local' scope).
  function ReferenceGeometry(Doc, szPanel) {
    const Geometry = MapGeometry(Doc);
    if (Geometry.Span) {
      if (szPanel !== 'local') {
        return PanelReference(Geometry, szPanel, Projection.Build().Frames[szPanel], (Point) => Point, (Point) => Point);
      }
      // Whole span: each placement's references, in local world units.
      const rgrgrgdEquatorSegments = [];
      const rgPoles = [];
      for (const [szPart, Placement] of Object.entries(Geometry.Span.Placements)) {
        const Reference = PanelReference(Geometry, szPart, Projection.Build().Frames[szPart], (Point) => Point, (Point) => Point);
        const ToWorld = (Point) => Projection.ApplyTransform(Placement.rgdFrameToWorld, Point);
        rgrgrgdEquatorSegments.push(...Reference.rgrgrgdEquatorSegments.map((rgrgdSegment) => rgrgdSegment.map(ToWorld)));
        rgPoles.push(...Reference.rgPoles.map((Pole) => ({ szLabel: Pole.szLabel, rgdPoint: ToWorld(Pole.rgdPoint) })));
      }
      return { rgrgdEquator: rgrgrgdEquatorSegments.length === 1 ? rgrgrgdEquatorSegments[0] : [], rgrgrgdEquatorSegments, rgPoles };
    }
    const Local = Doc.Local;
    const Frame = Projection.Build().Frames[Local ? Local.Anchor.szPanel : szPanel];
    const dMilesPerEdge = Local ? Projection.MilesPerEdge(Local.nPanelHexes) : Geometry.dMilesPerEdge;
    const dUnit = Local ? Local.dHexMiles / dMilesPerEdge : 1;
    const rgdOrigin = Local ? [Local.Anchor.dEast / dMilesPerEdge, Local.Anchor.dNorth / dMilesPerEdge] : [0, 0];
    const ToFrame = (Point) => Util.Add(rgdOrigin, Util.Scale(Point, dUnit));
    const FromFrame = (Point) => Util.Scale(Util.Subtract(Point, rgdOrigin), 1 / dUnit);
    return PanelReference(Geometry, szPanel, Frame, ToFrame, FromFrame);
  }

  function PanelReference(Geometry, szPanel, Frame, ToFrame, FromFrame) {
    const Polygon = FrameOutline(Geometry, szPanel);
    const rgrgdEquator = [];
    for (const [A, B] of Util.Boundary(Polygon)) {
      const dA = Util.Dot(Projection.FrameToSolid(Frame, ToFrame(A)), Projection.g_North);
      const dB = Util.Dot(Projection.FrameToSolid(Frame, ToFrame(B)), Projection.g_North);
      if (Math.abs(dA) < 1e-10 && !rgrgdEquator.some((Point) => Util.Distance(Point, A) < 1e-9)) {
        rgrgdEquator.push(A);
      }
      if (dA * dB < 0 && Math.abs(dA) >= 1e-10 && Math.abs(dB) >= 1e-10) {
        rgrgdEquator.push(Util.Add(A, Util.Scale(Util.Subtract(B, A), dA / (dA - dB))));
      }
    }
    const rgPoles = [];
    for (const [szLabel, nSign] of [['N', 1], ['S', -1]]) {
      const Direction = Util.Scale(Projection.g_North, nSign);
      const dDenominator = Util.Dot(Direction, Frame.rgdNormal3D);
      if (dDenominator <= 1e-10) {
        continue;
      }
      const dDistance = Util.Dot(Frame.rgdOrigin3D, Frame.rgdNormal3D) / dDenominator;
      const rgdPoint = FromFrame(Projection.SolidToFrame(Frame, Util.Scale(Direction, dDistance)));
      if (Util.PointInConvex(rgdPoint, Polygon)) {
        rgPoles.push({ szLabel, rgdPoint });
      }
    }
    return { rgrgdEquator, rgrgrgdEquatorSegments: rgrgdEquator.length === 2 ? [rgrgdEquator] : [], rgPoles };
  }

  // Every panel at its place in the net.
  function BuildNetLayout() {
    if (!g_NetLayout) {
      const Built = Projection.Build();
      g_NetLayout = MakeLayout('net', null,
        Object.keys(Built.Panels).map((szPanel) => MakePlacement(szPanel, Built.Frames[szPanel].rgdFrameToNet)));
    }
    return g_NetLayout;
  }

  // One panel north-up (world = its frame) with every edge-neighbour unfolded across
  // the shared seam. Neighbours come first so the focus panel draws on top.
  function BuildFocusLayout(szFocus) {
    if (!g_FocusLayouts.has(szFocus)) {
      const Built = Projection.Build();
      Require(Built.Panels[szFocus] !== undefined, `Unknown panel: ${szFocus}`);
      const rgPlacements = [];
      for (const Seam of Built.Seams) {
        if (Seam.szPanelA === szFocus) {
          rgPlacements.push(MakePlacement(Seam.szPanelB, Seam.rgdBToA));
        } else if (Seam.szPanelB === szFocus) {
          rgPlacements.push(MakePlacement(Seam.szPanelA, Seam.rgdAToB));
        }
      }
      rgPlacements.push(MakePlacement(szFocus, g_rgdIdentity));
      g_FocusLayouts.set(szFocus, MakeLayout('focus', szFocus, rgPlacements));
    }
    return g_FocusLayouts.get(szFocus);
  }

  function FindPlacement(Layout, szPanel) {
    return Layout.rgPlacements.find((Placement) => Placement.szPanel === szPanel) || null;
  }

  // The topmost placement whose panel polygon contains the world point.
  function PlacementAt(Layout, rgdWorld) {
    for (let nIndex = Layout.rgPlacements.length - 1; nIndex >= 0; nIndex--) {
      const Placement = Layout.rgPlacements[nIndex];
      if (!BoundsIntersect(Placement.rgdBounds, [rgdWorld[0], rgdWorld[1], rgdWorld[0], rgdWorld[1]])) {
        continue;
      }
      const rgdFrame = Projection.ApplyTransform(Placement.rgdWorldToFrame, rgdWorld);
      if (Util.PointInConvex(rgdFrame, Placement.rgrgdFrameOutline)) {
        return { Placement, rgdFrame };
      }
    }
    return null;
  }

  // Tiles drawn per panel ----------------------------------------------------------------

  const g_GroupCache = new WeakMap();

  // Groups of tiles to draw inside a panel's polygon, each with the transform from the
  // owning panel's frame to this panel's frame. Equatorial panels also draw the edge
  // columns of their strip neighbours, whose whole hexes overhang this panel slightly.
  function PanelTileGroups(Topo, szPanel) {
    let ByPanel = g_GroupCache.get(Topo);
    if (!ByPanel) {
      ByPanel = new Map();
      g_GroupCache.set(Topo, ByPanel);
    }
    if (ByPanel.has(szPanel)) {
      return ByPanel.get(szPanel);
    }
    const Info = Topo.Panels[szPanel];
    Require(Info !== undefined, `Unknown panel: ${szPanel}`);
    const rgGroups = [{
      szOwner: szPanel,
      rgdToPanel: g_rgdIdentity,
      rgnTiles: Int32Array.from({ length: Info.nTileCount }, (_, nIndex) => Info.nFirstTile + nIndex),
    }];
    if (Info.Lattice.fEquatorial && !Topo.szSinglePanel) {
      const Built = Projection.Build();
      const dHalfWidth = Built.dEquatorialWidth / 2;
      const dRadius = Lattice.HexRadius(Topo.dD);
      for (const szOther of [Info.szWest, Info.szEast]) {
        if (!szOther || !Topo.Panels[szOther]) {
          continue;
        }
        const Seam = Projection.FindSeam(szOther, szPanel);
        const rgdToPanel = Seam.szPanelA === szOther ? Seam.rgdAToB : Seam.rgdBToA;
        const Other = Topo.Panels[szOther];
        const rgnTiles = [];
        for (let nTile = Other.nFirstTile; nTile < Other.nFirstTile + Other.nTileCount; nTile++) {
          const dEast = Projection.ApplyTransform(rgdToPanel, Topo.rgTiles[nTile].rgdCenter)[0];
          if (dEast + dRadius > -dHalfWidth && dEast - dRadius < dHalfWidth) {
            rgnTiles.push(nTile);
          }
        }
        rgGroups.push({ szOwner: szOther, rgdToPanel, rgnTiles: Int32Array.from(rgnTiles) });
      }
    }
    const rgFrozen = Object.freeze(rgGroups.map((Group) => Object.freeze(Group)));
    ByPanel.set(szPanel, rgFrozen);
    return rgFrozen;
  }

  // Tiles of a group that may touch rgdFrameBounds (the view box in the panel's frame).
  function VisibleTiles(Topo, Group, rgdFrameBounds) {
    const dRadius = Lattice.HexRadius(Topo.dD);
    const [dMinX, dMinY, dMaxX, dMaxY] = rgdFrameBounds;
    const fIdentity = Group.rgdToPanel === g_rgdIdentity;
    const rgnVisible = [];
    for (const nTile of Group.rgnTiles) {
      const rgdCenter = fIdentity ? Topo.rgTiles[nTile].rgdCenter : Projection.ApplyTransform(Group.rgdToPanel, Topo.rgTiles[nTile].rgdCenter);
      if (rgdCenter[0] + dRadius >= dMinX && rgdCenter[0] - dRadius <= dMaxX
        && rgdCenter[1] + dRadius >= dMinY && rgdCenter[1] - dRadius <= dMaxY) {
        rgnVisible.push(nTile);
      }
    }
    return rgnVisible;
  }

  // The tile that owns a world point, or null. Returns { nTile, szPanel, rgdFrame } with
  // szPanel the tile's own panel and rgdFrame the point in that panel's frame. The point
  // can lie inside a neighbouring panel's outline: on the east/west seams between
  // equatorial panels, edge hexes belong wholly to their own panel, so the tip of a hex
  // that pokes across the seam still belongs to that hex (prompt.md, "Map projection").
  // Partial tiles on the other seams are clipped to their panel, so there the panel
  // containing the point owns it. szDrawPanel is the panel whose outline contains the point.
  function HitTest(Topo, Layout, rgdWorld) {
    const Hit = PlacementAt(Layout, rgdWorld);
    if (Hit === null) {
      return null;
    }
    const szDrawPanel = Hit.Placement.szPanel;
    if (Topo.Local) {
      const rgnXY = Coordinates.LocalPointToTile(Topo.Local, Hit.rgdFrame);
      return rgnXY ? { nTile: rgnXY[1] * Topo.Local.nWidth + rgnXY[0], szPanel: 'local', rgdFrame: Hit.rgdFrame, szDrawPanel } : null;
    }
    const [nQ, nJ] = Topology.LatticeNearest(Topo.Panels[szDrawPanel].Lattice, Hit.rgdFrame[0], Hit.rgdFrame[1]);
    const nTile = Topology.LocateLattice(Topo, szDrawPanel, nQ, nJ);
    if (nTile < 0) {
      return null;
    }
    const szPanel = Topo.rgTiles[nTile].szPanel;
    let rgdFrame = Hit.rgdFrame;
    if (szPanel !== szDrawPanel) {
      const Seam = Projection.FindSeam(szDrawPanel, szPanel);
      rgdFrame = Projection.ApplyTransform(Seam.szPanelA === szDrawPanel ? Seam.rgdAToB : Seam.rgdBToA, rgdFrame);
    }
    return { nTile, szPanel, rgdFrame, szDrawPanel };
  }

  // Feature geometry is computed in panel frames, never by joining net positions.
  function PanelTransform(szFrom, szTo) {
    if (szFrom === szTo) {
      return g_rgdIdentity;
    }
    const Seam = Projection.FindSeam(szFrom, szTo);
    Require(Seam !== null && Seam !== undefined, `Panels ${szFrom} and ${szTo} do not share an edge`);
    return Seam.szPanelA === szFrom ? Seam.rgdAToB : Seam.rgdBToA;
  }

  // The panel itself and each edge neighbour it is drawn beside. In a local span only
  // neighbours unfolded next to it count; global feature drawing uses every seam.
  function PanelCopies(szPanel, Topo = null) {
    const rgCopies = [{ szPanel, rgdTransform: g_rgdIdentity }];
    if (Topo && Topo.Span) {
      for (const Seam of Projection.Build().Seams) {
        const szOther = Seam.szPanelA === szPanel ? Seam.szPanelB : Seam.szPanelB === szPanel ? Seam.szPanelA : null;
        if (szOther && Topology.SpanLinked(Topo, szPanel, szOther)) {
          rgCopies.push({ szPanel: szOther, rgdTransform: Seam.szPanelA === szPanel ? Seam.rgdAToB : Seam.rgdBToA });
        }
      }
      return rgCopies;
    }
    for (const Seam of Projection.Build().Seams) {
      if (Seam.szPanelA === szPanel) {
        rgCopies.push({ szPanel: Seam.szPanelB, rgdTransform: Seam.rgdAToB });
      } else if (Seam.szPanelB === szPanel) {
        rgCopies.push({ szPanel: Seam.szPanelA, rgdTransform: Seam.rgdBToA });
      }
    }
    return rgCopies;
  }

  // A partial tile's lattice centre can lie outside its panel. Keep its glyph/path
  // anchor inside the largest visible piece; the saved tile coordinate is unchanged.
  function FeatureAnchor(Topo, nTile) {
    const Tile = Topo.rgTiles[nTile];
    if (!Tile.rgPieces) {
      return Tile.rgdCenter;
    }
    const Piece = Tile.rgPieces.reduce((Best, Next) =>
      Math.abs(Util.PolygonArea(Next.rgrgdPolygon)) > Math.abs(Util.PolygonArea(Best.rgrgdPolygon)) ? Next : Best);
    return Util.Center(Piece.rgrgdPolygon);
  }

  function FeatureCopies(Topo, Layout, nTile) {
    return PanelCopies(Topo.rgTiles[nTile].szPanel, Topo).flatMap((Copy) => {
      const Placement = FindPlacement(Layout, Copy.szPanel);
      return Placement ? [{
        Placement,
        rgdFrameToWorld: Projection.ComposeTransforms(Copy.rgdTransform, Placement.rgdFrameToWorld),
      }] : [];
    });
  }

  const g_OverlayCurves = new WeakMap();

  // Catmull-Rom tangents yield cubic curves through the tile anchors. At a seam both
  // panels get the SAME curve, transformed and clipped when drawn, including cut edges.
  function OverlayCurves(Topo, Overlay) {
    const Cached = g_OverlayCurves.get(Overlay);
    if (Cached && Cached.Topo === Topo) {
      return Cached.rgCurves;
    }
    const rgnTiles = Overlay.rgnTiles;
    const rgCurves = [];
    const PointIn = (nTile, szPanel) => Projection.ApplyTransform(PanelTransform(Topo.rgTiles[nTile].szPanel, szPanel), FeatureAnchor(Topo, nTile));
    for (let nIndex = 0; nIndex + 1 < rgnTiles.length; nIndex++) {
      const nA = rgnTiles[nIndex];
      const nB = rgnTiles[nIndex + 1];
      const szA = Topo.rgTiles[nA].szPanel;
      const szB = Topo.rgTiles[nB].szPanel;
      const rgdA = FeatureAnchor(Topo, nA);
      const rgdB = PointIn(nB, szA);
      const rgdPrev = PointIn(rgnTiles[Math.max(0, nIndex - 1)], szA);
      const rgdNextInB = PointIn(rgnTiles[Math.min(rgnTiles.length - 1, nIndex + 2)], szB);
      const rgdControlB = Util.Subtract(FeatureAnchor(Topo, nB), Util.Scale(Util.Subtract(rgdNextInB, PointIn(nA, szB)), 1 / 6));
      const rgrgdControl = [
        rgdA,
        Util.Add(rgdA, Util.Scale(Util.Subtract(rgdB, rgdPrev), 1 / 6)),
        Projection.ApplyTransform(PanelTransform(szB, szA), rgdControlB),
        rgdB,
      ];
      for (const Copy of PanelCopies(szA, Topo)) {
        const rgrgdMapped = rgrgdControl.map((rgdPoint) => Projection.ApplyTransform(Copy.rgdTransform, rgdPoint));
        if (BoundsIntersect(BoundsOf(rgrgdMapped), BoundsOf(FrameOutline(Topo, Copy.szPanel)))) {
          rgCurves.push({ szPanel: Copy.szPanel, nPoint: nIndex, rgrgdControl: rgrgdMapped });
        }
      }
    }
    g_OverlayCurves.set(Overlay, { Topo, rgCurves });
    return rgCurves;
  }

  function CubicPoint(rgrgdControl, dT) {
    const dU = 1 - dT;
    return [0, 1].map((nAxis) => dU ** 3 * rgrgdControl[0][nAxis]
      + 3 * dU * dU * dT * rgrgdControl[1][nAxis]
      + 3 * dU * dT * dT * rgrgdControl[2][nAxis] + dT ** 3 * rgrgdControl[3][nAxis]);
  }

  function DistanceToSegment(rgdPoint, rgdA, rgdB) {
    const rgdDelta = Util.Subtract(rgdB, rgdA);
    const dSquared = Util.Dot(rgdDelta, rgdDelta);
    const dT = dSquared === 0 ? 0 : Math.max(0, Math.min(1, Util.Dot(Util.Subtract(rgdPoint, rgdA), rgdDelta) / dSquared));
    return Util.Distance(rgdPoint, Util.Add(rgdA, Util.Scale(rgdDelta, dT)));
  }

  function FlattenCurve(rgrgdControl, dTolerance = 0.5) {
    const rgPoints = [rgrgdControl[0]];
    const Subdivide = (rg, nDepth) => {
      if (nDepth === 16 || Math.max(DistanceToSegment(rg[1], rg[0], rg[3]), DistanceToSegment(rg[2], rg[0], rg[3])) <= dTolerance) {
        rgPoints.push(rg[3]);
        return;
      }
      const [First, Second] = SplitCurve(rg);
      Subdivide(First, nDepth + 1);
      Subdivide(Second, nDepth + 1);
    };
    Subdivide(rgrgdControl, 0);
    return rgPoints;
  }

  function SplitCurve(rg) {
    const Mid = (A, B) => Util.Scale(Util.Add(A, B), 0.5);
    const A = Mid(rg[0], rg[1]), B = Mid(rg[1], rg[2]), C = Mid(rg[2], rg[3]);
    const D = Mid(A, B), E = Mid(B, C), F = Mid(D, E);
    return [[rg[0], A, D, F], [F, E, C, rg[3]]];
  }

  const g_OverlayStyles = Object.freeze({
    river: Object.freeze({ szColor: '#236eae', dWidth: 3, rgDash: Object.freeze([]) }),
    road: Object.freeze({ szColor: '#704224', dWidth: 2.5, rgDash: Object.freeze([]) }),
    trail: Object.freeze({ szColor: '#805e3b', dWidth: 1.8, rgDash: Object.freeze([4, 3]) }),
  });

  const g_dLabelUnitsPerHex = 48;

  // Label size/offset units are 1/48 hex. Local x is right, y is down, and rotation
  // is clockwise relative to panel north. Compose this with a panel-to-screen matrix.
  function LabelTransform(Topo, Label) {
    const [dX, dY] = FeatureAnchor(Topo, Label.nTile);
    const dUnit = Topo.dD / g_dLabelUnitsPerHex;
    const dAngle = Label.dRotation * Math.PI / 180;
    const dCos = Math.cos(dAngle) * dUnit;
    const dSin = Math.sin(dAngle) * dUnit;
    return [dCos, -dSin, -dSin, -dCos, dX + Label.dDx * dUnit, dY - Label.dDy * dUnit];
  }

  // Demo terrain -------------------------------------------------------------------------

  function CreateWaves(Random, nCount) {
    const rgWaves = [];
    for (let nIndex = 0; nIndex < nCount; nIndex++) {
      const dZ = 2 * Random() - 1;
      const dAngle = 2 * Math.PI * Random();
      const dRing = Math.sqrt(1 - dZ * dZ);
      const dFrequency = 1 + 5 * Random();
      rgWaves.push({ rgdDirection: [dRing * Math.cos(dAngle), dRing * Math.sin(dAngle), dZ], dFrequency, dPhase: 2 * Math.PI * Random(), dAmplitude: 1 / dFrequency });
    }
    const dTotal = rgWaves.reduce((dSum, Wave) => dSum + Wave.dAmplitude, 0);
    rgWaves.forEach((Wave) => { Wave.dAmplitude /= dTotal; });
    return rgWaves;
  }

  function SampleWaves(rgWaves, rgdPoint) {
    return rgWaves.reduce((dSum, Wave) => dSum + Wave.dAmplitude * Math.sin(Wave.dFrequency * Util.Dot(Wave.rgdDirection, rgdPoint) + Wave.dPhase), 0);
  }

  // A deterministic sample world (terrain ids per tile) so the renderer has something to
  // show before the terrain tools exist. Uses only Util.CreateRng / Util.HashIntegers.
  function DemoTerrain(Topo, nSeed = 1) {
    const Built = Projection.Build();
    const Random = Util.CreateRng(nSeed);
    const rgElevationWaves = CreateWaves(Random, 14);
    const rgMoistureWaves = CreateWaves(Random, 8);
    const rgdNorth = Util.Unit(Projection.g_North);
    const Id = (szKey) => Terrain.ByKey(szKey).nId;
    const rgnTerrain = new Uint8Array(Topo.nTiles);
    for (const Tile of Topo.rgTiles) {
      const rgdPoint = Util.Unit(Projection.FrameToSolid(Built.Frames[Tile.szPanel], Tile.rgdCenter));
      const dElevation = SampleWaves(rgElevationWaves, rgdPoint) * 2.2 - 0.05;
      const dMoisture = SampleWaves(rgMoistureWaves, rgdPoint) * 2.5;
      const dLatitude = Math.abs(Math.asin(Math.max(-1, Math.min(1, Util.Dot(rgdPoint, rgdNorth))))) * 180 / Math.PI;
      const dRoll = Util.HashIntegers(nSeed, Tile.nIndex) / 4294967296;
      let szKey = 'plain';
      if (dElevation < -0.02) {
        szKey = dElevation > -0.06 && dRoll < 0.08 ? 'islands' : 'water';
      } else if (dLatitude > 66) {
        szKey = dElevation > 0.4 ? 'mountains' : 'tundra';
      } else if (dElevation > 0.62) {
        szKey = 'mountainPeak';
      } else if (dElevation > 0.45) {
        szKey = 'mountains';
      } else if (dElevation > 0.3) {
        szKey = dMoisture < -0.45 ? 'badlands' : (dMoisture < -0.2 && dRoll < 0.35 ? 'canyon' : 'hills');
      } else if (dElevation < 0.04 && dMoisture > 0.35) {
        szKey = dLatitude < 25 ? 'mangrove' : 'marsh';
      } else if (dMoisture > 0.55 && dRoll < 0.15) {
        szKey = 'lakes';
      } else if (dMoisture > 0.15) {
        szKey = 'forest';
      } else if (dLatitude < 35 && dMoisture < -0.3) {
        szKey = dMoisture < -0.55 ? 'sandDunes' : 'desert';
      } else if (dRoll < 0.12) {
        szKey = 'farmland';
      }
      rgnTerrain[Tile.nIndex] = Id(szKey);
    }
    // Inlets: open water mostly enclosed by land becomes firth.
    const nWater = Id('water');
    const rgnResult = rgnTerrain.slice();
    for (let nTile = 0; nTile < Topo.nTiles; nTile++) {
      if (rgnTerrain[nTile] === nWater) {
        const rgnNeighbors = Topology.Neighbors(Topo, nTile);
        const nLand = rgnNeighbors.filter((nOther) => !Terrain.IsWater(rgnTerrain[nOther])).length;
        if (nLand >= 4) {
          rgnResult[nTile] = Id('firth');
        }
      }
    }
    return rgnResult;
  }

  RpgMap.View = Object.freeze({
    g_dMinScale,
    g_dMaxScale,
    g_rgdIdentity,
    CreateCamera,
    ResizeCamera,
    ClampScale,
    WorldToScreenTransform,
    WorldToScreen,
